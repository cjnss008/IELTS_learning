audio{display:block;max-width:100%;width:360px;margin:12px 0}.fixed{position:fixed;bottom:0;left:0;right:0;padding:12px 20px;background:#fffdf8;border-top:1px solid var(--line);z-index:10;display:flex;justify-content:center;gap:24px;align-items:center}.clock{font-size:28px;font-variant-numeric:tabular-nums}.urgent{color:#a43730}.pill{display:inline-block;border:1px solid var(--line);padding:4px 12px;border-radius:20px;margin:5px}.answers{border-left:3px solid #83a491;padding:12px 18px;margin:14px 0}.answer-ok{color:#176441}.answer-bad{color:#923e2e}details{margin:20px 0}summary{cursor:pointer}#saveWarn{background:#ffeed9;padding:10px}#saveWarn:empty{display:none}[hidden]{display:none!important}.recording{color:#a02e26;font-weight:bold}.big{font-size:22px}.breakline{white-space:pre-line}.reportbox{min-height:180px;font-size:14px}#speechPrompt{white-space:pre-line}button:focus-visible,a:focus-visible,input:focus,textarea:focus{outline:3px solid #b4d0be;outline-offset:2px}@media(max-width:760px){.split{grid-template-columns:1fr}.passage{max-height:none}.steps{grid-template-columns:repeat(2,1fr)}header{padding:22px 20px}.card{padding:20px}main{padding:15px 12px 120px}h1{font-size:26px}.fixed{gap:12px;padding:10px}.clock{font-size:24px}.en{font-size:18px}}

const TEST={"version": "2026-10-03-A", "questions": [{"id": "L1", "prompt": "1. Workshop day: ______", "answers": ["sunday"], "why": "原计划周六，最终改为周日。", "options": null, "kind": "text"}, {"id": "L2", "prompt": "2. Starting time: ______", "answers": ["9:15", "9.15", "09:15", "09.15"], "why": "原时间9:30，提前15分钟，最终9:15。", "options": null, "kind": "text"}, {"id": "L3", "prompt": "3. Fee for the beginners workshop: £______", "answers": ["18", "eighteen", "18.00"], "why": "£25 是高级班；初学班为 £18。", "options": null, "kind": "text"}, {"id": "L4", "prompt": "4. Item participants should bring to protect their hands: ______", "answers": ["gloves"], "why": "工具由中心提供；参加者要带 gloves。", "options": null, "kind": "text"}, {"id": "L5", "prompt": "5. What was the main purpose of the lighting trial?", "answers": ["B"], "why": "项目研究居民夜间步行的感受，不直接测量犯罪变化。", "options": ["A. To prove that brighter streets reduce crime", "B. To explore how residents felt about walking after dark", "C. To reduce the cost of installing lamps"], "kind": "choice"}, {"id": "L6", "prompt": "6. Why did many shop owners support the new lamps?", "answers": ["C"], "why": "新灯减少照进商店窗户的眩光。", "options": ["A. They received extra funding", "B. The lamps were cheaper to install", "C. Less light shone into their windows"], "kind": "choice"}, {"id": "L7", "prompt": "7. What made the trial results difficult to interpret?", "answers": ["A"], "why": "同时开通的新晚间公交也改变了街区活动情况，造成干扰。", "options": ["A. Another change occurred in the area at the same time", "B. Residents were asked different questions afterwards", "C. The researchers had no responses from local residents"], "kind": "choice"}, {"id": "L8", "prompt": "8. What will the researchers do next?", "answers": ["B"], "why": "比较同期两条类似街道，仅更改其中一条街道的灯光。", "options": ["A. Replace all the lamps in the region", "B. Compare two streets while changing the lamps on only one", "C. Stop collecting information about street use"], "kind": "choice"}, {"id": "R1", "prompt": "9. The increase in reports proved that the bird population had grown.", "answers": ["FALSE"], "why": "A段明确说明，报告增加未必表示鸟类数量增加。", "options": ["TRUE", "FALSE", "NOT GIVEN"], "kind": "choice"}, {"id": "R2", "prompt": "10. In the second procedure, volunteers observed birds within a regular morning time window.", "answers": ["TRUE"], "why": "B段明确写 within the same morning time window each week。", "options": ["TRUE", "FALSE", "NOT GIVEN"], "kind": "choice"}, {"id": "R3", "prompt": "11. Training was the most expensive part of the project.", "answers": ["NOT GIVEN"], "why": "文中没有比较各项活动的成本。", "options": ["TRUE", "FALSE", "NOT GIVEN"], "kind": "choice"}, {"id": "R4", "prompt": "12. Volunteers were encouraged to guess a bird’s identity when they were unsure.", "answers": ["FALSE"], "why": "C段要求不确定时留空，不作自信猜测。", "options": ["TRUE", "FALSE", "NOT GIVEN"], "kind": "choice"}, {"id": "R5", "prompt": "13. To make observations more consistent, volunteers followed a fixed ______.", "answers": ["route"], "why": "B段原词 route。", "options": null, "kind": "text"}, {"id": "R6", "prompt": "14. Experts checked reports against photographs or sound ______.", "answers": ["recordings"], "why": "C段原词 recordings；sound 已给出，只填一个词。", "options": null, "kind": "text"}, {"id": "R7", "prompt": "15. Why did the team recruit people in under-recorded areas?", "answers": ["C"], "why": "E段指出地域分布不均，招募是为了改善记录的地域覆盖。", "options": ["A. To replace every volunteer who lacked confidence", "B. To increase the number of unusual bird reports only", "C. To improve the geographical coverage of the records"], "kind": "choice"}, {"id": "R8", "prompt": "16. Which statement best expresses the main message of the passage?", "answers": ["A"], "why": "全文强调参与热情需配合可靠的方法与谨慎的解读。", "options": ["A. Public enthusiasm needs consistent methods to support useful research", "B. Volunteer records are useful only when rare birds are reported", "C. A larger total number of reports always produces better conclusions"], "kind": "choice"}], "reading": ["When a regional nature group launched a project asking residents to record birds in their neighbourhoods, it received thousands of reports within weeks. The organisers welcomed the enthusiasm, but they knew that an increase in reports did not necessarily mean an increase in the bird population. More people might simply have been looking. To turn public interest into useful research, the project needed a way to distinguish changes in observation from changes in nature.", "During the first stage, volunteers could submit a record whenever they liked. This produced a large collection of information, but comparison was difficult. One person might spend an entire afternoon in a park, while another noted a bird during a short walk to work. The team introduced a second procedure: volunteers followed a fixed route for fifteen minutes, within the same morning time window each week. They recorded ordinary birds as well as unusual ones. A report showing that no birds had been seen was also valuable, provided that the observer had actually completed the walk.", "Identification created another challenge. Some birds looked similar, especially at a distance, and confidence was not a reliable measure of accuracy. The group offered training sessions and asked participants to record uncertain identifications separately. Experts could then compare photographs or sound recordings with the written reports. Volunteers were told to leave an identification incomplete rather than make a confident guess. Training improved some participants' accuracy, although the team did not assume that every error had disappeared.", "Weather and participation could both influence the results. On wet mornings, volunteers were less likely to complete a walk, and some birds were harder to notice. A lower count on such a day could therefore have more than one explanation. The organisers recorded weather conditions and distinguished a missed visit from a completed visit with no sightings. Treating both as zero birds would create a misleading picture of what had happened.", "The volunteers were not distributed evenly across the region. Parks near residential areas attracted many observers, whereas industrial districts had few. Most participants were also available in the morning. The team recognised that these patterns limited the conclusions it could draw about the whole region. It began recruiting in under-recorded areas and offered alternative roles to people who could not attend the regular walks. These roles included checking photographs and helping to organise records.", "The project's success was eventually judged by more than the total number of reports. The researchers valued repeated observations made under comparable conditions, while participants valued feedback explaining how their records were used. The organisers published a summary of the findings, including the limits of the data. Their experience suggested that public participation could contribute to research when enthusiasm was supported by clear methods and honest interpretation."], "writing": "Some people think children should decide how to spend their free time, while others believe parents should organise it. Discuss both views and give your own opinion.", "speaking": [{"start": 0, "end": 60, "title": "简短问答 · 1分钟", "text": "Do you prefer studying alone or with other people? Why?\nWhat do you usually do when you find something difficult to learn?"}, {"start": 60, "end": 120, "title": "准备长回答 · 1分钟", "text": "Describe a time when you learned to do something without a teacher.\nSay what you learned, why you wanted to learn it, how you learned it, and what was difficult.\nExplain how you felt about the result."}, {"start": 120, "end": 240, "title": "连续讲述 · 最多2分钟", "text": "Describe a time when you learned to do something without a teacher.\nSay what you learned, why you wanted to learn it, how you learned it, and what was difficult.\nExplain how you felt about the result."}, {"start": 240, "end": 300, "title": "讨论问题1 · 1分钟", "text": "Why do some adults find it difficult to learn new skills?"}, {"start": 300, "end": 360, "title": "讨论问题2 · 1分钟", "text": "Can technology replace teachers? Why or why not?"}], "transcripts": ["Ryan: Good morning, Harton Community Centre. How can I help?\nSonia: Hello. I would like to join the furniture repair workshop. Is it this Saturday?\nRyan: That was the original plan, but some electrical work is taking place on Saturday. The workshop will now be on Sunday.\nSonia: That is fine. I have never repaired anything before. Is it suitable for beginners?\nRyan: Yes, absolutely. The tutor will show you how to repair a small wooden item. Please choose something you can carry easily, such as a chair.\nSonia: The website says it starts at half past nine. Is that still correct?\nRyan: Actually, we are starting fifteen minutes earlier, at nine fifteen, so there is time to introduce the tools. We should finish by twelve.\nSonia: And how much does it cost? I saw a price of twenty-five pounds.\nRyan: That is for the advanced class. The beginners workshop is eighteen pounds, including the materials.\nSonia: Do I need to bring any tools?\nRyan: No, we provide those. But please bring gloves to protect your hands. Wear old clothes too. Come to the garden room rather than the main hall.\nSonia: Great. I will book a place online this afternoon. Thank you.", "Good afternoon. Today I will describe a small trial of street lighting in Westfield. The council wanted to find out whether changing the lighting would make residents feel more comfortable walking home after dark. The project was not designed to measure changes in crime, and the team did not claim that brighter streets were always safer.\n\nBefore the trial, shop owners had complained that the existing lamps shone directly into their windows. The new lamps directed more light towards the pavement and less towards buildings. This reduction in glare was the main reason many shop owners supported the change. The lamps were not cheaper to install, and no extra funding was offered to businesses.\n\nResearchers asked residents the same questions before and after the lamps were changed. More people said they were willing to walk along the street in the evening. However, a new evening bus service had also started during the trial. It brought more passengers and activity to the area. This made it difficult to separate the effects of the lamps from the effects of the bus service.\n\nThe council therefore decided not to replace every lamp immediately. In the next stage, the researchers will compare two similar streets over the same period, changing the lighting on only one of them. They will also record how many people use each street. This should provide a clearer comparison, although it will not answer every question about safety."], "durations": [420, 420, 600, 360]},KEY='ielts-diagnostic-20261003-v1',NAMES=['听力','阅读','短写作','口语'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={stage:-1,answers:{},essay:'',records:[],plays:[0,0],started:null,stageStart:null,deadline:null,complete:false,events:[],usedHelp:false,rehearsed:false};try{let loaded=JSON.parse(window.IELTSProfiles.storage().getItem(KEY)||'null');if(loaded)state={...state,...loaded}}catch{}let busy=false,recorder=null,stream=null,recordingChunks=[],recordingStarted=0,recordingBlob=null,recordingUrl=null,recordMime='',cachedSpeechPhase=-1;
function save(){try{window.IELTSProfiles.storage().setItem(KEY,JSON.stringify(state))}catch{$('#saveWarn').textContent='浏览器未能保存答案，请随时点击“保存当前答案”下载备份。'}}
function recordEvent(type,detail=''){state.events.push({type,detail,at:new Date().toISOString()});save()}
function fmt(s){s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function setAnswer(id,value){state.answers[id]=value;save()}
function qs(ids){return TEST.questions.filter(q=>ids.includes(q.id)).map(q=>`<div class="question"><p class="en" id="label${q.id}">${esc(q.prompt)}</p>${q.kind==='choice'?q.options.map((o,i)=>{let val=q.id.startsWith('R')&&+q.id.slice(1)<=4?o:String.fromCharCode(65+i);return `<label class="option en"><input type="radio" name="${q.id}" value="${esc(val)}" ${state.answers[q.id]===val?'checked':''} onchange="setAnswer('${q.id}',this.value)">${esc(o)}</label>`}).join(''):`<input type="text" aria-labelledby="label${q.id}" value="${esc(state.answers[q.id]||'')}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="setAnswer('${q.id}',this.value)">`}</div>`).join('')}
function renderIntro(){ $('#dock').hidden=true;$('#view').innerHTML=`<section class="card"><span class="tag">新题 · 英式音频 · 学术类方向的缩短筛查</span><h2>准备好后再开始计时</h2><div class="steps"><div class="step">听力<b>7分钟</b>2段音频 · 8题</div><div class="step">阅读<b>7分钟</b>1篇短文 · 8题</div><div class="step">短写作<b>10分钟</b>建议120—160词</div><div class="step">口语<b>6分钟</b>问答、准备与讲述</div></div><p>这份原创短测用于初步判断强弱项。缩短的题目没有官方分数换算表；页面先核对听读，作文和原始口语录音发回聊天综合判断。它不能代替完整雅思模考。</p><ol><li>不查词、不翻译、不看课文、不用写作辅助；不知道的题可以空着。</li><li>听力每段尽量只听一遍，正常速度。重播与中断会记在结果中。</li><li>每项到时自动进入下一项。没有暂停；切到后台、锁屏或刷新后，时间仍继续计算。</li><li>写作是缩短采样，不是正式考试的完整作文。口语不读稿，准备时可写几个关键词。</li><li>做完导出文字结果和录音，再发回聊天。内容保存在本机，不自动上传。</li></ol><div class="notice">预计作答不超过30分钟。请先完成下面的声音检查；准备过程不计时。</div><h3>1. 检查声音</h3><audio controls preload="none" src="audio/diagnostic/soundcheck.mp3"></audio><h3>2. 检查口语录音方式</h3><p class="muted">电脑可用页面录音。iPad如果不支持或未允许麦克风，可用“语音备忘录”录口语，回来提交原始录音；文字答案照常保存。</p><button onclick="checkMic()">检查麦克风</button><p id="micStatus" role="status"></p><p><label><input type="checkbox" id="ready">我能听到声音，已准备好连续测试30分钟。</label></p><button class="primary big" onclick="startTest()">开始测试</button></section>`;}
async function checkMic(){try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error();const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());$('#micStatus').textContent='麦克风可用。口语阶段仍需点击“开始录音”。'}catch{$('#micStatus').textContent='页面暂时不能录音。请准备手机或 iPad 的“语音备忘录”，到口语阶段录下回答。'}}
function startTest(){if(!$('#ready').checked){$('#saveWarn').textContent='请先完成声音检查，并勾选准备完成。';return}$('#saveWarn').textContent='';document.querySelectorAll('audio').forEach(a=>a.pause());state.started=Date.now();state.stage=0;state.stageStart=Date.now();state.deadline=state.stageStart+TEST.durations[0]*1000;recordEvent('start');render();}
function render(){cachedSpeechPhase=-1;if(state.complete){renderResult();return}if(state.stage<0){renderIntro();return}$('#dock').hidden=false;$('#finishStage').textContent=state.stage===3?'完成测试':'交卷并进入下一项';let s='';if(state.stage===0){s=`<section class="card"><span class="tag">第1项 / 4 · 7分钟</span><h2>听力 Listening</h2><p>先看题，再播放。每段只听一遍，答案可在本项时间内修改。题目按录音顺序排列；没有中文提示。</p><h3>音频A · Q1—4</h3><p>Complete the notes. Write <strong>ONE WORD AND/OR A NUMBER</strong> for each answer. For Q2, write the time in digits.</p><button class="primary" id="play0" onclick="playClip(0)">▶ 播放音频A</button><span id="audioStatus0" class="muted"></span><audio id="clip0" src="audio/diagnostic/listening_a.mp3" preload="auto"></audio>${qs(['L1','L2','L3','L4'])}<h3>音频B · Q5—8</h3><p>Choose the correct letter, A, B or C.</p><button class="primary" id="play1" onclick="playClip(1)">▶ 播放音频B</button><span id="audioStatus1" class="muted"></span><audio id="clip1" src="audio/diagnostic/listening_b.mp3" preload="auto"></audio>${qs(['L5','L6','L7','L8'])}</section>`}else if(state.stage===1){s=`<section class="card"><span class="tag">第2项 / 4 · 7分钟</span><h2>阅读 Reading</h2><div class="split"><article class="passage en"><h3>Counting Birds, Counting Carefully</h3>${TEST.reading.map((p,i)=>`<p><b>${String.fromCharCode(65+i)}.</b> ${esc(p)}</p>`).join('')}</article><div><p class="muted">Q9—12：TRUE = 与原文一致；FALSE = 与原文矛盾；NOT GIVEN = 原文未提供足够信息。只根据文章作答。</p>${qs(['R1','R2','R3','R4'])}<p>Q13—14: Write <strong>ONE WORD ONLY</strong> from the passage.</p>${qs(['R5','R6'])}<p>Q15—16: Choose A, B or C.</p>${qs(['R7','R8'])}</div></div></section>`}else if(state.stage===2){s=`<section class="card"><span class="tag">第3项 / 4 · 10分钟</span><h2>短写作 Writing</h2><p class="en">${esc(TEST.writing)}</p><p>建议写120—160个英文单词，说明双方想法与自己的立场，至少给一个理由或例子。写不完也保留真实答案，不查词、不借助改写工具。</p><p class="muted">这是缩短采样；正式雅思 Task 2 要求至少250词。本次不按正式篇幅要求扣分，也不代表完整写作成绩。</p><label for="essay">你的回答</label><textarea id="essay" lang="en" autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="off" oninput="state.essay=this.value;save();updateWords()">${esc(state.essay)}</textarea><p id="wordCount" class="muted"></p></section>`}else{s=`<section class="card"><span class="tag">第4项 / 4 · 6分钟</span><h2>口语 Speaking</h2><p>现在点击录音，用英语回答屏幕上的问题。录音期间不要刷新或关闭页面，结束后立即下载备份。题目会按时间自动切换：1分钟问答 → 1分钟准备 → 2分钟讲述 → 2个各1分钟的讨论题。不要先写完整稿。</p><div class="tools"><button class="primary" id="recStart" onclick="startRecording()">● 开始录音</button><button id="recStop" onclick="stopRecording()" disabled>停止并保存录音</button><button onclick="downloadRecording()">下载已保存录音</button></div><p id="recordStatus" role="status">若页面录音不可用，用手机“语音备忘录”录下回答即可。</p><div class="notice"><b id="speechPhase"></b><p id="speechPrompt" class="en"></p></div><label for="speechNotes">准备区：只写关键词（不会替代口语回答）</label><textarea id="speechNotes" style="min-height:85px" oninput="state.speechNotes=this.value;save()" spellcheck="false">${esc(state.speechNotes||'')}</textarea></section>`}$('#view').innerHTML=s;window.scrollTo(0,0);if(state.stage===0)bindListening();if(state.stage===2)updateWords();tick();}
function updateWords(){const n=(state.essay.trim().match(/\b[\w]+(?:['’-][\w]+)*\b/g)||[]).length;$('#wordCount').textContent=`当前 ${n} 词 · 答案随输入保存`;return n}
function bindListening(){[0,1].forEach(i=>{const a=$('#clip'+i);$('#play'+i).textContent=state.plays[i]?'↻ 重播音频（会记录）':`▶ 播放音频${i?'B':'A'}`;a.onended=()=>{$('#play'+i).disabled=false;$('#play'+i).textContent='↻ 重播音频（会记录）';$('#audioStatus'+i).textContent=' 已播放完毕'};a.onerror=()=>{$('#play'+i).disabled=false;$('#audioStatus'+i).textContent=' 音频未能打开，请确认学习包 audio/diagnostic 文件夹完整';recordEvent('audio_error',String(i))};a.onratechange=()=>{if(a.playbackRate!==1){recordEvent('speed_change',`${i}:${a.playbackRate}`);a.playbackRate=1}};})}
async function playClip(i){if(state.stage!==0)return;const other=$('#clip'+(1-i));if(!other.paused&&!other.ended){recordEvent('interrupted_clip',String(1-i));other.pause();$('#play'+(1-i)).disabled=false}const a=$('#clip'+i);a.currentTime=0;a.playbackRate=1;try{await a.play();state.plays[i]++;recordEvent('play_clip',String(i));$('#play'+i).disabled=true;$('#audioStatus'+i).textContent=' 正在播放，请边听边答题'}catch{$('#audioStatus'+i).textContent=' 未能播放，请重试；如果仍失败，请保留结果说明';recordEvent('audio_play_failed',String(i))}}
function tick(){if(state.stage<0||state.complete)return;const now=Date.now(),left=(state.deadline-now)/1000;$('#phaseName').textContent=`第${state.stage+1}项 · ${NAMES[state.stage]}`;$('#clock').textContent=fmt(left);$('#clock').classList.toggle('urgent',left<60);$('#totalTime').textContent=`距30分钟上限 ${fmt((state.started+1800000-now)/1000)}`;if(state.stage===3){const elapsed=(now-state.stageStart)/1000;const i=TEST.speaking.findIndex(s=>elapsed>=s.start&&elapsed<s.end);if(i>=0&&i!==cachedSpeechPhase){cachedSpeechPhase=i;$('#speechPhase').textContent=TEST.speaking[i].title;$('#speechPrompt').textContent=TEST.speaking[i].text;}}if(left<=0&&!busy)advance(true)}
async function advance(auto){if(busy||state.stage<0||state.complete)return;if(!auto&&!confirm(state.stage===3?'确认完成并提交？':'确认提交本项？提交后不能返回修改。'))return;busy=true;document.querySelectorAll('audio').forEach(a=>a.pause());const now=Date.now(),oldDeadline=state.deadline;state.records.push({section:NAMES[state.stage],started:state.stageStart,ended:now,elapsedSeconds:Math.round((now-state.stageStart)/1000),auto});if(state.stage===3){await stopRecording();state.complete=true;recordEvent('complete');busy=false;render();return}state.stage++;state.stageStart=auto?oldDeadline:now;state.deadline=state.stageStart+TEST.durations[state.stage]*1000;recordEvent('section_start',NAMES[state.stage]);busy=false;render()}
async function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open(window.IELTSProfiles.scopeKey('ielts-diagnostic-audio-v1'),1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveBlob(blob){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('clips','readwrite');t.objectStore('clips').put(blob,'speech');t.oncomplete=()=>{d.close();resolve()};t.onerror=()=>{d.close();reject(t.error)}})}
async function loadBlob(){try{const d=await db();return await new Promise((resolve,reject)=>{const r=d.transaction('clips').objectStore('clips').get('speech');r.onsuccess=()=>{d.close();resolve(r.result)};r.onerror=()=>{d.close();reject(r.error)}})}catch{return null}}
async function startRecording(){if(state.stage!==3||recorder?.state==='recording')return;$('#recStart').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error();stream=await navigator.mediaDevices.getUserMedia({audio:true});if(state.stage!==3||state.complete){stream.getTracks().forEach(t=>t.stop());return}const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];recordMime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';recorder=recordMime?new MediaRecorder(stream,{mimeType:recordMime}):new MediaRecorder(stream);recordingChunks=[];recordingStarted=Date.now();recorder.ondataavailable=e=>{if(e.data.size)recordingChunks.push(e.data)};recorder.onerror=()=>{recordEvent('recording_error');$('#recordStatus').textContent='录音出现问题，请改用语音备忘录。';stream?.getTracks().forEach(t=>t.stop())};recorder.start(1000);state.recordingStarted=recordingStarted;recordEvent('recording_start');$('#recStop').disabled=false;$('#recordStatus').className='recording';$('#recordStatus').textContent='● 正在录音。请直接说英语；准备的一分钟可以安静思考。'}catch{$('#recStart').disabled=false;$('#recordStatus').textContent='页面录音不可用或未获授权。请用语音备忘录录下接下来的回答，并单独发回。';recordEvent('mic_unavailable')}}
async function stopRecording(){if(!recorder||recorder.state==='inactive')return;return new Promise(resolve=>{recorder.onstop=async()=>{stream?.getTracks().forEach(t=>t.stop());recordingBlob=new Blob(recordingChunks,{type:recorder.mimeType||recordMime||'audio/webm'});state.recordingSeconds=Math.round((Date.now()-recordingStarted)/1000);state.recordingBytes=recordingBlob.size;state.recordingType=recordingBlob.type;try{await saveBlob(recordingBlob);state.audioSaved=true}catch{state.audioSaved=false}save();if($('#recordStatus')){$('#recordStatus').className='';$('#recordStatus').textContent=state.audioSaved?'录音已保存在本机。请下载备份。':'录音暂存于当前页面，请立即下载，避免刷新丢失。';$('#recStop').disabled=true;$('#recStart').disabled=true}resolve()};recorder.stop()})}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function downloadRecording(){const blob=recordingBlob||await loadBlob();if(!blob){alert('本页还没有保存的录音。如果使用了语音备忘录，请从那里分享原始音频。');return}const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';download(blob,'30分钟测试_口语录音.'+ext)}
function normal(s){return String(s??'').trim().toLowerCase().replace(/[，。！？]/g,'').replace(/\s+/g,' ')}
function correct(q){return q.answers.some(a=>normal(a)===normal(state.answers[q.id]))}
function scores(){return {listening:TEST.questions.slice(0,8).filter(correct).length,reading:TEST.questions.slice(8).filter(correct).length}}
function report(){const sc=scores(),words=(state.essay.trim().match(/\b[\w]+(?:['’-][\w]+)*\b/g)||[]).length;return `英语能力筛查 · ${TEST.version}\n状态：${state.complete?'已提交':'未完成的备份'}\n作答开始：${state.started?new Date(state.started).toISOString():'未开始'}\n听力：${sc.listening}/8；阅读：${sc.reading}/8（原创短测原始分，不换算雅思分数）\n音频播放次数：A ${state.plays[0]}，B ${state.plays[1]}\n使用词典/翻译/他人帮助：${state.usedHelp?'是':'未勾选'}\n已练过本套题：${state.rehearsed?'是':'未勾选'}\n录音：${state.recordingSeconds||0}秒，${state.recordingBytes||0}字节；如使用外部录音请另附\n补充情况：${state.comment||'无'}\n\n【听力与阅读答案】\n${TEST.questions.map(q=>q.prompt+'\n作答：'+(state.answers[q.id]||'未答')+(state.complete?'\n核对：'+(correct(q)?'正确':'错误或未答')+'；参考：'+q.answers[0]:'')).join('\n\n')}\n\n【写作题目】\n${TEST.writing}\n限时10分钟、建议120—160词，仅为缩短写作采样，不含Task 1。\n实际词数：${words}\n【原始作文】\n${state.essay||'未作答'}\n\n【口语问题】\n${TEST.speaking.filter((s,i)=>i!==2).map(s=>s.title+'\n'+s.text).join('\n\n')}\n【准备关键词，不作为口语评分证据】\n${state.speechNotes||'无'}\n\n【各项用时】\n${state.records.map(r=>r.section+'：'+r.elapsedSeconds+'秒'+(r.auto?'（到时提交）':'（主动提交）')).join('\n')}\n\n【过程记录】\n${state.events.map(e=>e.at+' '+e.type+' '+e.detail).join('\n')}\n\n【评估边界】\n此套题为原创筛查，未与正式IELTS试卷等值校准；听读8题成绩不能按比例换算40题Band。写作任务缩短，口语为非互动录音。请结合实际作文与能听到的原始录音，给出带不确定性的能力判断；缺录音时不要评价发音或编造口语/总分。\n评分参考：https://ielts.org/take-a-test/your-results/ielts-scoring-in-detail\nhttps://ielts.org/cdn/ielts-guides/ielts-writing-band-descriptors.pdf\nhttps://ielts.org/cdn/ielts-guides/ielts-speaking-band-descriptors.pdf\n`}
function downloadReport(){download(new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'}),'30分钟测试_答案与作文.txt')}
function syncReport(){save();if($('#reportText'))$('#reportText').value=report()}
function renderResult(){$('#dock').hidden=true;const sc=scores();$('#view').innerHTML=`<section class="card"><span class="tag">已提交 · 答案已锁定</span><h2>完成了，现在看实际表现</h2><div class="steps"><div class="step">听力<b>${sc.listening} / 8</b>原始答对题数</div><div class="step">阅读<b>${sc.reading} / 8</b>原始答对题数</div><div class="step">写作<b>待评阅</b>根据你的原始作文</div><div class="step">口语<b>待听录音</b>未录音则暂不评估</div></div><p>把下面两个文件发回聊天，我会结合答题情况、作文和口语表现，判断目前的强弱项、对6.5目标的准备程度，以及还需要补测什么。短测样本不足时会保留不确定性，不会用16道题硬算一个总分。</p><div class="tools"><button class="primary" onclick="downloadReport()">① 下载答案与作文</button><button onclick="downloadRecording()">② 下载口语录音</button></div><div id="recordingPreview"></div><p class="muted">文件通常保存在浏览器“下载”中。若用语音备忘录，请分享那份录音。录音没有自动上传。</p><h3>补充实际作答情况</h3><label class="option"><input type="checkbox" ${state.usedHelp?'checked':''} onchange="state.usedHelp=this.checked;syncReport()">我使用了词典、翻译或其他帮助</label><label class="option"><input type="checkbox" ${state.rehearsed?'checked':''} onchange="state.rehearsed=this.checked;syncReport()">我之前看过或练过这套题</label><label for="comment">中断、听不清、外部录音等情况</label><textarea id="comment" style="min-height:80px" oninput="state.comment=this.value;syncReport()">${esc(state.comment||'')}</textarea><p class="muted">填写后请重新下载答案文件。</p><details><summary>下载不方便？展开后复制文字结果</summary><textarea id="reportText" class="reportbox" readonly>${esc(report())}</textarea></details><details><summary>查看听力与阅读答案、解释</summary>${TEST.questions.map(q=>`<div class="answers"><b class="${correct(q)?'answer-ok':'answer-bad'}">${correct(q)?'✓':'○'} ${esc(q.prompt)}</b><p>你的答案：${esc(state.answers[q.id]||'未答')}；参考：${esc(q.answers[0])}</p><p>${esc(q.why)}</p></div>`).join('')}</details><details><summary>查看听力原文（做完后复习用）</summary>${TEST.transcripts.map(t=>'<p class="en breakline">'+esc(t)+'</p>').join('')}</details><p class="muted">评阅参考：<a href="https://ielts.org/cdn/ielts-guides/ielts-writing-band-descriptors.pdf">雅思官方写作标准</a> · <a href="https://ielts.org/cdn/ielts-guides/ielts-speaking-band-descriptors.pdf">口语标准</a>。本短测非官方试题，合成听力仅用英式口音，未覆盖完整考试的难度与题型。</p><a class="button" href="开始学习.html">返回学习页面</a> <button class="danger" onclick="resetTest()">清除本次记录，重新练习</button></section>`;loadRecordingPreview();window.scrollTo(0,0)}
async function loadRecordingPreview(){const blob=recordingBlob||await loadBlob();if(blob&&$('#recordingPreview')){if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(blob);$('#recordingPreview').innerHTML='<p>回听你的口语录音：</p><audio controls></audio>';$('#recordingPreview audio').src=recordingUrl}}
async function resetTest(){if(!confirm('确认清除这套测试的答案与本页录音？请先下载备份。学习课文的记录不受影响。'))return;try{const d=await db();await new Promise((resolve,reject)=>{const t=d.transaction('clips','readwrite');t.objectStore('clips').delete('speech');t.oncomplete=resolve;t.onerror=reject});d.close()}catch{}window.IELTSProfiles.storage().removeItem(KEY);location.reload()}
document.addEventListener('visibilitychange',()=>{if(state.stage>=0&&!state.complete){recordEvent(document.hidden?'page_hidden':'page_visible');if(!document.hidden)tick()}});window.addEventListener('beforeunload',()=>{if(state.stage>=0&&!state.complete)recordEvent('page_unload')});setInterval(tick,250);if(state.stage>=0&&!state.complete)recordEvent('page_loaded_or_resumed');render();
</script><script type="application/x-ielts-pending" data-ielts-script="1" data-src="assets/study-timer.js" defer></script></body></html>
