": 0, "voiceEnd": 1.2441666666666666, "end": 2.4883333333333333, "voiceSeconds": 1.2441666666666666, "pauseSeconds": 1.2441666666666666, "sourceStart": 0.235, "sourceEnd": 1.4791666666666667, "zh": "计算机。"}, {"index": 1, "text": "The goal of early calculating machines was to simplify difficult sums.", "start": 2.4883333333333333, "voiceEnd": 8.224833333333333, "end": 13.961333333333334, "voiceSeconds": 5.7365, "pauseSeconds": 5.7365, "sourceStart": 1.9791666666666667, "sourceEnd": 7.7156666666666665, "zh": "早期计算机器的目标，是简化困难的运算。"}, {"index": 2, "text": "But with the help of new technology,", "start": 13.961333333333334, "voiceEnd": 16.475833333333334, "end": 18.990333333333332, "voiceSeconds": 2.5145, "pauseSeconds": 2.5145, "sourceStart": 8.245666666666667, "sourceEnd": 10.760166666666667, "zh": "但在新技术的帮助下，"}, {"index": 3, "text": "electronic chips replaced tubes and a revolution of artificial intelligence has arisen.", "start": 18.990333333333332, "voiceEnd": 25.71333333333333, "end": 32.43633333333333, "voiceSeconds": 6.723, "pauseSeconds": 6.723, "sourceStart": 10.980166666666667, "sourceEnd": 17.703166666666668, "zh": "电子芯片取代了电子管，人工智能革命兴起了。"}, {"index": 4, "text": "From then on,", "start": 32.43633333333333, "voiceEnd": 33.603291666666664, "end": 34.77025, "voiceSeconds": 1.1669583333333333, "pauseSeconds": 1.1669583333333333, "sourceStart": 18.213166666666666, "sourceEnd": 19.380125, "zh": "从那时起，"}, {"index": 5, "text": "the appearance of computers totally changed our lives.", "start": 34.77025, "voiceEnd": 38.95979166666666, "end": 43.14933333333333, "voiceSeconds": 4.189541666666667, "pauseSeconds": 4.189541666666667, "sourceStart": 19.620125, "sourceEnd": 23.809666666666665, "zh": "计算机的出现彻底改变了我们的生活。"}, {"index": 6, "text": "They can not only download information from the web", "start": 43.14933333333333, "voiceEnd": 46.48708333333333, "end": 49.82483333333333, "voiceSeconds": 3.33775, "pauseSeconds": 3.33775, "sourceStart": 24.309666666666665, "sourceEnd": 27.64741666666667, "zh": "它们不仅能从互联网上下载信息，"}, {"index": 7, "text": "when connected by the network or mobile phone signals,", "start": 49.82483333333333, "voiceEnd": 53.809374999999996, "end": 57.79391666666666, "voiceSeconds": 3.984541666666667, "pauseSeconds": 3.984541666666667, "sourceStart": 27.64741666666667, "sourceEnd": 31.631958333333333, "zh": "在通过网络或手机信号连接时，"}, {"index": 8, "text": "but also solve different types of logical problems.", "start": 57.79391666666666, "voiceEnd": 61.59162499999999, "end": 65.38933333333333, "voiceSeconds": 3.7977083333333335, "pauseSeconds": 3.7977083333333335, "sourceStart": 32.02195833333333, "sourceEnd": 35.81966666666667, "zh": "还能够解决各种逻辑问题。"}, {"index": 9, "text": "With operators as their coaches,", "start": 65.38933333333333, "voiceEnd": 67.74312499999999, "end": 70.09691666666666, "voiceSeconds": 2.3537916666666665, "pauseSeconds": 2.3537916666666665, "sourceStart": 36.31966666666667, "sourceEnd": 38.673458333333336, "zh": "以操作人员为指导者，"}, {"index": 10, "text": "they can even control rockets to explore the moon", "start": 70.09691666666666, "voiceEnd": 73.36058333333332, "end": 76.62424999999999, "voiceSeconds": 3.2636666666666665, "pauseSeconds": 3.2636666666666665, "sourceStart": 38.98345833333333, "sourceEnd": 42.247125, "zh": "它们甚至能控制火箭探索月球，"}, {"index": 11, "text": "and instruct androids with the human race’s characters", "start": 76.62424999999999, "voiceEnd": 80.37583333333332, "end": 84.12741666666666, "voiceSeconds": 3.7515833333333335, "pauseSeconds": 3.7515833333333335, "sourceStart": 42.247125, "sourceEnd": 45.99870833333333, "zh": "并指挥具有人类特征的机器人，"}, {"index": 12, "text": "to mop floors and watch over your naughty niece.", "start": 84.12741666666666, "voiceEnd": 87.42570833333333, "end": 90.72399999999999, "voiceSeconds": 3.2982916666666666, "pauseSeconds": 3.2982916666666666, "sourceStart": 45.99870833333333, "sourceEnd": 49.297, "zh": "拖地、照看你淘气的侄女。"}, {"index": 13, "text": "Anyhow, computers are so helpful that they do bring happiness.", "start": 90.72399999999999, "voiceEnd": 95.874, "end": 101.02399999999999, "voiceSeconds": 5.15, "pauseSeconds": 5.15, "sourceStart": 49.787, "sourceEnd": 54.937, "zh": "总之，计算机如此有用，确实能带来快乐。"}, {"index": 14, "text": "However, computers are easily attacked by viruses.", "start": 101.02399999999999, "voiceEnd": 105.79466666666666, "end": 110.56533333333331, "voiceSeconds": 4.770666666666667, "pauseSeconds": 4.770666666666667, "sourceStart": 55.447, "sourceEnd": 60.217666666666666, "zh": "然而，计算机很容易受到病毒攻击。"}, {"index": 15, "text": "This reality has become a problem that is hard to deal with.", "start": 110.56533333333331, "voiceEnd": 115.24499999999998, "end": 119.92466666666665, "voiceSeconds": 4.679666666666667, "pauseSeconds": 4.679666666666667, "sourceStart": 60.717666666666666, "sourceEnd": 65.39733333333334, "zh": "这一现实已经成了难以处理的问题。"}, {"index": 16, "text": "As a result,", "start": 119.92466666666665, "voiceEnd": 121.09766666666665, "end": 122.27066666666666, "voiceSeconds": 1.173, "pauseSeconds": 1.173, "sourceStart": 65.88733333333333, "sourceEnd": 67.06033333333333, "zh": "因此，"}, {"index": 17, "text": "computers are dangerous in a way.", "start": 122.27066666666666, "voiceEnd": 124.89566666666666, "end": 127.52066666666666, "voiceSeconds": 2.625, "pauseSeconds": 2.625, "sourceStart": 67.36033333333333, "sourceEnd": 69.98533333333333, "zh": "计算机在某种程度上也有危险。"}, {"index": 18, "text": "So, personally, I worry about their universal applications in some fields,", "start": 127.52066666666666, "voiceEnd": 133.9545, "end": 140.38833333333332, "voiceSeconds": 6.433833333333333, "pauseSeconds": 6.433833333333333, "sourceStart": 70.47533333333334, "sourceEnd": 76.90916666666666, "zh": "所以，就我个人而言，我担心它们在某些领域的广泛应用，"}, {"index": 19, "text": "such as finance.", "start": 140.38833333333332, "voiceEnd": 141.92016666666666, "end": 143.452, "voiceSeconds": 1.5318333333333334, "pauseSeconds": 1.5318333333333334, "sourceStart": 77.07916666666667, "sourceEnd": 78.611, "zh": "例如金融领域。"}], "duration": 143.452, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "34": {"day": 34, "title": "Wildlife Protection", "groups": [{"index": 0, "text": "Wildlife Protection.", "start": 0, "voiceEnd": 1.9906666666666666, "end": 3.981333333333333, "voiceSeconds": 1.9906666666666666, "pauseSeconds": 1.9906666666666666, "sourceStart": 0.195, "sourceEnd": 2.1856666666666666, "zh": "保护野生动植物。"}, {"index": 1, "text": "Dinosaurs died out because of an unexpected incident.", "start": 3.981333333333333, "voiceEnd": 8.476666666666667, "end": 12.972, "voiceSeconds": 4.495333333333333, "pauseSeconds": 4.495333333333333, "sourceStart": 2.6856666666666666, "sourceEnd": 7.181, "zh": "恐龙因为一次意外事件而灭绝了。"}, {"index": 2, "text": "But wildlife today disappears or is in danger", "start": 12.972, "voiceEnd": 16.981749999999998, "end": 20.991500000000002, "voiceSeconds": 4.00975, "pauseSeconds": 4.00975, "sourceStart": 7.731, "sourceEnd": 11.74075, "zh": "但如今的野生动植物正在消失或濒临危险，"}, {"index": 3, "text": "just because humans do harm to it.", "start": 20.991500000000002, "voiceEnd": 23.64241666666667, "end": 26.293333333333337, "voiceSeconds": 2.650916666666667, "pauseSeconds": 2.650916666666667, "sourceStart": 11.74075, "sourceEnd": 14.391666666666667, "zh": "正是因为人类对它们造成了伤害。"}, {"index": 4, "text": "For example, tigers are hunted for fur to make carpets", "start": 26.293333333333337, "voiceEnd": 30.624125000000003, "end": 34.95491666666667, "voiceSeconds": 4.330791666666666, "pauseSeconds": 4.330791666666666, "sourceStart": 14.901666666666667, "sourceEnd": 19.232458333333334, "zh": "例如，人们猎杀老虎，取其皮毛制作地毯，"}, {"index": 5, "text": "so that they can only live in secure reserves;", "start": 34.95491666666667, "voiceEnd": 37.802625000000006, "end": 40.650333333333336, "voiceSeconds": 2.8477083333333333, "pauseSeconds": 2.8477083333333333, "sourceStart": 19.232458333333334, "sourceEnd": 22.080166666666667, "zh": "以至于它们只能生活在安全的保护区里；"}, {"index": 6, "text": "grassland is destroyed without mercy", "start": 40.650333333333336, "voiceEnd": 43.403875, "end": 46.15741666666667, "voiceSeconds": 2.7535416666666666, "pauseSeconds": 2.7535416666666666, "sourceStart": 22.480166666666666, "sourceEnd": 25.233708333333333, "zh": "草原被无情地破坏，"}, {"index": 7, "text": "so that dust storms come into being affecting distant cities.", "start": 46.15741666666667, "voiceEnd": 50.377375, "end": 54.59733333333334, "voiceSeconds": 4.2199583333333335, "pauseSeconds": 4.2199583333333335, "sourceStart": 25.233708333333333, "sourceEnd": 29.453666666666667, "zh": "于是沙尘暴形成，并影响遥远的城市。"}, {"index": 8, "text": "Last year, scientists saw some monkeys rubbing themselves with a certain kind of insect", "start": 54.59733333333334, "voiceEnd": 61.34008333333334, "end": 68.08283333333334, "voiceSeconds": 6.74275, "pauseSeconds": 6.74275, "sourceStart": 29.963666666666665, "sourceEnd": 36.70641666666667, "zh": "去年，科学家看到一些猴子用某种昆虫摩擦身体，"}, {"index": 9, "text": "to protect themselves from fierce mosquitoes biting.", "start": 68.08283333333334, "voiceEnd": 71.77941666666668, "end": 75.47600000000001, "voiceSeconds": 3.6965833333333333, "pauseSeconds": 3.6965833333333333, "sourceStart": 36.70641666666667, "sourceEnd": 40.403, "zh": "保护自己，防止凶猛的蚊子叮咬。"}, {"index": 10, "text": "According to the result of the inspection,", "start": 75.47600000000001, "voiceEnd": 78.22716666666668, "end": 80.97833333333335, "voiceSeconds": 2.7511666666666668, "pauseSeconds": 2.7511666666666668, "sourceStart": 40.893, "sourceEnd": 43.64416666666666, "zh": "根据检查结果，"}, {"index": 11, "text": "they found that the insect contains a powerful drug,", "start": 80.97833333333335, "voiceEnd": 84.59516666666669, "end": 88.21200000000002, "voiceSeconds": 3.616833333333333, "pauseSeconds": 3.616833333333333, "sourceStart": 43.89416666666666, "sourceEnd": 47.511, "zh": "他们发现这种昆虫含有一种强效药物，"}, {"index": 12, "text": "so local farmers were employed to catch the insects.", "start": 88.21200000000002, "voiceEnd": 92.09466666666668, "end": 95.97733333333335, "voiceSeconds": 3.8826666666666667, "pauseSeconds": 3.8826666666666667, "sourceStart": 47.781, "sourceEnd": 51.663666666666664, "zh": "于是雇用当地农民去捕捉昆虫。"}, {"index": 13, "text": "The ending was that the insects disappeared from the whole zone.", "start": 95.97733333333335, "voiceEnd": 100.54733333333334, "end": 105.11733333333335, "voiceSeconds": 4.57, "pauseSeconds": 4.57, "sourceStart": 52.163666666666664, "sourceEnd": 56.733666666666664, "zh": "结果，这些昆虫在整个区域里消失了。"}, {"index": 14, "text": "When told that it was a loss to humans,", "start": 105.11733333333335, "voiceEnd": 107.88666666666668, "end": 110.65600000000002, "voiceSeconds": 2.7693333333333334, "pauseSeconds": 2.7693333333333334, "sourceStart": 57.21366666666667, "sourceEnd": 59.983, "zh": "当被告知这对人类是个损失时，"}, {"index": 15, "text": "the farmers burst into laughter and responded,", "start": 110.65600000000002, "voiceEnd": 113.96483333333336, "end": 117.27366666666668, "voiceSeconds": 3.3088333333333333, "pauseSeconds": 3.3088333333333333, "sourceStart": 60.283, "sourceEnd": 63.591833333333334, "zh": "农民们大笑着回答："}, {"index": 16, "text": "“Our real loss is our decreasing income.”", "start": 117.27366666666668, "voiceEnd": 120.14716666666669, "end": 123.02066666666668, "voiceSeconds": 2.8735, "pauseSeconds": 2.8735, "sourceStart": 63.871833333333335, "sourceEnd": 66.74533333333333, "zh": "“我们真正的损失，是收入减少了。”"}, {"index": 17, "text": "We should appreciate the natural balance", "start": 123.02066666666668, "voiceEnd": 125.91962500000002, "end": 128.81858333333335, "voiceSeconds": 2.8989583333333333, "pauseSeconds": 2.8989583333333333, "sourceStart": 67.23533333333333, "sourceEnd": 70.13429166666667, "zh": "我们应该珍视自然界的平衡，"}, {"index": 18, "text": "and pay more attention to the importance of wildlife protection.", "start": 128.81858333333335, "voiceEnd": 133.41162500000002, "end": 138.00466666666668, "voiceSeconds": 4.593041666666666, "pauseSeconds": 4.593041666666666, "sourceStart": 70.13429166666667, "sourceEnd": 74.72733333333333, "zh": "更加重视保护野生动植物的重要性。"}, {"index": 19, "text": "Not until we succeed in letting wildlife live in peace", "start": 138.00466666666668, "voiceEnd": 142.243625, "end": 146.48258333333334, "voiceSeconds": 4.238958333333334, "pauseSeconds": 4.238958333333334, "sourceStart": 75.22733333333333, "sourceEnd": 79.46629166666666, "zh": "只有成功让野生动植物安宁地生存，"}, {"index": 20, "text": "can we smile in relief.", "start": 146.48258333333334, "voiceEnd": 148.46529166666667, "end": 150.448, "voiceSeconds": 1.9827083333333333, "pauseSeconds": 1.9827083333333333, "sourceStart": 79.46629166666666, "sourceEnd": 81.449, "zh": "我们才能如释重负地微笑。"}], "duration": 150.448, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "35": {"day": 35, "title": "My First Band", "groups": [{"index": 0, "text": "My First Band.", "start": 0, "voiceEnd": 1.5948333333333333, "end": 3.1896666666666667, "voiceSeconds": 1.5948333333333333, "pauseSeconds": 1.5948333333333333, "sourceStart": 0.245, "sourceEnd": 1.8398333333333334, "zh": "我的第一支乐队。"}, {"index": 1, "text": "I was very sensitive to music.", "start": 3.1896666666666667, "voiceEnd": 6.018833333333333, "end": 8.847999999999999, "voiceSeconds": 2.8291666666666666, "pauseSeconds": 2.8291666666666666, "sourceStart": 2.349833333333333, "sourceEnd": 5.179, "zh": "我对音乐非常敏感。"}, {"index": 2, "text": "Just dipping into the music books briefly,", "start": 8.847999999999999, "voiceEnd": 11.907625, "end": 14.96725, "voiceSeconds": 3.059625, "pauseSeconds": 3.059625, "sourceStart": 5.679, "sourceEnd": 8.738625, "zh": "只需简略翻阅乐谱书，"}, {"index": 3, "text": "I could sing or play well.", "start": 14.96725, "voiceEnd": 17.082291666666666, "end": 19.197333333333333, "voiceSeconds": 2.1150416666666665, "pauseSeconds": 2.1150416666666665, "sourceStart": 8.998625, "sourceEnd": 11.113666666666667, "zh": "我就能唱得或演奏得很好。"}, {"index": 4, "text": "To be honest,", "start": 19.197333333333333, "voiceEnd": 20.320875, "end": 21.444416666666665, "voiceSeconds": 1.1235416666666667, "pauseSeconds": 1.1235416666666667, "sourceStart": 11.643666666666666, "sourceEnd": 12.767208333333333, "zh": "说实话，"}, {"index": 5, "text": "I always dreamt of becoming a famous folk actor.", "start": 21.444416666666665, "voiceEnd": 25.068375, "end": 28.69233333333333, "voiceSeconds": 3.6239583333333334, "pauseSeconds": 3.6239583333333334, "sourceStart": 12.977208333333333, "sourceEnd": 16.601166666666668, "zh": "我一直梦想成为著名的民间艺人。"}, {"index": 6, "text": "I was so confident that I never decreased my devotion.", "start": 28.69233333333333, "voiceEnd": 33.04083333333333, "end": 37.389333333333326, "voiceSeconds": 4.3485, "pauseSeconds": 4.3485, "sourceStart": 17.061166666666665, "sourceEnd": 21.409666666666666, "zh": "我信心十足，从未减少自己的投入。"}, {"index": 7, "text": "I formed my first band called “Rolling Frog”.", "start": 37.389333333333326, "voiceEnd": 41.10866666666666, "end": 44.82799999999999, "voiceSeconds": 3.719333333333333, "pauseSeconds": 3.719333333333333, "sourceStart": 21.909666666666666, "sourceEnd": 25.629, "zh": "我组建了第一支乐队，名叫“滚动的青蛙”。"}, {"index": 8, "text": "At the beginning,", "start": 44.82799999999999, "voiceEnd": 45.97662499999999, "end": 47.12524999999999, "voiceSeconds": 1.148625, "pauseSeconds": 1.148625, "sourceStart": 26.099, "sourceEnd": 27.247625, "zh": "起初，"}, {"index": 9, "text": "we relied on performing on instruments in pubs or to passers-by", "start": 47.12524999999999, "voiceEnd": 51.984749999999984, "end": 56.84424999999999, "voiceSeconds": 4.8595, "pauseSeconds": 4.8595, "sourceStart": 27.417625, "sourceEnd": 32.277125, "zh": "我们靠在酒吧或向路人演奏乐器，"}, {"index": 10, "text": "to earn extra money in cash.", "start": 56.84424999999999, "voiceEnd": 59.20079166666665, "end": 61.55733333333332, "voiceSeconds": 2.3565416666666668, "pauseSeconds": 2.3565416666666668, "sourceStart": 32.277125, "sourceEnd": 34.63366666666667, "zh": "赚一些额外的现金。"}, {"index": 11, "text": "Then we wore false beards", "start": 61.55733333333332, "voiceEnd": 63.62758333333332, "end": 65.69783333333332, "voiceSeconds": 2.07025, "pauseSeconds": 2.07025, "sourceStart": 35.11366666666667, "sourceEnd": 37.18391666666667, "zh": "后来，我们戴上假胡子，"}, {"index": 12, "text": "to pretend to be the musicians", "start": 65.69783333333332, "voiceEnd": 67.83679166666666, "end": 69.97574999999999, "voiceSeconds": 2.1389583333333335, "pauseSeconds": 2.1389583333333335, "sourceStart": 37.18391666666667, "sourceEnd": 39.322875, "zh": "假装成那些音乐家，"}, {"index": 13, "text": "whom people were familiar with.", "start": 69.97574999999999, "voiceEnd": 72.05020833333333, "end": 74.12466666666666, "voiceSeconds": 2.0744583333333333, "pauseSeconds": 2.0744583333333333, "sourceStart": 39.322875, "sourceEnd": 41.397333333333336, "zh": "就是大家熟悉的那些人。"}, {"index": 14, "text": "In addition, we attached humorous acts to our performances and played jokes on each other.", "start": 74.12466666666666, "voiceEnd": 80.85833333333332, "end": 87.59199999999998, "voiceSeconds": 6.733666666666666, "pauseSeconds": 6.733666666666666, "sourceStart": 41.87733333333333, "sourceEnd": 48.611, "zh": "此外，我们在演出中加入幽默动作，互相开玩笑。"}, {"index": 15, "text": "Soon, our “funny jazz” became famous", "start": 87.59199999999998, "voiceEnd": 90.92562499999998, "end": 94.25924999999998, "voiceSeconds": 3.333625, "pauseSeconds": 3.333625, "sourceStart": 49.101, "sourceEnd": 52.434625, "zh": "很快，我们的“搞笑爵士乐”出了名，"}, {"index": 16, "text": "and invitations to perform for broadcast stations began to come.", "start": 94.25924999999998, "voiceEnd": 99.04762499999998, "end": 103.83599999999998, "voiceSeconds": 4.788375, "pauseSeconds": 4.788375, "sourceStart": 52.434625, "sourceEnd": 57.223, "zh": "广播电台开始邀请我们去表演。"}, {"index": 17, "text": "Afterwards, we sorted out attractive music and made a record in a studio.", "start": 103.83599999999998, "voiceEnd": 109.83666666666664, "end": 115.83733333333332, "voiceSeconds": 6.000666666666667, "pauseSeconds": 6.000666666666667, "sourceStart": 57.693, "sourceEnd": 63.693666666666665, "zh": "后来，我们挑选整理了好听的音乐，在录音室录制了唱片。"}, {"index": 18, "text": "A million or so copies were sold and we became millionaires.", "start": 115.83733333333332, "voiceEnd": 120.51699999999998, "end": 125.19666666666666, "voiceSeconds": 4.679666666666667, "pauseSeconds": 4.679666666666667, "sourceStart": 64.16366666666667, "sourceEnd": 68.84333333333333, "zh": "唱片卖出了约一百万张，我们也成了百万富翁。"}, {"index": 19, "text": "It was painful that the band broke up finally.", "start": 125.19666666666666, "voiceEnd": 128.76433333333333, "end": 132.332, "voiceSeconds": 3.5676666666666668, "pauseSeconds": 3.5676666666666668, "sourceStart": 69.33333333333333, "sourceEnd": 72.901, "zh": "乐队最终解散，让我感到痛苦。"}, {"index": 20, "text": "But above all,", "start": 132.332, "voiceEnd": 133.48666666666665, "end": 134.64133333333334, "voiceSeconds": 1.1546666666666667, "pauseSeconds": 1.1546666666666667, "sourceStart": 73.341, "sourceEnd": 74.49566666666666, "zh": "但最重要的是，"}, {"index": 21, "text": "I realized my dream to be a musician.", "start": 134.64133333333334, "voiceEnd": 137.67866666666666, "end": 140.716, "voiceSeconds": 3.037333333333333, "pauseSeconds": 3.037333333333333, "sourceStart": 74.68566666666666, "sourceEnd": 77.723, "zh": "我实现了成为音乐家的梦想。"}], "duration": 140.716, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "36": {"day": 36, "title": "Explore MKII", "groups": [{"index": 0, "text": "Explore MKII.", "start": 0, "voiceEnd": 2.494, "end": 4.988, "voiceSeconds": 2.494, "pauseSeconds": 2.494, "sourceStart": 0.225, "sourceEnd": 2.719, "zh": "探索MKII星球。"}, {"index": 1, "text": "MKII, a planet billions of kilometers away,", "start": 4.988, "voiceEnd": 9.396666666666668, "end": 13.805333333333333, "voiceSeconds": 4.408666666666667, "pauseSeconds": 4.408666666666667, "sourceStart": 3.189, "sourceEnd": 7.597666666666667, "zh": "MKII是一颗远在数十亿公里之外的星球，"}, {"index": 2, "text": "is the origin of life in many religions.", "start": 13.805333333333333, "voiceEnd": 16.939, "end": 20.072666666666667, "voiceSeconds": 3.1336666666666666, "pauseSeconds": 3.1336666666666666, "sourceStart": 7.907666666666667, "sourceEnd": 11.041333333333334, "zh": "在许多宗教中被视为生命的起源。"}, {"index": 3, "text": "Physicists have proved the theory", "start": 20.072666666666667, "voiceEnd": 22.659041666666667, "end": 25.245416666666667, "voiceSeconds": 2.586375, "pauseSeconds": 2.586375, "sourceStart": 11.531333333333333, "sourceEnd": 14.117708333333333, "zh": "物理学家已经证明了这样一个理论："}, {"index": 4, "text": "that its gentle climate and the pull of its gravity", "start": 25.245416666666667, "voiceEnd": 28.760833333333334, "end": 32.276250000000005, "voiceSeconds": 3.515416666666667, "pauseSeconds": 3.515416666666667, "sourceStart": 14.117708333333333, "sourceEnd": 17.633125, "zh": "它温和的气候和引力，"}, {"index": 5, "text": "are similar to the earth’s.", "start": 32.276250000000005, "voiceEnd": 34.16679166666667, "end": 36.05733333333334, "voiceSeconds": 1.8905416666666666, "pauseSeconds": 1.8905416666666666, "sourceStart": 17.633125, "sourceEnd": 19.523666666666667, "zh": "与地球的相似。"}, {"index": 6, "text": "And astronomers have found that oxygen atoms and carbon dioxide,", "start": 36.05733333333334, "voiceEnd": 41.27125000000001, "end": 46.48516666666667, "voiceSeconds": 5.213916666666667, "pauseSeconds": 5.213916666666667, "sourceStart": 20.013666666666666, "sourceEnd": 25.22758333333333, "zh": "天文学家还发现，氧原子和二氧化碳，"}, {"index": 7, "text": "which are fundamental to life,", "start": 46.48516666666667, "voiceEnd": 48.502250000000004, "end": 50.519333333333336, "voiceSeconds": 2.0170833333333333, "pauseSeconds": 2.0170833333333333, "sourceStart": 25.507583333333333, "sourceEnd": 27.52466666666667, "zh": "这些对生命至关重要的物质，"}, {"index": 8, "text": "exist in its atmosphere through satellites.", "start": 50.519333333333336, "voiceEnd": 53.74433333333334, "end": 56.96933333333334, "voiceSeconds": 3.225, "pauseSeconds": 3.225, "sourceStart": 27.794666666666668, "sourceEnd": 31.019666666666666, "zh": "存在于它的大气中；这个发现借助了卫星。"}, {"index": 9, "text": "Cheered up by this news,", "start": 56.96933333333334, "voiceEnd": 58.80975000000001, "end": 60.65016666666667, "voiceSeconds": 1.8404166666666666, "pauseSeconds": 1.8404166666666666, "sourceStart": 31.549666666666667, "sourceEnd": 33.39008333333334, "zh": "受到这个消息的鼓舞，"}, {"index": 10, "text": "biologists, in their turn,", "start": 60.65016666666667, "voiceEnd": 63.036, "end": 65.42183333333334, "voiceSeconds": 2.3858333333333333, "pauseSeconds": 2.3858333333333333, "sourceStart": 33.56008333333333, "sourceEnd": 35.94591666666667, "zh": "接着轮到生物学家，"}, {"index": 11, "text": "began to do some research to remove people’s puzzles", "start": 65.42183333333334, "voiceEnd": 69.305875, "end": 73.18991666666668, "voiceSeconds": 3.8840416666666666, "pauseSeconds": 3.8840416666666666, "sourceStart": 36.245916666666666, "sourceEnd": 40.129958333333335, "zh": "开始开展研究，解答人们的疑问，"}, {"index": 12, "text": "— Now that there are some suitable conditions,", "start": 73.18991666666668, "voiceEnd": 75.94916666666667, "end": 78.70841666666668, "voiceSeconds": 2.75925, "pauseSeconds": 2.75925, "sourceStart": 40.159958333333336, "sourceEnd": 42.91920833333333, "zh": "——既然已经存在一些适宜的条件，"}, {"index": 13, "text": "does life really exist on this globe?", "start": 78.70841666666668, "voiceEnd": 81.14870833333335, "end": 83.58900000000001, "voiceSeconds": 2.4402916666666665, "pauseSeconds": 2.4402916666666665, "sourceStart": 43.249208333333335, "sourceEnd": 45.6895, "zh": "这个星球上真的有生命吗？"}, {"index": 14, "text": "Do they multiply by laying eggs or giving birth to babies?", "start": 83.58900000000001, "voiceEnd": 88.44050000000001, "end": 93.29200000000002, "voiceSeconds": 4.8515, "pauseSeconds": 4.8515, "sourceStart": 46.1495, "sourceEnd": 51.001, "zh": "它们是产卵繁殖，还是生下幼崽？"}, {"index": 15, "text": "Last month, a spaceship was sent there.", "start": 93.29200000000002, "voiceEnd": 96.69200000000002, "end": 100.09200000000001, "voiceSeconds": 3.4, "pauseSeconds": 3.4, "sourceStart": 51.491, "sourceEnd": 54.891, "zh": "上个月，一艘宇宙飞船被派往那里。"}, {"index": 16, "text": "It’s a pity that this mission failed.", "start": 100.09200000000001, "voiceEnd": 102.91466666666668, "end": 105.73733333333334, "voiceSeconds": 2.8226666666666667, "pauseSeconds": 2.8226666666666667, "sourceStart": 55.351, "sourceEnd": 58.17366666666667, "zh": "遗憾的是，这次任务失败了。"}, {"index": 17, "text": "Unlike the earth,", "start": 105.73733333333334, "voiceEnd": 107.15875000000001, "end": 108.58016666666667, "voiceSeconds": 1.4214166666666668, "pauseSeconds": 1.4214166666666668, "sourceStart": 58.663666666666664, "sourceEnd": 60.08508333333333, "zh": "与地球不同，"}, {"index": 18, "text": "MKII is a much younger planet.", "start": 108.58016666666667, "voiceEnd": 111.51841666666667, "end": 114.45666666666668, "voiceSeconds": 2.93825, "pauseSeconds": 2.93825, "sourceStart": 60.235083333333336, "sourceEnd": 63.17333333333333, "zh": "MKII是一颗年轻得多的星球。"}, {"index": 19, "text": "Thus, masses of harmful acid clouds float everywhere", "start": 114.45666666666668, "voiceEnd": 119.12116666666668, "end": 123.78566666666669, "voiceSeconds": 4.6645, "pauseSeconds": 4.6645, "sourceStart": 63.68333333333333, "sourceEnd": 68.34783333333333, "zh": "因此，大量有害的酸性云团到处飘浮，"}, {"index": 20, "text": "causing violent chain reactions to break out.", "start": 123.78566666666669, "voiceEnd": 127.28116666666668, "end": 130.7766666666667, "voiceSeconds": 3.4955, "pauseSeconds": 3.4955, "sourceStart": 68.34783333333333, "sourceEnd": 71.84333333333333, "zh": "引发剧烈的连锁反应。"}, {"index": 21, "text": "These clouds not only blocked out the pilots’ sight", "start": 130.7766666666667, "voiceEnd": 134.47720833333338, "end": 138.17775000000003, "voiceSeconds": 3.7005416666666666, "pauseSeconds": 3.7005416666666666, "sourceStart": 72.33333333333333, "sourceEnd": 76.033875, "zh": "这些云团不仅挡住了飞行员的视线，"}, {"index": 22, "text": "but also damaged the engine system.", "start": 138.17775000000003, "voiceEnd": 140.86387500000004, "end": 143.55000000000004, "voiceSeconds": 2.686125, "pauseSeconds": 2.686125, "sourceStart": 76.068875, "sourceEnd": 78.755, "zh": "还损坏了发动机系统。"}, {"index": 23, "text": "Luckily, the pilots watched out carefully and prevented the spaceship from crashing in time.", "start": 143.55000000000004, "voiceEnd": 150.50200000000004, "end": 157.45400000000004, "voiceSeconds": 6.952, "pauseSeconds": 6.952, "sourceStart": 79.245, "sourceEnd": 86.197, "zh": "幸运的是，飞行员仔细警戒，及时避免了飞船坠毁。"}], "duration": 157.45400000000004, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "37": {"day": 37, "title": "Sailing Home", "groups": [{"index": 0, "text": "Sailing Home.", "start": 0, "voiceEnd": 1.3926666666666667, "end": 2.7853333333333334, "voiceSeconds": 1.3926666666666667, "pauseSeconds": 1.3926666666666667, "sourceStart": 0.185, "sourceEnd": 1.5776666666666668, "zh": "航行回家。"}, {"index": 1, "text": "This novel was about an unbelievable but genuine adventure.", "start": 2.7853333333333334, "voiceEnd": 7.599, "end": 12.412666666666667, "voiceSeconds": 4.813666666666666, "pauseSeconds": 4.813666666666666, "sourceStart": 2.0276666666666667, "sourceEnd": 6.841333333333333, "zh": "这部小说讲述了一段难以置信却真实的冒险。"}, {"index": 2, "text": "Its author was a black businessman who was brought up in America.", "start": 12.412666666666667, "voiceEnd": 17.126666666666665, "end": 21.840666666666667, "voiceSeconds": 4.714, "pauseSeconds": 4.714, "sourceStart": 7.331333333333333, "sourceEnd": 12.045333333333334, "zh": "作者是一位在美国长大的黑人商人。"}, {"index": 3, "text": "In 1956, he visited Africa,", "start": 21.840666666666667, "voiceEnd": 25.63191666666667, "end": 29.423166666666667, "voiceSeconds": 3.79125, "pauseSeconds": 3.79125, "sourceStart": 12.525333333333334, "sourceEnd": 16.316583333333334, "zh": "1956年，他访问了非洲，"}, {"index": 4, "text": "his birthplace.", "start": 29.423166666666667, "voiceEnd": 30.77625, "end": 32.129333333333335, "voiceSeconds": 1.3530833333333334, "pauseSeconds": 1.3530833333333334, "sourceStart": 16.456583333333334, "sourceEnd": 17.809666666666665, "zh": "那是他的出生地。"}, {"index": 5, "text": "One day, when he was wandering on the pavement near the bay", "start": 32.129333333333335, "voiceEnd": 36.16279166666667, "end": 40.19625, "voiceSeconds": 4.033458333333333, "pauseSeconds": 4.033458333333333, "sourceStart": 18.319666666666667, "sourceEnd": 22.353125, "zh": "一天，他在海湾附近的人行道上漫步，"}, {"index": 6, "text": "enjoying the sea scenes,", "start": 40.19625, "voiceEnd": 42.0395, "end": 43.88275, "voiceSeconds": 1.84325, "pauseSeconds": 1.84325, "sourceStart": 22.353125, "sourceEnd": 24.196375, "zh": "欣赏海景，"}, {"index": 7, "text": "he lost his money and passport that he kept in an envelope.", "start": 43.88275, "voiceEnd": 47.957375, "end": 52.032000000000004, "voiceSeconds": 4.074625, "pauseSeconds": 4.074625, "sourceStart": 24.476375, "sourceEnd": 28.551, "zh": "却弄丢了装在信封里的钱和护照。"}, {"index": 8, "text": "So he went to the embassy to seek help,", "start": 52.032000000000004, "voiceEnd": 54.816208333333336, "end": 57.60041666666667, "voiceSeconds": 2.7842083333333334, "pauseSeconds": 2.7842083333333334, "sourceStart": 29.041, "sourceEnd": 31.825208333333332, "zh": "于是他去大使馆寻求帮助，"}, {"index": 9, "text": "but the ambassador with rude manners didn’t permit his staff to help", "start": 57.60041666666667, "voiceEnd": 62.04504166666667, "end": 66.48966666666666, "voiceSeconds": 4.444625, "pauseSeconds": 4.444625, "sourceStart": 32.20520833333333, "sourceEnd": 36.64983333333333, "zh": "但态度粗鲁的大使不允许工作人员帮助他，"}, {"index": 10, "text": "though he bowed to him.", "start": 66.48966666666666, "voiceEnd": 67.88716666666666, "end": 69.28466666666667, "voiceSeconds": 1.3975, "pauseSeconds": 1.3975, "sourceStart": 36.64983333333333, "sourceEnd": 38.047333333333334, "zh": "尽管他向大使鞠躬恳求。"}, {"index": 11, "text": "Staring at his impatient face,", "start": 69.28466666666667, "voiceEnd": 71.869625, "end": 74.45458333333333, "voiceSeconds": 2.5849583333333332, "pauseSeconds": 2.5849583333333332, "sourceStart": 38.537333333333336, "sourceEnd": 41.12229166666667, "zh": "看着大使不耐烦的脸，"}, {"index": 12, "text": "he understood that it was the fault of his skin colour", "start": 74.45458333333333, "voiceEnd": 77.80595833333334, "end": 81.15733333333333, "voiceSeconds": 3.351375, "pauseSeconds": 3.351375, "sourceStart": 41.38229166666667, "sourceEnd": 44.733666666666664, "zh": "他明白，对方介意的是他的肤色，"}, {"index": 13, "text": "that accounted for their rejection.", "start": 81.15733333333333, "voiceEnd": 83.32533333333333, "end": 85.49333333333333, "voiceSeconds": 2.168, "pauseSeconds": 2.168, "sourceStart": 44.733666666666664, "sourceEnd": 46.901666666666664, "zh": "这正是他们拒绝帮助的原因。"}, {"index": 14, "text": "So he decided to take a chance", "start": 85.49333333333333, "voiceEnd": 87.83254166666666, "end": 90.17174999999999, "voiceSeconds": 2.339208333333333, "pauseSeconds": 2.339208333333333, "sourceStart": 47.41166666666667, "sourceEnd": 49.750875, "zh": "所以，他决定冒险，"}, {"index": 15, "text": "to sail on a small boat home.", "start": 90.17174999999999, "voiceEnd": 92.67654166666665, "end": 95.18133333333333, "voiceSeconds": 2.5047916666666667, "pauseSeconds": 2.5047916666666667, "sourceStart": 49.750875, "sourceEnd": 52.25566666666667, "zh": "乘一条小船航行回家。"}, {"index": 16, "text": "He met a large amount of difficulty but was never stopped.", "start": 95.18133333333333, "voiceEnd": 99.55266666666667, "end": 103.92399999999999, "voiceSeconds": 4.371333333333333, "pauseSeconds": 4.371333333333333, "sourceStart": 52.73566666666667, "sourceEnd": 57.107, "zh": "他遇到了许多困难，但始终没有停下。"}, {"index": 17, "text": "On the contrary,", "start": 103.92399999999999, "voiceEnd": 105.223, "end": 106.52199999999999, "voiceSeconds": 1.299, "pauseSeconds": 1.299, "sourceStart": 57.607, "sourceEnd": 58.906, "zh": "恰恰相反，"}, {"index": 18, "text": "difficulty pushed him to go ahead harder.", "start": 106.52199999999999, "voiceEnd": 109.67299999999999, "end": 112.82399999999998, "voiceSeconds": 3.151, "pauseSeconds": 3.151, "sourceStart": 59.116, "sourceEnd": 62.267, "zh": "困难促使他更加努力地前进。"}, {"index": 19, "text": "Three months later,", "start": 112.82399999999998, "voiceEnd": 114.41133333333332, "end": 115.99866666666665, "voiceSeconds": 1.5873333333333333, "pauseSeconds": 1.5873333333333333, "sourceStart": 62.757, "sourceEnd": 64.34433333333334, "zh": "三个月后，"}, {"index": 20, "text": "he was spotted by a ship by accident.", "start": 115.99866666666665, "voiceEnd": 119.01966666666665, "end": 122.04066666666665, "voiceSeconds": 3.021, "pauseSeconds": 3.021, "sourceStart": 64.56433333333334, "sourceEnd": 67.58533333333334, "zh": "一艘船偶然发现了他。"}, {"index": 21, "text": "He was in rags indeed.", "start": 122.04066666666665, "voiceEnd": 124.04033333333332, "end": 126.03999999999999, "voiceSeconds": 1.9996666666666667, "pauseSeconds": 1.9996666666666667, "sourceStart": 68.09533333333333, "sourceEnd": 70.095, "zh": "他的确已是衣衫褴褛。"}, {"index": 22, "text": "A maid even screamed when bringing him a steak and pineapple dessert.", "start": 126.03999999999999, "voiceEnd": 131.13233333333332, "end": 136.22466666666665, "voiceSeconds": 5.092333333333333, "pauseSeconds": 5.092333333333333, "sourceStart": 70.595, "sourceEnd": 75.68733333333333, "zh": "一名女服务员给他送牛排和菠萝甜点时，甚至惊叫起来。"}, {"index": 23, "text": "Aboard, he earned his passage by working as a barber and got home finally.", "start": 136.22466666666665, "voiceEnd": 142.07266666666666, "end": 147.92066666666665, "voiceSeconds": 5.848, "pauseSeconds": 5.848, "sourceStart": 76.18733333333333, "sourceEnd": 82.03533333333333, "zh": "在船上，他靠做理发师挣得船费，终于回到了家。"}, {"index": 24, "text": "As for the name of his novel,", "start": 147.92066666666665, "voiceEnd": 149.95549999999997, "end": 151.99033333333333, "voiceSeconds": 2.0348333333333333, "pauseSeconds": 2.0348333333333333, "sourceStart": 82.48533333333333, "sourceEnd": 84.52016666666667, "zh": "至于这部小说的名字，"}, {"index": 25, "text": "he couldn’t think of a better one than the phrase “Go Ahead”.", "start": 151.99033333333333, "voiceEnd": 155.72916666666666, "end": 159.468, "voiceSeconds": 3.7388333333333335, "pauseSeconds": 3.7388333333333335, "sourceStart": 84.77016666666667, "sourceEnd": 88.509, "zh": "他想不出比“勇往直前”更好的名字了。"}], "duration": 159.468, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "38": {"day": 38, "title": "A Woman Doctor-Lina", "groups": [{"index": 0, "text": "A Woman Doctor-Lina.", "start": 0, "voiceEnd": 1.918, "end": 3.836, "voiceSeconds": 1.918, "pauseSeconds": 1.918, "sourceStart": 0.195, "sourceEnd": 2.113, "zh": "女医生丽娜。"}, {"index": 1, "text": "Born in a pigs’ nest,", "start": 3.836, "voiceEnd": 5.622583333333333, "end": 7.409166666666667, "voiceSeconds": 1.7865833333333334, "pauseSeconds": 1.7865833333333334, "sourceStart": 2.603, "sourceEnd": 4.389583333333333, "zh": "丽娜出生在一个猪圈里，"}, {"index": 2, "text": "Lina led a poor life in her childhood.", "start": 7.409166666666667, "voiceEnd": 10.290583333333334, "end": 13.172, "voiceSeconds": 2.8814166666666665, "pauseSeconds": 2.8814166666666665, "sourceStart": 4.659583333333333, "sourceEnd": 7.541, "zh": "童年生活十分贫困。"}, {"index": 3, "text": "She was looked down upon by the children of her generation.", "start": 13.172, "voiceEnd": 17.496333333333332, "end": 21.820666666666668, "voiceSeconds": 4.324333333333334, "pauseSeconds": 4.324333333333334, "sourceStart": 8.051, "sourceEnd": 12.375333333333334, "zh": "同龄孩子都看不起她。"}, {"index": 4, "text": "But she intended to become a doctor", "start": 21.820666666666668, "voiceEnd": 24.134, "end": 26.447333333333333, "voiceSeconds": 2.3133333333333335, "pauseSeconds": 2.3133333333333335, "sourceStart": 12.925333333333333, "sourceEnd": 15.238666666666667, "zh": "但她立志成为医生，"}, {"index": 5, "text": "after she came across Lin Qiaozhi by chance,", "start": 26.447333333333333, "voiceEnd": 29.830583333333333, "end": 33.21383333333333, "voiceSeconds": 3.38325, "pauseSeconds": 3.38325, "sourceStart": 15.238666666666667, "sourceEnd": 18.621916666666667, "zh": "是在偶然遇见林巧稚之后，"}, {"index": 6, "text": "who was delivering medical courses to an audience crowding around her.", "start": 33.21383333333333, "voiceEnd": 37.881083333333336, "end": 42.54833333333333, "voiceSeconds": 4.66725, "pauseSeconds": 4.66725, "sourceStart": 18.911916666666666, "sourceEnd": 23.579166666666666, "zh": "当时林巧稚正在向围拢在身边的听众讲授医学课程。"}, {"index": 7, "text": "Before moving off,", "start": 42.54833333333333, "voiceEnd": 44.06270833333333, "end": 45.577083333333334, "voiceSeconds": 1.514375, "pauseSeconds": 1.514375, "sourceStart": 24.069166666666668, "sourceEnd": 25.583541666666665, "zh": "离开之前，"}, {"index": 8, "text": "Lin inspired her to carry on her study.", "start": 45.577083333333334, "voiceEnd": 48.530875, "end": 51.48466666666667, "voiceSeconds": 2.9537916666666666, "pauseSeconds": 2.9537916666666666, "sourceStart": 25.863541666666666, "sourceEnd": 28.817333333333334, "zh": "林巧稚鼓励她继续学习。"}, {"index": 9, "text": "With Lin’s support,", "start": 51.48466666666667, "voiceEnd": 53.02004166666667, "end": 54.555416666666666, "voiceSeconds": 1.535375, "pauseSeconds": 1.535375, "sourceStart": 29.287333333333333, "sourceEnd": 30.822708333333335, "zh": "在林巧稚的支持下，"}, {"index": 10, "text": "Lina entered an institute and studied hard sparing no time for entertainment.", "start": 54.555416666666666, "voiceEnd": 60.352041666666665, "end": 66.14866666666667, "voiceSeconds": 5.796625, "pauseSeconds": 5.796625, "sourceStart": 31.082708333333333, "sourceEnd": 36.879333333333335, "zh": "丽娜进入一所学院，努力学习，没有时间娱乐。"}, {"index": 11, "text": "Her being outspoken and modest won respect for her.", "start": 66.14866666666667, "voiceEnd": 70.35266666666666, "end": 74.55666666666667, "voiceSeconds": 4.204, "pauseSeconds": 4.204, "sourceStart": 37.38933333333333, "sourceEnd": 41.593333333333334, "zh": "她的坦率和谦逊赢得了人们的尊敬。"}, {"index": 12, "text": "Her excellent arguing skills and observation ability put others into the shade.", "start": 74.55666666666667, "voiceEnd": 80.83500000000001, "end": 87.11333333333334, "voiceSeconds": 6.278333333333333, "pauseSeconds": 6.278333333333333, "sourceStart": 42.083333333333336, "sourceEnd": 48.361666666666665, "zh": "她出色的辩论技巧和观察能力让别人相形见绌。"}, {"index": 13, "text": "Now, Lina has become a specialist in medical emergencies.", "start": 87.11333333333334, "voiceEnd": 92.26733333333334, "end": 97.42133333333334, "voiceSeconds": 5.154, "pauseSeconds": 5.154, "sourceStart": 48.861666666666665, "sourceEnd": 54.01566666666667, "zh": "如今，丽娜已经成为一名急诊医学专家。"}, {"index": 14, "text": "Her kindness and considerate behavior to the poor were well known.", "start": 97.42133333333334, "voiceEnd": 102.38466666666667, "end": 107.348, "voiceSeconds": 4.963333333333333, "pauseSeconds": 4.963333333333333, "sourceStart": 54.51566666666667, "sourceEnd": 59.479, "zh": "她对穷人的善意和体贴行为广为人知。"}, {"index": 15, "text": "The organization she founded carried out campaigns and welfare projects", "start": 107.348, "voiceEnd": 112.83970833333333, "end": 118.33141666666667, "voiceSeconds": 5.491708333333333, "pauseSeconds": 5.491708333333333, "sourceStart": 59.959, "sourceEnd": 65.45070833333334, "zh": "她创办的组织开展了各种活动和福利项目，"}, {"index": 16, "text": "to help cut the death rate for the poor.", "start": 118.33141666666667, "voiceEnd": 120.98637500000001, "end": 123.64133333333334, "voiceSeconds": 2.6549583333333335, "pauseSeconds": 2.6549583333333335, "sourceStart": 65.45070833333334, "sourceEnd": 68.10566666666666, "zh": "帮助降低贫困人群的死亡率。"}, {"index": 17, "text": "Her job was hard but worthwhile.", "start": 123.64133333333334, "voiceEnd": 126.42333333333333, "end": 129.20533333333333, "voiceSeconds": 2.782, "pauseSeconds": 2.782, "sourceStart": 68.57566666666666, "sourceEnd": 71.35766666666666, "zh": "她的工作很辛苦，却很有价值。"}, {"index": 18, "text": "She often refers to the connection between her achievement and Lin Qiaozhi,", "start": 129.20533333333333, "voiceEnd": 134.32929166666665, "end": 139.45325, "voiceSeconds": 5.123958333333333, "pauseSeconds": 5.123958333333333, "sourceStart": 71.87766666666667, "sourceEnd": 77.001625, "zh": "她经常提及自己的成就与林巧稚之间的联系，"}, {"index": 19, "text": "and says that her poor childhood is the bond", "start": 139.45325, "voiceEnd": 142.31754166666667, "end": 145.18183333333332, "voiceSeconds": 2.8642916666666665, "pauseSeconds": 2.8642916666666665, "sourceStart": 77.331625, "sourceEnd": 80.19591666666666, "zh": "还说，贫困的童年是一条纽带，"}, {"index": 20, "text": "between her and the poor.", "start": 145.18183333333332, "voiceEnd": 146.96891666666664, "end": 148.75599999999997, "voiceSeconds": 1.7870833333333334, "pauseSeconds": 1.7870833333333334, "sourceStart": 80.19591666666666, "sourceEnd": 81.983, "zh": "将她与穷人紧紧联系在一起。"}], "duration": 148.75599999999997, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "39": {"day": 39, "title": "A New Farming Way", "groups": [{"index": 0, "text": "A New Farming Way.", "start": 0, "voiceEnd": 1.7406666666666666, "end": 3.481333333333333, "voiceSeconds": 1.7406666666666666, "pauseSeconds": 1.7406666666666666, "sourceStart": 0.185, "sourceEnd": 1.9256666666666666, "zh": "新的耕作方式。"}, {"index": 1, "text": "Tuan was a farmer in Vietnam.", "start": 3.481333333333333, "voiceEnd": 6.169333333333333, "end": 8.857333333333333, "voiceSeconds": 2.688, "pauseSeconds": 2.688, "sourceStart": 2.445666666666667, "sourceEnd": 5.133666666666667, "zh": "团是一名越南农民。"}, {"index": 2, "text": "For decades, he had been struggling to rid his family of hunger.", "start": 8.857333333333333, "voiceEnd": 13.728666666666665, "end": 18.6, "voiceSeconds": 4.871333333333333, "pauseSeconds": 4.871333333333333, "sourceStart": 5.603666666666666, "sourceEnd": 10.475, "zh": "几十年来，他一直努力让家人摆脱饥饿。"}, {"index": 3, "text": "However, it always confused him how to expand the output of his crops.", "start": 18.6, "voiceEnd": 24.490333333333336, "end": 30.38066666666667, "voiceSeconds": 5.890333333333333, "pauseSeconds": 5.890333333333333, "sourceStart": 10.945, "sourceEnd": 16.835333333333335, "zh": "然而，如何提高农作物产量，始终让他困惑。"}, {"index": 4, "text": "This disturbing problem led to his regretting being a farmer.", "start": 30.38066666666667, "voiceEnd": 35.021, "end": 39.66133333333334, "voiceSeconds": 4.640333333333333, "pauseSeconds": 4.640333333333333, "sourceStart": 17.335333333333335, "sourceEnd": 21.975666666666665, "zh": "这个令人烦恼的问题使他后悔当了农民。"}, {"index": 5, "text": "He would rather have chosen another job.", "start": 39.66133333333334, "voiceEnd": 42.541000000000004, "end": 45.42066666666667, "voiceSeconds": 2.8796666666666666, "pauseSeconds": 2.8796666666666666, "sourceStart": 22.485666666666667, "sourceEnd": 25.365333333333332, "zh": "他宁愿当初选择了别的工作。"}, {"index": 6, "text": "One day, when skimming through a newspaper,", "start": 45.42066666666667, "voiceEnd": 48.71458333333334, "end": 52.008500000000005, "voiceSeconds": 3.2939166666666666, "pauseSeconds": 3.2939166666666666, "sourceStart": 25.835333333333335, "sourceEnd": 29.12925, "zh": "一天，浏览报纸时，"}, {"index": 7, "text": "Tuan read a comment on Yuan Longping.", "start": 52.008500000000005, "voiceEnd": 54.96691666666667, "end": 57.92533333333334, "voiceSeconds": 2.9584166666666665, "pauseSeconds": 2.9584166666666665, "sourceStart": 29.41925, "sourceEnd": 32.37766666666667, "zh": "团读到了一篇有关袁隆平的评论。"}, {"index": 8, "text": "He underlined Yuan’s nationality and occupation,", "start": 57.92533333333334, "voiceEnd": 61.90950000000001, "end": 65.89366666666668, "voiceSeconds": 3.984166666666667, "pauseSeconds": 3.984166666666667, "sourceStart": 32.87766666666667, "sourceEnd": 36.86183333333334, "zh": "他在袁隆平的国籍和职业下面画了线，"}, {"index": 9, "text": "and then focused on his discovery and the statistics of his research.", "start": 65.89366666666668, "voiceEnd": 70.78083333333335, "end": 75.668, "voiceSeconds": 4.887166666666666, "pauseSeconds": 4.887166666666666, "sourceStart": 37.17183333333333, "sourceEnd": 42.059, "zh": "然后重点关注他的发现及研究数据。"}, {"index": 10, "text": "He found the knowledge Yuan circulated very practical.", "start": 75.668, "voiceEnd": 80.16833333333334, "end": 84.66866666666667, "voiceSeconds": 4.500333333333334, "pauseSeconds": 4.500333333333334, "sourceStart": 42.569, "sourceEnd": 47.06933333333333, "zh": "他觉得袁隆平传播的知识非常实用。"}, {"index": 11, "text": "Therefore, he made a summary and began to build up a new farming method.", "start": 84.66866666666667, "voiceEnd": 90.26466666666667, "end": 95.86066666666667, "voiceSeconds": 5.596, "pauseSeconds": 5.596, "sourceStart": 47.57933333333333, "sourceEnd": 53.175333333333334, "zh": "因此，他作了总结，开始逐步建立新的耕作方法。"}, {"index": 12, "text": "He planted super grain of rich nutrition", "start": 95.86066666666667, "voiceEnd": 99.04154166666667, "end": 102.22241666666667, "voiceSeconds": 3.180875, "pauseSeconds": 3.180875, "sourceStart": 53.68533333333333, "sourceEnd": 56.86620833333333, "zh": "他种植了营养丰富的超级谷物，"}, {"index": 13, "text": "and equipped himself", "start": 102.22241666666667, "voiceEnd": 103.58775000000001, "end": 104.95308333333334, "voiceSeconds": 1.3653333333333333, "pauseSeconds": 1.3653333333333333, "sourceStart": 56.86620833333333, "sourceEnd": 58.231541666666665, "zh": "并为自己做好准备、配备所需条件，"}, {"index": 14, "text": "to keep his crops’ roots free from bacteria and pests.", "start": 104.95308333333334, "voiceEnd": 109.166875, "end": 113.38066666666667, "voiceSeconds": 4.213791666666666, "pauseSeconds": 4.213791666666666, "sourceStart": 58.231541666666665, "sourceEnd": 62.44533333333333, "zh": "让作物的根部免受细菌和害虫侵扰。"}, {"index": 15, "text": "He also enriched minerals in the soil while reducing chemical fertilizers.", "start": 113.38066666666667, "voiceEnd": 119.64833333333334, "end": 125.916, "voiceSeconds": 6.267666666666667, "pauseSeconds": 6.267666666666667, "sourceStart": 62.94533333333333, "sourceEnd": 69.213, "zh": "他还增加土壤中的矿物质，同时减少化肥使用。"}, {"index": 16, "text": "Though it cost him more time and freedom,", "start": 125.916, "voiceEnd": 128.77854166666665, "end": 131.64108333333334, "voiceSeconds": 2.8625416666666665, "pauseSeconds": 2.8625416666666665, "sourceStart": 69.703, "sourceEnd": 72.56554166666666, "zh": "虽然这花费了他更多时间，也占用了自由时间，"}, {"index": 17, "text": "he was full of hope.", "start": 131.64108333333334, "voiceEnd": 133.08254166666669, "end": 134.524, "voiceSeconds": 1.4414583333333333, "pauseSeconds": 1.4414583333333333, "sourceStart": 72.82554166666667, "sourceEnd": 74.267, "zh": "他依然满怀希望。"}, {"index": 18, "text": "The next year,", "start": 134.524, "voiceEnd": 135.67458333333335, "end": 136.82516666666666, "voiceSeconds": 1.1505833333333333, "pauseSeconds": 1.1505833333333333, "sourceStart": 74.757, "sourceEnd": 75.90758333333333, "zh": "第二年，"}, {"index": 19, "text": "Tuan was sunburnt but satisfied with his production very much.", "start": 136.82516666666666, "voiceEnd": 141.77925, "end": 146.73333333333332, "voiceSeconds": 4.954083333333333, "pauseSeconds": 4.954083333333333, "sourceStart": 76.18758333333334, "sourceEnd": 81.14166666666667, "zh": "团虽然晒黑了，却对产量十分满意。"}, {"index": 20, "text": "Thanks to Yuan Longping,", "start": 146.73333333333332, "voiceEnd": 148.89079166666664, "end": 151.04825, "voiceSeconds": 2.1574583333333335, "pauseSeconds": 2.1574583333333335, "sourceStart": 81.62166666666667, "sourceEnd": 83.779125, "zh": "多亏了袁隆平，"}, {"index": 21, "text": "he not only won the battle against hunger,", "start": 151.04825, "voiceEnd": 153.78504166666667, "end": 156.52183333333332, "voiceSeconds": 2.7367916666666665, "pauseSeconds": 2.7367916666666665, "sourceStart": 84.019125, "sourceEnd": 86.75591666666666, "zh": "他不仅战胜了饥饿，"}, {"index": 22, "text": "but he could also export his crops abroad.", "start": 156.52183333333332, "voiceEnd": 159.55691666666667, "end": 162.59199999999998, "voiceSeconds": 3.035083333333333, "pauseSeconds": 3.035083333333333, "sourceStart": 87.09591666666667, "sourceEnd": 90.131, "zh": "还能把农作物出口到国外。"}], "duration": 162.59199999999998, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "40": {"day": 40, "title": "Chaplin - A Great Master of Humour", "groups": [{"index": 0, "text": "Chaplin - A Great Master of Humour.", "start": 0, "voiceEnd": 2.9303333333333335, "end": 5.860666666666667, "voiceSeconds": 2.9303333333333335, "pauseSeconds": 2.9303333333333335, "sourceStart": 0.215, "sourceEnd": 3.1453333333333333, "zh": "卓别林——伟大的幽默大师。"}, {"index": 1, "text": "Chaplin was an extraordinary performer who starred in and directed many outstanding comedies.", "start": 5.860666666666667, "voiceEnd": 13.092333333333332, "end": 20.323999999999998, "voiceSeconds": 7.2316666666666665, "pauseSeconds": 7.2316666666666665, "sourceStart": 3.6453333333333333, "sourceEnd": 10.877, "zh": "卓别林是一位杰出的表演者，主演并导演了许多优秀喜剧。"}, {"index": 2, "text": "Few were bored watching his moustache,", "start": 20.323999999999998, "voiceEnd": 23.08820833333333, "end": 25.852416666666663, "voiceSeconds": 2.7642083333333334, "pauseSeconds": 2.7642083333333334, "sourceStart": 11.377, "sourceEnd": 14.141208333333333, "zh": "看着他的小胡子，几乎没有人会感到无聊，"}, {"index": 3, "text": "his gestures or his entertaining reactions when chased by detectives.", "start": 25.852416666666663, "voiceEnd": 31.24054166666666, "end": 36.62866666666666, "voiceSeconds": 5.388125, "pauseSeconds": 5.388125, "sourceStart": 14.351208333333334, "sourceEnd": 19.739333333333335, "zh": "还有他的手势，以及被侦探追赶时逗趣的反应。"}, {"index": 4, "text": "Being drunk, sliding on a banana skin or whispering his own failures to nobody,", "start": 36.62866666666666, "voiceEnd": 42.68316666666666, "end": 48.73766666666666, "voiceSeconds": 6.0545, "pauseSeconds": 6.0545, "sourceStart": 20.239333333333335, "sourceEnd": 26.293833333333332, "zh": "无论是喝醉、踩到香蕉皮滑倒，还是对着空气低声诉说自己的失败，"}, {"index": 5, "text": "he made us feel more content with our life without any verbal explanation.", "start": 48.73766666666666, "voiceEnd": 53.93483333333333, "end": 59.132, "voiceSeconds": 5.197166666666667, "pauseSeconds": 5.197166666666667, "sourceStart": 26.593833333333333, "sourceEnd": 31.791, "zh": "他不用任何语言解释，就能让我们对自己的生活更加满足。"}, {"index": 6, "text": "His particular sense of humor has astonished everybody", "start": 59.132, "voiceEnd": 63.19645833333333, "end": 67.26091666666666, "voiceSeconds": 4.0644583333333335, "pauseSeconds": 4.0644583333333335, "sourceStart": 32.301, "sourceEnd": 36.365458333333336, "zh": "他独特的幽默感让所有人都惊叹，"}, {"index": 7, "text": "throughout the world up to now.", "start": 67.26091666666666, "voiceEnd": 69.38912499999999, "end": 71.51733333333333, "voiceSeconds": 2.1282083333333333, "pauseSeconds": 2.1282083333333333, "sourceStart": 36.365458333333336, "sourceEnd": 38.49366666666667, "zh": "遍及世界各地，直到今天。"}, {"index": 8, "text": "In a small budget film,", "start": 71.51733333333333, "voiceEnd": 73.31354166666667, "end": 75.10974999999999, "voiceSeconds": 1.7962083333333334, "pauseSeconds": 1.7962083333333334, "sourceStart": 38.96366666666667, "sourceEnd": 40.759875, "zh": "在一部低成本电影里，"}, {"index": 9, "text": "he played a badly-off and homeless person wearing worn-out shoes and messy clothes.", "start": 75.10974999999999, "voiceEnd": 81.164875, "end": 87.22, "voiceSeconds": 6.055125, "pauseSeconds": 6.055125, "sourceStart": 40.999875, "sourceEnd": 47.055, "zh": "他扮演一个贫穷的流浪汉，穿着破鞋和凌乱的衣服。"}, {"index": 10, "text": "On one occasion,", "start": 87.22, "voiceEnd": 88.54745833333334, "end": 89.87491666666666, "voiceSeconds": 1.3274583333333334, "pauseSeconds": 1.3274583333333334, "sourceStart": 47.555, "sourceEnd": 48.88245833333333, "zh": "有一次，"}, {"index": 11, "text": "he was trapped by a snowstorm in a vast mountainous area.", "start": 89.87491666666666, "voiceEnd": 94.28945833333333, "end": 98.704, "voiceSeconds": 4.414541666666667, "pauseSeconds": 4.414541666666667, "sourceStart": 49.112458333333336, "sourceEnd": 53.527, "zh": "他被暴风雪困在一片广阔的山区。"}, {"index": 12, "text": "Though he overcame many difficulties,", "start": 98.704, "voiceEnd": 101.61754166666665, "end": 104.53108333333333, "voiceSeconds": 2.9135416666666667, "pauseSeconds": 2.9135416666666667, "sourceStart": 53.997, "sourceEnd": 56.91054166666667, "zh": "虽然他克服了许多困难，"}, {"index": 13, "text": "he wasn’t fortunate enough.", "start": 104.53108333333333, "voiceEnd": 106.555875, "end": 108.58066666666666, "voiceSeconds": 2.0247916666666668, "pauseSeconds": 2.0247916666666668, "sourceStart": 57.16054166666667, "sourceEnd": 59.18533333333333, "zh": "运气却仍然不够好。"}, {"index": 14, "text": "With all the porridge eaten up,", "start": 108.58066666666666, "voiceEnd": 110.61049999999999, "end": 112.64033333333333, "voiceSeconds": 2.0298333333333334, "pauseSeconds": 2.0298333333333334, "sourceStart": 59.68533333333333, "sourceEnd": 61.71516666666667, "zh": "粥全都吃完了，"}, {"index": 15, "text": "he picked out a shoe and boiled it to eat.", "start": 112.64033333333333, "voiceEnd": 115.75416666666666, "end": 118.868, "voiceSeconds": 3.1138333333333335, "pauseSeconds": 3.1138333333333335, "sourceStart": 61.985166666666665, "sourceEnd": 65.099, "zh": "他挑出一只鞋，煮来吃。"}, {"index": 16, "text": "He cut off the leather bottom and chewed it like a pancake.", "start": 118.868, "voiceEnd": 123.00866666666666, "end": 127.14933333333333, "voiceSeconds": 4.140666666666666, "pauseSeconds": 4.140666666666666, "sourceStart": 65.609, "sourceEnd": 69.74966666666667, "zh": "他切下皮革鞋底，像嚼薄饼一样嚼着。"}, {"index": 17, "text": "According to an actress,", "start": 127.14933333333333, "voiceEnd": 128.95154166666666, "end": 130.75375, "voiceSeconds": 1.8022083333333334, "pauseSeconds": 1.8022083333333334, "sourceStart": 70.25966666666666, "sourceEnd": 72.061875, "zh": "据一位女演员说，"}, {"index": 18, "text": "his acting was so convincing and amusing", "start": 130.75375, "voiceEnd": 133.98995833333333, "end": 137.22616666666667, "voiceSeconds": 3.2362083333333334, "pauseSeconds": 3.2362083333333334, "sourceStart": 72.281875, "sourceEnd": 75.51808333333334, "zh": "他的表演是如此逼真而有趣，"}, {"index": 19, "text": "that everybody couldn’t help bursting into laughter.", "start": 137.22616666666667, "voiceEnd": 140.61908333333335, "end": 144.012, "voiceSeconds": 3.392916666666667, "pauseSeconds": 3.392916666666667, "sourceStart": 75.51808333333334, "sourceEnd": 78.911, "zh": "以至于所有人都忍不住大笑起来。"}], "duration": 144.012, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}};
