 "start": 97.78350000000002, "voiceEnd": 99.65991666666669, "end": 101.53633333333335, "voiceSeconds": 1.8764166666666666, "pauseSeconds": 1.8764166666666666, "sourceStart": 54.83675, "sourceEnd": 56.713166666666666, "zh": "去请教一位专家。"}, {"index": 17, "text": "The expert sighed and said,", "start": 101.53633333333335, "voiceEnd": 103.71495833333334, "end": 105.89358333333334, "voiceSeconds": 2.178625, "pauseSeconds": 2.178625, "sourceStart": 57.223166666666664, "sourceEnd": 59.40179166666667, "zh": "专家叹了口气，说："}, {"index": 18, "text": "“Both of your menus have weaknesses and limited strengths.", "start": 105.89358333333334, "voiceEnd": 110.10745833333334, "end": 114.32133333333334, "voiceSeconds": 4.213875, "pauseSeconds": 4.213875, "sourceStart": 59.76179166666667, "sourceEnd": 63.97566666666667, "zh": "“你们两人的菜单都有缺点，优点也有限。"}, {"index": 19, "text": "Your customers put on weight too easily,", "start": 114.32133333333334, "voiceEnd": 117.35783333333335, "end": 120.39433333333335, "voiceSeconds": 3.0365, "pauseSeconds": 3.0365, "sourceStart": 64.46566666666666, "sourceEnd": 67.50216666666667, "zh": "你的顾客太容易长胖，"}, {"index": 20, "text": "while Yong Hui’s lose weight too quickly.", "start": 120.39433333333335, "voiceEnd": 123.48316666666668, "end": 126.57200000000002, "voiceSeconds": 3.0888333333333335, "pauseSeconds": 3.0888333333333335, "sourceStart": 67.77216666666666, "sourceEnd": 70.861, "zh": "而咏慧的顾客瘦得又太快。"}, {"index": 21, "text": "So, Wang Peng,", "start": 126.57200000000002, "voiceEnd": 128.34333333333336, "end": 130.1146666666667, "voiceSeconds": 1.7713333333333334, "pauseSeconds": 1.7713333333333334, "sourceStart": 71.291, "sourceEnd": 73.06233333333333, "zh": "所以，王鹏，"}, {"index": 22, "text": "cut down on the fat in your food and increase vegetables and fruits,", "start": 130.1146666666667, "voiceEnd": 134.73595833333337, "end": 139.35725000000002, "voiceSeconds": 4.621291666666667, "pauseSeconds": 4.621291666666667, "sourceStart": 73.33233333333334, "sourceEnd": 77.953625, "zh": "减少食物中的脂肪，增加蔬菜和水果，"}, {"index": 23, "text": "like nuts, beans,", "start": 139.35725000000002, "voiceEnd": 141.3179166666667, "end": 143.27858333333336, "voiceSeconds": 1.9606666666666666, "pauseSeconds": 1.9606666666666666, "sourceStart": 78.233625, "sourceEnd": 80.19429166666667, "zh": "例如坚果、豆类，"}, {"index": 24, "text": "mushrooms, peaches and lemons.", "start": 143.27858333333336, "voiceEnd": 145.94362500000003, "end": 148.6086666666667, "voiceSeconds": 2.6650416666666668, "pauseSeconds": 2.6650416666666668, "sourceStart": 80.42429166666666, "sourceEnd": 83.08933333333333, "zh": "蘑菇、桃子和柠檬。"}, {"index": 25, "text": "You ought to combine the two menus", "start": 148.6086666666667, "voiceEnd": 151.10370833333337, "end": 153.59875000000002, "voiceSeconds": 2.495041666666667, "pauseSeconds": 2.495041666666667, "sourceStart": 83.58933333333333, "sourceEnd": 86.084375, "zh": "你应该把两份菜单结合起来，"}, {"index": 26, "text": "and provide a balanced diet.”", "start": 153.59875000000002, "voiceEnd": 155.85337500000003, "end": 158.10800000000003, "voiceSeconds": 2.254625, "pauseSeconds": 2.254625, "sourceStart": 86.084375, "sourceEnd": 88.339, "zh": "提供均衡的饮食。”"}, {"index": 27, "text": "Before long, Wang Peng won his customers back.", "start": 158.10800000000003, "voiceEnd": 162.13600000000002, "end": 166.16400000000004, "voiceSeconds": 4.028, "pauseSeconds": 4.028, "sourceStart": 88.849, "sourceEnd": 92.877, "zh": "不久，王鹏就重新赢得了顾客。"}], "duration": 166.16400000000004, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "4": {"day": 4, "title": "A Misunderstanding", "groups": [{"index": 0, "text": "A Misunderstanding.", "start": 0, "voiceEnd": 1.7686666666666666, "end": 3.537333333333333, "voiceSeconds": 1.7686666666666666, "pauseSeconds": 1.7686666666666666, "sourceStart": 0.195, "sourceEnd": 1.9636666666666667, "zh": "一场误会。"}, {"index": 1, "text": "In general, spoken statements are the major way of communication,", "start": 3.537333333333333, "voiceEnd": 8.507041666666666, "end": 13.47675, "voiceSeconds": 4.969708333333333, "pauseSeconds": 4.969708333333333, "sourceStart": 2.4836666666666667, "sourceEnd": 7.453375, "zh": "一般来说，口头表达是主要的交流方式，"}, {"index": 2, "text": "but body language and facial expressions also have such kinds of function.", "start": 13.47675, "voiceEnd": 18.955041666666666, "end": 24.43333333333333, "voiceSeconds": 5.478291666666666, "pauseSeconds": 5.478291666666666, "sourceStart": 7.823375, "sourceEnd": 13.301666666666666, "zh": "但肢体语言和面部表情也具有这类功能。"}, {"index": 3, "text": "For example, yawning means not being interested", "start": 24.43333333333333, "voiceEnd": 28.10520833333333, "end": 31.77708333333333, "voiceSeconds": 3.671875, "pauseSeconds": 3.671875, "sourceStart": 13.811666666666667, "sourceEnd": 17.483541666666667, "zh": "比如，打哈欠表示不感兴趣，"}, {"index": 4, "text": "and turning one’s back to someone or swinging your fist", "start": 31.77708333333333, "voiceEnd": 35.37204166666666, "end": 38.967, "voiceSeconds": 3.5949583333333335, "pauseSeconds": 3.5949583333333335, "sourceStart": 17.483541666666667, "sourceEnd": 21.0785, "zh": "而背对着某人，或者挥动拳头，"}, {"index": 5, "text": "shows your anger.", "start": 38.967, "voiceEnd": 40.33983333333333, "end": 41.712666666666664, "voiceSeconds": 1.3728333333333333, "pauseSeconds": 1.3728333333333333, "sourceStart": 21.0785, "sourceEnd": 22.451333333333334, "zh": "则表示你生气了。"}, {"index": 6, "text": "But what those gestures really mean is subjective in different cultures.", "start": 41.712666666666664, "voiceEnd": 47.13516666666666, "end": 52.55766666666666, "voiceSeconds": 5.4225, "pauseSeconds": 5.4225, "sourceStart": 22.961333333333332, "sourceEnd": 28.38383333333333, "zh": "但在不同文化里，这些手势的真正含义带有主观性。"}, {"index": 7, "text": "Thus, misunderstandings happen now and then in today’s world of cultural crossroads.", "start": 52.55766666666666, "voiceEnd": 59.43083333333333, "end": 66.304, "voiceSeconds": 6.873166666666667, "pauseSeconds": 6.873166666666667, "sourceStart": 28.88383333333333, "sourceEnd": 35.757, "zh": "因此，在当今文化交汇的世界里，误会时有发生。"}, {"index": 8, "text": "Once, representing the Adults’ Education Association,", "start": 66.304, "voiceEnd": 70.72733333333333, "end": 75.15066666666667, "voiceSeconds": 4.423333333333333, "pauseSeconds": 4.423333333333333, "sourceStart": 36.247, "sourceEnd": 40.67033333333333, "zh": "有一次，我代表成人教育协会，"}, {"index": 9, "text": "I went to the airport", "start": 75.15066666666667, "voiceEnd": 76.60825, "end": 78.06583333333333, "voiceSeconds": 1.4575833333333332, "pauseSeconds": 1.4575833333333332, "sourceStart": 40.940333333333335, "sourceEnd": 42.39791666666667, "zh": "来到机场，"}, {"index": 10, "text": "to meet an official of high rank from Colombia", "start": 78.06583333333333, "voiceEnd": 81.24254166666667, "end": 84.41924999999999, "voiceSeconds": 3.1767083333333335, "pauseSeconds": 3.1767083333333335, "sourceStart": 42.39791666666667, "sourceEnd": 45.574625, "zh": "迎接一位来自哥伦比亚的高级官员，"}, {"index": 11, "text": "and take him to his dormitory", "start": 84.41924999999999, "voiceEnd": 86.34575, "end": 88.27224999999999, "voiceSeconds": 1.9265, "pauseSeconds": 1.9265, "sourceStart": 45.574625, "sourceEnd": 47.501125, "zh": "带他去宿舍，"}, {"index": 12, "text": "and then to the canteen.", "start": 88.27224999999999, "voiceEnd": 89.92412499999999, "end": 91.57599999999998, "voiceSeconds": 1.651875, "pauseSeconds": 1.651875, "sourceStart": 47.501125, "sourceEnd": 49.153, "zh": "然后再去食堂。"}, {"index": 13, "text": "After the flight arrived,", "start": 91.57599999999998, "voiceEnd": 93.48012499999997, "end": 95.38424999999998, "voiceSeconds": 1.904125, "pauseSeconds": 1.904125, "sourceStart": 49.643, "sourceEnd": 51.547125, "zh": "航班抵达后，"}, {"index": 14, "text": "I saw a man looking around curiously.", "start": 95.38424999999998, "voiceEnd": 98.43012499999998, "end": 101.47599999999998, "voiceSeconds": 3.045875, "pauseSeconds": 3.045875, "sourceStart": 51.797125, "sourceEnd": 54.843, "zh": "我看见一个男人好奇地四处张望。"}, {"index": 15, "text": "So I approached to greet him.", "start": 101.47599999999998, "voiceEnd": 103.85666666666665, "end": 106.23733333333331, "voiceSeconds": 2.3806666666666665, "pauseSeconds": 2.3806666666666665, "sourceStart": 55.293, "sourceEnd": 57.67366666666667, "zh": "于是我上前向他问好。"}, {"index": 16, "text": "He suddenly dashed to hug me", "start": 106.23733333333331, "voiceEnd": 108.39304166666665, "end": 110.54874999999998, "voiceSeconds": 2.155708333333333, "pauseSeconds": 2.155708333333333, "sourceStart": 58.17366666666667, "sourceEnd": 60.329375, "zh": "他突然冲过来拥抱我，"}, {"index": 17, "text": "and kissed me on both cheeks.", "start": 110.54874999999998, "voiceEnd": 112.72637499999999, "end": 114.90399999999998, "voiceSeconds": 2.177625, "pauseSeconds": 2.177625, "sourceStart": 60.329375, "sourceEnd": 62.507, "zh": "并亲吻了我的两颊。"}, {"index": 18, "text": "As a young girl,", "start": 114.90399999999998, "voiceEnd": 116.23829166666665, "end": 117.57258333333331, "voiceSeconds": 1.3342916666666667, "pauseSeconds": 1.3342916666666667, "sourceStart": 62.997, "sourceEnd": 64.33129166666667, "zh": "作为一个年轻女孩，"}, {"index": 19, "text": "I felt truly embarrassed and put up my hands to defend myself.", "start": 117.57258333333331, "voiceEnd": 122.48295833333331, "end": 127.39333333333332, "voiceSeconds": 4.910375, "pauseSeconds": 4.910375, "sourceStart": 64.56129166666666, "sourceEnd": 69.47166666666666, "zh": "我非常尴尬，举起双手保护自己。"}, {"index": 20, "text": "His false smile told me that he had lost face.", "start": 127.39333333333332, "voiceEnd": 131.28066666666666, "end": 135.16799999999998, "voiceSeconds": 3.8873333333333333, "pauseSeconds": 3.8873333333333333, "sourceStart": 69.97166666666666, "sourceEnd": 73.859, "zh": "他不自然的笑容告诉我，他觉得丢了面子。"}, {"index": 21, "text": "Later, I received a cassette from him,", "start": 135.16799999999998, "voiceEnd": 138.36599999999999, "end": 141.56399999999996, "voiceSeconds": 3.198, "pauseSeconds": 3.198, "sourceStart": 74.349, "sourceEnd": 77.547, "zh": "后来，我收到他寄来的一盘磁带，"}, {"index": 22, "text": "in which he recorded his apology.", "start": 141.56399999999996, "voiceEnd": 143.9543333333333, "end": 146.34466666666663, "voiceSeconds": 2.3903333333333334, "pauseSeconds": 2.3903333333333334, "sourceStart": 77.767, "sourceEnd": 80.15733333333333, "zh": "里面录着他的道歉。"}, {"index": 23, "text": "On hearing that Colombians were more likely to kiss others,", "start": 146.34466666666663, "voiceEnd": 150.39524999999995, "end": 154.4458333333333, "voiceSeconds": 4.050583333333333, "pauseSeconds": 4.050583333333333, "sourceStart": 80.63733333333333, "sourceEnd": 84.68791666666667, "zh": "听说哥伦比亚人更习惯用亲吻表达问候后，"}, {"index": 24, "text": "I soon felt at ease.", "start": 154.4458333333333, "voiceEnd": 156.19291666666663, "end": 157.93999999999997, "voiceSeconds": 1.7470833333333333, "pauseSeconds": 1.7470833333333333, "sourceStart": 84.94791666666667, "sourceEnd": 86.695, "zh": "我很快就放松了下来。"}], "duration": 157.93999999999997, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "5": {"day": 5, "title": "A Unique Theme Park", "groups": [{"index": 0, "text": "A Unique Theme Park.", "start": 0, "voiceEnd": 1.9043333333333334, "end": 3.808666666666667, "voiceSeconds": 1.9043333333333334, "pauseSeconds": 1.9043333333333334, "sourceStart": 0.185, "sourceEnd": 2.0893333333333333, "zh": "独一无二的主题公园。"}, {"index": 1, "text": "As soon as our shuttle got close to the theme park", "start": 3.808666666666667, "voiceEnd": 7.135625, "end": 10.462583333333333, "voiceSeconds": 3.3269583333333332, "pauseSeconds": 3.3269583333333332, "sourceStart": 2.5993333333333335, "sourceEnd": 5.926291666666667, "zh": "我们的接驳车一接近主题公园，"}, {"index": 2, "text": "by the freeway,", "start": 10.462583333333333, "voiceEnd": 11.666916666666665, "end": 12.87125, "voiceSeconds": 1.2043333333333333, "pauseSeconds": 1.2043333333333333, "sourceStart": 5.926291666666667, "sourceEnd": 7.130625, "zh": "沿着高速公路而来，"}, {"index": 3, "text": "everyone came to life", "start": 12.87125, "voiceEnd": 14.468041666666666, "end": 16.064833333333333, "voiceSeconds": 1.5967916666666666, "pauseSeconds": 1.5967916666666666, "sourceStart": 7.430625, "sourceEnd": 9.027416666666667, "zh": "大家就活跃起来，"}, {"index": 4, "text": "and put on cloth sneakers in advance for an outing.", "start": 16.064833333333333, "voiceEnd": 19.51875, "end": 22.972666666666665, "voiceSeconds": 3.4539166666666667, "pauseSeconds": 3.4539166666666667, "sourceStart": 9.027416666666667, "sourceEnd": 12.481333333333334, "zh": "提前穿上帆布运动鞋，为出游做准备。"}, {"index": 5, "text": "Our translator paid for the admission,", "start": 22.972666666666665, "voiceEnd": 25.825499999999998, "end": 28.67833333333333, "voiceSeconds": 2.8528333333333333, "pauseSeconds": 2.8528333333333333, "sourceStart": 12.971333333333334, "sourceEnd": 15.824166666666667, "zh": "翻译替我们付了门票钱，"}, {"index": 6, "text": "and we started enjoying the various attractions in the sunlight.", "start": 28.67833333333333, "voiceEnd": 33.0755, "end": 37.47266666666666, "voiceSeconds": 4.397166666666666, "pauseSeconds": 4.397166666666666, "sourceStart": 16.134166666666665, "sourceEnd": 20.531333333333333, "zh": "我们开始在阳光下欣赏各种景点。"}, {"index": 7, "text": "According to the travel brochure,", "start": 37.47266666666666, "voiceEnd": 39.74487499999999, "end": 42.01708333333333, "voiceSeconds": 2.2722083333333334, "pauseSeconds": 2.2722083333333334, "sourceStart": 21.031333333333333, "sourceEnd": 23.303541666666668, "zh": "根据旅游宣传册的介绍，"}, {"index": 8, "text": "this unique park is famous for its well preserved minority culture.", "start": 42.01708333333333, "voiceEnd": 47.12054166666667, "end": 52.224, "voiceSeconds": 5.103458333333333, "pauseSeconds": 5.103458333333333, "sourceStart": 23.573541666666667, "sourceEnd": 28.677, "zh": "这个独特的公园以保存完好的少数民族文化闻名。"}, {"index": 9, "text": "We experienced many deeds of the early settlers,", "start": 52.224, "voiceEnd": 55.98195833333333, "end": 59.739916666666666, "voiceSeconds": 3.7579583333333333, "pauseSeconds": 3.7579583333333333, "sourceStart": 29.147, "sourceEnd": 32.90495833333333, "zh": "我们体验了早期定居者的许多活动，"}, {"index": 10, "text": "such as swinging across rivers,", "start": 59.739916666666666, "voiceEnd": 61.864916666666666, "end": 63.989916666666666, "voiceSeconds": 2.125, "pauseSeconds": 2.125, "sourceStart": 33.114958333333334, "sourceEnd": 35.239958333333334, "zh": "例如荡过河流，"}, {"index": 11, "text": "hunting creatures in the jungle,", "start": 63.989916666666666, "voiceEnd": 66.034375, "end": 68.07883333333334, "voiceSeconds": 2.0444583333333335, "pauseSeconds": 2.0444583333333335, "sourceStart": 35.489958333333334, "sourceEnd": 37.534416666666665, "zh": "在丛林里打猎，"}, {"index": 12, "text": "or taking part in sword-fighting tournaments.", "start": 68.07883333333334, "voiceEnd": 71.21175, "end": 74.34466666666667, "voiceSeconds": 3.1329166666666666, "pauseSeconds": 3.1329166666666666, "sourceStart": 37.754416666666664, "sourceEnd": 40.88733333333333, "zh": "或参加剑术比赛。"}, {"index": 13, "text": "This park is also famous for its wooden souvenirs.", "start": 74.34466666666667, "voiceEnd": 78.60266666666666, "end": 82.86066666666667, "voiceSeconds": 4.258, "pauseSeconds": 4.258, "sourceStart": 41.37733333333333, "sourceEnd": 45.635333333333335, "zh": "这座公园还以木制纪念品出名。"}, {"index": 14, "text": "Whichever we bought in the central shop", "start": 82.86066666666667, "voiceEnd": 85.40087500000001, "end": 87.94108333333334, "voiceSeconds": 2.540208333333333, "pauseSeconds": 2.540208333333333, "sourceStart": 46.135333333333335, "sourceEnd": 48.67554166666667, "zh": "无论我们在中心商店买哪一件东西，"}, {"index": 15, "text": "was made of wood,", "start": 87.94108333333334, "voiceEnd": 89.21095833333334, "end": 90.48083333333334, "voiceSeconds": 1.269875, "pauseSeconds": 1.269875, "sourceStart": 48.67554166666667, "sourceEnd": 49.94541666666667, "zh": "它都是木头做的，"}, {"index": 16, "text": "and wherever we went", "start": 90.48083333333334, "voiceEnd": 91.69550000000001, "end": 92.91016666666667, "voiceSeconds": 1.2146666666666666, "pauseSeconds": 1.2146666666666666, "sourceStart": 50.275416666666665, "sourceEnd": 51.49008333333333, "zh": "而且无论我们走到哪里，"}, {"index": 17, "text": "we could see minority carpenters working.", "start": 92.91016666666667, "voiceEnd": 96.02108333333334, "end": 99.132, "voiceSeconds": 3.1109166666666668, "pauseSeconds": 3.1109166666666668, "sourceStart": 51.49008333333333, "sourceEnd": 54.601, "zh": "都能看见少数民族木匠在工作。"}, {"index": 18, "text": "They made wooden tools,", "start": 99.132, "voiceEnd": 100.95654166666667, "end": 102.78108333333334, "voiceSeconds": 1.8245416666666667, "pauseSeconds": 1.8245416666666667, "sourceStart": 55.101, "sourceEnd": 56.92554166666667, "zh": "他们制作木制工具，"}, {"index": 19, "text": "wooden cartoon figures,", "start": 102.78108333333334, "voiceEnd": 104.61325000000001, "end": 106.44541666666667, "voiceSeconds": 1.8321666666666667, "pauseSeconds": 1.8321666666666667, "sourceStart": 57.16554166666667, "sourceEnd": 58.997708333333335, "zh": "木制卡通人物，"}, {"index": 20, "text": "wooden athletic products and so on.", "start": 106.44541666666667, "voiceEnd": 109.08104166666668, "end": 111.71666666666667, "voiceSeconds": 2.635625, "pauseSeconds": 2.635625, "sourceStart": 59.26770833333333, "sourceEnd": 61.903333333333336, "zh": "木制体育用品，等等。"}, {"index": 21, "text": "They even built a huge wooden engine with a length of 20 metres,", "start": 111.71666666666667, "voiceEnd": 116.51841666666667, "end": 121.32016666666667, "voiceSeconds": 4.80175, "pauseSeconds": 4.80175, "sourceStart": 62.38333333333333, "sourceEnd": 67.18508333333334, "zh": "他们甚至造了一台长20米的巨大木制发动机，"}, {"index": 22, "text": "which was modeled after a real one.", "start": 121.32016666666667, "voiceEnd": 123.73808333333334, "end": 126.156, "voiceSeconds": 2.4179166666666667, "pauseSeconds": 2.4179166666666667, "sourceStart": 67.49508333333333, "sourceEnd": 69.913, "zh": "是仿照一台真发动机制作的。"}, {"index": 23, "text": "This theme park is really a fantasy amusement park.", "start": 126.156, "voiceEnd": 130.44233333333335, "end": 134.72866666666667, "voiceSeconds": 4.286333333333333, "pauseSeconds": 4.286333333333333, "sourceStart": 70.393, "sourceEnd": 74.67933333333333, "zh": "这座主题公园真是一个充满奇幻想象的游乐园。"}, {"index": 24, "text": "No wonder it has become the brand of local tourism.", "start": 134.72866666666667, "voiceEnd": 138.90033333333332, "end": 143.072, "voiceSeconds": 4.171666666666667, "pauseSeconds": 4.171666666666667, "sourceStart": 75.17933333333333, "sourceEnd": 79.351, "zh": "难怪它成了当地旅游业的一张名片。"}], "duration": 143.072, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "6": {"day": 6, "title": "A Strange Disease", "groups": [{"index": 0, "text": "A Strange Disease.", "start": 0, "voiceEnd": 1.7503333333333333, "end": 3.5006666666666666, "voiceSeconds": 1.7503333333333333, "pauseSeconds": 1.7503333333333333, "sourceStart": 0.195, "sourceEnd": 1.9453333333333334, "zh": "奇怪的疾病。"}, {"index": 1, "text": "When the construction of the firework factory came to the stage of painting,", "start": 3.5006666666666666, "voiceEnd": 8.679708333333334, "end": 13.85875, "voiceSeconds": 5.1790416666666665, "pauseSeconds": 5.1790416666666665, "sourceStart": 2.445333333333333, "sourceEnd": 7.624375, "zh": "当烟花厂的建设进行到刷漆阶段时，"}, {"index": 2, "text": "a pump was put in.", "start": 13.85875, "voiceEnd": 15.437708333333333, "end": 17.016666666666666, "voiceSeconds": 1.5789583333333332, "pauseSeconds": 1.5789583333333332, "sourceStart": 7.874375, "sourceEnd": 9.453333333333333, "zh": "一台水泵被安装了进去。"}, {"index": 3, "text": "Then, all the painters in the neighbourhood", "start": 17.016666666666666, "voiceEnd": 19.769166666666667, "end": 22.521666666666665, "voiceSeconds": 2.7525, "pauseSeconds": 2.7525, "sourceStart": 9.923333333333334, "sourceEnd": 12.675833333333333, "zh": "接着，附近所有的油漆工，"}, {"index": 4, "text": "were defeated by a severe disease", "start": 22.521666666666665, "voiceEnd": 25.210499999999996, "end": 27.89933333333333, "voiceSeconds": 2.688833333333333, "pauseSeconds": 2.688833333333333, "sourceStart": 12.675833333333333, "sourceEnd": 15.364666666666666, "zh": "都被一种严重的疾病击倒了，"}, {"index": 5, "text": "whose characteristic was similar to that of a bad burn.", "start": 27.89933333333333, "voiceEnd": 31.732, "end": 35.56466666666667, "voiceSeconds": 3.832666666666667, "pauseSeconds": 3.832666666666667, "sourceStart": 15.364666666666666, "sourceEnd": 19.197333333333333, "zh": "症状类似于严重烧伤。"}, {"index": 6, "text": "An expert physician was instructed", "start": 35.56466666666667, "voiceEnd": 38.353625, "end": 41.142583333333334, "voiceSeconds": 2.7889583333333334, "pauseSeconds": 2.7889583333333334, "sourceStart": 19.677333333333333, "sourceEnd": 22.466291666666667, "zh": "一位专业医生奉命，"}, {"index": 7, "text": "to attend to the victims", "start": 41.142583333333334, "voiceEnd": 42.97558333333333, "end": 44.80858333333333, "voiceSeconds": 1.833, "pauseSeconds": 1.833, "sourceStart": 22.466291666666667, "sourceEnd": 24.299291666666665, "zh": "照料这些患者，"}, {"index": 8, "text": "and handle this case.", "start": 44.80858333333333, "voiceEnd": 46.57495833333333, "end": 48.34133333333333, "voiceSeconds": 1.766375, "pauseSeconds": 1.766375, "sourceStart": 24.299291666666665, "sourceEnd": 26.065666666666665, "zh": "并处理这一病例。"}, {"index": 9, "text": "He was enthusiastic,", "start": 48.34133333333333, "voiceEnd": 50.127125, "end": 51.91291666666667, "voiceSeconds": 1.7857916666666667, "pauseSeconds": 1.7857916666666667, "sourceStart": 26.575666666666667, "sourceEnd": 28.361458333333335, "zh": "他很热心，"}, {"index": 10, "text": "but he didn’t foresee that it was a hard challenge.", "start": 51.91291666666667, "voiceEnd": 55.34245833333333, "end": 58.772, "voiceSeconds": 3.4295416666666667, "pauseSeconds": 3.4295416666666667, "sourceStart": 28.721458333333334, "sourceEnd": 32.151, "zh": "却没预料到这会是一项艰巨的挑战。"}, {"index": 11, "text": "After a simple enquiry,", "start": 58.772, "voiceEnd": 60.841458333333335, "end": 62.910916666666665, "voiceSeconds": 2.0694583333333334, "pauseSeconds": 2.0694583333333334, "sourceStart": 32.641, "sourceEnd": 34.710458333333335, "zh": "经过简单询问，"}, {"index": 12, "text": "he announced that the polluted paint was to blame.", "start": 62.910916666666665, "voiceEnd": 66.454125, "end": 69.99733333333333, "voiceSeconds": 3.5432083333333333, "pauseSeconds": 3.5432083333333333, "sourceStart": 34.95045833333333, "sourceEnd": 38.49366666666667, "zh": "他宣称，应当归咎于受污染的油漆。"}, {"index": 13, "text": "But without positive evidence,", "start": 69.99733333333333, "voiceEnd": 72.13645833333334, "end": 74.27558333333333, "voiceSeconds": 2.139125, "pauseSeconds": 2.139125, "sourceStart": 38.99366666666667, "sourceEnd": 41.13279166666667, "zh": "但由于缺乏确凿证据，"}, {"index": 14, "text": "people suspected and rejected his view,", "start": 74.27558333333333, "voiceEnd": 77.41979166666667, "end": 80.564, "voiceSeconds": 3.1442083333333333, "pauseSeconds": 3.1442083333333333, "sourceStart": 41.412791666666664, "sourceEnd": 44.557, "zh": "人们怀疑并否定了他的看法，"}, {"index": 15, "text": "saying the theory he put forward", "start": 80.564, "voiceEnd": 82.60358333333333, "end": 84.64316666666666, "voiceSeconds": 2.0395833333333333, "pauseSeconds": 2.0395833333333333, "sourceStart": 44.817, "sourceEnd": 46.85658333333333, "zh": "说他提出的理论，"}, {"index": 16, "text": "made no sense.", "start": 84.64316666666666, "voiceEnd": 86.06641666666665, "end": 87.48966666666666, "voiceSeconds": 1.42325, "pauseSeconds": 1.42325, "sourceStart": 46.85658333333333, "sourceEnd": 48.279833333333336, "zh": "根本说不通。"}, {"index": 17, "text": "Being much more strict with himself,", "start": 87.48966666666666, "voiceEnd": 90.13154166666666, "end": 92.77341666666666, "voiceSeconds": 2.641875, "pauseSeconds": 2.641875, "sourceStart": 48.789833333333334, "sourceEnd": 51.43170833333333, "zh": "于是他更加严格地要求自己，"}, {"index": 18, "text": "he devoted himself to the case.", "start": 92.77341666666666, "voiceEnd": 95.26670833333333, "end": 97.75999999999999, "voiceSeconds": 2.4932916666666665, "pauseSeconds": 2.4932916666666665, "sourceStart": 51.66170833333333, "sourceEnd": 54.155, "zh": "全身心地投入这一病例的调查。"}, {"index": 19, "text": "Apart from making enquiries,", "start": 97.75999999999999, "voiceEnd": 100.07645833333332, "end": 102.39291666666665, "voiceSeconds": 2.3164583333333333, "pauseSeconds": 2.3164583333333333, "sourceStart": 54.645, "sourceEnd": 56.96145833333333, "zh": "除了询问情况，"}, {"index": 20, "text": "he made detailed charts and analysed the data cautiously.", "start": 102.39291666666665, "voiceEnd": 106.95712499999999, "end": 111.52133333333332, "voiceSeconds": 4.564208333333333, "pauseSeconds": 4.564208333333333, "sourceStart": 57.201458333333335, "sourceEnd": 61.76566666666667, "zh": "他还绘制了详细图表，谨慎地分析数据。"}, {"index": 21, "text": "Finally, he drew a scientific conclusion,", "start": 111.52133333333332, "voiceEnd": 115.06295833333331, "end": 118.60458333333332, "voiceSeconds": 3.541625, "pauseSeconds": 3.541625, "sourceStart": 62.215666666666664, "sourceEnd": 65.75729166666666, "zh": "最后，他得出了一个科学结论，"}, {"index": 22, "text": "linking the disease to the radium in the pump.", "start": 118.60458333333332, "voiceEnd": 121.856625, "end": 125.10866666666665, "voiceSeconds": 3.2520416666666665, "pauseSeconds": 3.2520416666666665, "sourceStart": 66.01729166666667, "sourceEnd": 69.26933333333334, "zh": "把这种疾病与水泵里的镭联系起来。"}, {"index": 23, "text": "Exposed to radium,", "start": 125.10866666666665, "voiceEnd": 126.90274999999998, "end": 128.69683333333333, "voiceSeconds": 1.7940833333333333, "pauseSeconds": 1.7940833333333333, "sourceStart": 69.77933333333333, "sourceEnd": 71.57341666666666, "zh": "人们接触了镭，"}, {"index": 24, "text": "a kind of radioactive material in the universe,", "start": 128.69683333333333, "voiceEnd": 132.13120833333332, "end": 135.56558333333334, "voiceSeconds": 3.434375, "pauseSeconds": 3.434375, "sourceStart": 71.68341666666667, "sourceEnd": 75.11779166666666, "zh": "这是一种宇宙中的放射性物质，"}, {"index": 25, "text": "people absorbed radiation and got sick immediately.", "start": 135.56558333333334, "voiceEnd": 139.49279166666668, "end": 143.42000000000002, "voiceSeconds": 3.927208333333333, "pauseSeconds": 3.927208333333333, "sourceStart": 75.47779166666666, "sourceEnd": 79.405, "zh": "吸收了辐射，随即生病。"}, {"index": 26, "text": "Spinning the pump backward,", "start": 143.42000000000002, "voiceEnd": 145.45245833333334, "end": 147.4849166666667, "voiceSeconds": 2.0324583333333335, "pauseSeconds": 2.0324583333333335, "sourceStart": 79.845, "sourceEnd": 81.87745833333334, "zh": "他反向转动水泵，"}, {"index": 27, "text": "he took away the radium.", "start": 147.4849166666667, "voiceEnd": 149.27245833333336, "end": 151.06000000000003, "voiceSeconds": 1.7875416666666666, "pauseSeconds": 1.7875416666666666, "sourceStart": 82.11745833333333, "sourceEnd": 83.905, "zh": "把镭移走了。"}, {"index": 28, "text": "This simple movement cured all the victims.", "start": 151.06000000000003, "voiceEnd": 154.65600000000003, "end": 158.25200000000004, "voiceSeconds": 3.596, "pauseSeconds": 3.596, "sourceStart": 84.395, "sourceEnd": 87.991, "zh": "故事中，这个简单的动作治好了所有患者。"}], "duration": 158.25200000000004, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "7": {"day": 7, "title": "Sightseeing in the United Kingdom", "groups": [{"index": 0, "text": "Sightseeing in the United Kingdom.", "start": 0, "voiceEnd": 2.8706666666666667, "end": 5.741333333333333, "voiceSeconds": 2.8706666666666667, "pauseSeconds": 2.8706666666666667, "sourceStart": 0.195, "sourceEnd": 3.0656666666666665, "zh": "英国观光。"}, {"index": 1, "text": "After the wedding,", "start": 5.741333333333333, "voiceEnd": 7.012708333333333, "end": 8.284083333333333, "voiceSeconds": 1.271375, "pauseSeconds": 1.271375, "sourceStart": 3.5256666666666665, "sourceEnd": 4.797041666666667, "zh": "婚礼之后，"}, {"index": 2, "text": "my cousin and his wife went to the United Kingdom for nationwide sightseeing.", "start": 8.284083333333333, "voiceEnd": 14.196041666666666, "end": 20.108, "voiceSeconds": 5.911958333333334, "pauseSeconds": 5.911958333333334, "sourceStart": 4.957041666666667, "sourceEnd": 10.869, "zh": "我的表亲和他的妻子到英国各地观光。"}, {"index": 3, "text": "He faxed a letter to me in English yesterday.", "start": 20.108, "voiceEnd": 23.5, "end": 26.892, "voiceSeconds": 3.392, "pauseSeconds": 3.392, "sourceStart": 11.349, "sourceEnd": 14.741, "zh": "昨天，他给我传真了一封英文信。"}, {"index": 4, "text": "To my delight,", "start": 26.892, "voiceEnd": 28.16658333333333, "end": 29.441166666666668, "voiceSeconds": 1.2745833333333334, "pauseSeconds": 1.2745833333333334, "sourceStart": 15.241, "sourceEnd": 16.515583333333332, "zh": "让我高兴的是，"}, {"index": 5, "text": "he no longer made any tense error.", "start": 29.441166666666668, "voiceEnd": 32.11858333333333, "end": 34.796, "voiceSeconds": 2.677416666666667, "pauseSeconds": 2.677416666666667, "sourceStart": 16.735583333333334, "sourceEnd": 19.413, "zh": "他不再犯时态错误了。"}, {"index": 6, "text": "And his description roughly clarified my questions about the UK--its currency,", "start": 34.796, "voiceEnd": 40.46666666666667, "end": 46.13733333333333, "voiceSeconds": 5.6706666666666665, "pauseSeconds": 5.6706666666666665, "sourceStart": 19.893, "sourceEnd": 25.563666666666666, "zh": "他的描述也大致解答了我对英国的疑问——包括英国的货币，"}, {"index": 7, "text": "its administration, the institution which divides it into four constituent countries,", "start": 46.13733333333333, "voiceEnd": 52.47366666666667, "end": 58.809999999999995, "voiceSeconds": 6.336333333333333, "pauseSeconds": 6.336333333333333, "sourceStart": 25.843666666666667, "sourceEnd": 32.18, "zh": "行政管理，以及由四个构成国组成的制度，"}, {"index": 8, "text": "and the historical conflicts and quarrels", "start": 58.809999999999995, "voiceEnd": 61.464, "end": 64.118, "voiceSeconds": 2.654, "pauseSeconds": 2.654, "sourceStart": 32.48, "sourceEnd": 35.134, "zh": "还有历史上的冲突与争端，"}, {"index": 9, "text": "when Southern Ireland broke away from the UK.", "start": 64.118, "voiceEnd": 67.27533333333332, "end": 70.43266666666666, "voiceSeconds": 3.1573333333333333, "pauseSeconds": 3.1573333333333333, "sourceStart": 35.134, "sourceEnd": 38.291333333333334, "zh": "即南爱尔兰脱离英国时发生的那些事。"}, {"index": 10, "text": "Unwilling to leave out any attraction,", "start": 70.43266666666666, "voiceEnd": 73.18362499999999, "end": 75.93458333333334, "voiceSeconds": 2.750958333333333, "pauseSeconds": 2.750958333333333, "sourceStart": 38.781333333333336, "sourceEnd": 41.532291666666666, "zh": "因为不想遗漏任何景点，"}, {"index": 11, "text": "my cousin arranged his enjoyable journey carefully.", "start": 75.93458333333334, "voiceEnd": 79.789625, "end": 83.64466666666667, "voiceSeconds": 3.8550416666666667, "pauseSeconds": 3.8550416666666667, "sourceStart": 41.77229166666667, "sourceEnd": 45.62733333333333, "zh": "我的表亲仔细安排了这次愉快的旅行。"}, {"index": 12, "text": "One attractive place he visited was a castle in the countryside of Scotland,", "start": 83.64466666666667, "voiceEnd": 89.298375, "end": 94.95208333333333, "voiceSeconds": 5.653708333333333, "pauseSeconds": 5.653708333333333, "sourceStart": 46.08733333333333, "sourceEnd": 51.74104166666667, "zh": "他参观的一处迷人景点，是苏格兰乡间的一座城堡，"}, {"index": 13, "text": "which lies near a port.", "start": 94.95208333333333, "voiceEnd": 96.72004166666667, "end": 98.488, "voiceSeconds": 1.7679583333333333, "pauseSeconds": 1.7679583333333333, "sourceStart": 52.041041666666665, "sourceEnd": 53.809, "zh": "位于一个港口附近。"}, {"index": 14, "text": "It used to be the headquarters of the Communism Union", "start": 98.488, "voiceEnd": 102.25629166666667, "end": 106.02458333333334, "voiceSeconds": 3.768291666666667, "pauseSeconds": 3.768291666666667, "sourceStart": 54.299, "sourceEnd": 58.06729166666667, "zh": "它曾经是共产主义联盟的总部，"}, {"index": 15, "text": "but broke down during the war.", "start": 106.02458333333334, "voiceEnd": 108.334625, "end": 110.64466666666667, "voiceSeconds": 2.3100416666666668, "pauseSeconds": 2.3100416666666668, "sourceStart": 58.06729166666667, "sourceEnd": 60.37733333333333, "zh": "但在战争中毁坏了。"}, {"index": 16, "text": "Finding nothing could take the place of this splendid architecture,", "start": 110.64466666666667, "voiceEnd": 115.03745833333333, "end": 119.43025, "voiceSeconds": 4.392791666666667, "pauseSeconds": 4.392791666666667, "sourceStart": 60.83733333333333, "sourceEnd": 65.230125, "zh": "人们觉得，没有什么可以替代这座宏伟的建筑，"}, {"index": 17, "text": "people accomplished rebuilding it in 1952.", "start": 119.43025, "voiceEnd": 123.36145833333333, "end": 127.29266666666666, "voiceSeconds": 3.931208333333333, "pauseSeconds": 3.931208333333333, "sourceStart": 65.560125, "sourceEnd": 69.49133333333333, "zh": "于是于1952年完成了重建。"}, {"index": 18, "text": "It was to their credit", "start": 127.29266666666666, "voiceEnd": 128.86958333333334, "end": 130.4465, "voiceSeconds": 1.5769166666666667, "pauseSeconds": 1.5769166666666667, "sourceStart": 69.98133333333334, "sourceEnd": 71.55825, "zh": "值得称赞的是，"}, {"index": 19, "text": "that all furnished rooms are consistent with", "start": 130.4465, "voiceEnd": 133.59491666666665, "end": 136.7433333333333, "voiceSeconds": 3.148416666666667, "pauseSeconds": 3.148416666666667, "sourceStart": 71.55825, "sourceEnd": 74.70666666666666, "zh": "所有配备家具的房间都保持着，"}, {"index": 20, "text": "what they used to be.", "start": 136.7433333333333, "voiceEnd": 138.18166666666664, "end": 139.61999999999998, "voiceSeconds": 1.4383333333333332, "pauseSeconds": 1.4383333333333332, "sourceStart": 74.70666666666666, "sourceEnd": 76.145, "zh": "原来的样子。"}, {"index": 21, "text": "My cousin was thrilled by its collections", "start": 139.61999999999998, "voiceEnd": 142.5257083333333, "end": 145.43141666666665, "voiceSeconds": 2.905708333333333, "pauseSeconds": 2.905708333333333, "sourceStart": 76.595, "sourceEnd": 79.50070833333334, "zh": "我的表亲对那里的藏品十分兴奋，"}, {"index": 22, "text": "consisting of statues plus royal uniforms", "start": 145.43141666666665, "voiceEnd": 149.08149999999998, "end": 152.7315833333333, "voiceSeconds": 3.6500833333333333, "pauseSeconds": 3.6500833333333333, "sourceStart": 79.50070833333334, "sourceEnd": 83.15079166666666, "zh": "包括雕像以及皇家制服，"}, {"index": 23, "text": "folded in glass tanks.", "start": 152.7315833333333, "voiceEnd": 154.67212499999997, "end": 156.61266666666663, "voiceSeconds": 1.9405416666666666, "pauseSeconds": 1.9405416666666666, "sourceStart": 83.15079166666666, "sourceEnd": 85.09133333333334, "zh": "制服被折叠好，放在玻璃柜里。"}, {"index": 24, "text": "Though there was no possibility of buying some of these exhibits,", "start": 156.61266666666663, "voiceEnd": 160.87712499999995, "end": 165.1415833333333, "voiceSeconds": 4.264458333333334, "pauseSeconds": 4.264458333333334, "sourceStart": 85.58133333333333, "sourceEnd": 89.84579166666667, "zh": "虽然不可能买下其中的一些展品，"}, {"index": 25, "text": "it was convenient to take photos,", "start": 165.1415833333333, "voiceEnd": 167.76099999999997, "end": 170.38041666666663, "voiceSeconds": 2.6194166666666665, "pauseSeconds": 2.6194166666666665, "sourceStart": 90.09579166666667, "sourceEnd": 92.71520833333334, "zh": "拍照却很方便，"}, {"index": 26, "text": "which he sent me along with his fax.", "start": 170.38041666666663, "voiceEnd": 172.8642083333333, "end": 175.34799999999996, "voiceSeconds": 2.483791666666667, "pauseSeconds": 2.483791666666667, "sourceStart": 93.00520833333333, "sourceEnd": 95.489, "zh": "他把照片和传真一起发给了我。"}], "duration": 175.34799999999996, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "8": {"day": 8, "title": "An Air Crash", "groups": [{"index": 0, "text": "An Air Crash.", "start": 0, "voiceEnd": 1.3426666666666667, "end": 2.6853333333333333, "voiceSeconds": 1.3426666666666667, "pauseSeconds": 1.3426666666666667, "sourceStart": 0.195, "sourceEnd": 1.5376666666666667, "zh": "飞机事故。"}, {"index": 1, "text": "I was formerly a typist in a post office.", "start": 2.6853333333333333, "voiceEnd": 6.165333333333333, "end": 9.645333333333333, "voiceSeconds": 3.48, "pauseSeconds": 3.48, "sourceStart": 2.0376666666666665, "sourceEnd": 5.517666666666667, "zh": "我以前是邮局的一名打字员。"}, {"index": 2, "text": "Because I couldn’t tolerate typing any more postage bills or postcodes", "start": 9.645333333333333, "voiceEnd": 14.704291666666666, "end": 19.76325, "voiceSeconds": 5.058958333333333, "pauseSeconds": 5.058958333333333, "sourceStart": 6.047666666666666, "sourceEnd": 11.106625, "zh": "因为再也无法忍受敲打邮费账单或邮政编码，"}, {"index": 3, "text": "on a typewriter every day,", "start": 19.76325, "voiceEnd": 21.88083333333333, "end": 23.998416666666664, "voiceSeconds": 2.117583333333333, "pauseSeconds": 2.117583333333333, "sourceStart": 11.106625, "sourceEnd": 13.224208333333333, "zh": "天天对着打字机，"}, {"index": 4, "text": "I resigned.", "start": 23.998416666666664, "voiceEnd": 25.054041666666663, "end": 26.109666666666662, "voiceSeconds": 1.055625, "pauseSeconds": 1.055625, "sourceStart": 13.524208333333334, "sourceEnd": 14.579833333333333, "zh": "我辞职了。"}, {"index": 5, "text": "With a greedy motivation of making big money,", "start": 26.109666666666662, "voiceEnd": 29.443249999999995, "end": 32.77683333333333, "voiceSeconds": 3.3335833333333333, "pauseSeconds": 3.3335833333333333, "sourceStart": 15.129833333333334, "sourceEnd": 18.463416666666667, "zh": "怀着赚大钱的强烈欲望，"}, {"index": 6, "text": "I took up working as a business representative for the G.E Ecology Company,", "start": 32.77683333333333, "voiceEnd": 38.16, "end": 43.543166666666664, "voiceSeconds": 5.383166666666667, "pauseSeconds": 5.383166666666667, "sourceStart": 18.713416666666667, "sourceEnd": 24.096583333333335, "zh": "我开始担任G.E生态公司的业务代表，"}, {"index": 7, "text": "which produced goods by recycling useful materials from our dustbins.", "start": 43.543166666666664, "voiceEnd": 48.87441666666666, "end": 54.205666666666666, "voiceSeconds": 5.33125, "pauseSeconds": 5.33125, "sourceStart": 24.406583333333334, "sourceEnd": 29.737833333333334, "zh": "这家公司回收垃圾桶中的有用材料来生产商品。"}, {"index": 8, "text": "My new job left me good impressions in many aspects", "start": 54.205666666666666, "voiceEnd": 58.26204166666667, "end": 62.318416666666664, "voiceSeconds": 4.056375, "pauseSeconds": 4.056375, "sourceStart": 30.227833333333333, "sourceEnd": 34.28420833333333, "zh": "新工作在很多方面都给我留下了好印象，"}, {"index": 9, "text": "except that the working timetable was full of traveling by jets.", "start": 62.318416666666664, "voiceEnd": 67.151875, "end": 71.98533333333333, "voiceSeconds": 4.833458333333334, "pauseSeconds": 4.833458333333334, "sourceStart": 34.28420833333333, "sourceEnd": 39.117666666666665, "zh": "只是工作日程里安排了大量乘喷气式飞机出差的行程。"}, {"index": 10, "text": "Once, when speeding up,", "start": 71.98533333333333, "voiceEnd": 74.22566666666667, "end": 76.466, "voiceSeconds": 2.2403333333333335, "pauseSeconds": 2.2403333333333335, "sourceStart": 39.617666666666665, "sourceEnd": 41.858, "zh": "一次，飞机正在加速时，"}, {"index": 11, "text": "our jet was swallowed by a thunderstorm,", "start": 76.466, "voiceEnd": 79.27033333333333, "end": 82.07466666666666, "voiceSeconds": 2.804333333333333, "pauseSeconds": 2.804333333333333, "sourceStart": 41.978, "sourceEnd": 44.782333333333334, "zh": "被一场雷暴吞没了，"}, {"index": 12, "text": "which destroyed our GPS receiver and made us lose sight of the directions.", "start": 82.07466666666666, "voiceEnd": 87.472, "end": 92.86933333333333, "voiceSeconds": 5.397333333333333, "pauseSeconds": 5.397333333333333, "sourceStart": 45.07233333333333, "sourceEnd": 50.46966666666667, "zh": "GPS接收器被毁，我们也失去了方向。"}, {"index": 13, "text": "A constantly flashing light showed that our jet was in danger.", "start": 92.86933333333333, "voiceEnd": 97.62466666666667, "end": 102.38, "voiceSeconds": 4.755333333333334, "pauseSeconds": 4.755333333333334, "sourceStart": 50.959666666666664, "sourceEnd": 55.715, "zh": "一盏不断闪烁的灯表明，飞机正处于危险中。"}, {"index": 14, "text": "A steward instantly asked us to put on masks", "start": 102.38, "voiceEnd": 105.87662499999999, "end": 109.37325, "voiceSeconds": 3.496625, "pauseSeconds": 3.496625, "sourceStart": 56.205, "sourceEnd": 59.701625, "zh": "一名乘务员立即让我们戴上面罩，"}, {"index": 15, "text": "and fasten the safety belts,", "start": 109.37325, "voiceEnd": 111.43554166666667, "end": 113.49783333333333, "voiceSeconds": 2.062291666666667, "pauseSeconds": 2.062291666666667, "sourceStart": 59.701625, "sourceEnd": 61.76391666666667, "zh": "系好安全带，"}, {"index": 16, "text": "and then pressed a button to switch on the escaping capsule.", "start": 113.49783333333333, "voiceEnd": 117.30091666666667, "end": 121.104, "voiceSeconds": 3.8030833333333334, "pauseSeconds": 3.8030833333333334, "sourceStart": 62.04391666666667, "sourceEnd": 65.847, "zh": "然后按下按钮，启动逃生舱。"}, {"index": 17, "text": "It slid sideways out of the opening at once", "start": 121.104, "voiceEnd": 124.6215, "end": 128.139, "voiceSeconds": 3.5175, "pauseSeconds": 3.5175, "sourceStart": 66.357, "sourceEnd": 69.8745, "zh": "逃生舱立刻从开口侧滑出去，"}, {"index": 18, "text": "and landed in a desert area safely.", "start": 128.139, "voiceEnd": 131.04616666666666, "end": 133.95333333333335, "voiceSeconds": 2.9071666666666665, "pauseSeconds": 2.9071666666666665, "sourceStart": 69.8745, "sourceEnd": 72.78166666666667, "zh": "安全地降落在一片沙漠地带。"}, {"index": 19, "text": "Lacking food and tablets,", "start": 133.95333333333335, "voiceEnd": 136.08670833333335, "end": 138.22008333333335, "voiceSeconds": 2.133375, "pauseSeconds": 2.133375, "sourceStart": 73.21166666666667, "sourceEnd": 75.34504166666666, "zh": "由于缺少食物和药片，"}, {"index": 20, "text": "we were nervous and uncertain at first.", "start": 138.22008333333335, "voiceEnd": 141.31670833333334, "end": 144.41333333333336, "voiceSeconds": 3.096625, "pauseSeconds": 3.096625, "sourceStart": 75.60504166666666, "sourceEnd": 78.70166666666667, "zh": "起初我们既紧张又不知所措。"}, {"index": 21, "text": "But we all kept optimistic and made a good adjustment to the situation.", "start": 144.41333333333336, "voiceEnd": 149.7915, "end": 155.1696666666667, "voiceSeconds": 5.378166666666667, "pauseSeconds": 5.378166666666667, "sourceStart": 79.25166666666667, "sourceEnd": 84.62983333333334, "zh": "但大家保持乐观，很好地适应了局面。"}, {"index": 22, "text": "We swept up the surrounding mud to make our settlement", "start": 155.1696666666667, "voiceEnd": 159.04362500000002, "end": 162.91758333333337, "voiceSeconds": 3.8739583333333334, "pauseSeconds": 3.8739583333333334, "sourceStart": 85.13983333333333, "sourceEnd": 89.01379166666666, "zh": "我们收拢周围的泥土，搭建临时住处，"}, {"index": 23, "text": "and were back on our feet soon.", "start": 162.91758333333337, "voiceEnd": 165.03312500000004, "end": 167.1486666666667, "voiceSeconds": 2.1155416666666667, "pauseSeconds": 2.1155416666666667, "sourceStart": 89.01379166666666, "sourceEnd": 91.12933333333334, "zh": "很快重新振作起来。"}, {"index": 24, "text": "Finally, guided by the smoke of our crashing jet,", "start": 167.1486666666667, "voiceEnd": 171.1272916666667, "end": 175.1059166666667, "voiceSeconds": 3.978625, "pauseSeconds": 3.978625, "sourceStart": 91.63933333333334, "sourceEnd": 95.61795833333333, "zh": "最后，当地人看到了失事飞机冒出的烟，"}, {"index": 25, "text": "some local citizens came by carriages and saved us.", "start": 175.1059166666667, "voiceEnd": 179.34695833333336, "end": 183.58800000000002, "voiceSeconds": 4.241041666666667, "pauseSeconds": 4.241041666666667, "sourceStart": 95.91795833333333, "sourceEnd": 100.159, "zh": "乘马车赶来，救了我们。"}], "duration": 183.58800000000002, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "9": {"day": 9, "title": "An Amateur Journalist", "groups": [{"index": 0, "text": "An Amateur Journalist.", "start": 0, "voiceEnd": 2.09, "end": 4.18, "voiceSeconds": 2.09, "pauseSeconds": 2.09, "sourceStart": 0.195, "sourceEnd": 2.285, "zh": "业余记者。"}, {"index": 1, "text": "Jane is a housewife,", "start": 4.18, "voiceEnd": 5.9286666666666665, "end": 7.677333333333333, "voiceSeconds": 1.7486666666666666, "pauseSeconds": 1.7486666666666666, "sourceStart": 2.805, "sourceEnd": 4.5536666666666665, "zh": "简是一位家庭主妇，"}, {"index": 2, "text": "but delighted to work as an amateur journalist.", "start": 7.677333333333333, "voiceEnd": 11.061333333333334, "end": 14.445333333333334, "voiceSeconds": 3.384, "pauseSeconds": 3.384, "sourceStart": 4.873666666666667, "sourceEnd": 8.257666666666667, "zh": "但她很乐意做一名业余记者。"}, {"index": 3, "text": "It is a dilemma for her to rush between family and work,", "start": 14.445333333333334, "voiceEnd": 18.659916666666668, "end": 22.8745, "voiceSeconds": 4.214583333333334, "pauseSeconds": 4.214583333333334, "sourceStart": 8.767666666666667, "sourceEnd": 12.98225, "zh": "在家庭和工作之间来回奔波，让她左右为难，"}, {"index": 4, "text": "and it is also unusual for the News Department", "start": 22.8745, "voiceEnd": 26.10441666666667, "end": 29.334333333333333, "voiceSeconds": 3.2299166666666665, "pauseSeconds": 3.2299166666666665, "sourceStart": 13.31225, "sourceEnd": 16.542166666666667, "zh": "而对于新闻部门来说，"}, {"index": 5, "text": "to depend on an amateur to cover crimes.", "start": 29.334333333333333, "voiceEnd": 32.36383333333333, "end": 35.39333333333333, "voiceSeconds": 3.0295, "pauseSeconds": 3.0295, "sourceStart": 16.542166666666667, "sourceEnd": 19.571666666666665, "zh": "依靠业余人员报道犯罪案件也很不寻常。"}, {"index": 6, "text": "But Jane is really gifted.", "start": 35.39333333333333, "voiceEnd": 37.70133333333333, "end": 40.00933333333333, "voiceSeconds": 2.308, "pauseSeconds": 2.308, "sourceStart": 20.051666666666666, "sourceEnd": 22.359666666666666, "zh": "但简确实很有天赋。"}, {"index": 7, "text": "It is admirable that she is seldom accused of making mistakes.", "start": 40.00933333333333, "voiceEnd": 44.827, "end": 49.644666666666666, "voiceSeconds": 4.817666666666667, "pauseSeconds": 4.817666666666667, "sourceStart": 22.869666666666667, "sourceEnd": 27.687333333333335, "zh": "令人佩服的是，她很少因出错而受到指责。"}, {"index": 8, "text": "And, eager to become more professional,", "start": 49.644666666666666, "voiceEnd": 52.53545833333333, "end": 55.426249999999996, "voiceSeconds": 2.890791666666667, "pauseSeconds": 2.890791666666667, "sourceStart": 28.177333333333333, "sourceEnd": 31.068125, "zh": "她渴望变得更加专业，"}, {"index": 9, "text": "she concentrates on her job and updates herself now and then.", "start": 55.426249999999996, "voiceEnd": 59.845458333333326, "end": 64.26466666666667, "voiceSeconds": 4.419208333333334, "pauseSeconds": 4.419208333333334, "sourceStart": 31.318125, "sourceEnd": 35.73733333333333, "zh": "因此专注于工作，不时学习新东西。"}, {"index": 10, "text": "Once she is informed of a new case,", "start": 64.26466666666667, "voiceEnd": 66.96304166666667, "end": 69.66141666666667, "voiceSeconds": 2.698375, "pauseSeconds": 2.698375, "sourceStart": 36.227333333333334, "sourceEnd": 38.92570833333333, "zh": "一旦接到新案件的消息，"}, {"index": 11, "text": "her normal working process is as follows:", "start": 69.66141666666667, "voiceEnd": 72.72529166666666, "end": 75.78916666666667, "voiceSeconds": 3.063875, "pauseSeconds": 3.063875, "sourceStart": 39.10570833333333, "sourceEnd": 42.169583333333335, "zh": "她通常按以下流程工作："}, {"index": 12, "text": "first, she makes appointments with guilty people for interviews.", "start": 75.78916666666667, "voiceEnd": 80.45691666666667, "end": 85.12466666666667, "voiceSeconds": 4.66775, "pauseSeconds": 4.66775, "sourceStart": 42.46958333333333, "sourceEnd": 47.13733333333333, "zh": "首先，她预约采访涉案的犯罪者。"}, {"index": 13, "text": "So as to acquire accurate stories,", "start": 85.12466666666667, "voiceEnd": 88.14941666666667, "end": 91.17416666666666, "voiceSeconds": 3.02475, "pauseSeconds": 3.02475, "sourceStart": 47.62733333333333, "sourceEnd": 50.65208333333333, "zh": "为了获得准确的报道素材，"}, {"index": 14, "text": "she usually demands to record", "start": 91.17416666666666, "voiceEnd": 93.47233333333332, "end": 95.7705, "voiceSeconds": 2.2981666666666665, "pauseSeconds": 2.2981666666666665, "sourceStart": 50.86208333333333, "sourceEnd": 53.16025, "zh": "她通常要求录下，"}, {"index": 15, "text": "what they say.", "start": 95.7705, "voiceEnd": 96.84158333333333, "end": 97.91266666666667, "voiceSeconds": 1.0710833333333334, "pauseSeconds": 1.0710833333333334, "sourceStart": 53.16025, "sourceEnd": 54.23133333333333, "zh": "他们所说的话。"}, {"index": 16, "text": "Meanwhile, a technically good colleague will assist her in taking photographs.", "start": 97.91266666666667, "voiceEnd": 103.759, "end": 109.60533333333333, "voiceSeconds": 5.846333333333333, "pauseSeconds": 5.846333333333333, "sourceStart": 54.721333333333334, "sourceEnd": 60.56766666666667, "zh": "与此同时，一位技术出色的同事会协助她拍照。"}, {"index": 17, "text": "Second, she assesses whether they are deliberately hiding the truth.", "start": 109.60533333333333, "voiceEnd": 114.91933333333333, "end": 120.23333333333333, "voiceSeconds": 5.314, "pauseSeconds": 5.314, "sourceStart": 61.05766666666667, "sourceEnd": 66.37166666666667, "zh": "其次，她评估他们是否故意隐瞒真相。"}, {"index": 18, "text": "If she is skeptical about their words,", "start": 120.23333333333333, "voiceEnd": 123.07520833333334, "end": 125.91708333333334, "voiceSeconds": 2.841875, "pauseSeconds": 2.841875, "sourceStart": 66.86166666666666, "sourceEnd": 69.70354166666667, "zh": "如果她对他们的话有所怀疑，"}, {"index": 19, "text": "she will look into the case herself.", "start": 125.91708333333334, "voiceEnd": 128.30720833333334, "end": 130.69733333333335, "voiceSeconds": 2.390125, "pauseSeconds": 2.390125, "sourceStart": 69.93354166666667, "sourceEnd": 72.32366666666667, "zh": "就会亲自调查案件。"}, {"index": 20, "text": "Third, she writes thorough stories ahead of the deadline", "start": 130.69733333333335, "voiceEnd": 134.74937500000001, "end": 138.80141666666668, "voiceSeconds": 4.052041666666667, "pauseSeconds": 4.052041666666667, "sourceStart": 72.81366666666666, "sourceEnd": 76.86570833333333, "zh": "第三，她在截稿日期前写出详尽的报道，"}, {"index": 21, "text": "and submits them to the senior chief editor,", "start": 138.80141666666668, "voiceEnd": 141.85229166666667, "end": 144.9031666666667, "voiceSeconds": 3.050875, "pauseSeconds": 3.050875, "sourceStart": 76.86570833333333, "sourceEnd": 79.91658333333334, "zh": "提交给资深主编，"}, {"index": 22, "text": "who polishes and approves every section.", "start": 144.9031666666667, "voiceEnd": 148.03625000000002, "end": 151.16933333333336, "voiceSeconds": 3.1330833333333334, "pauseSeconds": 3.1330833333333334, "sourceStart": 80.17658333333334, "sourceEnd": 83.30966666666667, "zh": "由主编润色并批准每一个部分。"}, {"index": 23, "text": "Finally, her stories will be published in different editions of their magazine.", "start": 151.16933333333336, "voiceEnd": 157.11266666666668, "end": 163.056, "voiceSeconds": 5.943333333333333, "pauseSeconds": 5.943333333333333, "sourceStart": 83.80966666666667, "sourceEnd": 89.753, "zh": "最后，她的报道会刊登在杂志的不同期次中。"}], "duration": 163.056, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "10": {"day": 10, "title": "First Aid", "groups": [{"index": 0, "text": "First Aid.", "start": 0, "voiceEnd": 1.308, "end": 2.616, "voiceSeconds": 1.308, "pauseSeconds": 1.308, "sourceStart": 0.195, "sourceEnd": 1.503, "zh": "急救。"}, {"index": 1, "text": "A boy fell ill.", "start": 2.616, "voiceEnd": 4.136, "end": 5.656000000000001, "voiceSeconds": 1.52, "pauseSeconds": 1.52, "sourceStart": 2.013, "sourceEnd": 3.533, "zh": "一个男孩生病了。"}, {"index": 2, "text": "His organs were damaged by the radiation of an infrared ray stove.", "start": 5.656000000000001, "voiceEnd": 11.148666666666667, "end": 16.641333333333336, "voiceSeconds": 5.492666666666667, "pauseSeconds": 5.492666666666667, "sourceStart": 4.053, "sourceEnd": 9.545666666666667, "zh": "他的器官受到一台红外线炉辐射的损伤。"}, {"index": 3, "text": "But before the ambulance arrived,", "start": 16.641333333333336, "voiceEnd": 18.945875, "end": 21.25041666666667, "voiceSeconds": 2.3045416666666667, "pauseSeconds": 2.3045416666666667, "sourceStart": 10.055666666666667, "sourceEnd": 12.360208333333333, "zh": "但在救护车到达之前，"}, {"index": 4, "text": "a number of other injuries happened to this unlucky boy", "start": 21.25041666666667, "voiceEnd": 24.962625000000003, "end": 28.674833333333336, "voiceSeconds": 3.7122083333333333, "pauseSeconds": 3.7122083333333333, "sourceStart": 12.560208333333334, "sourceEnd": 16.27241666666667, "zh": "这个倒霉的男孩又遭受了其他伤害，"}, {"index": 5, "text": "over and over again.", "start": 28.674833333333336, "voiceEnd": 30.571583333333336, "end": 32.468333333333334, "voiceSeconds": 1.89675, "pauseSeconds": 1.89675, "sourceStart": 16.27241666666667, "sourceEnd": 18.169166666666666, "zh": "一次又一次。"}, {"index": 6, "text": "First, he was choked by some poisonous liquid from the kettle on the cupboard.", "start": 32.468333333333334, "voiceEnd": 38.34216666666667, "end": 44.216, "voiceSeconds": 5.873833333333334, "pauseSeconds": 5.873833333333334, "sourceStart": 18.669166666666666, "sourceEnd": 24.543, "zh": "首先，橱柜上水壶里的有毒液体呛到了他。"}, {"index": 7, "text": "Then his wrist skin was burnt by electric shock.", "start": 44.216, "voiceEnd": 48.18066666666667, "end": 52.14533333333333, "voiceSeconds": 3.9646666666666666, "pauseSeconds": 3.9646666666666666, "sourceStart": 25.053, "sourceEnd": 29.017666666666667, "zh": "接着，他手腕的皮肤被电击灼伤。"}, {"index": 8, "text": "Finally, his ankle was cut by a pan.", "start": 52.14533333333333, "voiceEnd": 55.754666666666665, "end": 59.364, "voiceSeconds": 3.6093333333333333, "pauseSeconds": 3.6093333333333333, "sourceStart": 29.517666666666667, "sourceEnd": 33.127, "zh": "最后，他的脚踝被锅划破。"}, {"index": 9, "text": "Fortunately, the boy’s nurse gave him proper temporary treatments according to his complex symptoms.", "start": 59.364, "voiceEnd": 66.86633333333333, "end": 74.36866666666667, "voiceSeconds": 7.5023333333333335, "pauseSeconds": 7.5023333333333335, "sourceStart": 33.597, "sourceEnd": 41.099333333333334, "zh": "幸运的是，故事中的护士根据复杂症状给他做了临时处理。"}, {"index": 10, "text": "She mildly squeezed the poisonous liquid out of his throat", "start": 74.36866666666667, "voiceEnd": 78.496375, "end": 82.62408333333333, "voiceSeconds": 4.1277083333333335, "pauseSeconds": 4.1277083333333335, "sourceStart": 41.589333333333336, "sourceEnd": 45.71704166666667, "zh": "她轻轻地把有毒液体从他的喉部挤了出来，"}, {"index": 11, "text": "and put bandages firmly in place", "start": 82.62408333333333, "voiceEnd": 85.08533333333334, "end": 87.54658333333333, "voiceSeconds": 2.46125, "pauseSeconds": 2.46125, "sourceStart": 45.742041666666665, "sourceEnd": 48.203291666666665, "zh": "并将绷带牢牢固定好，"}, {"index": 12, "text": "to apply pressure to the ankle wound to stop bleeding.", "start": 87.54658333333333, "voiceEnd": 91.40029166666666, "end": 95.25399999999999, "voiceSeconds": 3.8537083333333335, "pauseSeconds": 3.8537083333333335, "sourceStart": 48.203291666666665, "sourceEnd": 52.057, "zh": "给脚踝伤口加压，以止住流血。"}, {"index": 13, "text": "As for the burn,", "start": 95.25399999999999, "voiceEnd": 96.50491666666666, "end": 97.75583333333333, "voiceSeconds": 1.2509166666666667, "pauseSeconds": 1.2509166666666667, "sourceStart": 52.547, "sourceEnd": 53.797916666666666, "zh": "至于烧伤，"}, {"index": 14, "text": "she used scissors to remove his sleeve,", "start": 97.75583333333333, "voiceEnd": 100.464625, "end": 103.17341666666667, "voiceSeconds": 2.7087916666666665, "pauseSeconds": 2.7087916666666665, "sourceStart": 53.96791666666667, "sourceEnd": 56.67670833333333, "zh": "她用剪刀剪去他的袖子，"}, {"index": 15, "text": "poured a basin of cold water over the burn to cool it", "start": 103.17341666666667, "voiceEnd": 106.89054166666666, "end": 110.60766666666667, "voiceSeconds": 3.717125, "pauseSeconds": 3.717125, "sourceStart": 57.016708333333334, "sourceEnd": 60.73383333333334, "zh": "把一盆冷水倒在烧伤处使其降温，"}, {"index": 16, "text": "and put her hands on a damp blouse", "start": 110.60766666666667, "voiceEnd": 112.82537500000001, "end": 115.04308333333334, "voiceSeconds": 2.2177083333333334, "pauseSeconds": 2.2177083333333334, "sourceStart": 60.73383333333334, "sourceEnd": 62.951541666666664, "zh": "然后找到一件潮湿的女式衬衫，"}, {"index": 17, "text": "to cover his swollen tissue tightly.", "start": 115.04308333333334, "voiceEnd": 117.60054166666667, "end": 120.15800000000002, "voiceSeconds": 2.5574583333333334, "pauseSeconds": 2.5574583333333334, "sourceStart": 62.951541666666664, "sourceEnd": 65.509, "zh": "紧紧裹住他肿胀的组织。"}, {"index": 18, "text": "She also inspired his bravery to fight against the unbearable pain.", "start": 120.15800000000002, "voiceEnd": 125.64000000000001, "end": 131.122, "voiceSeconds": 5.482, "pauseSeconds": 5.482, "sourceStart": 65.949, "sourceEnd": 71.431, "zh": "她还鼓励他勇敢地忍受难以承受的疼痛。"}, {"index": 19, "text": "Her first aid made a vital difference in saving his life.", "start": 131.122, "voiceEnd": 135.77800000000002, "end": 140.43400000000003, "voiceSeconds": 4.656, "pauseSeconds": 4.656, "sourceStart": 71.901, "sourceEnd": 76.557, "zh": "她的急救对挽救他的生命起了重要作用。"}, {"index": 20, "text": "A ceremony was held to honour the nurse", "start": 140.43400000000003, "voiceEnd": 143.24400000000003, "end": 146.05400000000003, "voiceSeconds": 2.81, "pauseSeconds": 2.81, "sourceStart": 77.057, "sourceEnd": 79.867, "zh": "人们举行仪式，表彰这位护士，"}, {"index": 21, "text": "who overcame a variety of barriers to save the boy.", "start": 146.05400000000003, "voiceEnd": 149.98400000000004, "end": 153.91400000000004, "voiceSeconds": 3.93, "pauseSeconds": 3.93, "sourceStart": 79.867, "sourceEnd": 83.797, "zh": "她克服种种障碍，救助了这个男孩。"}], "duration": 153.91400000000004, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "11": {"day": 11, "title": "Abstract Art", "groups": [{"index": 0, "text": "Abstract Art.", "start": 0, "voiceEnd": 1.5346666666666666, "end": 3.0693333333333332, "voiceSeconds": 1.5346666666666666, "pauseSeconds": 1.5346666666666666, "sourceStart": 0.195, "sourceEnd": 1.7296666666666667, "zh": "抽象艺术。"}, {"index": 1, "text": "Abstract art used to be controversial.", "start": 3.0693333333333332, "voiceEnd": 6.323, "end": 9.576666666666666, "voiceSeconds": 3.2536666666666667, "pauseSeconds": 3.2536666666666667, "sourceStart": 2.2196666666666665, "sourceEnd": 5.473333333333334, "zh": "抽象艺术曾经颇有争议。"}, {"index": 2, "text": "On one hand,", "start": 9.576666666666666, "voiceEnd": 10.762541666666666, "end": 11.948416666666667, "voiceSeconds": 1.185875, "pauseSeconds": 1.185875, "sourceStart": 5.983333333333333, "sourceEnd": 7.169208333333334, "zh": "一方面，"}, {"index": 3, "text": "the artists stopped painting delicate figures", "start": 11.948416666666667, "voiceEnd": 15.236458333333333, "end": 18.5245, "voiceSeconds": 3.2880416666666665, "pauseSeconds": 3.2880416666666665, "sourceStart": 7.359208333333333, "sourceEnd": 10.64725, "zh": "艺术家不再描绘精细的人物形象，"}, {"index": 4, "text": "but attempted to adopt special techniques", "start": 18.5245, "voiceEnd": 21.372833333333332, "end": 24.221166666666665, "voiceSeconds": 2.848333333333333, "pauseSeconds": 2.848333333333333, "sourceStart": 10.64725, "sourceEnd": 13.495583333333334, "zh": "而是尝试采用特殊技法，"}, {"index": 5, "text": "to give people different visual impacts.", "start": 24.221166666666665, "voiceEnd": 27.080583333333333, "end": 29.939999999999998, "voiceSeconds": 2.8594166666666667, "pauseSeconds": 2.8594166666666667, "sourceStart": 13.495583333333334, "sourceEnd": 16.355, "zh": "给人带来不同的视觉冲击。"}, {"index": 6, "text": "On the other hand,", "start": 29.939999999999998, "voiceEnd": 31.183791666666664, "end": 32.42758333333333, "voiceSeconds": 1.2437916666666666, "pauseSeconds": 1.2437916666666666, "sourceStart": 16.845, "sourceEnd": 18.088791666666665, "zh": "另一方面，"}, {"index": 7, "text": "their works, including sculptures carved out of marble or fragile clay,", "start": 32.42758333333333, "voiceEnd": 37.891375, "end": 43.35516666666666, "voiceSeconds": 5.463791666666666, "pauseSeconds": 5.463791666666666, "sourceStart": 18.188791666666667, "sourceEnd": 23.652583333333332, "zh": "他们的作品，包括用大理石或易碎黏土雕成的雕塑，"}, {"index": 8, "text": "were all with a specific aim of showing feelings.", "start": 43.35516666666666, "voiceEnd": 46.84224999999999, "end": 50.32933333333333, "voiceSeconds": 3.4870833333333335, "pauseSeconds": 3.4870833333333335, "sourceStart": 23.932583333333334, "sourceEnd": 27.419666666666668, "zh": "都有一个明确目的：表达情感。"}, {"index": 9, "text": "Some conventional scholars who were allergic to abstract art", "start": 50.32933333333333, "voiceEnd": 54.610791666666664, "end": 58.89225, "voiceSeconds": 4.281458333333333, "pauseSeconds": 4.281458333333333, "sourceStart": 27.909666666666666, "sourceEnd": 32.191125, "zh": "一些反感抽象艺术的传统学者，"}, {"index": 10, "text": "said it was evidently ridiculous", "start": 58.89225, "voiceEnd": 61.46854166666667, "end": 64.04483333333333, "voiceSeconds": 2.5762916666666666, "pauseSeconds": 2.5762916666666666, "sourceStart": 32.191125, "sourceEnd": 34.76741666666667, "zh": "说这种艺术显然荒谬可笑，"}, {"index": 11, "text": "and neither art nor geometry.", "start": 64.04483333333333, "voiceEnd": 66.47041666666667, "end": 68.896, "voiceSeconds": 2.4255833333333334, "pauseSeconds": 2.4255833333333334, "sourceStart": 34.76741666666667, "sourceEnd": 37.193, "zh": "既算不上艺术，也算不上几何学。"}, {"index": 12, "text": "Their Traditional Art Committee predicted that it would soon disappear.", "start": 68.896, "voiceEnd": 73.932, "end": 78.968, "voiceSeconds": 5.036, "pauseSeconds": 5.036, "sourceStart": 37.643, "sourceEnd": 42.679, "zh": "他们的传统艺术委员会预言，它很快就会消失。"}, {"index": 13, "text": "But nowadays, abstract art has become part of the permanent possessions of contemporary civilization.", "start": 78.968, "voiceEnd": 86.88266666666667, "end": 94.79733333333334, "voiceSeconds": 7.914666666666666, "pauseSeconds": 7.914666666666666, "sourceStart": 43.149, "sourceEnd": 51.06366666666667, "zh": "然而如今，抽象艺术已经成为当代文明永久财富的一部分。"}, {"index": 14, "text": "Galleries along the Madison Avenue", "start": 94.79733333333334, "voiceEnd": 97.21091666666668, "end": 99.62450000000001, "voiceSeconds": 2.4135833333333334, "pauseSeconds": 2.4135833333333334, "sourceStart": 51.623666666666665, "sourceEnd": 54.03725, "zh": "麦迪逊大道沿线的画廊，"}, {"index": 15, "text": "give scores of superb exhibitions on typical abstract works,", "start": 99.62450000000001, "voiceEnd": 104.42041666666668, "end": 109.21633333333335, "voiceSeconds": 4.795916666666667, "pauseSeconds": 4.795916666666667, "sourceStart": 54.03725, "sourceEnd": 58.83316666666666, "zh": "举办了许多展示典型抽象作品的精彩展览，"}, {"index": 16, "text": "appealing to many who have a preference for abstract art.", "start": 109.21633333333335, "voiceEnd": 113.22866666666668, "end": 117.24100000000001, "voiceSeconds": 4.012333333333333, "pauseSeconds": 4.012333333333333, "sourceStart": 59.143166666666666, "sourceEnd": 63.1555, "zh": "吸引了许多偏爱抽象艺术的人。"}, {"index": 17, "text": "The Shadow of Egypt,", "start": 117.24100000000001, "voiceEnd": 118.92362500000002, "end": 120.60625000000002, "voiceSeconds": 1.682625, "pauseSeconds": 1.682625, "sourceStart": 63.6555, "sourceEnd": 65.338125, "zh": "“埃及之影”，"}, {"index": 18, "text": "a café in this district,", "start": 120.60625000000002, "voiceEnd": 122.55241666666669, "end": 124.49858333333336, "voiceSeconds": 1.9461666666666666, "pauseSeconds": 1.9461666666666666, "sourceStart": 65.428125, "sourceEnd": 67.37429166666666, "zh": "是这个街区的一家咖啡馆，"}, {"index": 19, "text": "has become the home to those aggressive abstract artists.", "start": 124.49858333333336, "voiceEnd": 128.77395833333335, "end": 133.04933333333335, "voiceSeconds": 4.275375, "pauseSeconds": 4.275375, "sourceStart": 67.65429166666667, "sourceEnd": 71.92966666666666, "zh": "它成了那些积极进取的抽象艺术家的聚集地。"}, {"index": 20, "text": "Consequently, it is not a coincidence", "start": 133.04933333333335, "voiceEnd": 136.24408333333335, "end": 139.43883333333335, "voiceSeconds": 3.19475, "pauseSeconds": 3.19475, "sourceStart": 72.45966666666666, "sourceEnd": 75.65441666666666, "zh": "因此，这并非偶然："}, {"index": 21, "text": "for you to meet one of these artists of great reputation", "start": 139.43883333333335, "voiceEnd": 143.32104166666667, "end": 147.20325000000003, "voiceSeconds": 3.8822083333333333, "pauseSeconds": 3.8822083333333333, "sourceStart": 75.65441666666666, "sourceEnd": 79.536625, "zh": "你可能遇见其中一位声名卓著的艺术家，"}, {"index": 22, "text": "in the flesh.", "start": 147.20325000000003, "voiceEnd": 148.2937916666667, "end": 149.38433333333336, "voiceSeconds": 1.0905416666666667, "pauseSeconds": 1.0905416666666667, "sourceStart": 79.536625, "sourceEnd": 80.62716666666667, "zh": "而且是见到本人。"}, {"index": 23, "text": "They are asked for signatures", "start": 149.38433333333336, "voiceEnd": 151.41670833333336, "end": 153.44908333333336, "voiceSeconds": 2.032375, "pauseSeconds": 2.032375, "sourceStart": 81.11716666666666, "sourceEnd": 83.14954166666666, "zh": "人们向他们索要签名，"}, {"index": 24, "text": "and given bunches of fragrant flowers", "start": 153.44908333333336, "voiceEnd": 156.13316666666668, "end": 158.81725000000003, "voiceSeconds": 2.684083333333333, "pauseSeconds": 2.684083333333333, "sourceStart": 83.14954166666666, "sourceEnd": 85.833625, "zh": "送给他们一束束芬芳的鲜花，"}, {"index": 25, "text": "plus they are given a great deal of praise", "start": 158.81725000000003, "voiceEnd": 161.3936666666667, "end": 163.97008333333338, "voiceSeconds": 2.576416666666667, "pauseSeconds": 2.576416666666667, "sourceStart": 85.833625, "sourceEnd": 88.41004166666667, "zh": "他们还获得了大量赞美，"}, {"index": 26, "text": "by their faithful fans.", "start": 163.97008333333338, "voiceEnd": 165.7690416666667, "end": 167.56800000000004, "voiceSeconds": 1.7989583333333334, "pauseSeconds": 1.7989583333333334, "sourceStart": 88.41004166666667, "sourceEnd": 90.209, "zh": "来自忠实的粉丝。"}], "duration": 167.56800000000004, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "12": {"day": 12, "title": "A Russian Poem", "groups": [{"index": 0, "text": "A Russian Poem.", "start": 0, "voiceEnd": 1.5103333333333333, "end": 3.0206666666666666, "voiceSeconds": 1.5103333333333333, "pauseSeconds": 1.5103333333333333, "sourceStart": 0.195, "sourceEnd": 1.7053333333333334, "zh": "俄国童谣。"}, {"index": 1, "text": "Since childhood, Anton had often recited poems,", "start": 3.0206666666666666, "voiceEnd": 7.214291666666666, "end": 11.407916666666667, "voiceSeconds": 4.193625, "pauseSeconds": 4.193625, "sourceStart": 2.1853333333333333, "sourceEnd": 6.378958333333333, "zh": "安东从小就经常朗诵诗歌，"}, {"index": 2, "text": "accompanied by pianists and violinists,", "start": 11.407916666666667, "voiceEnd": 14.506458333333335, "end": 17.605, "voiceSeconds": 3.0985416666666667, "pauseSeconds": 3.0985416666666667, "sourceStart": 6.558958333333333, "sourceEnd": 9.6575, "zh": "由钢琴家和小提琴家伴奏，"}, {"index": 3, "text": "at wedding ceremonies before brides and bridegrooms exchanged rings.", "start": 17.605, "voiceEnd": 22.6125, "end": 27.62, "voiceSeconds": 5.0075, "pauseSeconds": 5.0075, "sourceStart": 9.8975, "sourceEnd": 14.905, "zh": "在婚礼上，在新郎新娘交换戒指之前。"}, {"index": 4, "text": "Gradually, he found writing poems the most appropriate way", "start": 27.62, "voiceEnd": 32.15604166666667, "end": 36.692083333333336, "voiceSeconds": 4.536041666666667, "pauseSeconds": 4.536041666666667, "sourceStart": 15.395, "sourceEnd": 19.931041666666665, "zh": "渐渐地，他发现写诗是最合适的方式，"}, {"index": 5, "text": "to convey his joy and sorrow.", "start": 36.692083333333336, "voiceEnd": 39.122375000000005, "end": 41.55266666666667, "voiceSeconds": 2.4302916666666667, "pauseSeconds": 2.4302916666666667, "sourceStart": 19.931041666666665, "sourceEnd": 22.361333333333334, "zh": "来传达自己的喜悦与悲伤。"}, {"index": 6, "text": "When his poem Contradictory Blank won him a national championship", "start": 41.55266666666667, "voiceEnd": 46.419875, "end": 51.287083333333335, "voiceSeconds": 4.867208333333333, "pauseSeconds": 4.867208333333333, "sourceStart": 22.831333333333333, "sourceEnd": 27.698541666666667, "zh": "当他的诗作《矛盾的空白》为他赢得全国冠军，"}, {"index": 7, "text": "and a scholarship to the Moscow University from a sponsor,", "start": 51.287083333333335, "voiceEnd": 55.26495833333333, "end": 59.24283333333334, "voiceSeconds": 3.977875, "pauseSeconds": 3.977875, "sourceStart": 27.698541666666667, "sourceEnd": 31.676416666666668, "zh": "并得到赞助人提供的莫斯科大学奖学金时，"}, {"index": 8, "text": "he was just an unknown librarian.", "start": 59.24283333333334, "voiceEnd": 61.76975, "end": 64.29666666666667, "voiceSeconds": 2.5269166666666667, "pauseSeconds": 2.5269166666666667, "sourceStart": 32.00641666666667, "sourceEnd": 34.53333333333333, "zh": "他还只是个默默无闻的图书管理员。"}, {"index": 9, "text": "After getting his diploma,", "start": 64.29666666666667, "voiceEnd": 66.29395833333334, "end": 68.29125, "voiceSeconds": 1.9972916666666667, "pauseSeconds": 1.9972916666666667, "sourceStart": 35.03333333333333, "sourceEnd": 37.030625, "zh": "获得文凭之后，"}, {"index": 10, "text": "he devoted his life to writing poems.", "start": 68.29125, "voiceEnd": 71.48995833333333, "end": 74.68866666666668, "voiceSeconds": 3.1987083333333333, "pauseSeconds": 3.1987083333333333, "sourceStart": 37.290625, "sourceEnd": 40.489333333333335, "zh": "他把一生奉献给了诗歌创作。"}, {"index": 11, "text": "Using concrete but flexible language and the minimum of words is his style.", "start": 74.68866666666668, "voiceEnd": 80.77033333333334, "end": 86.852, "voiceSeconds": 6.081666666666667, "pauseSeconds": 6.081666666666667, "sourceStart": 40.97933333333334, "sourceEnd": 47.061, "zh": "使用具体而灵活的语言、尽可能少的词，是他的风格。"}, {"index": 12, "text": "He tried out different patterns and preferred nursery rhyme in particular.", "start": 86.852, "voiceEnd": 92.15033333333334, "end": 97.44866666666667, "voiceSeconds": 5.298333333333333, "pauseSeconds": 5.298333333333333, "sourceStart": 47.551, "sourceEnd": 52.849333333333334, "zh": "他尝试不同的形式，尤其喜欢童谣。"}, {"index": 13, "text": "The following is a translation of one of his works", "start": 97.44866666666667, "voiceEnd": 100.66616666666667, "end": 103.88366666666667, "voiceSeconds": 3.2175, "pauseSeconds": 3.2175, "sourceStart": 53.349333333333334, "sourceEnd": 56.566833333333335, "zh": "下面是他的一篇作品的译文，"}, {"index": 14, "text": "made up of 3 sections:", "start": 103.88366666666667, "voiceEnd": 105.79495833333334, "end": 107.70625, "voiceSeconds": 1.9112916666666666, "pauseSeconds": 1.9112916666666666, "sourceStart": 56.566833333333335, "sourceEnd": 58.478125, "zh": "由三节组成："}, {"index": 15, "text": "Little sparrow with heavy load,", "start": 107.70625, "voiceEnd": 109.95391666666666, "end": 112.20158333333333, "voiceSeconds": 2.2476666666666665, "pauseSeconds": 2.2476666666666665, "sourceStart": 58.788125, "sourceEnd": 61.03579166666667, "zh": "背着沉重负担的小麻雀，"}, {"index": 16, "text": "Ran out of energy and very cold;", "start": 112.20158333333333, "voiceEnd": 114.78304166666666, "end": 117.36449999999999, "voiceSeconds": 2.5814583333333334, "pauseSeconds": 2.5814583333333334, "sourceStart": 61.21579166666667, "sourceEnd": 63.79725, "zh": "耗尽了力气，又十分寒冷；"}, {"index": 17, "text": "No compass and all sweat salty,", "start": 117.36449999999999, "voiceEnd": 119.68016666666666, "end": 121.99583333333332, "voiceSeconds": 2.3156666666666665, "pauseSeconds": 2.3156666666666665, "sourceStart": 64.14725, "sourceEnd": 66.46291666666667, "zh": "没有指南针，流出的汗水咸咸的，"}, {"index": 18, "text": "Can you go through the endless darkness?", "start": 121.99583333333332, "voiceEnd": 124.50058333333332, "end": 127.00533333333333, "voiceSeconds": 2.50475, "pauseSeconds": 2.50475, "sourceStart": 66.72291666666666, "sourceEnd": 69.22766666666666, "zh": "你能穿过这无边的黑暗吗？"}, {"index": 19, "text": "Little balloon let out by the thread,", "start": 127.00533333333333, "voiceEnd": 129.48675, "end": 131.96816666666666, "voiceSeconds": 2.4814166666666666, "pauseSeconds": 2.4814166666666666, "sourceStart": 69.71766666666667, "sourceEnd": 72.19908333333333, "zh": "从线绳上放开的小气球，"}, {"index": 20, "text": "Flew over cottages and was very glad;", "start": 131.96816666666666, "voiceEnd": 134.88820833333332, "end": 137.80825, "voiceSeconds": 2.9200416666666666, "pauseSeconds": 2.9200416666666666, "sourceStart": 72.31908333333334, "sourceEnd": 75.239125, "zh": "飞过村舍，心里很欢喜；"}, {"index": 21, "text": "With warmth transformed from sunlight,", "start": 137.80825, "voiceEnd": 140.47604166666665, "end": 143.14383333333333, "voiceSeconds": 2.6677916666666666, "pauseSeconds": 2.6677916666666666, "sourceStart": 75.559125, "sourceEnd": 78.22691666666667, "zh": "带着阳光转化成的温暖，"}, {"index": 22, "text": "He said he could forever fly;", "start": 143.14383333333333, "voiceEnd": 145.14404166666668, "end": 147.14425, "voiceSeconds": 2.000208333333333, "pauseSeconds": 2.000208333333333, "sourceStart": 78.38691666666666, "sourceEnd": 80.387125, "zh": "它说自己能永远飞翔；"}, {"index": 23, "text": "Take it easy,", "start": 147.14425, "voiceEnd": 148.218125, "end": 149.292, "voiceSeconds": 1.073875, "pauseSeconds": 1.073875, "sourceStart": 80.707125, "sourceEnd": 81.781, "zh": "放轻松，"}, {"index": 24, "text": "little balloon; Don’t tease the sparrow with his wound;", "start": 149.292, "voiceEnd": 152.89591666666666, "end": 156.49983333333333, "voiceSeconds": 3.6039166666666667, "pauseSeconds": 3.6039166666666667, "sourceStart": 81.841, "sourceEnd": 85.44491666666667, "zh": "小气球，别取笑受了伤的小麻雀；"}, {"index": 25, "text": "On the bare branch and have a rest;", "start": 156.49983333333333, "voiceEnd": 158.69675, "end": 160.89366666666666, "voiceSeconds": 2.1969166666666666, "pauseSeconds": 2.1969166666666666, "sourceStart": 85.68491666666667, "sourceEnd": 87.88183333333333, "zh": "在光秃秃的树枝上歇一歇；"}, {"index": 26, "text": "This diamond heart will eventually get success.", "start": 160.89366666666666, "voiceEnd": 164.11483333333334, "end": 167.33599999999998, "voiceSeconds": 3.2211666666666665, "pauseSeconds": 3.2211666666666665, "sourceStart": 88.20183333333334, "sourceEnd": 91.423, "zh": "这颗钻石般坚强的心，终将获得成功。"}], "duration": 167.33599999999998, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "13": {"day": 13, "title": "Let’s Help Adolescents", "groups": [{"index": 0, "text": "Let’s Help Adolescents.", "start": 0, "voiceEnd": 2.1963333333333335, "end": 4.392666666666667, "voiceSeconds": 2.1963333333333335, "pauseSeconds": 2.1963333333333335, "sourceStart": 0.195, "sourceEnd": 2.3913333333333333, "zh": "让我们帮助青少年。"}, {"index": 1, "text": "Whether they are male or female,", "start": 4.392666666666667, "voiceEnd": 6.554083333333334, "end": 8.7155, "voiceSeconds": 2.1614166666666668, "pauseSeconds": 2.1614166666666668, "sourceStart": 2.941333333333333, "sourceEnd": 5.10275, "zh": "无论男生还是女生，"}, {"index": 2, "text": "adolescents feel like deciding on everything themselves in spite of parents’ instruction,", "start": 8.7155, "voiceEnd": 14.650375, "end": 20.585250000000002, "voiceSeconds": 5.934875, "pauseSeconds": 5.934875, "sourceStart": 5.26275, "sourceEnd": 11.197625, "zh": "青少年都想自己决定一切，不顾父母的教导，"}, {"index": 3, "text": "especially when they face problems like sex,", "start": 20.585250000000002, "voiceEnd": 23.743708333333334, "end": 26.90216666666667, "voiceSeconds": 3.1584583333333334, "pauseSeconds": 3.1584583333333334, "sourceStart": 11.517625, "sourceEnd": 14.676083333333333, "zh": "尤其当他们面对性方面的问题，"}, {"index": 4, "text": "mental stress, etc.,", "start": 26.90216666666667, "voiceEnd": 29.101833333333335, "end": 31.301500000000004, "voiceSeconds": 2.199666666666667, "pauseSeconds": 2.199666666666667, "sourceStart": 14.856083333333334, "sourceEnd": 17.05575, "zh": "精神压力等等，"}, {"index": 5, "text": "which make them feel ashamed and embarrassed.", "start": 31.301500000000004, "voiceEnd": 34.239583333333336, "end": 37.17766666666667, "voiceSeconds": 2.938083333333333, "pauseSeconds": 2.938083333333333, "sourceStart": 17.27575, "sourceEnd": 20.213833333333334, "zh": "这些问题会让他们羞愧、尴尬。"}, {"index": 6, "text": "Thus they often automatically get into trouble", "start": 37.17766666666667, "voiceEnd": 40.509375, "end": 43.84108333333333, "voiceSeconds": 3.3317083333333333, "pauseSeconds": 3.3317083333333333, "sourceStart": 20.733833333333333, "sourceEnd": 24.065541666666668, "zh": "所以，他们往往不自觉地陷入麻烦，"}, {"index": 7, "text": "due to their imperfect comprehension and judgement.", "start": 43.84108333333333, "voiceEnd": 47.65454166666666, "end": 51.467999999999996, "voiceSeconds": 3.813458333333333, "pauseSeconds": 3.813458333333333, "sourceStart": 24.065541666666668, "sourceEnd": 27.879, "zh": "因为理解力和判断力还不成熟。"}, {"index": 8, "text": "Some are addicted to cigarettes,", "start": 51.467999999999996, "voiceEnd": 53.815374999999996, "end": 56.162749999999996, "voiceSeconds": 2.347375, "pauseSeconds": 2.347375, "sourceStart": 28.399, "sourceEnd": 30.746375, "zh": "有些人沉迷于吸烟，"}, {"index": 9, "text": "only several packets of which will hurt their lungs", "start": 56.162749999999996, "voiceEnd": 59.47608333333333, "end": 62.78941666666666, "voiceSeconds": 3.3133333333333335, "pauseSeconds": 3.3133333333333335, "sourceStart": 30.986375, "sourceEnd": 34.299708333333335, "zh": "几包烟就会伤害他们的肺，"}, {"index": 10, "text": "and make them breathless quickly.", "start": 62.78941666666666, "voiceEnd": 64.91137499999999, "end": 67.03333333333333, "voiceSeconds": 2.121958333333333, "pauseSeconds": 2.121958333333333, "sourceStart": 34.299708333333335, "sourceEnd": 36.42166666666667, "zh": "使他们很快变得气喘吁吁。"}, {"index": 11, "text": "Others can’t quit drinking alcohol,", "start": 67.03333333333333, "voiceEnd": 69.63074999999999, "end": 72.22816666666667, "voiceSeconds": 2.5974166666666667, "pauseSeconds": 2.5974166666666667, "sourceStart": 36.861666666666665, "sourceEnd": 39.45908333333333, "zh": "另一些人戒不掉酒，"}, {"index": 12, "text": "whose harmful effects include causing young pregnant women to abort", "start": 72.22816666666667, "voiceEnd": 76.89354166666666, "end": 81.55891666666666, "voiceSeconds": 4.665375, "pauseSeconds": 4.665375, "sourceStart": 39.699083333333334, "sourceEnd": 44.36445833333333, "zh": "酒精的危害包括导致年轻孕妇流产，"}, {"index": 13, "text": "or give birth to abnormal babies.", "start": 81.55891666666666, "voiceEnd": 84.116125, "end": 86.67333333333333, "voiceSeconds": 2.5572083333333335, "pauseSeconds": 2.5572083333333335, "sourceStart": 44.36445833333333, "sourceEnd": 46.92166666666667, "zh": "或生下有健康异常的婴儿。"}, {"index": 14, "text": "The worst is drug abuse,", "start": 86.67333333333333, "voiceEnd": 88.61633333333333, "end": 90.55933333333333, "voiceSeconds": 1.943, "pauseSeconds": 1.943, "sourceStart": 47.42166666666667, "sourceEnd": 49.364666666666665, "zh": "最糟糕的是滥用毒品，"}, {"index": 15, "text": "for the withdrawal is tough once their bodies are accustomed to the drugs.", "start": 90.55933333333333, "voiceEnd": 95.526, "end": 100.49266666666666, "voiceSeconds": 4.966666666666667, "pauseSeconds": 4.966666666666667, "sourceStart": 49.62466666666667, "sourceEnd": 54.59133333333333, "zh": "因为身体一旦习惯了毒品，戒断就很难。"}, {"index": 16, "text": "Meanwhile, those who share needles bought from illegal chemists", "start": 100.49266666666666, "voiceEnd": 105.19616666666667, "end": 109.89966666666666, "voiceSeconds": 4.7035, "pauseSeconds": 4.7035, "sourceStart": 55.08133333333333, "sourceEnd": 59.78483333333333, "zh": "与此同时，那些共用从非法药商处买来的针头的人，"}, {"index": 17, "text": "are at great risk of being infected with desperate AIDS.", "start": 109.89966666666666, "voiceEnd": 113.98049999999999, "end": 118.06133333333332, "voiceSeconds": 4.0808333333333335, "pauseSeconds": 4.0808333333333335, "sourceStart": 59.78483333333333, "sourceEnd": 63.86566666666667, "zh": "面临很高的感染风险；原文将此表述为患上艾滋病。"}, {"index": 18, "text": "If so, neither injecting nor taking pills can guarantee their survival.", "start": 118.06133333333332, "voiceEnd": 123.87299999999999, "end": 129.68466666666666, "voiceSeconds": 5.8116666666666665, "pauseSeconds": 5.8116666666666665, "sourceStart": 64.36566666666667, "sourceEnd": 70.17733333333334, "zh": "如果这样，无论注射还是服药，都无法保证他们活下来。"}, {"index": 19, "text": "However, don’t be disappointed at or have prejudice against our children so easily.", "start": 129.68466666666666, "voiceEnd": 136.3
