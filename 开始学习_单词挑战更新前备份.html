9666666666665, "end": 143.10866666666666, "voiceSeconds": 6.712, "pauseSeconds": 6.712, "sourceStart": 70.68733333333333, "sourceEnd": 77.39933333333333, "zh": "不过，不要轻易对我们的孩子失望，或对他们抱有偏见。"}, {"index": 20, "text": "After all, being awkward is an appendix of youth.", "start": 143.10866666666666, "voiceEnd": 147.361, "end": 151.61333333333334, "voiceSeconds": 4.2523333333333335, "pauseSeconds": 4.2523333333333335, "sourceStart": 77.82933333333334, "sourceEnd": 82.08166666666666, "zh": "毕竟，笨拙不成熟也伴随着青春期。"}, {"index": 21, "text": "As long as we strengthen communication with them", "start": 151.61333333333334, "voiceEnd": 154.77508333333336, "end": 157.93683333333334, "voiceSeconds": 3.16175, "pauseSeconds": 3.16175, "sourceStart": 82.57166666666667, "sourceEnd": 85.73341666666667, "zh": "只要我们加强与他们的沟通，"}, {"index": 22, "text": "instead of only banning this or banning that,", "start": 157.93683333333334, "voiceEnd": 160.85975000000002, "end": 163.78266666666667, "voiceSeconds": 2.9229166666666666, "pauseSeconds": 2.9229166666666666, "sourceStart": 85.73341666666667, "sourceEnd": 88.65633333333334, "zh": "而不只是一味禁止这个、禁止那个，"}, {"index": 23, "text": "we will surely help them avoid anything unfit.", "start": 163.78266666666667, "voiceEnd": 167.20733333333334, "end": 170.632, "voiceSeconds": 3.4246666666666665, "pauseSeconds": 3.4246666666666665, "sourceStart": 88.99633333333334, "sourceEnd": 92.421, "zh": "就一定能帮助他们远离不适合他们的事物。"}], "duration": 170.632, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "14": {"day": 14, "title": "Refresh Our Environment", "groups": [{"index": 0, "text": "Refresh Our Environment.", "start": 0, "voiceEnd": 2.2243333333333335, "end": 4.448666666666667, "voiceSeconds": 2.2243333333333335, "pauseSeconds": 2.2243333333333335, "sourceStart": 0.195, "sourceEnd": 2.4193333333333333, "zh": "改善我们的环境。"}, {"index": 1, "text": "As the director stated on behalf of his research group,", "start": 4.448666666666667, "voiceEnd": 8.477416666666667, "end": 12.506166666666665, "voiceSeconds": 4.02875, "pauseSeconds": 4.02875, "sourceStart": 2.949333333333333, "sourceEnd": 6.978083333333333, "zh": "正如负责人代表研究小组所说，"}, {"index": 2, "text": "the data of this graph makes a clear presentation", "start": 12.506166666666665, "voiceEnd": 16.093999999999998, "end": 19.68183333333333, "voiceSeconds": 3.587833333333333, "pauseSeconds": 3.587833333333333, "sourceStart": 7.328083333333334, "sourceEnd": 10.915916666666666, "zh": "这幅图的数据清楚地展示了，"}, {"index": 3, "text": "of the future environmental tendency.", "start": 19.68183333333333, "voiceEnd": 22.452916666666663, "end": 25.223999999999997, "voiceSeconds": 2.7710833333333333, "pauseSeconds": 2.7710833333333333, "sourceStart": 10.915916666666666, "sourceEnd": 13.687, "zh": "未来环境变化的趋势。"}, {"index": 4, "text": "On the one hand,", "start": 25.223999999999997, "voiceEnd": 26.41470833333333, "end": 27.605416666666663, "voiceSeconds": 1.1907083333333333, "pauseSeconds": 1.1907083333333333, "sourceStart": 14.147, "sourceEnd": 15.337708333333333, "zh": "一方面，"}, {"index": 5, "text": "the quantity of fuel keeps on decreasing by 9% per year", "start": 27.605416666666663, "voiceEnd": 32.355999999999995, "end": 37.10658333333333, "voiceSeconds": 4.750583333333333, "pauseSeconds": 4.750583333333333, "sourceStart": 15.567708333333334, "sourceEnd": 20.318291666666667, "zh": "燃料数量正以每年9%的速度持续减少，"}, {"index": 6, "text": "while the growth of a wide range of pollution has been a global trend.", "start": 37.10658333333333, "voiceEnd": 41.653958333333335, "end": 46.20133333333333, "voiceSeconds": 4.547375, "pauseSeconds": 4.547375, "sourceStart": 20.318291666666667, "sourceEnd": 24.865666666666666, "zh": "而多种污染的加剧已经成为全球趋势。"}, {"index": 7, "text": "On the other hand,", "start": 46.20133333333333, "voiceEnd": 47.437124999999995, "end": 48.672916666666666, "voiceSeconds": 1.2357916666666666, "pauseSeconds": 1.2357916666666666, "sourceStart": 25.365666666666666, "sourceEnd": 26.601458333333333, "zh": "另一方面，"}, {"index": 8, "text": "the mild but steady rise in the average temperature", "start": 48.672916666666666, "voiceEnd": 52.28775, "end": 55.90258333333333, "voiceSeconds": 3.6148333333333333, "pauseSeconds": 3.6148333333333333, "sourceStart": 26.851458333333333, "sourceEnd": 30.466291666666667, "zh": "平均气温缓慢而持续地上升，"}, {"index": 9, "text": "is resulting in catastrophes like widespread floods.", "start": 55.90258333333333, "voiceEnd": 59.90495833333333, "end": 63.907333333333334, "voiceSeconds": 4.002375, "pauseSeconds": 4.002375, "sourceStart": 30.511291666666665, "sourceEnd": 34.513666666666666, "zh": "正导致大范围洪灾等灾难。"}, {"index": 10, "text": "Without disagreement, they subscribe to the view", "start": 63.907333333333334, "voiceEnd": 67.59470833333333, "end": 71.28208333333333, "voiceSeconds": 3.687375, "pauseSeconds": 3.687375, "sourceStart": 35.013666666666666, "sourceEnd": 38.70104166666667, "zh": "他们一致赞同这样的看法："}, {"index": 11, "text": "that it is humans’ existence and their randomly consuming energy", "start": 71.28208333333333, "voiceEnd": 75.89091666666667, "end": 80.49975, "voiceSeconds": 4.608833333333333, "pauseSeconds": 4.608833333333333, "sourceStart": 38.70104166666667, "sourceEnd": 43.309875, "zh": "正是人类的存在及其随意消耗能源的行为，"}, {"index": 12, "text": "that result in this phenomenon.", "start": 80.49975, "voiceEnd": 82.540875, "end": 84.58200000000001, "voiceSeconds": 2.041125, "pauseSeconds": 2.041125, "sourceStart": 43.309875, "sourceEnd": 45.351, "zh": "造成了这一现象。"}, {"index": 13, "text": "Many people have a commitment", "start": 84.58200000000001, "voiceEnd": 86.79175000000001, "end": 89.00150000000001, "voiceSeconds": 2.20975, "pauseSeconds": 2.20975, "sourceStart": 45.841, "sourceEnd": 48.05075, "zh": "许多人坚信，"}, {"index": 14, "text": "that developing nuclear power or energy from outer space", "start": 89.00150000000001, "voiceEnd": 93.30229166666668, "end": 97.60308333333334, "voiceSeconds": 4.300791666666667, "pauseSeconds": 4.300791666666667, "sourceStart": 48.05075, "sourceEnd": 52.35154166666667, "zh": "开发核能或来自外太空的能源，"}, {"index": 15, "text": "will stop bad consequences coming about.", "start": 97.60308333333334, "voiceEnd": 100.66920833333334, "end": 103.73533333333334, "voiceSeconds": 3.066125, "pauseSeconds": 3.066125, "sourceStart": 52.35154166666667, "sourceEnd": 55.41766666666667, "zh": "能够阻止不良后果出现。"}, {"index": 16, "text": "However, scientists and educators are opposed to this view", "start": 103.73533333333334, "voiceEnd": 108.53583333333334, "end": 113.33633333333334, "voiceSeconds": 4.8005, "pauseSeconds": 4.8005, "sourceStart": 55.91766666666667, "sourceEnd": 60.71816666666667, "zh": "然而，科学家和教育工作者反对这种观点，"}, {"index": 17, "text": "even if our needs may be met on the whole.", "start": 113.33633333333334, "voiceEnd": 116.27783333333335, "end": 119.21933333333334, "voiceSeconds": 2.9415, "pauseSeconds": 2.9415, "sourceStart": 60.71816666666667, "sourceEnd": 63.659666666666666, "zh": "即使这些方式总体上可能满足我们的需求。"}, {"index": 18, "text": "They tend to advocate refreshing our circumstances", "start": 119.21933333333334, "voiceEnd": 123.26616666666668, "end": 127.313, "voiceSeconds": 4.046833333333334, "pauseSeconds": 4.046833333333334, "sourceStart": 64.16966666666667, "sourceEnd": 68.2165, "zh": "他们倾向于主张改善我们的环境，"}, {"index": 19, "text": "by saving energy and recycling waste.", "start": 127.313, "voiceEnd": 130.7215, "end": 134.13, "voiceSeconds": 3.4085, "pauseSeconds": 3.4085, "sourceStart": 68.2165, "sourceEnd": 71.625, "zh": "通过节约能源和回收废物来实现。"}, {"index": 20, "text": "It is suggested that we use energy-saving appliances such as electrical motors,", "start": 134.13, "voiceEnd": 139.98845833333334, "end": 145.84691666666666, "voiceSeconds": 5.858458333333333, "pauseSeconds": 5.858458333333333, "sourceStart": 72.145, "sourceEnd": 78.00345833333333, "zh": "有人建议使用节能设备，例如电动机，"}, {"index": 21, "text": "microwaves and so on", "start": 145.84691666666666, "voiceEnd": 147.89308333333332, "end": 149.93925, "voiceSeconds": 2.0461666666666667, "pauseSeconds": 2.0461666666666667, "sourceStart": 78.30345833333334, "sourceEnd": 80.349625, "zh": "微波炉等等，"}, {"index": 22, "text": "and not be casual about little things like recycling a can.", "start": 149.93925, "voiceEnd": 154.306625, "end": 158.67399999999998, "voiceSeconds": 4.367375, "pauseSeconds": 4.367375, "sourceStart": 80.349625, "sourceEnd": 84.717, "zh": "也不要忽视回收一个易拉罐这样的小事。"}, {"index": 23, "text": "So please glance around and see what you can do.", "start": 158.67399999999998, "voiceEnd": 162.39866666666666, "end": 166.1233333333333, "voiceSeconds": 3.724666666666667, "pauseSeconds": 3.724666666666667, "sourceStart": 85.197, "sourceEnd": 88.92166666666667, "zh": "所以，请看看周围，想想自己能做些什么。"}, {"index": 24, "text": "So long as everybody makes a contribution,", "start": 166.1233333333333, "voiceEnd": 169.30249999999998, "end": 172.48166666666663, "voiceSeconds": 3.1791666666666667, "pauseSeconds": 3.1791666666666667, "sourceStart": 89.41166666666666, "sourceEnd": 92.59083333333334, "zh": "只要每个人都贡献一份力量，"}, {"index": 25, "text": "we will not have to put up with this problem anymore.", "start": 172.48166666666663, "voiceEnd": 175.7958333333333, "end": 179.10999999999996, "voiceSeconds": 3.3141666666666665, "pauseSeconds": 3.3141666666666665, "sourceStart": 92.87083333333334, "sourceEnd": 96.185, "zh": "我们就不必再忍受这个问题了。"}], "duration": 179.10999999999996, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "15": {"day": 15, "title": "A Volcano Eruption", "groups": [{"index": 0, "text": "A Volcano Eruption.", "start": 0, "voiceEnd": 2.090333333333333, "end": 4.180666666666666, "voiceSeconds": 2.090333333333333, "pauseSeconds": 2.090333333333333, "sourceStart": 0.195, "sourceEnd": 2.2853333333333334, "zh": "火山喷发。"}, {"index": 1, "text": "As the best candidate,", "start": 4.180666666666666, "voiceEnd": 5.817458333333333, "end": 7.45425, "voiceSeconds": 1.6367916666666666, "pauseSeconds": 1.6367916666666666, "sourceStart": 2.7953333333333332, "sourceEnd": 4.432125, "zh": "作为最合适的人选，"}, {"index": 2, "text": "I was appointed to collect and evaluate information", "start": 7.45425, "voiceEnd": 11.012083333333333, "end": 14.569916666666668, "voiceSeconds": 3.5578333333333334, "pauseSeconds": 3.5578333333333334, "sourceStart": 4.592125, "sourceEnd": 8.149958333333334, "zh": "我被指派收集并评估信息，"}, {"index": 3, "text": "for a database about diverse natural disasters,", "start": 14.569916666666668, "voiceEnd": 18.34691666666667, "end": 22.123916666666666, "voiceSeconds": 3.777, "pauseSeconds": 3.777, "sourceStart": 8.149958333333334, "sourceEnd": 11.926958333333333, "zh": "用于一个涵盖各种自然灾害的数据库，"}, {"index": 4, "text": "such as hurricanes,", "start": 22.123916666666666, "voiceEnd": 23.55858333333333, "end": 24.99325, "voiceSeconds": 1.4346666666666668, "pauseSeconds": 1.4346666666666668, "sourceStart": 12.196958333333333, "sourceEnd": 13.631625, "zh": "例如飓风，"}, {"index": 5, "text": "typhoons or thunderstorms.", "start": 24.99325, "voiceEnd": 27.386958333333332, "end": 29.78066666666667, "voiceSeconds": 2.3937083333333335, "pauseSeconds": 2.3937083333333335, "sourceStart": 13.841625, "sourceEnd": 16.235333333333333, "zh": "台风或雷暴。"}, {"index": 6, "text": "Sometimes I did this by giving out questionnaires", "start": 29.78066666666667, "voiceEnd": 33.38995833333333, "end": 36.99925, "voiceSeconds": 3.6092916666666666, "pauseSeconds": 3.6092916666666666, "sourceStart": 16.72533333333333, "sourceEnd": 20.334625, "zh": "有时，我通过发放调查问卷来收集信息，"}, {"index": 7, "text": "to those who went through them.", "start": 36.99925, "voiceEnd": 38.87562500000001, "end": 40.752, "voiceSeconds": 1.876375, "pauseSeconds": 1.876375, "sourceStart": 20.334625, "sourceEnd": 22.211, "zh": "对象是经历过这些灾害的人。"}, {"index": 8, "text": "But sometimes I had to go through actual disasters myself.", "start": 40.752, "voiceEnd": 45.55083333333334, "end": 50.34966666666667, "voiceSeconds": 4.7988333333333335, "pauseSeconds": 4.7988333333333335, "sourceStart": 22.731, "sourceEnd": 27.529833333333332, "zh": "但有时，我也不得不亲身经历真正的灾难。"}, {"index": 9, "text": "The Musaki Volcano was one of them.", "start": 50.34966666666667, "voiceEnd": 53.41483333333334, "end": 56.480000000000004, "voiceSeconds": 3.065166666666667, "pauseSeconds": 3.065166666666667, "sourceStart": 28.039833333333334, "sourceEnd": 31.105, "zh": "穆萨基火山事件就是其中一次。"}, {"index": 10, "text": "At that time,", "start": 56.480000000000004, "voiceEnd": 57.723000000000006, "end": 58.966, "voiceSeconds": 1.243, "pauseSeconds": 1.243, "sourceStart": 31.605, "sourceEnd": 32.848, "zh": "当时，"}, {"index": 11, "text": "I lived in a bungalow alongside the volcano with a novelist,", "start": 58.966, "voiceEnd": 63.45525, "end": 67.9445, "voiceSeconds": 4.48925, "pauseSeconds": 4.48925, "sourceStart": 32.978, "sourceEnd": 37.46725, "zh": "我和一位小说家住在火山旁的一栋平房里，"}, {"index": 12, "text": "who came for the appreciation of its eruption.", "start": 67.9445, "voiceEnd": 71.09425, "end": 74.244, "voiceSeconds": 3.14975, "pauseSeconds": 3.14975, "sourceStart": 37.74725, "sourceEnd": 40.897, "zh": "他是为了观赏火山喷发而来的。"}, {"index": 13, "text": "One day, when I was drawing diagrams on the balcony and he was bathing inside,", "start": 74.244, "voiceEnd": 80.11116666666666, "end": 85.97833333333334, "voiceSeconds": 5.867166666666667, "pauseSeconds": 5.867166666666667, "sourceStart": 41.397, "sourceEnd": 47.26416666666667, "zh": "一天，我在阳台画图，他在屋里洗澡，"}, {"index": 14, "text": "the volcano erupted unexpectedly.", "start": 85.97833333333334, "voiceEnd": 88.94916666666667, "end": 91.92, "voiceSeconds": 2.970833333333333, "pauseSeconds": 2.970833333333333, "sourceStart": 47.634166666666665, "sourceEnd": 50.605, "zh": "火山突然喷发了。"}, {"index": 15, "text": "The ash and lava fountains shooting high in the sky", "start": 91.92, "voiceEnd": 95.73425, "end": 99.5485, "voiceSeconds": 3.81425, "pauseSeconds": 3.81425, "sourceStart": 51.055, "sourceEnd": 54.86925, "zh": "喷向高空的火山灰和熔岩喷泉，"}, {"index": 16, "text": "varied from 50 to 100 meters in height.", "start": 99.5485, "voiceEnd": 103.32258333333334, "end": 107.09666666666666, "voiceSeconds": 3.7740833333333335, "pauseSeconds": 3.7740833333333335, "sourceStart": 54.86925, "sourceEnd": 58.64333333333333, "zh": "高度在50到100米之间不等。"}, {"index": 17, "text": "It was absolutely fantastic!", "start": 107.09666666666666, "voiceEnd": 109.88266666666667, "end": 112.66866666666667, "voiceSeconds": 2.786, "pauseSeconds": 2.786, "sourceStart": 59.13333333333333, "sourceEnd": 61.919333333333334, "zh": "那景象真是令人惊叹！"}, {"index": 18, "text": "I even noticed a rainbow appear in the fog", "start": 112.66866666666667, "voiceEnd": 115.95220833333333, "end": 119.23575, "voiceSeconds": 3.283541666666667, "pauseSeconds": 3.283541666666667, "sourceStart": 62.349333333333334, "sourceEnd": 65.632875, "zh": "我甚至看见雾中出现了一道彩虹，"}, {"index": 19, "text": "caused by a heat wave.", "start": 119.23575, "voiceEnd": 121.06420833333333, "end": 122.89266666666666, "voiceSeconds": 1.8284583333333333, "pauseSeconds": 1.8284583333333333, "sourceStart": 65.632875, "sourceEnd": 67.46133333333333, "zh": "那片雾是热浪形成的。"}, {"index": 20, "text": "But, glancing through our surroundings,", "start": 122.89266666666666, "voiceEnd": 125.78420833333332, "end": 128.67575, "voiceSeconds": 2.8915416666666665, "pauseSeconds": 2.8915416666666665, "sourceStart": 67.93133333333333, "sourceEnd": 70.822875, "zh": "但扫视周围之后，"}, {"index": 21, "text": "I foresaw the potential danger and found no guarantee of our safety.", "start": 128.67575, "voiceEnd": 133.88820833333332, "end": 139.10066666666665, "voiceSeconds": 5.212458333333333, "pauseSeconds": 5.212458333333333, "sourceStart": 71.052875, "sourceEnd": 76.26533333333333, "zh": "我预感到潜在的危险，觉得我们的安全没有保障。"}, {"index": 22, "text": "The uncomfortable gas almost made us unconscious.", "start": 139.10066666666665, "voiceEnd": 143.35266666666666, "end": 147.60466666666665, "voiceSeconds": 4.252, "pauseSeconds": 4.252, "sourceStart": 76.73533333333333, "sourceEnd": 80.98733333333334, "zh": "令人不适的气体几乎让我们失去知觉。"}, {"index": 23, "text": "Sweat began to drip as we grew anxious.", "start": 147.60466666666665, "voiceEnd": 151.01666666666665, "end": 154.42866666666666, "voiceSeconds": 3.412, "pauseSeconds": 3.412, "sourceStart": 81.47733333333333, "sourceEnd": 84.88933333333334, "zh": "随着焦虑加剧，汗水开始滴落。"}, {"index": 24, "text": "Managing to stop panicking and trembling,", "start": 154.42866666666666, "voiceEnd": 157.35979166666667, "end": 160.29091666666665, "voiceSeconds": 2.931125, "pauseSeconds": 2.931125, "sourceStart": 85.37933333333334, "sourceEnd": 88.31045833333333, "zh": "我们努力让自己不再惊慌、发抖，"}, {"index": 25, "text": "we quickly put on our protective suits,", "start": 160.29091666666665, "voiceEnd": 162.96712499999998, "end": 165.64333333333332, "voiceSeconds": 2.6762083333333333, "pauseSeconds": 2.6762083333333333, "sourceStart": 88.53045833333333, "sourceEnd": 91.20666666666666, "zh": "迅速穿上防护服，"}, {"index": 26, "text": "helmets and boots and eventually made our way to a safe place.", "start": 165.64333333333332, "voiceEnd": 170.41366666666664, "end": 175.18399999999997, "voiceSeconds": 4.770333333333333, "pauseSeconds": 4.770333333333333, "sourceStart": 91.43666666666667, "sourceEnd": 96.207, "zh": "戴好头盔、穿好靴子，最终来到安全的地方。"}, {"index": 27, "text": "How lucky we were", "start": 175.18399999999997, "voiceEnd": 176.5277083333333, "end": 177.87141666666665, "voiceSeconds": 1.3437083333333333, "pauseSeconds": 1.3437083333333333, "sourceStart": 96.707, "sourceEnd": 98.05070833333333, "zh": "我们是多么幸运，"}, {"index": 28, "text": "even though my precious equipment and documents were all burnt to the ground!", "start": 177.87141666666665, "voiceEnd": 183.2077083333333, "end": 188.54399999999998, "voiceSeconds": 5.336291666666667, "pauseSeconds": 5.336291666666667, "sourceStart": 98.05070833333333, "sourceEnd": 103.387, "zh": "尽管我珍贵的设备和文件全被烧毁了！"}], "duration": 188.54399999999998, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "16": {"day": 16, "title": "Defeat Disability", "groups": [{"index": 0, "text": "Defeat Disability.", "start": 0, "voiceEnd": 1.948, "end": 3.896, "voiceSeconds": 1.948, "pauseSeconds": 1.948, "sourceStart": 0.195, "sourceEnd": 2.143, "zh": "战胜残障带来的困难。"}, {"index": 1, "text": "Yang’s ambition was to get an architect’s certificate or become a bowling master.", "start": 3.896, "voiceEnd": 10.050333333333334, "end": 16.204666666666668, "voiceSeconds": 6.154333333333334, "pauseSeconds": 6.154333333333334, "sourceStart": 2.613, "sourceEnd": 8.767333333333333, "zh": "杨的志向是取得建筑师资格证，或成为保龄球高手。"}, {"index": 2, "text": "But when he was conducting experiments with a microscope in the basement,", "start": 16.204666666666668, "voiceEnd": 20.843041666666668, "end": 25.481416666666668, "voiceSeconds": 4.638375, "pauseSeconds": 4.638375, "sourceStart": 9.267333333333333, "sourceEnd": 13.905708333333333, "zh": "但当他在地下室里用显微镜做实验时，"}, {"index": 3, "text": "a tank on the bench exploded,", "start": 25.481416666666668, "voiceEnd": 27.69225, "end": 29.903083333333335, "voiceSeconds": 2.2108333333333334, "pauseSeconds": 2.2108333333333334, "sourceStart": 14.225708333333333, "sourceEnd": 16.436541666666667, "zh": "工作台上的一个罐子爆炸了，"}, {"index": 4, "text": "sending him flying outwards through the exit.", "start": 29.903083333333335, "voiceEnd": 33.094375, "end": 36.28566666666667, "voiceSeconds": 3.191291666666667, "pauseSeconds": 3.191291666666667, "sourceStart": 16.686541666666667, "sourceEnd": 19.877833333333335, "zh": "将他从出口炸飞了出去。"}, {"index": 5, "text": "He was out of breath", "start": 36.28566666666667, "voiceEnd": 37.66483333333334, "end": 39.044000000000004, "voiceSeconds": 1.3791666666666667, "pauseSeconds": 1.3791666666666667, "sourceStart": 20.387833333333333, "sourceEnd": 21.767, "zh": "他感到喘不过气来，"}, {"index": 6, "text": "while knowing he lost his eyesight", "start": 39.044000000000004, "voiceEnd": 41.40745833333334, "end": 43.77091666666667, "voiceSeconds": 2.3634583333333334, "pauseSeconds": 2.3634583333333334, "sourceStart": 21.767, "sourceEnd": 24.130458333333333, "zh": "因为得知自己失去了视力，"}, {"index": 7, "text": "as well as 70% of his hearing.", "start": 43.77091666666667, "voiceEnd": 46.47379166666667, "end": 49.17666666666667, "voiceSeconds": 2.702875, "pauseSeconds": 2.702875, "sourceStart": 24.130458333333333, "sourceEnd": 26.833333333333332, "zh": "以及70%的听力。"}, {"index": 8, "text": "In other words,", "start": 49.17666666666667, "voiceEnd": 50.395250000000004, "end": 51.61383333333334, "voiceSeconds": 1.2185833333333334, "pauseSeconds": 1.2185833333333334, "sourceStart": 27.333333333333332, "sourceEnd": 28.551916666666667, "zh": "换句话说，"}, {"index": 9, "text": "he was disabled.", "start": 51.61383333333334, "voiceEnd": 53.08958333333334, "end": 54.56533333333334, "voiceSeconds": 1.47575, "pauseSeconds": 1.47575, "sourceStart": 28.731916666666667, "sourceEnd": 30.207666666666668, "zh": "他成了残障人士。"}, {"index": 10, "text": "Feeling clumsy, he was annoyed at first though nobody made fun of him.", "start": 54.56533333333334, "voiceEnd": 59.96100000000001, "end": 65.35666666666668, "voiceSeconds": 5.395666666666667, "pauseSeconds": 5.395666666666667, "sourceStart": 30.707666666666668, "sourceEnd": 36.10333333333333, "zh": "起初他觉得自己笨拙，十分烦躁，尽管没人取笑他。"}, {"index": 11, "text": "He cut out going outdoors", "start": 65.35666666666668, "voiceEnd": 67.43133333333336, "end": 69.50600000000001, "voiceSeconds": 2.074666666666667, "pauseSeconds": 2.074666666666667, "sourceStart": 36.593333333333334, "sourceEnd": 38.668, "zh": "他不再外出，"}, {"index": 12, "text": "and just sat around at home", "start": 69.50600000000001, "voiceEnd": 71.43795833333334, "end": 73.36991666666668, "voiceSeconds": 1.9319583333333334, "pauseSeconds": 1.9319583333333334, "sourceStart": 38.668, "sourceEnd": 40.59995833333333, "zh": "只是整天在家闲坐，"}, {"index": 13, "text": "talking to his parrot or tortoise silently.", "start": 73.36991666666668, "voiceEnd": 76.58362500000001, "end": 79.79733333333336, "voiceSeconds": 3.2137083333333334, "pauseSeconds": 3.2137083333333334, "sourceStart": 40.59995833333333, "sourceEnd": 43.81366666666667, "zh": "默默地对着鹦鹉或乌龟说话。"}, {"index": 14, "text": "His sister resigned to help him in many ways.", "start": 79.79733333333336, "voiceEnd": 83.42866666666669, "end": 87.06000000000002, "voiceSeconds": 3.6313333333333335, "pauseSeconds": 3.6313333333333335, "sourceStart": 44.273666666666664, "sourceEnd": 47.905, "zh": "姐姐辞了职，从多方面帮助他。"}, {"index": 15, "text": "Her assistance and encouragement were so beneficial to his psychology", "start": 87.06000000000002, "voiceEnd": 92.20262500000001, "end": 97.34525000000002, "voiceSeconds": 5.142625, "pauseSeconds": 5.142625, "sourceStart": 48.405, "sourceEnd": 53.547625, "zh": "她的帮助和鼓励对他的心理状态十分有益，"}, {"index": 16, "text": "that he adapted to his disability soon", "start": 97.34525000000002, "voiceEnd": 100.28037500000002, "end": 103.21550000000002, "voiceSeconds": 2.935125, "pauseSeconds": 2.935125, "sourceStart": 53.547625, "sourceEnd": 56.48275, "zh": "以至于他很快适应了自己的残障状况，"}, {"index": 17, "text": "and became outgoing again.", "start": 103.21550000000002, "voiceEnd": 105.24575000000002, "end": 107.27600000000002, "voiceSeconds": 2.03025, "pauseSeconds": 2.03025, "sourceStart": 56.48275, "sourceEnd": 58.513, "zh": "又变得开朗起来。"}, {"index": 18, "text": "In a college accessible to him,", "start": 107.27600000000002, "voiceEnd": 109.62383333333335, "end": 111.97166666666669, "voiceSeconds": 2.3478333333333334, "pauseSeconds": 2.3478333333333334, "sourceStart": 58.993, "sourceEnd": 61.340833333333336, "zh": "在一所方便他就读的大学里，"}, {"index": 19, "text": "he studied politics and literature.", "start": 111.97166666666669, "voiceEnd": 114.69783333333336, "end": 117.42400000000002, "voiceSeconds": 2.726166666666667, "pauseSeconds": 2.726166666666667, "sourceStart": 61.600833333333334, "sourceEnd": 64.327, "zh": "他学习政治和文学。"}, {"index": 20, "text": "He always sat in the front row near the entry", "start": 117.42400000000002, "voiceEnd": 120.46012500000002, "end": 123.49625000000002, "voiceSeconds": 3.036125, "pauseSeconds": 3.036125, "sourceStart": 64.797, "sourceEnd": 67.833125, "zh": "他总坐在靠近入口的前排，"}, {"index": 21, "text": "without any absence and,", "start": 123.49625000000002, "voiceEnd": 125.61870833333334, "end": 127.74116666666669, "voiceSeconds": 2.1224583333333333, "pauseSeconds": 2.1224583333333333, "sourceStart": 67.833125, "sourceEnd": 69.95558333333334, "zh": "从不缺席，而且，"}, {"index": 22, "text": "with the help of his handy laptop,", "start": 127.74116666666669, "voiceEnd": 130.0235416666667, "end": 132.3059166666667, "voiceSeconds": 2.282375, "pauseSeconds": 2.282375, "sourceStart": 70.21558333333333, "sourceEnd": 72.49795833333333, "zh": "借助方便使用的笔记本电脑，"}, {"index": 23, "text": "he studied well by means of dictation.", "start": 132.3059166666667, "voiceEnd": 135.16362500000002, "end": 138.02133333333336, "voiceSeconds": 2.8577083333333335, "pauseSeconds": 2.8577083333333335, "sourceStart": 72.75795833333333, "sourceEnd": 75.61566666666667, "zh": "他通过听写学习，学得很好。"}, {"index": 24, "text": "His thesis, Abolishing Slavery,", "start": 138.02133333333336, "voiceEnd": 141.02012500000004, "end": 144.01891666666668, "voiceSeconds": 2.9987916666666665, "pauseSeconds": 2.9987916666666665, "sourceStart": 76.11566666666667, "sourceEnd": 79.11445833333333, "zh": "他的论文《废除奴隶制》，"}, {"index": 25, "text": "met with all professors’ approval.", "start": 144.01891666666668, "voiceEnd": 146.39945833333334, "end": 148.78000000000003, "voiceSeconds": 2.380541666666667, "pauseSeconds": 2.380541666666667, "sourceStart": 79.35445833333333, "sourceEnd": 81.735, "zh": "得到了所有教授的认可。"}, {"index": 26, "text": "After class, he and his companions often played drum music,", "start": 148.78000000000003, "voiceEnd": 153.7201666666667, "end": 158.66033333333337, "voiceSeconds": 4.940166666666666, "pauseSeconds": 4.940166666666666, "sourceStart": 82.245, "sourceEnd": 87.18516666666666, "zh": "课后，他经常和同伴一起敲鼓演奏，"}, {"index": 27, "text": "which was noisy but suitable for his hearing.", "start": 158.66033333333337, "voiceEnd": 161.71450000000004, "end": 164.7686666666667, "voiceSeconds": 3.0541666666666667, "pauseSeconds": 3.0541666666666667, "sourceStart": 87.48516666666667, "sourceEnd": 90.53933333333333, "zh": "声音虽然大，却适合他的听力状况。"}, {"index": 28, "text": "After graduation, he made high profits by designing software for a firm.", "start": 164.7686666666667, "voiceEnd": 170.7826666666667, "end": 176.79666666666668, "voiceSeconds": 6.014, "pauseSeconds": 6.014, "sourceStart": 91.02933333333333, "sourceEnd": 97.04333333333334, "zh": "毕业后，他通过为一家公司设计软件获得了丰厚收益。"}, {"index": 29, "text": "All in all,", "start": 176.79666666666668, "voiceEnd": 177.80729166666669, "end": 178.8179166666667, "voiceSeconds": 1.010625, "pauseSeconds": 1.010625, "sourceStart": 97.53333333333333, "sourceEnd": 98.54395833333334, "zh": "总而言之，"}, {"index": 30, "text": "in his community,", "start": 178.8179166666667, "voiceEnd": 180.22329166666668, "end": 181.6286666666667, "voiceSeconds": 1.405375, "pauseSeconds": 1.405375, "sourceStart": 98.61395833333333, "sourceEnd": 100.01933333333334, "zh": "在他所在的社区里，"}, {"index": 31, "text": "he won his dignity and people’s congratulations.", "start": 181.6286666666667, "voiceEnd": 185.5446666666667, "end": 189.4606666666667, "voiceSeconds": 3.916, "pauseSeconds": 3.916, "sourceStart": 100.27933333333333, "sourceEnd": 104.19533333333334, "zh": "他赢得了自己的尊严，也赢得了人们的祝贺。"}, {"index": 32, "text": "He always wished all the best to his disabled fellows and encouraged them,", "start": 189.4606666666667, "voiceEnd": 194.74158333333335, "end": 200.02250000000004, "voiceSeconds": 5.280916666666666, "pauseSeconds": 5.280916666666666, "sourceStart": 104.69533333333334, "sourceEnd": 109.97625, "zh": "他总把最好的祝愿送给其他残障伙伴，鼓励他们说："}, {"index": 33, "text": "“Never mind!", "start": 200.02250000000004, "voiceEnd": 201.0999166666667, "end": 202.17733333333337, "voiceSeconds": 1.0774166666666667, "pauseSeconds": 1.0774166666666667, "sourceStart": 110.27625, "sourceEnd": 111.35366666666667, "zh": "“别灰心！"}, {"index": 34, "text": "All you have is adequate to achieve your goals.”", "start": 202.17733333333337, "voiceEnd": 205.9006666666667, "end": 209.62400000000002, "voiceSeconds": 3.723333333333333, "pauseSeconds": 3.723333333333333, "sourceStart": 111.84366666666666, "sourceEnd": 115.567, "zh": "你所拥有的一切，足以帮助你实现目标。”"}], "duration": 209.62400000000002, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "17": {"day": 17, "title": "Happy Marriage Needs Fighting For", "groups": [{"index": 0, "text": "Happy Marriage Needs Fighting For.", "start": 0, "voiceEnd": 2.86, "end": 5.72, "voiceSeconds": 2.86, "pauseSeconds": 2.86, "sourceStart": 0.195, "sourceEnd": 3.055, "zh": "幸福的婚姻需要争取。"}, {"index": 1, "text": "As a talented navy officer,", "start": 5.72, "voiceEnd": 8.157083333333333, "end": 10.594166666666666, "voiceSeconds": 2.4370833333333333, "pauseSeconds": 2.4370833333333333, "sourceStart": 3.515, "sourceEnd": 5.952083333333333, "zh": "作为一名有才能的海军军官，"}, {"index": 2, "text": "he was bound to be busy.", "start": 10.594166666666666, "voiceEnd": 12.49775, "end": 14.401333333333334, "voiceSeconds": 1.9035833333333334, "pauseSeconds": 1.9035833333333334, "sourceStart": 6.202083333333333, "sourceEnd": 8.105666666666666, "zh": "他注定十分忙碌。"}, {"index": 3, "text": "When his wife rang him up to say that she wanted a divorce,", "start": 14.401333333333334, "voiceEnd": 18.298125, "end": 22.194916666666668, "voiceSeconds": 3.8967916666666667, "pauseSeconds": 3.8967916666666667, "sourceStart": 8.615666666666666, "sourceEnd": 12.512458333333333, "zh": "妻子打电话告诉他想离婚时，"}, {"index": 4, "text": "he was still scanning a digital counter to check the data", "start": 22.194916666666668, "voiceEnd": 26.004875000000002, "end": 29.814833333333333, "voiceSeconds": 3.8099583333333333, "pauseSeconds": 3.8099583333333333, "sourceStart": 12.762458333333333, "sourceEnd": 16.572416666666665, "zh": "他还在查看数字计数器，核对数据，"}, {"index": 5, "text": "so as to give an assessment", "start": 29.814833333333333, "voiceEnd": 31.55575, "end": 33.29666666666667, "voiceSeconds": 1.7409166666666667, "pauseSeconds": 1.7409166666666667, "sourceStart": 16.572416666666665, "sourceEnd": 18.313333333333333, "zh": "以便作出评估，"}, {"index": 6, "text": "of the theoretical framework for a biochemical weapon.", "start": 33.29666666666667, "voiceEnd": 37.2945, "end": 41.29233333333333, "voiceSeconds": 3.9978333333333333, "pauseSeconds": 3.9978333333333333, "sourceStart": 18.313333333333333, "sourceEnd": 22.311166666666665, "zh": "评估的是一种生化武器的理论框架。"}, {"index": 7, "text": "His junior staff’s sympathy made him feel embarrassed.", "start": 41.29233333333333, "voiceEnd": 45.51483333333333, "end": 49.73733333333333, "voiceSeconds": 4.2225, "pauseSeconds": 4.2225, "sourceStart": 22.831166666666668, "sourceEnd": 27.05366666666667, "zh": "下属的同情让他感到尴尬。"}, {"index": 8, "text": "His wife was a part-time clerk.", "start": 49.73733333333333, "voiceEnd": 52.43933333333333, "end": 55.141333333333336, "voiceSeconds": 2.702, "pauseSeconds": 2.702, "sourceStart": 27.573666666666668, "sourceEnd": 30.275666666666666, "zh": "他的妻子是个兼职文员。"}, {"index": 9, "text": "With his high bonus,", "start": 55.141333333333336, "voiceEnd": 56.77733333333334, "end": 58.413333333333334, "voiceSeconds": 1.636, "pauseSeconds": 1.636, "sourceStart": 30.765666666666668, "sourceEnd": 32.401666666666664, "zh": "凭着他丰厚的奖金，"}, {"index": 10, "text": "she lived in a grand house with elegant cushions and bedding.", "start": 58.413333333333334, "voiceEnd": 62.684666666666665, "end": 66.956, "voiceSeconds": 4.271333333333334, "pauseSeconds": 4.271333333333334, "sourceStart": 32.63166666666667, "sourceEnd": 36.903, "zh": "她住在配有雅致靠垫和寝具的大房子里。"}, {"index": 11, "text": "Her favourite pastime was reading stars’ biographies", "start": 66.956, "voiceEnd": 70.96783333333333, "end": 74.97966666666667, "voiceSeconds": 4.011833333333334, "pauseSeconds": 4.011833333333334, "sourceStart": 37.403, "sourceEnd": 41.414833333333334, "zh": "她最喜欢的消遣是读明星传记，"}, {"index": 12, "text": "or absurd fiction with endless chapters in her armchair.", "start": 74.97966666666667, "voiceEnd": 79.1375, "end": 83.29533333333335, "voiceSeconds": 4.1578333333333335, "pauseSeconds": 4.1578333333333335, "sourceStart": 41.44983333333333, "sourceEnd": 45.60766666666667, "zh": "或坐在扶手椅上读章节没完没了的荒诞小说。"}, {"index": 13, "text": "People envied her leisurely life very much.", "start": 83.29533333333335, "voiceEnd": 86.83100000000002, "end": 90.36666666666667, "voiceSeconds": 3.5356666666666667, "pauseSeconds": 3.5356666666666667, "sourceStart": 46.09766666666667, "sourceEnd": 49.63333333333333, "zh": "人们非常羡慕她悠闲的生活。"}, {"index": 14, "text": "But in fact,", "start": 90.36666666666667, "voiceEnd": 91.51358333333334, "end": 92.66050000000001, "voiceSeconds": 1.1469166666666666, "pauseSeconds": 1.1469166666666666, "sourceStart": 50.14333333333333, "sourceEnd": 51.29025, "zh": "但事实上，"}, {"index": 15, "text": "she was tired of being left alone.", "start": 92.66050000000001, "voiceEnd": 95.16191666666668, "end": 97.66333333333334, "voiceSeconds": 2.5014166666666666, "pauseSeconds": 2.5014166666666666, "sourceStart": 51.52025, "sourceEnd": 54.02166666666667, "zh": "她已经厌倦了总是独自一人。"}, {"index": 16, "text": "She sent emails to his mailbox every week", "start": 97.66333333333334, "voiceEnd": 100.87679166666668, "end": 104.09025000000001, "voiceSeconds": 3.2134583333333335, "pauseSeconds": 3.2134583333333335, "sourceStart": 54.49166666666667, "sourceEnd": 57.705125, "zh": "她每周都给他的邮箱发邮件，"}, {"index": 17, "text": "to state her thinking and ask for his accompaniment,", "start": 104.09025000000001, "voiceEnd": 107.48679166666668, "end": 110.88333333333334, "voiceSeconds": 3.396541666666667, "pauseSeconds": 3.396541666666667, "sourceStart": 57.705125, "sourceEnd": 61.10166666666667, "zh": "表达自己的想法，希望得到他的陪伴，"}, {"index": 18, "text": "but never received a satisfactory reply.", "start": 110.88333333333334, "voiceEnd": 114.13733333333334, "end": 117.39133333333334, "voiceSeconds": 3.254, "pauseSeconds": 3.254, "sourceStart": 61.49166666666667, "sourceEnd": 64.74566666666666, "zh": "但从没收到满意的答复。"}, {"index": 19, "text": "Tired of his explanation that he must obey the orders,", "start": 117.39133333333334, "voiceEnd": 121.41795833333333, "end": 125.44458333333334, "voiceSeconds": 4.026625, "pauseSeconds": 4.026625, "sourceStart": 65.23566666666666, "sourceEnd": 69.26229166666667, "zh": "听腻了他“必须服从命令”的解释，"}, {"index": 20, "text": "she filed for divorce.", "start": 125.44458333333334, "voiceEnd": 127.33595833333334, "end": 129.22733333333335, "voiceSeconds": 1.891375, "pauseSeconds": 1.891375, "sourceStart": 69.46229166666667, "sourceEnd": 71.35366666666667, "zh": "她提出了离婚。"}, {"index": 21, "text": "Because he desired to get their holy affection back,", "start": 129.22733333333335, "voiceEnd": 133.00754166666667, "end": 136.78775000000002, "voiceSeconds": 3.7802083333333334, "pauseSeconds": 3.7802083333333334, "sourceStart": 71.89366666666666, "sourceEnd": 75.673875, "zh": "因为他渴望找回两人神圣的感情，"}, {"index": 22, "text": "he set other affairs aside.", "start": 136.78775000000002, "voiceEnd": 138.96537500000002, "end": 141.14300000000003, "voiceSeconds": 2.177625, "pauseSeconds": 2.177625, "sourceStart": 75.933875, "sourceEnd": 78.1115, "zh": "他把其他事务暂时放到一边。"}, {"index": 23, "text": "He trimmed his fingernails short", "start": 141.14300000000003, "voiceEnd": 143.48295833333336, "end": 145.82291666666669, "voiceSeconds": 2.339958333333333, "pauseSeconds": 2.339958333333333, "sourceStart": 78.6115, "sourceEnd": 80.95145833333333, "zh": "他剪短了指甲，"}, {"index": 24, "text": "and changed his overweight figure as well as his awful haircut.", "start": 145.82291666666669, "voiceEnd": 150.294125, "end": 154.76533333333336, "voiceSeconds": 4.471208333333333, "pauseSeconds": 4.471208333333333, "sourceStart": 80.95645833333333, "sourceEnd": 85.42766666666667, "zh": "改变了过胖的体形，也换掉了糟糕的发型。"}, {"index": 25, "text": "He wore an apron to prepare delicious cuisine for her.", "start": 154.76533333333336, "voiceEnd": 158.925, "end": 163.0846666666667, "voiceSeconds": 4.159666666666666, "pauseSeconds": 4.159666666666666, "sourceStart": 85.93766666666667, "sourceEnd": 90.09733333333334, "zh": "他系上围裙，为妻子做可口的饭菜。"}, {"index": 26, "text": "He also bought her a necklace and piles of flowers", "start": 163.0846666666667, "voiceEnd": 166.8946666666667, "end": 170.7046666666667, "voiceSeconds": 3.81, "pauseSeconds": 3.81, "sourceStart": 90.60733333333333, "sourceEnd": 94.41733333333333, "zh": "他还给她买项链和一大堆鲜花，"}, {"index": 27, "text": "hoping that their receiver could turn around.", "start": 170.7046666666667, "voiceEnd": 173.71033333333335, "end": 176.71600000000004, "voiceSeconds": 3.0056666666666665, "pauseSeconds": 3.0056666666666665, "sourceStart": 94.41733333333333, "sourceEnd": 97.423, "zh": "希望收礼物的她能回心转意。"}, {"index": 28, "text": "After being tested out for 3 months in all,", "start": 176.71600000000004, "voiceEnd": 180.07483333333337, "end": 183.4336666666667, "voiceSeconds": 3.358833333333333, "pauseSeconds": 3.358833333333333, "sourceStart": 97.903, "sourceEnd": 101.26183333333333, "zh": "经过总共三个月的考验，"}, {"index": 29, "text": "he eventually succeeded.", "start": 183.4336666666667, "voiceEnd": 185.30083333333337, "end": 187.16800000000003, "voiceSeconds": 1.8671666666666666, "pauseSeconds": 1.8671666666666666, "sourceStart": 101.52183333333333, "sourceEnd": 103.389, "zh": "他终于成功了。"}], "duration": 187.16800000000003, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "18": {"day": 18, "title": "Mark and a Seal", "groups": [{"index": 0, "text": "Mark and a Seal.", "start": 0, "voiceEnd": 1.5446666666666666, "end": 3.0893333333333333, "voiceSeconds": 1.5446666666666666, "pauseSeconds": 1.5446666666666666, "sourceStart": 0.195, "sourceEnd": 1.7396666666666667, "zh": "马克和海豹。"}, {"index": 1, "text": "Mark rented accommodation with his pension near the shore.", "start": 3.0893333333333333, "voiceEnd": 7.487, "end": 11.884666666666668, "voiceSeconds": 4.397666666666667, "pauseSeconds": 4.397666666666667, "sourceStart": 2.2296666666666667, "sourceEnd": 6.6273333333333335, "zh": "马克用养老金在海边租了住处。"}, {"index": 2, "text": "He paid annual visits there", "start": 11.884666666666668, "voiceEnd": 13.939833333333334, "end": 15.995000000000001, "voiceSeconds": 2.0551666666666666, "pauseSeconds": 2.0551666666666666, "sourceStart": 7.0873333333333335, "sourceEnd": 9.1425, "zh": "他每年都到那里，"}, {"index": 3, "text": "to enjoy the vivid beauty", "start": 15.995000000000001, "voiceEnd": 18.120083333333334, "end": 20.24516666666667, "voiceSeconds": 2.1250833333333334, "pauseSeconds": 2.1250833333333334, "sourceStart": 9.1425, "sourceEnd": 11.267583333333333, "zh": "欣赏那鲜活的美景，"}, {"index": 4, "text": "in the depths of the pure sea.", "start": 20.24516666666667, "voiceEnd": 22.385250000000003, "end": 24.525333333333336, "voiceSeconds": 2.140083333333333, "pauseSeconds": 2.140083333333333, "sourceStart": 11.267583333333333, "sourceEnd": 13.407666666666668, "zh": "在清澈大海的深处。"}, {"index": 5, "text": "Once, with his underwater telescope and flashlight,", "start": 24.525333333333336, "voiceEnd": 28.51375, "end": 32.50216666666667, "voiceSeconds": 3.9884166666666667, "pauseSeconds": 3.9884166666666667, "sourceStart": 13.917666666666667, "sourceEnd": 17.906083333333335, "zh": "有一次，带着水下望远镜和手电筒，"}, {"index": 6, "text": "Mark dived along the boundary", "start": 32.50216666666667, "voiceEnd": 34.601, "end": 36.69983333333333, "voiceSeconds": 2.0988333333333333, "pauseSeconds": 2.0988333333333333, "sourceStart": 18.266083333333334, "sourceEnd": 20.364916666666666, "zh": "马克沿着一条交界线潜水，"}, {"index": 7, "text": "between the steep reef and the area of seaweed conservation.", "start": 36.69983333333333, "voiceEnd": 41.10825, "end": 45.516666666666666, "voiceSeconds": 4.408416666666667, "pauseSeconds": 4.408416666666667, "sourceStart": 20.364916666666666, "sourceEnd": 24.773333333333333, "zh": "那是陡峭礁石与海草保护区之间的边界。"}, {"index": 8, "text": "Suddenly, an awesome Antarctic seal with sharp teeth appeared opposite him.", "start": 45.516666666666666, "voiceEnd": 51.300333333333334, "end": 57.084, "voiceSeconds": 5.783666666666667, "pauseSeconds": 5.783666666666667, "sourceStart": 25.273333333333333, "sourceEnd": 31.057, "zh": "突然，一只长着尖牙、令人生畏的南极海豹出现在他对面。"}, {"index": 9, "text": "Every cell in his body was scared to death.", "start": 57.084, "voiceEnd": 60.47866666666667, "end": 63.873333333333335, "voiceSeconds": 3.3946666666666667, "pauseSeconds": 3.3946666666666667, "sourceStart": 31.537, "sourceEnd": 34.931666666666665, "zh": "他全身每一个细胞都吓坏了。"}, {"index": 10, "text": "But soon, he was aware that he wasn’t the target of an attack.", "start": 63.873333333333335, "voiceEnd": 68.629, "end": 73.38466666666667, "voiceSeconds": 4.7556666666666665, "pauseSeconds": 4.7556666666666665, "sourceStart": 35.41166666666667, "sourceEnd": 40.16733333333333, "zh": "但很快，他意识到自己并不是被攻击的目标。"}, {"index": 11, "text": "With a neat wound in its lip caused by a shark,", "start": 73.38466666666667, "voiceEnd": 76.80670833333335, "end": 80.22875, "voiceSeconds": 3.422041666666667, "pauseSeconds": 3.422041666666667, "sourceStart": 40.67733333333333, "sourceEnd": 44.099375, "zh": "这只海豹嘴唇上有一道鲨鱼造成的整齐伤口，"}, {"index": 12, "text": "this grey seal was washed upside down by the tides time after time.", "start": 80.22875, "voiceEnd": 85.192375, "end": 90.156, "voiceSeconds": 4.963625, "pauseSeconds": 4.963625, "sourceStart": 44.449375, "sourceEnd": 49.413, "zh": "灰色的身体被潮水一次又一次地掀翻。"}, {"index": 13, "text": "But it tried to jog Mark", "start": 90.156, "voiceEnd": 92.03845833333334, "end": 93.92091666666667, "voiceSeconds": 1.8824583333333333, "pauseSeconds": 1.8824583333333333, "sourceStart": 49.933, "sourceEnd": 51.81545833333333, "zh": "但它试着轻碰马克，"}, {"index": 14, "text": "as if to urge him to help it.", "start": 93.92091666666667, "voiceEnd": 96.22629166666667, "end": 98.53166666666667, "voiceSeconds": 2.305375, "pauseSeconds": 2.305375, "sourceStart": 51.820458333333335, "sourceEnd": 54.12583333333333, "zh": "仿佛在催促他帮帮自己。"}, {"index": 15, "text": "So Mark abandoned fleeing away.", "start": 98.53166666666667, "voiceEnd": 101.30483333333333, "end": 104.078, "voiceSeconds": 2.7731666666666666, "pauseSeconds": 2.7731666666666666, "sourceStart": 54.62583333333333, "sourceEnd": 57.399, "zh": "于是马克放弃了逃跑。"}, {"index": 16, "text": "With its cooperation,", "start": 104.078, "voiceEnd": 105.81329166666667, "end": 107.54858333333334, "voiceSeconds": 1.7352916666666667, "pauseSeconds": 1.7352916666666667, "sourceStart": 57.899, "sourceEnd": 59.63429166666667, "zh": "在海豹的配合下，"}, {"index": 17, "text": "Mark used a net to drag the seal to the shallow water.", "start": 107.54858333333334, "voiceEnd": 111.61995833333334, "end": 115.69133333333335, "voiceSeconds": 4.071375, "pauseSeconds": 4.071375, "sourceStart": 59.834291666666665, "sourceEnd": 63.90566666666667, "zh": "马克用网把它拖到了浅水处。"}, {"index": 18, "text": "Without pausing he helped it out after a simple operation", "start": 115.69133333333335, "voiceEnd": 120.12529166666668, "end": 124.55925000000002, "voiceSeconds": 4.433958333333333, "pauseSeconds": 4.433958333333333, "sourceStart": 64.36566666666667, "sourceEnd": 68.799625, "zh": "他没有停歇，做了一个简单手术，帮助它脱险，"}, {"index": 19, "text": "and settled it in a narrow cave by the seaside.", "start": 124.55925000000002, "voiceEnd": 128.16929166666668, "end": 131.77933333333334, "voiceSeconds": 3.6100416666666666, "pauseSeconds": 3.6100416666666666, "sourceStart": 68.799625, "sourceEnd": 72.40966666666667, "zh": "然后把它安置在海边一个狭窄的洞穴里。"}, {"index": 20, "text": "Every time he brought it tasty fish,", "start": 131.77933333333334, "voiceEnd": 134.6565, "end": 137.53366666666668, "voiceSeconds": 2.8771666666666667, "pauseSeconds": 2.8771666666666667, "sourceStart": 72.90966666666667, "sourceEnd": 75.78683333333333, "zh": "每次他带来美味的鱼，"}, {"index": 21, "text": "it would yell and suck his hands happily.", "start": 137.53366666666668, "voiceEnd": 140.4741666666667, "end": 143.41466666666668, "voiceSeconds": 2.9405, "pauseSeconds": 2.9405, "sourceStart": 76.05683333333333, "sourceEnd": 78.99733333333333, "zh": "它都会高兴地叫着，吮吸他的手。"}, {"index": 22, "text": "Witnesses said their anecdotes reflected a magic dimension", "start": 143.41466666666668, "voiceEnd": 148.16625000000002, "end": 152.91783333333333, "voiceSeconds": 4.7515833333333335, "pauseSeconds": 4.7515833333333335, "sourceStart": 79.43733333333333, "sourceEnd": 84.18891666666667, "zh": "目击者说，他们的故事展示了奇妙的一面，"}, {"index": 23, "text": "of the relationship between humans and animals.", "start": 152.91783333333333, "voiceEnd": 156.61391666666665, "end": 160.31, "voiceSeconds": 3.696083333333333, "pauseSeconds": 3.696083333333333, "sourceStart": 84.18891666666667, "sourceEnd": 87.885, "zh": "那就是人类与动物之间的关系。"}], "duration": 160.31, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "19": {"day": 19, "title": "Helping the Remote Village", "groups": [{"index": 0, "text": "Helping the Remote Village.", "start": 0, "voiceEnd": 2.23, "end": 4.46, "voiceSeconds": 2.23, "pauseSeconds": 2.23, "sourceStart": 0.195, "sourceEnd": 2.425, "zh": "帮助偏远村庄。"}, {"index": 1, "text": "A year ago,", "start": 4.46, "voiceEnd": 5.562333333333333, "end": 6.664666666666667, "voiceSeconds": 1.1023333333333334, "pauseSeconds": 1.1023333333333334, "sourceStart": 2.905, "sourceEnd": 4.007333333333333, "zh": "一年前，"}, {"index": 2, "text": "the famous astronaut received an invitation by airmail from a remote village.", "start": 6.664666666666667, "voiceEnd": 12.351, "end": 18.037333333333336, "voiceSeconds": 5.686333333333334, "pauseSeconds": 5.686333333333334, "sourceStart": 4.237333333333333, "sourceEnd": 9.923666666666668, "zh": "这位著名宇航员收到一封来自偏远村庄的航空邀请信。"}, {"index": 3, "text": "Intending to sniff some fresh air,", "start": 18.037333333333336, "voiceEnd": 20.606333333333335, "end": 23.175333333333334, "voiceSeconds": 2.569, "pauseSeconds": 2.569, "sourceStart": 10.413666666666666, "sourceEnd": 12.982666666666667, "zh": "为了呼吸一些新鲜空气，"}, {"index": 4, "text": "he and his interpreter paid a fortnight’s visit there.", "start": 23.175333333333334, "voiceEnd": 26.942333333333334, "end": 30.709333333333333, "voiceSeconds": 3.767, "pauseSeconds": 3.767, "sourceStart": 13.242666666666667, "sourceEnd": 17.009666666666668, "zh": "他和翻译在那里访问了两周。"}, {"index": 5, "text": "It was a privilege for them to be there,", "start": 30.709333333333333, "voiceEnd": 33.278416666666665, "end": 35.8475, "voiceSeconds": 2.5690833333333334, "pauseSeconds": 2.5690833333333334, "sourceStart": 17.459666666666667, "sourceEnd": 20.02875, "zh": "能到那里，他们觉得十分荣幸，"}, {"index": 6, "text": "but they were shocked by what they saw.", "start": 35.8475, "voiceEnd": 38.30808333333333, "end": 40.76866666666666, "voiceSeconds": 2.460583333333333, "pauseSeconds": 2.460583333333333, "sourceStart": 20.30875, "sourceEnd": 22.769333333333332, "zh": "却也被眼前的情景震惊了。"}, {"index": 7, "text": "The tracks were muddy.", "start": 40.76866666666666, "voiceEnd": 42.39666666666666, "end": 44.02466666666666, "voiceSeconds": 1.628, "pauseSeconds": 1.628, "sourceStart": 23.239333333333335, "sourceEnd": 24.867333333333335, "zh": "小路泥泞不堪。"}, {"index": 8, "text": "The river was drying up.", "start": 44.02466666666666, "voiceEnd": 46.124333333333325, "end": 48.224, "voiceSeconds": 2.099666666666667, "pauseSeconds": 2.099666666666667, "sourceStart": 25.347333333333335, "sourceEnd": 27.447, "zh": "河水正在干涸。"}, {"index": 9, "text": "Most villagers only possessed one broom,", "start": 48.224, "voiceEnd": 51.385124999999995, "end": 54.54625, "voiceSeconds": 3.161125, "pauseSeconds": 3.161125, "sourceStart": 27.947, "sourceEnd": 31.108125, "zh": "大多数村民只有一把扫帚，"}, {"index": 10, "text": "a few tins and several jars", "start": 54.54625, "voiceEnd": 57.04525, "end": 59.54425, "voiceSeconds": 2.499, "pauseSeconds": 2.499, "sourceStart": 31.318125, "sourceEnd": 33.817125, "zh": "几个铁罐和几个坛子，"}, {"index": 11, "text": "and their rectangular grass huts with rounded corners", "start": 59.54425, "voiceEnd": 63.077083333333334, "end": 66.60991666666666, "voiceSeconds": 3.5328333333333335, "pauseSeconds": 3.5328333333333335, "sourceStart": 33.817125, "sourceEnd": 37.34995833333333, "zh": "他们带着圆角的长方形茅草屋，"}, {"index": 12, "text": "were surrounded by weeds.", "start": 66.60991666666666, "voiceEnd": 68.45929166666666, "end": 70.30866666666667, "voiceSeconds": 1.849375, "pauseSeconds": 1.849375, "sourceStart": 37.34995833333333, "sourceEnd": 39.199333333333335, "zh": "四周长满了杂草。"}, {"index": 13, "text": "Besides, their school had no roof and platform,", "start": 70.30866666666667, "voiceEnd": 74.20266666666667, "end": 78.09666666666666, "voiceSeconds": 3.894, "pauseSeconds": 3.894, "sourceStart": 39.739333333333335, "sourceEnd": 43.63333333333333, "zh": "此外，学校没有屋顶，也没有讲台，"}, {"index": 14, "text": "and the students had no concept of clicking a computer at all.", "start": 78.09666666666666, "voiceEnd": 82.28716666666666, "end": 86.47766666666666, "voiceSeconds": 4.1905, "pauseSeconds": 4.1905, "sourceStart": 43.89333333333333, "sourceEnd": 48.08383333333333, "zh": "学生完全不知道如何点击操作电脑。"}, {"index": 15, "text": "They were badly in need.", "start": 86.47766666666666, "voiceEnd": 88.33283333333333, "end": 90.188, "voiceSeconds": 1.8551666666666666, "pauseSeconds": 1.8551666666666666, "sourceStart": 48.58383333333333, "sourceEnd": 50.439, "zh": "他们急需帮助。"}, {"index": 16, "text": "Soon, the astronaut made a generous voluntary donation to the village.", "start": 90.188, "voiceEnd": 95.96266666666666, "end": 101.73733333333334, "voiceSeconds": 5.774666666666667, "pauseSeconds": 5.774666666666667, "sourceStart": 50.949, "sourceEnd": 56.72366666666667, "zh": "不久，宇航员自愿向村庄作了一笔慷慨捐赠。"}, {"index": 17, "text": "There were textbooks for students,", "start": 101.73733333333334, "voiceEnd": 104.07004166666667, "end": 106.40275000000001, "voiceSeconds": 2.332708333333333, "pauseSeconds": 2.332708333333333, "sourceStart": 57.21366666666667, "sourceEnd": 59.546375, "zh": "有送给学生的课本，"}, {"index": 18, "text": "sewing machines for tailors and tractors for farmers.", "start": 106.40275000000001, "voiceEnd": 110.36137500000001, "end": 114.32000000000001, "voiceSeconds": 3.958625, "pauseSeconds": 3.958625, "sourceStart": 59.796375, "sourceEnd": 63.755, "zh": "送给裁缝的缝纫机，以及送给农民的拖拉机。"}, {"index": 19, "text": "His distribution catalogue also included operating a clinic and a trunk library,", "start": 114.32000000000001, "voiceEnd": 120.51075, "end": 126.70150000000001, "voiceSeconds": 6.19075, "pauseSeconds": 6.19075, "sourceStart": 64.255, "sourceEnd": 70.44575, "zh": "他的援助清单还包括开办诊所和箱式流动图书馆，"}, {"index": 20, "text": "as well as giving weekly lessons", "start": 126.70150000000001, "voiceEnd": 128.85475000000002, "end": 131.008, "voiceSeconds": 2.15325, "pauseSeconds": 2.15325, "sourceStart": 70.74575, "sourceEnd": 72.899, "zh": "以及每周开设课程，"}, {"index": 21, "text": "to teach relevant farming knowledge", "start": 131.008, "voiceEnd": 133.31020833333335, "end": 135.6124166666667, "voiceSeconds": 2.302208333333333, "pauseSeconds": 2.302208333333333, "sourceStart": 72.899, "sourceEnd": 75.20120833333333, "zh": "传授相关农业知识，"}, {"index": 22, "text": "like how to dry out seeds or raise oxen.", "start": 135.6124166666667, "voiceEnd": 138.90254166666668, "end": 142.1926666666667, "voiceSeconds": 3.290125, "pauseSeconds": 3.290125, "sourceStart": 75.20120833333333, "sourceEnd": 78.49133333333333, "zh": "例如如何晒干种子、饲养耕牛。"}, {"index": 23, "text": "He himself not only helped do some paperwork", "start": 142.1926666666667, "voiceEnd": 145.48512500000004, "end": 148.77758333333335, "voiceSeconds": 3.2924583333333333, "pauseSeconds": 3.2924583333333333, "sourceStart": 78.99133333333333, "sourceEnd": 82.28379166666667, "zh": "他自己不但帮忙做文书工作，"}, {"index": 24, "text": "but also purchased grills for boys to toast potatoes", "start": 148.77758333333335, "voiceEnd": 152.80675000000002, "end": 156.8359166666667, "voiceSeconds": 4.029166666666667, "pauseSeconds": 4.029166666666667, "sourceStart": 82.32879166666666, "sourceEnd": 86.35795833333333, "zh": "还为男孩们买了烤架，让他们烤土豆，"}, {"index": 25, "text": "and combs for girls who were dying to get one.", "start": 156.8359166666667, "voiceEnd": 159.94695833333336, "end": 163.05800000000002, "voiceSeconds": 3.1110416666666665, "pauseSeconds": 3.1110416666666665, "sourceStart": 86.35795833333333, "sourceEnd": 89.469, "zh": "并给非常想要梳子的女孩们买了梳子。"}, {"index": 26, "text": "The other day,", "start": 163.05800000000002, "voiceEnd": 164.14350000000002, "end": 165.229, "voiceSeconds": 1.0855, "pauseSeconds": 1.0855, "sourceStart": 89.949, "sourceEnd": 91.0345, "zh": "前几天，"}, {"index": 27, "text": "he heard from the villagers again", "start": 165.229, "voiceEnd": 167.4145, "end": 169.60000000000002, "voiceSeconds": 2.1855, "pauseSeconds": 2.1855, "sourceStart": 91.2145, "sourceEnd": 93.4, "zh": "他再次收到了村民的来信，"}, {"index": 28, "text": "inviting him to participate in the donation anniversary.", "start": 169.60000000000002, "voiceEnd": 173.89333333333335, "end": 178.1866666666667, "voiceSeconds": 4.293333333333333, "pauseSeconds": 4.293333333333333, "sourceStart": 93.4, "sourceEnd": 97.69333333333333, "zh": "邀请他参加捐赠周年纪念活动。"}, {"index": 29, "text": "For political and security reasons,", "start": 178.1866666666667, "voiceEnd": 181.15550000000002, "end": 184.12433333333337, "voiceSeconds": 2.9688333333333334, "pauseSeconds": 2.9688333333333334, "sourceStart": 98.13333333333334, "sourceEnd": 101.10216666666666, "zh": "由于政治和安全方面的原因，"}, {"index": 30, "text": "he couldn’t adjust his travel arrangements-otherwise he would go.", "start": 184.12433333333337, "voiceEnd": 188.57183333333336, "end": 193.01933333333338, "voiceSeconds": 4.4475, "pauseSeconds": 4.4475, "sourceStart": 101.34216666666667, "sourceEnd": 105.78966666666666, "zh": "他无法调整出行安排，否则他就会去了。"}, {"index": 31, "text": "But his deeds were remembered forever.", "start": 193.01933333333338, "voiceEnd": 195.9266666666667, "end": 198.83400000000003, "voiceSeconds": 2.9073333333333333, "pauseSeconds": 2.9073333333333333, "sourceStart": 106.29966666666667, "sourceEnd": 109.207, "zh": "但他的善举永远被人铭记。"}], "duration": 198.83400000000003, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "20": {"day": 20, "title": "Study in America", "groups": [{"index": 0, "text": "Study in America.", "start": 0, "voiceEnd": 1.9343333333333332, "end": 3.8686666666666665, "voiceSeconds": 1.9343333333333332, "pauseSeconds": 1.9343333333333332, "sourceStart": 0.195, "sourceEnd": 2.1293333333333333, "zh": "在美国留学。"}, {"index": 1, "text": "Nannan’s father runs an enterprise near the Ming Tombs", "start": 3.8686666666666665, "voiceEnd": 7.859125, "end": 11.849583333333333, "voiceSeconds": 3.990458333333333, "pauseSeconds": 3.990458333333333, "sourceStart": 2.5893333333333333, "sourceEnd": 6.579791666666667, "zh": "楠楠的父亲在明十三陵附近经营一家企业，"}, {"index": 2, "text": "selling batteries and drills to the Daqing Oilfield.", "start": 11.849583333333333, "voiceEnd": 15.783458333333334, "end": 19.717333333333332, "voiceSeconds": 3.933875, "pauseSeconds": 3.933875, "sourceStart": 6.579791666666667, "sourceEnd": 10.513666666666667, "zh": "向大庆油田销售电池和钻机。"}, {"index": 3, "text": "Hoping to get the qualification to help govern it,", "start": 19.717333333333332, "voiceEnd": 23.240458333333333, "end": 26.763583333333333, "voiceSeconds": 3.523125, "pauseSeconds": 3.523125, "sourceStart": 11.013666666666667, "sourceEnd": 14.536791666666666, "zh": "希望获得资格，将来帮助管理企业，"}, {"index": 4, "text": "Nannan made much preparation", "start": 26.763583333333333, "voiceEnd": 29.156666666666666, "end": 31.54975, "voiceSeconds": 2.3930833333333332, "pauseSeconds": 2.3930833333333332, "sourceStart": 14.856791666666666, "sourceEnd": 17.249875, "zh": "楠楠做了大量准备，"}, {"index": 5, "text": "and then left her motherland with her visa", "start": 31.54975, "voiceEnd": 34.164, "end": 36.77825, "voiceSeconds": 2.61425, "pauseSeconds": 2.61425, "sourceStart": 17.284875, "sourceEnd": 19.899125, "zh": "然后带着签证离开祖国，"}, {"index": 6, "text": "to study in America.", "start": 36.77825, "voiceEnd": 38.42879166666667, "end": 40.07933333333333, "voiceSeconds": 1.6505416666666666, "pauseSeconds": 1.6505416666666666, "sourceStart": 19.899125, "sourceEnd": 21.549666666666667, "zh": "到美国留学。"}, {"index": 7, "text": "Having reached her destination,", "start": 40.07933333333333, "voiceEnd": 42.36116666666666, "end": 44.643, "voiceSeconds": 2.281833333333333, "pauseSeconds": 2.281833333333333, "sourceStart": 22.019666666666666, "sourceEnd": 24.3015, "zh": "到达目的地后，"}, {"index": 8, "text": "she settled in an inn recommended by the travel agent.", "start": 44.643, "voiceEnd": 48.6325, "end": 52.622, "voiceSeconds": 3.9895, "pauseSeconds": 3.9895, "sourceStart": 24.5515, "sourceEnd": 28.541, "zh": "她住进了旅行社推荐的一家小旅馆。"}, {"index": 9, "text": "As far as Nannan was concerned,", "start": 52.622, "voiceEnd": 55.25575, "end": 57.8895, "voiceSeconds": 2.63375, "pauseSeconds": 2.63375, "sourceStart": 29.051, "sourceEnd": 31.68475, "zh": "就楠楠而言，"}, {"index": 10, "text": "she always kept it up in China.", "start": 57.8895, "voiceEnd": 60.25841666666666, "end": 62.62733333333333, "voiceSeconds": 2.368916666666667, "pauseSeconds": 2.368916666666667, "sourceStart": 31.90475, "sourceEnd": 34.273666666666664, "zh": "她在中国时一直保持着良好的表现。"}, {"index": 11, "text": "But she had to acknowledge", "start": 62.62733333333333, "voiceEnd": 64.18304166666667, "end": 65.73875, "voiceSeconds": 1.5557083333333332, "pauseSeconds": 1.5557083333333332, "sourceStart": 34.803666666666665, "sourceEnd": 36.359375, "zh": "但她不得不承认，"}, {"index": 12, "text": "it was not easy to adjust herself to the new academic requirements,", "start": 65.73875, "voiceEnd": 70.71120833333333, "end": 75.68366666666667, "voiceSeconds": 4.972458333333333, "pauseSeconds": 4.972458333333333, "sourceStart": 36.359375, "sourceEnd": 41.331833333333336, "zh": "要适应新的学业要求并不容易，"}, {"index": 13, "text": "which were not in line with those in China.", "start": 75.68366666666667, "voiceEnd": 78.371, "end": 81.05833333333334, "voiceSeconds": 2.687333333333333, "pauseSeconds": 2.687333333333333, "sourceStart": 41.64183333333333, "sourceEnd": 44.329166666666666, "zh": "这些要求与中国的不一样。"}, {"index": 14, "text": "Though she was occupied with lectures and seminars day in and day out,", "start": 81.05833333333334, "voiceEnd": 85.97491666666667, "end": 90.89150000000001, "voiceSeconds": 4.9165833333333335, "pauseSeconds": 4.9165833333333335, "sourceStart": 44.81916666666667, "sourceEnd": 49.73575, "zh": "尽管她日复一日地忙于听课和参加研讨会，"}, {"index": 15, "text": "the essays she drafted were still criticised by her tutors.", "start": 90.89150000000001, "voiceEnd": 95.17741666666667, "end": 99.46333333333334, "voiceSeconds": 4.285916666666667, "pauseSeconds": 4.285916666666667, "sourceStart": 50.08575, "sourceEnd": 54.37166666666667, "zh": "她起草的论文还是会受到导师的批评。"}, {"index": 16, "text": "As for her routine life,", "start": 99.46333333333334, "voiceEnd": 101.51158333333333, "end": 103.55983333333334, "voiceSeconds": 2.04825, "pauseSeconds": 2.04825, "sourceStart": 54.861666666666665, "sourceEnd": 56.90991666666667, "zh": "至于日常生活，"}, {"index": 17, "text": "she felt that it was hard to fit in,", "start": 103.55983333333334, "voiceEnd": 106.04029166666668, "end": 108.52075, "voiceSeconds": 2.4804583333333334, "pauseSeconds": 2.4804583333333334, "sourceStart": 57.15991666666667, "sourceEnd": 59.640375, "zh": "她觉得很难融入，"}, {"index": 18, "text": "too.", "start": 108.52075, "voiceEnd": 109.09570833333333, "end": 109.67066666666668, "voiceSeconds": 0.5749583333333333, "pauseSeconds": 0.5749583333333333, "sourceStart": 59.820375, "sourceEnd": 60.39533333333333, "zh": "也是如此（too 表示“也”）。"}, {"index": 19, "text": "For example, she found English idioms difficult to understand.", "start": 109.67066666666668, "voiceEnd": 114.89233333333334, "end": 120.114, "voiceSeconds": 5.221666666666667, "pauseSeconds": 5.221666666666667, "sourceStart": 60.885333333333335, "sourceEnd": 66.107, "zh": "比如，她发现英语习语很难理解。"}, {"index": 20, "text": "And it was out of the question to eat delicious Chinese foods", "start": 120.114, "voiceEnd": 124.24866666666667, "end": 128.38333333333333, "voiceSeconds": 4.134666666666667, "pauseSeconds": 4.134666666666667, "sourceStart": 66.597, "sourceEnd": 70.73166666666667, "zh": "而吃到美味的中餐，更是不可能，"}, {"index": 21, "text": "though many optional cafeterias served abundant substitutes.", "start": 128.38333333333333, "voiceEnd": 133.05066666666667, "end": 137.718, "voiceSeconds": 4.667333333333334, "pauseSeconds": 4.667333333333334, "sourceStart": 70.73166666666667, "sourceEnd": 75.399, "zh": "尽管有许多自助餐厅可选，提供丰富的替代食物。"}, {"index": 22, "text": "In addition, she had to wait in a queue early", "start": 137.718, "voiceEnd": 141.05249999999998, "end": 144.387, "voiceSeconds": 3.3345, "pauseSeconds": 3.3345, "sourceStart": 75.899, "sourceEnd": 79.2335, "zh": "此外，她还得早早排队等候，"}, {"index": 23, "text": "for the minibus that took her to school", "start": 144.387, "voiceEnd": 146.82566666666668, "end": 149.26433333333333, "voiceSeconds": 2.4386666666666668, "pauseSeconds": 2.4386666666666668, "sourceStart": 79.2335, "sourceEnd": 81.67216666666667, "zh": "等送她去学校的小巴，"}, {"index": 24, "text": "and it was usually so cold", "start": 149.26433333333333, "voiceEnd": 151.185, "end": 153.10566666666665, "voiceSeconds": 1.9206666666666667, "pauseSeconds": 1.9206666666666667, "sourceStart": 81.67216666666667, "sourceEnd": 83.59283333333333, "zh": "而当时通常非常冷，"}, {"index": 25, "text": "that she felt numb.", "start": 153.10566666666665, "voiceEnd": 154.40849999999998, "end": 155.71133333333333, "voiceSeconds": 1.3028333333333333, "pauseSeconds": 1.3028333333333333, "sourceStart": 83.59283333333333, "sourceEnd": 84.89566666666667, "zh": "冷得她都麻木了。"}, {"index": 26, "text": "What bothered her most was", "start": 155.71133333333333, "voiceEnd": 157.60608333333332, "end": 159.50083333333333, "voiceSeconds": 1.89475, "pauseSeconds": 1.89475, "sourceStart": 85.36566666666667, "sourceEnd": 87.26041666666667, "zh": "最困扰她的是，"}, {"index": 27, "text": "that she received no apology", "start": 159.50083333333333, "voiceEnd": 161.68283333333332, "end": 163.86483333333334, "voiceSeconds": 2.182, "pauseSeconds": 2.182, "sourceStart": 87.26041666666667, "sourceEnd": 89.44241666666667, "zh": "她没有得到任何道歉，"}, {"index": 28, "text": "when her sleeping was disturbed", "start": 163.86483333333334, "voiceEnd": 165.99054166666667, "end": 168.11625, "voiceSeconds": 2.1257083333333333, "pauseSeconds": 2.1257083333333333, "sourceStart": 89.44241666666667, "sourceEnd": 91.568125, "zh": "当她的睡眠受到干扰时，"}, {"index": 29, "text": "by a barking dog in a shopkeeper’s cage.", "start": 168.11625, "voiceEnd": 171.2687916666667, "end": 174.42133333333334, "voiceSeconds": 3.1525416666666666, "pauseSeconds": 3.1525416666666666, "sourceStart": 91.583125, "sourceEnd": 94.73566666666666, "zh": "干扰来自店主笼子里一只不停叫的狗。"}, {"index": 30, "text": "Luckily, with her parents comforting her by videophone,", "start": 174.42133333333334, "voiceEnd": 178.65708333333333, "end": 182.89283333333333, "voiceSeconds": 4.23575, "pauseSeconds": 4.23575, "sourceStart": 95.21566666666666, "sourceEnd": 99.45141666666666, "zh": "幸运的是，父母通过视频电话安慰她，"}, {"index": 31, "text": "she became autonomous soon", "start": 182.89283333333333, "voiceEnd": 184.99949999999998, "end": 187.10616666666667, "voiceSeconds": 2.1066666666666665, "pauseSeconds": 2.1066666666666665, "sourceStart": 99.71141666666666, "sourceEnd": 101.81808333333333, "zh": "她很快变得独立，"}, {"index": 32, "text": "and eventually got her bachelor’s degree successfully.", "start": 187.10616666666667, "voiceEnd": 190.58508333333333, "end": 194.064, "voiceSeconds": 3.4789166666666667, "pauseSeconds": 3.4789166666666667, "sourceStart": 101.81808333333333, "sourceEnd": 105.297, "zh": "最终顺利获得了学士学位。"}], "duration": 194.064, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "21": {"day": 21, "title": "Immigrate to America", "groups": [{"index": 0, "text": "Immigrate to America.", "start": 0, "voiceEnd": 2.016, "end": 4.032, "voiceSeconds": 2.016, "pauseSeconds": 2.016, "sourceStart": 0.185, "sourceEnd": 2.201, "zh": "移居美国。"}, {"index": 1, "text": "Attracted by the boom in America,", "start": 4.032, "voiceEnd": 6.553125, "end": 9.07425, "voiceSeconds": 2.521125, "pauseSeconds": 2.521125, "sourceStart": 2.661, "sourceEnd": 5.182125, "zh": "受到美国繁荣景象的吸引，"}, {"index": 2, "text": "my nephew teamed up with a Korean", "start": 9.07425, "voiceEnd": 11.462833333333332, "end": 13.851416666666665, "voiceSeconds": 2.3885833333333335, "pauseSeconds": 2.3885833333333335, "sourceStart": 5.412125, "sourceEnd": 7.800708333333334, "zh": "我的侄子和一个韩国人结伴，"}, {"index": 3, "text": "to illegally cross the Bering Strait in the Arctic to America.", "start": 13.851416666666665, "voiceEnd": 18.254041666666666, "end": 22.656666666666666, "voiceSeconds": 4.402625, "pauseSeconds": 4.402625, "sourceStart": 7.800708333333334, "sourceEnd": 12.203333333333333, "zh": "非法穿过北极地区的白令海峡，前往美国。"}, {"index": 4, "text": "To avoid the Customs’ punishment,", "start": 22.656666666666666, "voiceEnd": 24.973208333333332, "end": 27.289749999999998, "voiceSeconds": 2.3165416666666667, "pauseSeconds": 2.3165416666666667, "sourceStart": 12.713333333333333, "sourceEnd": 15.029875, "zh": "为了躲避海关的处罚，"}, {"index": 5, "text": "they hid in a small ferry called the North Pole Seagull,", "start": 27.289749999999998, "voiceEnd": 30.879916666666666, "end": 34.470083333333335, "voiceSeconds": 3.5901666666666667, "pauseSeconds": 3.5901666666666667, "sourceStart": 15.309875, "sourceEnd": 18.900041666666667, "zh": "他们藏在一艘名叫“北极海鸥”的小渡船里，"}, {"index": 6, "text": "sitting back to back without sleeping,", "start": 34.470083333333335, "voiceEnd": 37.01466666666667, "end": 39.55925, "voiceSeconds": 2.544583333333333, "pauseSeconds": 2.544583333333333, "sourceStart": 19.130041666666667, "sourceEnd": 21.674625, "zh": "背靠背地坐着，不睡觉，"}, {"index": 7, "text": "showering and shaving for 3 days,", "start": 39.55925, "voiceEnd": 42.4255, "end": 45.29175, "voiceSeconds": 2.86625, "pauseSeconds": 2.86625, "sourceStart": 21.794625, "sourceEnd": 24.660875, "zh": "三天没有洗澡，也没有刮胡子，"}, {"index": 8, "text": "and had no chance to mourn their lost luggage when landing.", "start": 45.29175, "voiceEnd": 48.93004166666667, "end": 52.568333333333335, "voiceSeconds": 3.6382916666666665, "pauseSeconds": 3.6382916666666665, "sourceStart": 24.980875, "sourceEnd": 28.61916666666667, "zh": "上岸时，连为丢失的行李难过一下的机会都没有。"}, {"index": 9, "text": "The hardship of this crossing was apparent.", "start": 52.568333333333335, "voiceEnd": 55.86666666666667, "end": 59.165, "voiceSeconds": 3.2983333333333333, "pauseSeconds": 3.2983333333333333, "sourceStart": 29.179166666666667, "sourceEnd": 32.4775, "zh": "这次横渡的艰辛显而易见。"}, {"index": 10, "text": "At first, he made a living by means of raising cattle", "start": 59.165, "voiceEnd": 63.48370833333333, "end": 67.80241666666666, "voiceSeconds": 4.318708333333333, "pauseSeconds": 4.318708333333333, "sourceStart": 32.9975, "sourceEnd": 37.316208333333336, "zh": "起初，他靠养牛谋生，"}, {"index": 11, "text": "and then was hired in aircraft industries.", "start": 67.80241666666666, "voiceEnd": 70.855875, "end": 73.90933333333332, "voiceSeconds": 3.0534583333333334, "pauseSeconds": 3.0534583333333334, "sourceStart": 37.316208333333336, "sourceEnd": 40.36966666666667, "zh": "后来受雇于航空工业。"}, {"index": 12, "text": "He lived in a Catholic district.", "start": 73.90933333333332, "voiceEnd": 76.46466666666666, "end": 79.01999999999998, "voiceSeconds": 2.5553333333333335, "pauseSeconds": 2.5553333333333335, "sourceStart": 40.879666666666665, "sourceEnd": 43.435, "zh": "他住在一个天主教社区。"}, {"index": 13, "text": "Taking in a small percentage of Pakistani immigrants,", "start": 79.01999999999998, "voiceEnd": 83.00383333333332, "end": 86.98766666666666, "voiceSeconds": 3.983833333333333, "pauseSeconds": 3.983833333333333, "sourceStart": 43.975, "sourceEnd": 47.95883333333333, "zh": "那里接纳了少量巴基斯坦移民，"}, {"index": 14, "text": "the majority of the residents were from Italy and Denmark,", "start": 86.98766666666666, "voiceEnd": 90.86020833333332, "end": 94.73274999999998, "voiceSeconds": 3.8725416666666668, "pauseSeconds": 3.8725416666666668, "sourceStart": 48.27883333333333, "sourceEnd": 52.151375, "zh": "但大多数居民来自意大利和丹麦，"}, {"index": 15, "text": "who all kept up their customs and cultures.", "start": 94.73274999999998, "voiceEnd": 97.89254166666665, "end": 101.05233333333331, "voiceSeconds": 3.1597916666666666, "pauseSeconds": 3.1597916666666666, "sourceStart": 52.411375, "sourceEnd": 55.57116666666667, "zh": "他们都保留着自己的习俗和文化。"}, {"index": 16, "text": "Different blocks here were distinctly marked out and indicated from the racial angle.", "start": 101.05233333333331, "voiceEnd": 107.22816666666664, "end": 113.40399999999997, "voiceSeconds": 6.175833333333333, "pauseSeconds": 6.175833333333333, "sourceStart": 56.07116666666667, "sourceEnd": 62.247, "zh": "这里的不同街区按种族被清楚地划分和标示出来。"}, {"index": 17, "text": "It was unfair and needed reforming.", "start": 113.40399999999997, "voiceEnd": 116.34999999999997, "end": 119.29599999999996, "voiceSeconds": 2.946, "pauseSeconds": 2.946, "sourceStart": 62.747, "sourceEnd": 65.693, "zh": "这很不公平，需要改革。"}, {"index": 18, "text": "But with nowhere else to go,", "start": 119.29599999999996, "voiceEnd": 121.28624999999997, "end": 123.27649999999997, "voiceSeconds": 1.99025, "pauseSeconds": 1.99025, "sourceStart": 66.233, "sourceEnd": 68.22325, "zh": "但是，因为没有别的地方可去，"}, {"index": 19, "text": "my nephew lived on and managed to make a life for himself.", "start": 123.27649999999997, "voiceEnd": 127.56074999999997, "end": 131.84499999999997, "voiceSeconds": 4.28425, "pauseSeconds": 4.28425, "sourceStart": 68.42325, "sourceEnd": 72.7075, "zh": "我的侄子继续住下，努力为自己谋生活。"}, {"index": 20, "text": "My nephew’s fortune came", "start": 131.84499999999997, "voiceEnd": 133.8857083333333, "end": 135.92641666666663, "voiceSeconds": 2.0407083333333333, "pauseSeconds": 2.0407083333333333, "sourceStart": 73.1975, "sourceEnd": 75.23820833333333, "zh": "侄子的好运来了，"}, {"index": 21, "text": "when he bravely helped a conductor brake a tram", "start": 135.92641666666663, "voiceEnd": 139.26999999999995, "end": 142.61358333333328, "voiceSeconds": 3.343583333333333, "pauseSeconds": 3.343583333333333, "sourceStart": 75.23820833333333, "sourceEnd": 78.58179166666666, "zh": "当他勇敢地帮助一名列车员刹住电车，"}, {"index": 22, "text": "to stop it from slipping out of the rails.", "start": 142.61358333333328, "voiceEnd": 145.49945833333328, "end": 148.38533333333328, "voiceSeconds": 2.885875, "pauseSeconds": 2.885875, "sourceStart": 78.58179166666666, "sourceEnd": 81.46766666666667, "zh": "阻止电车脱轨时。"}, {"index": 23, "text": "The man was elected vice chairman of the Socialist Party later.", "start": 148.38533333333328, "voiceEnd": 153.28099999999995, "end": 158.17666666666662, "voiceSeconds": 4.895666666666667, "pauseSeconds": 4.895666666666667, "sourceStart": 81.96766666666667, "sourceEnd": 86.86333333333333, "zh": "后来，那个人当选为社会党的副主席。"}, {"index": 24, "text": "It occurred to my nephew", "start": 158.17666666666662, "voiceEnd": 159.89154166666663, "end": 161.60641666666663, "voiceSeconds": 1.714875, "pauseSeconds": 1.714875, "sourceStart": 87.33333333333333, "sourceEnd": 89.04820833333333, "zh": "我的侄子忽然想到，"}, {"index": 25, "text": "that he could grasp this opportunity", "start": 161.60641666666663, "voiceEnd": 164.09087499999995, "end": 166.5753333333333, "voiceSeconds": 2.4844583333333334, "pauseSeconds": 2.4844583333333334, "sourceStart": 89.04820833333333, "sourceEnd": 91.53266666666667, "zh": "自己可以抓住这个机会，"}, {"index": 26, "text": "to ask for his help.", "start": 166.5753333333333, "voiceEnd": 168.32199999999997, "end": 170.06866666666664, "voiceSeconds": 1.7466666666666666, "pauseSeconds": 1.7466666666666666, "sourceStart": 91.53266666666667, "sourceEnd": 93.27933333333333, "zh": "向他寻求帮助。"}, {"index": 27, "text": "The man who was thankful helped him apply to the civil authority", "start": 170.06866666666664, "voiceEnd": 174.43045833333332, "end": 178.79224999999997, "voiceSeconds": 4.361791666666667, "pauseSeconds": 4.361791666666667, "sourceStart": 93.78933333333333, "sourceEnd": 98.151125, "zh": "那个人心怀感激，帮助侄子向民政机构申请，"}, {"index": 28, "text": "for the right to live in America", "start": 178.79224999999997, "voiceEnd": 180.85866666666664, "end": 182.9250833333333, "voiceSeconds": 2.0664166666666666, "pauseSeconds": 2.0664166666666666, "sourceStart": 98.151125, "sourceEnd": 100.21754166666666, "zh": "申请在美国居住的权利，"}, {"index": 29, "text": "by inserting his brave deed into his documents.", "start": 182.9250833333333, "voiceEnd": 186.64887499999998, "end": 190.37266666666665, "voiceSeconds": 3.7237916666666666, "pauseSeconds": 3.7237916666666666, "sourceStart": 100.21754166666666, "sourceEnd": 103.94133333333333, "zh": "把他的英勇事迹补充进申请材料。"}, {"index": 30, "text": "Unlike a great many other applicants,", "start": 190.37266666666665, "voiceEnd": 193.22724999999997, "end": 196.08183333333332, "voiceSeconds": 2.8545833333333333, "pauseSeconds": 2.8545833333333333, "sourceStart": 104.43133333333333, "sourceEnd": 107.28591666666667, "zh": "与许多其他申请人不同，"}, {"index": 31, "text": "his application was approved by the Federal Justice Ministry.", "start": 196.08183333333332, "voiceEnd": 200.51325, "end": 204.94466666666665, "voiceSeconds": 4.431416666666666, "pauseSeconds": 4.431416666666666, "sourceStart": 107.55591666666666, "sourceEnd": 111.98733333333334, "zh": "他的申请获得了联邦司法部门的批准。"}, {"index": 32, "text": "Before long, he started his own bakery and lived a better life.", "start": 204.94466666666665, "voiceEnd": 209.99033333333333, "end": 215.03599999999997, "voiceSeconds": 5.0456666666666665, "pauseSeconds": 5.0456666666666665, "sourceStart": 112.43733333333333, "sourceEnd": 117.483, "zh": "不久，他开了自己的面包店，生活有了改善。"}], "duration": 215.03599999999997, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "22": {"day": 22, "title": "Be Careful about Cloning", "groups": [{"index": 0, "text": "Be Careful about Cloning.", "start": 0, "voiceEnd": 2.2761666666666667, "end": 4.552333333333333, "voiceSeconds": 2.2761666666666667, "pauseSeconds": 2.2761666666666667, "sourceStart": 0.245, "sourceEnd": 2.521166666666667, "zh": "谨慎对待克隆。"}, {"index": 1, "text": "After a series of initial experiments and corrections,", "start": 4.552333333333333, "voiceEnd": 8.380916666666668, "end": 12.2095, "voiceSeconds": 3.8285833333333334, "pauseSeconds": 3.8285833333333334, "sourceStart": 3.0311666666666666, "sourceEnd": 6.85975, "zh": "经过一系列初步实验和修正，"}, {"index": 2, "text": "the scientist’s hard work paid off", "start": 12.2095, "voiceEnd": 14.801125, "end": 17.39275, "voiceSeconds": 2.591625, "pauseSeconds": 2.591625, "sourceStart": 7.20975, "sourceEnd": 9.801375, "zh": "科学家的辛勤工作终于有了回报，"}, {"index": 3, "text": "when the twin clone turkeys were hatched with normal feathers and claws.", "start": 17.39275, "voiceEnd": 22.194375, "end": 26.996, "voiceSeconds": 4.801625, "pauseSeconds": 4.801625, "sourceStart": 9.801375, "sourceEnd": 14.603, "zh": "两只克隆火鸡孵化出来，羽毛和爪子都很正常。"}, {"index": 4, "text": "This breakthrough possibly enabled people to bring their adored pets back to life.", "start": 26.996, "voiceEnd": 33.096333333333334, "end": 39.196666666666665, "voiceSeconds": 6.100333333333333, "pauseSeconds": 6.100333333333333, "sourceStart": 15.093, "sourceEnd": 21.19333333333333, "zh": "这项突破也许能让人们心爱的宠物起死回生。"}, {"index": 5, "text": "However, it bothered him from time to time", "start": 39.196666666666665, "voiceEnd": 42.54066666666667, "end": 45.88466666666667, "voiceSeconds": 3.344, "pauseSeconds": 3.344, "sourceStart": 21.683333333333334, "sourceEnd": 25.027333333333335, "zh": "然而，这件事不时困扰着他："}, {"index": 6, "text": "that their health was in poor condition", "start": 45.88466666666667, "voiceEnd": 48.27491666666667, "end": 50.665166666666664, "voiceSeconds": 2.39025, "pauseSeconds": 2.39025, "sourceStart": 25.027333333333335, "sourceEnd": 27.417583333333333, "zh": "它们的健康状况很差，"}, {"index": 7, "text": "because they were unable to resist illnesses.", "start": 50.665166666666664, "voiceEnd": 53.694583333333334, "end": 56.724, "voiceSeconds": 3.0294166666666666, "pauseSeconds": 3.0294166666666666, "sourceStart": 27.417583333333333, "sourceEnd": 30.447, "zh": "因为它们无法抵抗疾病。"}, {"index": 8, "text": "This drawback cast him down.", "start": 56.724, "voiceEnd": 59.20466666666666, "end": 61.68533333333333, "voiceSeconds": 2.4806666666666666, "pauseSeconds": 2.4806666666666666, "sourceStart": 30.977, "sourceEnd": 33.45766666666667, "zh": "这个缺陷使他非常沮丧。"}, {"index": 9, "text": "Merely 2 weeks later,", "start": 61.68533333333333, "voiceEnd": 63.618833333333335, "end": 65.55233333333334, "voiceSeconds": 1.9335, "pauseSeconds": 1.9335, "sourceStart": 33.937666666666665, "sourceEnd": 35.87116666666667, "zh": "仅仅两周后，"}, {"index": 10, "text": "the clones and their carrier died,", "start": 65.55233333333334, "voiceEnd": 68.00225, "end": 70.45216666666667, "voiceSeconds": 2.4499166666666667, "pauseSeconds": 2.4499166666666667, "sourceStart": 35.991166666666665, "sourceEnd": 38.44108333333333, "zh": "克隆体和它们的代孕母体都死了，"}, {"index": 11, "text": "which struck frustration into his heart.", "start": 70.45216666666667, "voiceEnd": 73.31041666666667, "end": 76.16866666666667, "voiceSeconds": 2.85825, "pauseSeconds": 2.85825, "sourceStart": 38.72108333333333, "sourceEnd": 41.57933333333333, "zh": "这让他深受挫败。"}, {"index": 12, "text": "He retired before he attained his ambition", "start": 76.16866666666667, "voiceEnd": 79.39604166666666, "end": 82.62341666666667, "voiceSeconds": 3.227375, "pauseSeconds": 3.227375, "sourceStart": 42.089333333333336, "sourceEnd": 45.31670833333333, "zh": "他还没实现抱负就退休了，"}, {"index": 13, "text": "and became a member of an opera chorus", "start": 82.62341666666667, "voiceEnd": 85.40625, "end": 88.18908333333334, "voiceSeconds": 2.7828333333333335, "pauseSeconds": 2.7828333333333335, "sourceStart": 45.31670833333333, "sourceEnd": 48.09954166666667, "zh": "成为一个歌剧合唱团的成员，"}, {"index": 14, "text": "to relieve his depression.", "start": 88.18908333333334, "voiceEnd": 89.93854166666668, "end": 91.68800000000002, "voiceSeconds": 1.7494583333333333, "pauseSeconds": 1.7494583333333333, "sourceStart": 48.09954166666667, "sourceEnd": 49.849, "zh": "以缓解自己的消沉。"}, {"index": 15, "text": "Shortly afterwards, the media published a conservative argument objecting to cloning owing to moral problems,", "start": 91.68800000000002, "voiceEnd": 99.63995833333335, "end": 107.59191666666669, "voiceSeconds": 7.951958333333334, "pauseSeconds": 7.951958333333334, "sourceStart": 50.349, "sourceEnd": 58.300958333333334, "zh": "不久后，媒体出于道德问题发表了反对克隆的保守观点，"}, {"index": 16, "text": "and suggested the constitution include compulsory regulations", "start": 107.59191666666669, "voiceEnd": 112.08891666666669, "end": 116.58591666666669, "voiceSeconds": 4.497, "pauseSeconds": 4.497, "sourceStart": 58.620958333333334, "sourceEnd": 63.117958333333334, "zh": "并建议宪法纳入强制性规定，"}, {"index": 17, "text": "to forbid obtaining commercial profits from cloning.", "start": 116.58591666666669, "voiceEnd": 120.25729166666669, "end": 123.92866666666669, "voiceSeconds": 3.671375, "pauseSeconds": 3.671375, "sourceStart": 63.117958333333334, "sourceEnd": 66.78933333333333, "zh": "禁止通过克隆获取商业利润。"}, {"index": 18, "text": "When interviewed, the scientist stared at the decorations on the ceiling,", "start": 123.92866666666669, "voiceEnd": 128.8909166666667, "end": 133.85316666666668, "voiceSeconds":
