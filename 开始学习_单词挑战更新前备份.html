4.96225, "pauseSeconds": 4.96225, "sourceStart": 67.32933333333334, "sourceEnd": 72.29158333333334, "zh": "接受采访时，科学家盯着天花板上的装饰，"}, {"index": 19, "text": "thinking for a while,", "start": 133.85316666666668, "voiceEnd": 135.25508333333335, "end": 136.657, "voiceSeconds": 1.4019166666666667, "pauseSeconds": 1.4019166666666667, "sourceStart": 72.55158333333334, "sourceEnd": 73.9535, "zh": "想了一会儿，"}, {"index": 20, "text": "and then said,", "start": 136.657, "voiceEnd": 137.67375, "end": 138.69050000000001, "voiceSeconds": 1.01675, "pauseSeconds": 1.01675, "sourceStart": 74.1235, "sourceEnd": 75.14025, "zh": "然后说："}, {"index": 21, "text": "“I’m not in favour of any arbitrary assumption,", "start": 138.69050000000001, "voiceEnd": 141.87254166666668, "end": 145.05458333333334, "voiceSeconds": 3.1820416666666667, "pauseSeconds": 3.1820416666666667, "sourceStart": 75.33025, "sourceEnd": 78.51229166666667, "zh": "“我不赞成任何武断的假设，"}, {"index": 22, "text": "but undertaking cloning does differ", "start": 145.05458333333334, "voiceEnd": 147.47008333333335, "end": 149.88558333333333, "voiceSeconds": 2.4155, "pauseSeconds": 2.4155, "sourceStart": 78.86229166666666, "sourceEnd": 81.27779166666667, "zh": "但开展克隆确实不同，"}, {"index": 23, "text": "from the straightforward procedure of making loaves out of flour.", "start": 149.88558333333333, "voiceEnd": 154.23729166666666, "end": 158.589, "voiceSeconds": 4.351708333333334, "pauseSeconds": 4.351708333333334, "sourceStart": 81.27779166666667, "sourceEnd": 85.6295, "zh": "不同于用面粉制作面包那样直接明了的过程。"}, {"index": 24, "text": "Until we accumulate enough exact knowledge,", "start": 158.589, "voiceEnd": 161.92766666666665, "end": 165.26633333333334, "voiceSeconds": 3.3386666666666667, "pauseSeconds": 3.3386666666666667, "sourceStart": 86.0895, "sourceEnd": 89.42816666666667, "zh": "在积累足够准确的知识之前，"}, {"index": 25, "text": "any practice is in vain and is bound to fail.", "start": 165.26633333333334, "voiceEnd": 168.9275, "end": 172.58866666666665, "voiceSeconds": 3.6611666666666665, "pauseSeconds": 3.6611666666666665, "sourceStart": 89.61816666666667, "sourceEnd": 93.27933333333333, "zh": "任何尝试都是徒劳的，注定会失败。"}, {"index": 26, "text": "Altogether, being more careful is reasonable or we may walk into a side road.”", "start": 172.58866666666665, "voiceEnd": 178.80433333333332, "end": 185.01999999999998, "voiceSeconds": 6.2156666666666665, "pauseSeconds": 6.2156666666666665, "sourceStart": 93.78933333333333, "sourceEnd": 100.005, "zh": "总之，更谨慎是合理的，否则我们可能走上岔路。”"}], "duration": 185.01999999999998, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "23": {"day": 23, "title": "Strange Patent Applications", "groups": [{"index": 0, "text": "Strange Patent Applications.", "start": 0, "voiceEnd": 2.820666666666667, "end": 5.641333333333334, "voiceSeconds": 2.820666666666667, "pauseSeconds": 2.820666666666667, "sourceStart": 0.195, "sourceEnd": 3.0156666666666667, "zh": "奇怪的专利申请。"}, {"index": 1, "text": "I set about working in the current Patent Office", "start": 5.641333333333334, "voiceEnd": 9.238958333333333, "end": 12.836583333333333, "voiceSeconds": 3.597625, "pauseSeconds": 3.597625, "sourceStart": 3.5356666666666667, "sourceEnd": 7.133291666666667, "zh": "我开始在现在的专利局工作，"}, {"index": 2, "text": "after resigning from the court personnel.", "start": 12.836583333333333, "voiceEnd": 15.722958333333334, "end": 18.609333333333332, "voiceSeconds": 2.886375, "pauseSeconds": 2.886375, "sourceStart": 7.133291666666667, "sourceEnd": 10.019666666666666, "zh": "是在从法院辞职之后。"}, {"index": 3, "text": "Competent and dynamic,", "start": 18.609333333333332, "voiceEnd": 20.601875, "end": 22.594416666666664, "voiceSeconds": 1.9925416666666667, "pauseSeconds": 1.9925416666666667, "sourceStart": 10.559666666666667, "sourceEnd": 12.552208333333333, "zh": "我能干而且精力充沛，"}, {"index": 4, "text": "I never feel passive", "start": 22.594416666666664, "voiceEnd": 24.170666666666662, "end": 25.746916666666664, "voiceSeconds": 1.57625, "pauseSeconds": 1.57625, "sourceStart": 12.772208333333333, "sourceEnd": 14.348458333333333, "zh": "从不觉得自己是在消极应付，"}, {"index": 5, "text": "while diving into the identifications", "start": 25.746916666666664, "voiceEnd": 28.34808333333333, "end": 30.94925, "voiceSeconds": 2.601166666666667, "pauseSeconds": 2.601166666666667, "sourceStart": 14.348458333333333, "sourceEnd": 16.949625, "zh": "而是深入开展审查，"}, {"index": 6, "text": "of whether applications are valid and practical", "start": 30.94925, "voiceEnd": 34.35075, "end": 37.75225, "voiceSeconds": 3.4015, "pauseSeconds": 3.4015, "sourceStart": 16.949625, "sourceEnd": 20.351125, "zh": "判断申请是否有效、是否实用，"}, {"index": 7, "text": "according to the new version of the criteria.", "start": 37.75225, "voiceEnd": 40.74095833333333, "end": 43.72966666666666, "voiceSeconds": 2.9887083333333333, "pauseSeconds": 2.9887083333333333, "sourceStart": 20.351125, "sourceEnd": 23.339833333333335, "zh": "依据的是最新版本的标准。"}, {"index": 8, "text": "With the expectation of distinguishing their own importance,", "start": 43.72966666666666, "voiceEnd": 47.69745833333333, "end": 51.66524999999999, "voiceSeconds": 3.967791666666667, "pauseSeconds": 3.967791666666667, "sourceStart": 23.879833333333334, "sourceEnd": 27.847625, "zh": "为了彰显自己的重要性，"}, {"index": 9, "text": "some people leave the beaten track", "start": 51.66524999999999, "voiceEnd": 53.79516666666666, "end": 55.925083333333326, "voiceSeconds": 2.1299166666666665, "pauseSeconds": 2.1299166666666665, "sourceStart": 28.097625, "sourceEnd": 30.227541666666667, "zh": "有些人不走寻常路，"}, {"index": 10, "text": "and file strange products with us now and then,", "start": 55.925083333333326, "voiceEnd": 59.08087499999999, "end": 62.23666666666666, "voiceSeconds": 3.1557916666666666, "pauseSeconds": 3.1557916666666666, "sourceStart": 30.227541666666667, "sourceEnd": 33.38333333333333, "zh": "时不时向我们提交古怪的产品申请，"}, {"index": 11, "text": "for example, lantern that can be attached to your forehead,", "start": 62.23666666666666, "voiceEnd": 66.19391666666665, "end": 70.15116666666665, "voiceSeconds": 3.95725, "pauseSeconds": 3.95725, "sourceStart": 33.623333333333335, "sourceEnd": 37.58058333333334, "zh": "比如能固定在额头上的灯笼，"}, {"index": 12, "text": "cubic walnuts, refrigerator made of straw and glue,", "start": 70.15116666666665, "voiceEnd": 74.35970833333332, "end": 78.56824999999999, "voiceSeconds": 4.208541666666667, "pauseSeconds": 4.208541666666667, "sourceStart": 37.870583333333336, "sourceEnd": 42.079125, "zh": "方形核桃、用稻草和胶水制成的冰箱，"}, {"index": 13, "text": "perfume that nobody can bear to smell,", "start": 78.56824999999999, "voiceEnd": 81.22220833333333, "end": 83.87616666666666, "voiceSeconds": 2.653958333333333, "pauseSeconds": 2.653958333333333, "sourceStart": 42.379125, "sourceEnd": 45.03308333333333, "zh": "让人闻了无法忍受的香水，"}, {"index": 14, "text": "and so on.", "start": 83.87616666666666, "voiceEnd": 84.82058333333333, "end": 85.765, "voiceSeconds": 0.9444166666666667, "pauseSeconds": 0.9444166666666667, "sourceStart": 45.113083333333336, "sourceEnd": 46.0575, "zh": "等等。"}, {"index": 15, "text": "Once, a man made a triangular helicopter out of stainless wires and string.", "start": 85.765, "voiceEnd": 92.0185, "end": 98.272, "voiceSeconds": 6.2535, "pauseSeconds": 6.2535, "sourceStart": 46.5475, "sourceEnd": 52.801, "zh": "一次，一个人用不锈钢丝和绳子做了一架三角形直升机。"}, {"index": 16, "text": "He called us up", "start": 98.272, "voiceEnd": 99.37295833333334, "end": 100.47391666666667, "voiceSeconds": 1.1009583333333333, "pauseSeconds": 1.1009583333333333, "sourceStart": 53.301, "sourceEnd": 54.40195833333333, "zh": "他给我们打来电话，"}, {"index": 17, "text": "and merrily claimed it was stable and convenient to use,", "start": 100.47391666666667, "voiceEnd": 104.73325, "end": 108.99258333333333, "voiceSeconds": 4.259333333333333, "pauseSeconds": 4.259333333333333, "sourceStart": 54.41695833333333, "sourceEnd": 58.676291666666664, "zh": "兴高采烈地声称它稳定、使用方便，"}, {"index": 18, "text": "and never out of order.", "start": 108.99258333333333, "voiceEnd": 110.54395833333332, "end": 112.09533333333333, "voiceSeconds": 1.551375, "pauseSeconds": 1.551375, "sourceStart": 58.916291666666666, "sourceEnd": 60.467666666666666, "zh": "而且从不出故障。"}, {"index": 19, "text": "I asked him to hang on,", "start": 112.09533333333333, "voiceEnd": 113.852875, "end": 115.61041666666667, "voiceSeconds": 1.7575416666666666, "pauseSeconds": 1.7575416666666666, "sourceStart": 60.967666666666666, "sourceEnd": 62.725208333333335, "zh": "我让他稍等，"}, {"index": 20, "text": "but this innocent man just rang off", "start": 115.61041666666667, "voiceEnd": 118.20358333333333, "end": 120.79675, "voiceSeconds": 2.593166666666667, "pauseSeconds": 2.593166666666667, "sourceStart": 63.03520833333334, "sourceEnd": 65.628375, "zh": "但这个天真的人直接挂断电话，"}, {"index": 21, "text": "and set out to fly from his courtyard.", "start": 120.79675, "voiceEnd": 123.53204166666667, "end": 126.26733333333334, "voiceSeconds": 2.7352916666666665, "pauseSeconds": 2.7352916666666665, "sourceStart": 65.628375, "sourceEnd": 68.36366666666666, "zh": "开始从自家院子起飞。"}, {"index": 22, "text": "I dialed his number in the directory trying to ring him back,", "start": 126.26733333333334, "voiceEnd": 130.68195833333334, "end": 135.09658333333334, "voiceSeconds": 4.414625, "pauseSeconds": 4.414625, "sourceStart": 68.86366666666666, "sourceEnd": 73.27829166666666, "zh": "我拨打通讯录里的号码，想给他回电话，"}, {"index": 23, "text": "but never got through.", "start": 135.09658333333334, "voiceEnd": 136.70962500000002, "end": 138.32266666666666, "voiceSeconds": 1.6130416666666667, "pauseSeconds": 1.6130416666666667, "sourceStart": 73.63829166666666, "sourceEnd": 75.25133333333333, "zh": "却始终没接通。"}, {"index": 24, "text": "By the mercy of God,", "start": 138.32266666666666, "voiceEnd": 139.96291666666667, "end": 141.60316666666665, "voiceSeconds": 1.64025, "pauseSeconds": 1.64025, "sourceStart": 75.78133333333334, "sourceEnd": 77.42158333333333, "zh": "幸得上天眷顾，"}, {"index": 25, "text": "an abrupt freezing rainfall made his powder wet.", "start": 141.60316666666665, "voiceEnd": 145.30941666666666, "end": 149.01566666666665, "voiceSeconds": 3.70625, "pauseSeconds": 3.70625, "sourceStart": 77.63158333333334, "sourceEnd": 81.33783333333334, "zh": "一场突如其来的冰冷降雨打湿了他的火药。"}, {"index": 26, "text": "Luckily, the trouble was without any extension", "start": 149.01566666666665, "voiceEnd": 152.69437499999998, "end": 156.3730833333333, "voiceSeconds": 3.6787083333333332, "pauseSeconds": 3.6787083333333332, "sourceStart": 81.83783333333334, "sourceEnd": 85.51654166666667, "zh": "幸运的是，事情没有进一步恶化，"}, {"index": 27, "text": "except that he crashed into a greengrocer’s", "start": 156.3730833333333, "voiceEnd": 159.38799999999998, "end": 162.40291666666664, "voiceSeconds": 3.0149166666666667, "pauseSeconds": 3.0149166666666667, "sourceStart": 85.51654166666667, "sourceEnd": 88.53145833333333, "zh": "只是他撞进了一家蔬果店，"}, {"index": 28, "text": "making all the ripe fruits become messy jam.", "start": 162.40291666666664, "voiceEnd": 165.6344583333333, "end": 168.86599999999999, "voiceSeconds": 3.2315416666666668, "pauseSeconds": 3.2315416666666668, "sourceStart": 88.53145833333333, "sourceEnd": 91.763, "zh": "把所有熟透的水果弄成了乱糟糟的果酱。"}, {"index": 29, "text": "When people seized this crazy man with caution", "start": 168.86599999999999, "voiceEnd": 172.35054166666666, "end": 175.83508333333333, "voiceSeconds": 3.484541666666667, "pauseSeconds": 3.484541666666667, "sourceStart": 92.303, "sourceEnd": 95.78754166666667, "zh": "人们小心地抓住这个疯狂的人，"}, {"index": 30, "text": "and sobered him by tapping his face,", "start": 175.83508333333333, "voiceEnd": 178.45316666666668, "end": 181.07125, "voiceSeconds": 2.6180833333333333, "pauseSeconds": 2.6180833333333333, "sourceStart": 95.78754166666667, "sourceEnd": 98.405625, "zh": "轻拍他的脸让他清醒过来，"}, {"index": 31, "text": "he complained about the bad weather", "start": 181.07125, "voiceEnd": 183.06979166666665, "end": 185.06833333333333, "voiceSeconds": 1.9985416666666667, "pauseSeconds": 1.9985416666666667, "sourceStart": 98.705625, "sourceEnd": 100.70416666666667, "zh": "他却抱怨起糟糕的天气，"}, {"index": 32, "text": "instead of associating his failure with his unscientific design.", "start": 185.06833333333333, "voiceEnd": 189.78916666666666, "end": 194.51, "voiceSeconds": 4.720833333333333, "pauseSeconds": 4.720833333333333, "sourceStart": 100.70416666666667, "sourceEnd": 105.425, "zh": "而没有把失败与自己不科学的设计联系起来。"}], "duration": 194.51, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "24": {"day": 24, "title": "Pronunciation and Status", "groups": [{"index": 0, "text": "Pronunciation and Status.", "start": 0, "voiceEnd": 2.7468333333333335, "end": 5.493666666666667, "voiceSeconds": 2.7468333333333335, "pauseSeconds": 2.7468333333333335, "sourceStart": 0.245, "sourceEnd": 2.991833333333333, "zh": "发音与身份。"}, {"index": 1, "text": "An ambassador and a referee were consulting a professor", "start": 5.493666666666667, "voiceEnd": 9.655375, "end": 13.817083333333333, "voiceSeconds": 4.161708333333333, "pauseSeconds": 4.161708333333333, "sourceStart": 3.5418333333333334, "sourceEnd": 7.703541666666666, "zh": "一位大使和一位裁判正在请教一位教授，"}, {"index": 2, "text": "on the caption of a Buddhistic alphabet", "start": 13.817083333333333, "voiceEnd": 16.533625, "end": 19.250166666666665, "voiceSeconds": 2.7165416666666666, "pauseSeconds": 2.7165416666666666, "sourceStart": 7.703541666666666, "sourceEnd": 10.420083333333332, "zh": "询问一套佛教字母的说明文字，"}, {"index": 3, "text": "when a sobbing woman stopped them", "start": 19.250166666666665, "voiceEnd": 21.292125, "end": 23.334083333333332, "voiceSeconds": 2.0419583333333335, "pauseSeconds": 2.0419583333333335, "sourceStart": 10.420083333333332, "sourceEnd": 12.462041666666666, "zh": "这时，一个抽泣的女人拦住了他们，"}, {"index": 4, "text": "to sell an antique musical bathtub.", "start": 23.334083333333332, "voiceEnd": 26.22520833333333, "end": 29.116333333333333, "voiceSeconds": 2.891125, "pauseSeconds": 2.891125, "sourceStart": 12.462041666666666, "sourceEnd": 15.353166666666667, "zh": "想卖给他们一个古董音乐浴缸。"}, {"index": 5, "text": "Her dirty garment and the handkerchief around her waist", "start": 29.116333333333333, "voiceEnd": 32.98204166666667, "end": 36.84775, "voiceSeconds": 3.8657083333333335, "pauseSeconds": 3.8657083333333335, "sourceStart": 15.813166666666667, "sourceEnd": 19.678875, "zh": "她肮脏的衣服和围在腰上的手帕，"}, {"index": 6, "text": "were badly in need of being sent to a laundry.", "start": 36.84775, "voiceEnd": 39.951208333333334, "end": 43.05466666666666, "voiceSeconds": 3.103458333333333, "pauseSeconds": 3.103458333333333, "sourceStart": 19.733875, "sourceEnd": 22.837333333333333, "zh": "急需送进洗衣店清洗。"}, {"index": 7, "text": "The ambassador uncomfortably gave her a handful of pence", "start": 43.05466666666666, "voiceEnd": 46.99958333333333, "end": 50.9445, "voiceSeconds": 3.944916666666667, "pauseSeconds": 3.944916666666667, "sourceStart": 23.287333333333333, "sourceEnd": 27.23225, "zh": "大使有些不自在，给了她一把硬币，"}, {"index": 8, "text": "from his wallet and said,", "start": 50.9445, "voiceEnd": 52.691125, "end": 54.43775, "voiceSeconds": 1.746625, "pauseSeconds": 1.746625, "sourceStart": 27.23225, "sourceEnd": 28.978875, "zh": "从钱包里掏出来，并说道："}, {"index": 9, "text": "“Take this fortune away,", "start": 54.43775, "voiceEnd": 56.234500000000004, "end": 58.03125, "voiceSeconds": 1.79675, "pauseSeconds": 1.79675, "sourceStart": 29.348875, "sourceEnd": 31.145625, "zh": "“拿着这笔钱走吧，"}, {"index": 10, "text": "troublesome woman.”", "start": 58.03125, "voiceEnd": 59.29329166666667, "end": 60.55533333333334, "voiceSeconds": 1.2620416666666667, "pauseSeconds": 1.2620416666666667, "sourceStart": 31.345625, "sourceEnd": 32.60766666666667, "zh": "你这个烦人的女人。”"}, {"index": 11, "text": "When her figure faded away,", "start": 60.55533333333334, "voiceEnd": 62.625, "end": 64.69466666666668, "voiceSeconds": 2.0696666666666665, "pauseSeconds": 2.0696666666666665, "sourceStart": 33.117666666666665, "sourceEnd": 35.187333333333335, "zh": "她的身影逐渐消失后，"}, {"index": 12, "text": "the brilliant professor said,", "start": 64.69466666666668, "voiceEnd": 66.52904166666667, "end": 68.36341666666668, "voiceSeconds": 1.834375, "pauseSeconds": 1.834375, "sourceStart": 35.37733333333333, "sourceEnd": 37.211708333333334, "zh": "那位聪明的教授说："}, {"index": 13, "text": "“You are mistaken and your improper remark on her should be condemned.", "start": 68.36341666666668, "voiceEnd": 73.16270833333334, "end": 77.96200000000002, "voiceSeconds": 4.799291666666667, "pauseSeconds": 4.799291666666667, "sourceStart": 37.55170833333333, "sourceEnd": 42.351, "zh": "“你错了，你对她的不当评论应该受到谴责。"}, {"index": 14, "text": "In terms of this extraordinary woman,", "start": 77.96200000000002, "voiceEnd": 80.72283333333336, "end": 83.48366666666668, "voiceSeconds": 2.7608333333333333, "pauseSeconds": 2.7608333333333333, "sourceStart": 42.851, "sourceEnd": 45.61183333333334, "zh": "说到这位不同寻常的女士，"}, {"index": 15, "text": "you can’t classify her status by her horrible clothes or disgusting nails.", "start": 83.48366666666668, "voiceEnd": 89.37683333333335, "end": 95.27000000000001, "voiceSeconds": 5.893166666666667, "pauseSeconds": 5.893166666666667, "sourceStart": 45.871833333333335, "sourceEnd": 51.765, "zh": "你不能凭她糟糕的衣服和脏指甲判断她的身份。"}, {"index": 16, "text": "Her clean woolen vest and stockings,", "start": 95.27000000000001, "voiceEnd": 98.12587500000001, "end": 100.98175, "voiceSeconds": 2.855875, "pauseSeconds": 2.855875, "sourceStart": 52.255, "sourceEnd": 55.110875, "zh": "她干净的羊毛背心和长袜，"}, {"index": 17, "text": "especially her classic pronunciation,", "start": 100.98175, "voiceEnd": 103.89995833333334, "end": 106.81816666666667, "voiceSeconds": 2.9182083333333333, "pauseSeconds": 2.9182083333333333, "sourceStart": 55.330875, "sourceEnd": 58.24908333333333, "zh": "尤其是她规范的发音，"}, {"index": 18, "text": "all suggested her upper status.”", "start": 106.81816666666667, "voiceEnd": 109.34275000000001, "end": 111.86733333333333, "voiceSeconds": 2.524583333333333, "pauseSeconds": 2.524583333333333, "sourceStart": 58.48908333333333, "sourceEnd": 61.013666666666666, "zh": "都暗示着她较高的社会地位。”"}, {"index": 19, "text": "The ambassador gave a whistle in amazement,", "start": 111.86733333333333, "voiceEnd": 115.03541666666666, "end": 118.2035, "voiceSeconds": 3.168083333333333, "pauseSeconds": 3.168083333333333, "sourceStart": 61.523666666666664, "sourceEnd": 64.69175, "zh": "大使惊讶地吹了一声口哨，"}, {"index": 20, "text": "and advised making her acquaintance.", "start": 118.2035, "voiceEnd": 121.02541666666667, "end": 123.84733333333334, "voiceSeconds": 2.8219166666666666, "pauseSeconds": 2.8219166666666666, "sourceStart": 64.94175, "sourceEnd": 67.76366666666667, "zh": "建议去结识她。"}, {"index": 21, "text": "The professor hesitated for a while,", "start": 123.84733333333334, "voiceEnd": 126.74891666666667, "end": 129.6505, "voiceSeconds": 2.9015833333333334, "pauseSeconds": 2.9015833333333334, "sourceStart": 68.27366666666667, "sourceEnd": 71.17525, "zh": "教授犹豫了一会儿，"}, {"index": 22, "text": "then compromised.", "start": 129.6505, "voiceEnd": 131.11891666666665, "end": 132.58733333333333, "voiceSeconds": 1.4684166666666667, "pauseSeconds": 1.4684166666666667, "sourceStart": 71.44525, "sourceEnd": 72.91366666666667, "zh": "随后同意了。"}, {"index": 23, "text": "The outcome was that she was an authentic superior police officer.", "start": 132.58733333333333, "voiceEnd": 137.627, "end": 142.66666666666666, "voiceSeconds": 5.039666666666666, "pauseSeconds": 5.039666666666666, "sourceStart": 73.41366666666667, "sourceEnd": 78.45333333333333, "zh": "结果，她竟是一位货真价实的高级警官。"}, {"index": 24, "text": "When they were shown in her office and saw her once more,", "start": 142.66666666666666, "voiceEnd": 146.19979166666667, "end": 149.73291666666665, "voiceSeconds": 3.533125, "pauseSeconds": 3.533125, "sourceStart": 78.98333333333333, "sourceEnd": 82.51645833333333, "zh": "当他们被领进她的办公室，再次见到她时，"}, {"index": 25, "text": "she brought them a teapot of tea and some cookies,", "start": 149.73291666666665, "voiceEnd": 153.02429166666664, "end": 156.31566666666666, "voiceSeconds": 3.291375, "pauseSeconds": 3.291375, "sourceStart": 82.72645833333333, "sourceEnd": 86.01783333333333, "zh": "她给他们端来一壶茶和一些饼干，"}, {"index": 26, "text": "laughing and saying,", "start": 156.31566666666666, "voiceEnd": 157.69591666666665, "end": 159.07616666666667, "voiceSeconds": 1.38025, "pauseSeconds": 1.38025, "sourceStart": 86.25783333333334, "sourceEnd": 87.63808333333333, "zh": "笑着说："}, {"index": 27, "text": "“I rubbed some cream and wax on my garment", "start": 159.07616666666667, "voiceEnd": 161.85270833333334, "end": 164.62925, "voiceSeconds": 2.7765416666666667, "pauseSeconds": 2.7765416666666667, "sourceStart": 87.92808333333333, "sourceEnd": 90.704625, "zh": "“我在衣服上抹了些乳霜和蜡，"}, {"index": 28, "text": "and passed myself off as a shabby woman", "start": 164.62925, "voiceEnd": 167.1942916666667, "end": 169.75933333333336, "voiceSeconds": 2.5650416666666667, "pauseSeconds": 2.5650416666666667, "sourceStart": 90.704625, "sourceEnd": 93.26966666666667, "zh": "把自己伪装成一个衣衫褴褛的女人，"}, {"index": 29, "text": "among thieves and robbers", "start": 169.75933333333336, "voiceEnd": 171.33162500000003, "end": 172.9039166666667, "voiceSeconds": 1.5722916666666666, "pauseSeconds": 1.5722916666666666, "sourceStart": 93.26966666666667, "sourceEnd": 94.84195833333334, "zh": "混在小偷和强盗中间，"}, {"index": 30, "text": "to investigate a plot.", "start": 172.9039166666667, "voiceEnd": 174.72145833333337, "end": 176.53900000000004, "voiceSeconds": 1.8175416666666666, "pauseSeconds": 1.8175416666666666, "sourceStart": 94.84195833333334, "sourceEnd": 96.6595, "zh": "调查一场阴谋。"}, {"index": 31, "text": "Generally speaking, your overlooking me and my adaptation are the best help.", "start": 176.53900000000004, "voiceEnd": 182.71900000000005, "end": 188.89900000000006, "voiceSeconds": 6.18, "pauseSeconds": 6.18, "sourceStart": 97.1795, "sourceEnd": 103.3595, "zh": "一般来说，你们不注意我，加上我的随机应变，就是最好的帮助。"}, {"index": 32, "text": "But my pronunciation seemed to have betrayed me.”", "start": 188.89900000000006, "voiceEnd": 192.74850000000006, "end": 196.59800000000007, "voiceSeconds": 3.8495, "pauseSeconds": 3.8495, "sourceStart": 103.8895, "sourceEnd": 107.739, "zh": "但我的发音似乎暴露了我。”"}], "duration": 196.59800000000007, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "25": {"day": 25, "title": "A Sly Murder", "groups": [{"index": 0, "text": "A Sly Murder.", "start": 0, "voiceEnd": 1.4423333333333332, "end": 2.8846666666666665, "voiceSeconds": 1.4423333333333332, "pauseSeconds": 1.4423333333333332, "sourceStart": 0.195, "sourceEnd": 1.6373333333333333, "zh": "狡猾的谋杀案。"}, {"index": 1, "text": "When giving a lecture about the significance of punctuation,", "start": 2.8846666666666665, "voiceEnd": 6.921666666666667, "end": 10.958666666666666, "voiceSeconds": 4.037, "pauseSeconds": 4.037, "sourceStart": 2.1473333333333335, "sourceEnd": 6.184333333333333, "zh": "正在讲解标点符号的重要性时，"}, {"index": 2, "text": "the academic professor was interrupted and arrested by the police", "start": 10.958666666666666, "voiceEnd": 15.598708333333333, "end": 20.23875, "voiceSeconds": 4.640041666666667, "pauseSeconds": 4.640041666666667, "sourceStart": 6.4943333333333335, "sourceEnd": 11.134375, "zh": "这位学院教授的讲座被打断，他被警方逮捕，"}, {"index": 3, "text": "for murdering his wife,", "start": 20.23875, "voiceEnd": 21.893375, "end": 23.548, "voiceSeconds": 1.654625, "pauseSeconds": 1.654625, "sourceStart": 11.134375, "sourceEnd": 12.789, "zh": "因为他谋杀了自己的妻子，"}, {"index": 4, "text": "a receptionist of a kindergarten.", "start": 23.548, "voiceEnd": 25.945999999999998, "end": 28.343999999999998, "voiceSeconds": 2.398, "pauseSeconds": 2.398, "sourceStart": 13.049, "sourceEnd": 15.447, "zh": "她是一名幼儿园接待员。"}, {"index": 5, "text": "The police found some photos he deleted from their e-album", "start": 28.343999999999998, "voiceEnd": 32.72108333333333, "end": 37.098166666666664, "voiceSeconds": 4.377083333333333, "pauseSeconds": 4.377083333333333, "sourceStart": 15.957, "sourceEnd": 20.334083333333332, "zh": "警方找到了他从电子相册中删除的一些照片，"}, {"index": 6, "text": "showing that they used to have a happy life.", "start": 37.098166666666664, "voiceEnd": 39.88775, "end": 42.67733333333333, "voiceSeconds": 2.7895833333333333, "pauseSeconds": 2.7895833333333333, "sourceStart": 20.334083333333332, "sourceEnd": 23.123666666666665, "zh": "显示他们过去曾过着幸福的生活。"}, {"index": 7, "text": "But, fed up with her wrinkled face,", "start": 42.67733333333333, "voiceEnd": 45.497375, "end": 48.31741666666666, "voiceSeconds": 2.8200416666666666, "pauseSeconds": 2.8200416666666666, "sourceStart": 23.613666666666667, "sourceEnd": 26.433708333333332, "zh": "但他厌倦了她布满皱纹的脸，"}, {"index": 8, "text": "he murdered her instead of divorcing her to avoid fortune division.", "start": 48.31741666666666, "voiceEnd": 53.04104166666666, "end": 57.764666666666656, "voiceSeconds": 4.723625, "pauseSeconds": 4.723625, "sourceStart": 26.713708333333333, "sourceEnd": 31.437333333333335, "zh": "为了避免离婚时分割财产，他杀害了她，而没有选择离婚。"}, {"index": 9, "text": "He cut up a kind of seashell with a sharpened knife,", "start": 57.764666666666656, "voiceEnd": 61.35166666666666, "end": 64.93866666666666, "voiceSeconds": 3.587, "pauseSeconds": 3.587, "sourceStart": 31.937333333333335, "sourceEnd": 35.52433333333333, "zh": "他用磨尖的刀切碎了一种贝壳，"}, {"index": 10, "text": "and hammered it into powder on a skateboard,", "start": 64.93866666666666, "voiceEnd": 67.72333333333333, "end": 70.508, "voiceSeconds": 2.784666666666667, "pauseSeconds": 2.784666666666667, "sourceStart": 35.724333333333334, "sourceEnd": 38.509, "zh": "在滑板上把它锤成粉末，"}, {"index": 11, "text": "and made at most one gram,", "start": 70.508, "voiceEnd": 72.509, "end": 74.50999999999999, "voiceSeconds": 2.001, "pauseSeconds": 2.001, "sourceStart": 38.799, "sourceEnd": 40.8, "zh": "制成的量至多一克，"}, {"index": 12, "text": "which was enough to accelerate one’s pulse until he or she died.", "start": 74.50999999999999, "voiceEnd": 79.09366666666666, "end": 83.67733333333332, "voiceSeconds": 4.583666666666667, "pauseSeconds": 4.583666666666667, "sourceStart": 41.07, "sourceEnd": 45.653666666666666, "zh": "按故事的说法，这足以使人的脉搏加快，直至死亡。"}, {"index": 13, "text": "This kind of poison can date back to 10,000 BC", "start": 83.67733333333332, "voiceEnd": 87.97754166666665, "end": 92.27774999999998, "voiceSeconds": 4.300208333333333, "pauseSeconds": 4.300208333333333, "sourceStart": 46.163666666666664, "sourceEnd": 50.463875, "zh": "这种毒物的使用可追溯到公元前一万年，"}, {"index": 14, "text": "when people rubbed it on spears to kill beasts.", "start": 92.27774999999998, "voiceEnd": 95.77687499999999, "end": 99.27599999999998, "voiceSeconds": 3.499125, "pauseSeconds": 3.499125, "sourceStart": 50.463875, "sourceEnd": 53.963, "zh": "当时人们把它涂在长矛上杀死野兽。"}, {"index": 15, "text": "The professor mixed the poison with onion,", "start": 99.27599999999998, "voiceEnd": 102.29629166666665, "end": 105.31658333333331, "voiceSeconds": 3.0202916666666666, "pauseSeconds": 3.0202916666666666, "sourceStart": 54.463, "sourceEnd": 57.483291666666666, "zh": "教授把毒物与洋葱混在一起，"}, {"index": 16, "text": "watermelon and yogurt for his wife.", "start": 105.31658333333331, "voiceEnd": 108.35662499999998, "end": 111.39666666666665, "voiceSeconds": 3.0400416666666668, "pauseSeconds": 3.0400416666666668, "sourceStart": 57.663291666666666, "sourceEnd": 60.70333333333333, "zh": "又加上西瓜和酸奶，给妻子吃。"}, {"index": 17, "text": "Howling and scratching her chest,", "start": 111.39666666666665, "voiceEnd": 113.84033333333332, "end": 116.28399999999998, "voiceSeconds": 2.4436666666666667, "pauseSeconds": 2.4436666666666667, "sourceStart": 61.18333333333333, "sourceEnd": 63.627, "zh": "她嚎叫着，抓挠自己的胸口，"}, {"index": 18, "text": "she felt dizzy and died soon.", "start": 116.28399999999998, "voiceEnd": 118.86033333333332, "end": 121.43666666666664, "voiceSeconds": 2.5763333333333334, "pauseSeconds": 2.5763333333333334, "sourceStart": 63.877, "sourceEnd": 66.45333333333333, "zh": "感到头晕，很快就死了。"}, {"index": 19, "text": "After tentative examination,", "start": 121.43666666666664, "voiceEnd": 123.79508333333331, "end": 126.15349999999998, "voiceSeconds": 2.358416666666667, "pauseSeconds": 2.358416666666667, "sourceStart": 66.93333333333334, "sourceEnd": 69.29175, "zh": "初步检查之后，"}, {"index": 20, "text": "the police assumed she died of heart disease.", "start": 126.15349999999998, "voiceEnd": 129.50074999999998, "end": 132.84799999999998, "voiceSeconds": 3.34725, "pauseSeconds": 3.34725, "sourceStart": 69.55175, "sourceEnd": 72.899, "zh": "警方以为她死于心脏病。"}, {"index": 21, "text": "But systematic botanical analyses showed", "start": 132.84799999999998, "voiceEnd": 136.28704166666665, "end": 139.72608333333332, "voiceSeconds": 3.4390416666666668, "pauseSeconds": 3.4390416666666668, "sourceStart": 73.449, "sourceEnd": 76.88804166666667, "zh": "但系统的植物学分析显示，"}, {"index": 22, "text": "that the watermelon spit on the messy mat and the quilt", "start": 139.72608333333332, "voiceEnd": 143.50775, "end": 147.28941666666665, "voiceSeconds": 3.7816666666666667, "pauseSeconds": 3.7816666666666667, "sourceStart": 76.88804166666667, "sourceEnd": 80.66970833333333, "zh": "她吐在凌乱垫子和被子上的西瓜，"}, {"index": 23, "text": "was poisonous.", "start": 147.28941666666665, "voiceEnd": 148.59554166666666, "end": 149.90166666666664, "voiceSeconds": 1.306125, "pauseSeconds": 1.306125, "sourceStart": 80.66970833333333, "sourceEnd": 81.97583333333333, "zh": "是有毒的。"}, {"index": 24, "text": "Regardless of exhaustion and starvation,", "start": 149.90166666666664, "voiceEnd": 153.07216666666665, "end": 156.24266666666665, "voiceSeconds": 3.1705, "pauseSeconds": 3.1705, "sourceStart": 82.47583333333333, "sourceEnd": 85.64633333333333, "zh": "不顾疲惫与饥饿，"}, {"index": 25, "text": "the acute and skilful policemen used radioactive equipment", "start": 156.24266666666665, "voiceEnd": 160.88187499999998, "end": 165.5210833333333, "voiceSeconds": 4.639208333333333, "pauseSeconds": 4.639208333333333, "sourceStart": 85.92633333333333, "sourceEnd": 90.56554166666666, "zh": "敏锐、熟练的警察使用了放射性设备，"}, {"index": 26, "text": "to make sure the category of the poison.", "start": 165.5210833333333, "voiceEnd": 168.10054166666663, "end": 170.67999999999998, "voiceSeconds": 2.579458333333333, "pauseSeconds": 2.579458333333333, "sourceStart": 90.56554166666666, "sourceEnd": 93.145, "zh": "确定毒物的类别。"}, {"index": 27, "text": "Primitive and not ample as their alternative equipment was,", "start": 170.67999999999998, "voiceEnd": 175.16349999999997, "end": 179.647, "voiceSeconds": 4.4835, "pauseSeconds": 4.4835, "sourceStart": 93.705, "sourceEnd": 98.1885, "zh": "尽管替代设备简陋而且不足，"}, {"index": 28, "text": "they got perfect accuracy somehow.", "start": 179.647, "voiceEnd": 182.31433333333334, "end": 184.98166666666665, "voiceSeconds": 2.667333333333333, "pauseSeconds": 2.667333333333333, "sourceStart": 98.5285, "sourceEnd": 101.19583333333334, "zh": "他们还是设法得出了非常准确的结果。"}, {"index": 29, "text": "People applauded the police", "start": 184.98166666666665, "voiceEnd": 186.95083333333332, "end": 188.92, "voiceSeconds": 1.9691666666666667, "pauseSeconds": 1.9691666666666667, "sourceStart": 101.70583333333333, "sourceEnd": 103.675, "zh": "人们为警方鼓掌，"}, {"index": 30, "text": "and the woman’s family can look ahead with relief now.", "start": 188.92, "voiceEnd": 192.78199999999998, "end": 196.64399999999998, "voiceSeconds": 3.862, "pauseSeconds": 3.862, "sourceStart": 103.675, "sourceEnd": 107.537, "zh": "而这位女子的家人，现在也能稍感宽慰地面对未来。"}], "duration": 196.64399999999998, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "26": {"day": 26, "title": "Fall in Love with English", "groups": [{"index": 0, "text": "Fall in Love with English.", "start": 0, "voiceEnd": 2.1926666666666668, "end": 4.3853333333333335, "voiceSeconds": 2.1926666666666668, "pauseSeconds": 2.1926666666666668, "sourceStart": 0.195, "sourceEnd": 2.3876666666666666, "zh": "爱上英语。"}, {"index": 1, "text": "Hiding behind the loose dusty curtain,", "start": 4.3853333333333335, "voiceEnd": 7.294333333333333, "end": 10.203333333333333, "voiceSeconds": 2.909, "pauseSeconds": 2.909, "sourceStart": 2.877666666666667, "sourceEnd": 5.786666666666667, "zh": "躲在松垮、落满灰尘的窗帘后面，"}, {"index": 2, "text": "a teenager packed up his overcoat into the suitcase.", "start": 10.203333333333333, "voiceEnd": 14.218333333333334, "end": 18.233333333333334, "voiceSeconds": 4.015, "pauseSeconds": 4.015, "sourceStart": 6.046666666666667, "sourceEnd": 10.061666666666667, "zh": "一个少年把大衣装进了行李箱。"}, {"index": 3, "text": "He planned to leave home at dusk", "start": 18.233333333333334, "voiceEnd": 20.387500000000003, "end": 22.541666666666668, "voiceSeconds": 2.154166666666667, "pauseSeconds": 2.154166666666667, "sourceStart": 10.561666666666667, "sourceEnd": 12.715833333333334, "zh": "他打算在黄昏时离家，"}, {"index": 4, "text": "though there was thunder and lightning outdoors.", "start": 22.541666666666668, "voiceEnd": 25.763166666666667, "end": 28.98466666666667, "voiceSeconds": 3.2215, "pauseSeconds": 3.2215, "sourceStart": 12.715833333333334, "sourceEnd": 15.937333333333333, "zh": "尽管外面雷鸣电闪。"}, {"index": 5, "text": "He had got to do this", "start": 28.98466666666667, "voiceEnd": 30.47229166666667, "end": 31.95991666666667, "voiceSeconds": 1.487625, "pauseSeconds": 1.487625, "sourceStart": 16.447333333333333, "sourceEnd": 17.934958333333334, "zh": "他觉得自己不得不这么做，"}, {"index": 6, "text": "because he was tired of his parents’ nagging about his English study", "start": 31.95991666666667, "voiceEnd": 36.375708333333336, "end": 40.7915, "voiceSeconds": 4.415791666666666, "pauseSeconds": 4.415791666666666, "sourceStart": 17.934958333333334, "sourceEnd": 22.35075, "zh": "因为他厌倦了父母对自己英语学习的唠叨，"}, {"index": 7, "text": "and did not want to go through it any longer.", "start": 40.7915, "voiceEnd": 43.60008333333333, "end": 46.40866666666667, "voiceSeconds": 2.8085833333333334, "pauseSeconds": 2.8085833333333334, "sourceStart": 22.35075, "sourceEnd": 25.159333333333333, "zh": "不想再忍受下去。"}, {"index": 8, "text": "He couldn’t get along well with English", "start": 46.40866666666667, "voiceEnd": 48.78608333333334, "end": 51.1635, "voiceSeconds": 2.3774166666666665, "pauseSeconds": 2.3774166666666665, "sourceStart": 25.639333333333333, "sourceEnd": 28.01675, "zh": "他的英语总是学不好，"}, {"index": 9, "text": "and disliked joining in English classes", "start": 51.1635, "voiceEnd": 54.04654166666666, "end": 56.92958333333333, "voiceSeconds": 2.8830416666666667, "pauseSeconds": 2.8830416666666667, "sourceStart": 28.01675, "sourceEnd": 30.899791666666665, "zh": "也不喜欢参加英语课，"}, {"index": 10, "text": "because he thought his teacher ignored him on purpose.", "start": 56.92958333333333, "voiceEnd": 60.44745833333333, "end": 63.965333333333334, "voiceSeconds": 3.517875, "pauseSeconds": 3.517875, "sourceStart": 30.899791666666665, "sourceEnd": 34.41766666666667, "zh": "因为他觉得老师在故意忽视他。"}, {"index": 11, "text": "As a result,", "start": 63.965333333333334, "voiceEnd": 65.129375, "end": 66.29341666666667, "voiceSeconds": 1.1640416666666666, "pauseSeconds": 1.1640416666666666, "sourceStart": 34.91766666666667, "sourceEnd": 36.08170833333333, "zh": "结果，"}, {"index": 12, "text": "his score in each exam never added up to over 60.", "start": 66.29341666666667, "voiceEnd": 70.44304166666667, "end": 74.59266666666667, "voiceSeconds": 4.149625, "pauseSeconds": 4.149625, "sourceStart": 36.32170833333333, "sourceEnd": 40.471333333333334, "zh": "他每次考试的分数都没有超过60分。"}, {"index": 13, "text": "His partner was concerned about him very much.", "start": 74.59266666666667, "voiceEnd": 78.269, "end": 81.94533333333334, "voiceSeconds": 3.6763333333333335, "pauseSeconds": 3.6763333333333335, "sourceStart": 40.94133333333333, "sourceEnd": 44.617666666666665, "zh": "他的伙伴非常关心他。"}, {"index": 14, "text": "She understood exactly what he was suffering from,", "start": 81.94533333333334, "voiceEnd": 85.41416666666667, "end": 88.88300000000001, "voiceSeconds": 3.4688333333333334, "pauseSeconds": 3.4688333333333334, "sourceStart": 45.117666666666665, "sourceEnd": 48.5865, "zh": "她完全理解他的苦恼，"}, {"index": 15, "text": "but entirely disagreed with his idea.", "start": 88.88300000000001, "voiceEnd": 91.89383333333335, "end": 94.90466666666667, "voiceSeconds": 3.0108333333333333, "pauseSeconds": 3.0108333333333333, "sourceStart": 48.9465, "sourceEnd": 51.95733333333333, "zh": "但十分反对他的想法。"}, {"index": 16, "text": "In order to calm him down and settle his problem,", "start": 94.90466666666667, "voiceEnd": 98.28516666666667, "end": 101.66566666666667, "voiceSeconds": 3.3805, "pauseSeconds": 3.3805, "sourceStart": 52.42733333333333, "sourceEnd": 55.807833333333335, "zh": "为了让他冷静下来、解决问题，"}, {"index": 17, "text": "she talked with him face to face", "start": 101.66566666666667, "voiceEnd": 103.94375, "end": 106.22183333333334, "voiceSeconds": 2.2780833333333335, "pauseSeconds": 2.2780833333333335, "sourceStart": 56.087833333333336, "sourceEnd": 58.365916666666664, "zh": "她与他面对面地交谈，"}, {"index": 18, "text": "and swapped a series of learning tips with him.", "start": 106.22183333333334, "voiceEnd": 109.24558333333334, "end": 112.26933333333334, "voiceSeconds": 3.02375, "pauseSeconds": 3.02375, "sourceStart": 58.365916666666664, "sourceEnd": 61.38966666666666, "zh": "分享了一系列学习技巧。"}, {"index": 19, "text": "The items she set down helped him find the highway", "start": 112.26933333333334, "voiceEnd": 116.09866666666667, "end": 119.928, "voiceSeconds": 3.8293333333333335, "pauseSeconds": 3.8293333333333335, "sourceStart": 61.86966666666667, "sourceEnd": 65.699, "zh": "她记下的这些要点帮助他找到了捷径，"}, {"index": 20, "text": "to studying English well.", "start": 119.928, "voiceEnd": 121.87233333333333, "end": 123.81666666666666, "voiceSeconds": 1.9443333333333332, "pauseSeconds": 1.9443333333333332, "sourceStart": 65.699, "sourceEnd": 67.64333333333333, "zh": "通向学好英语的道路。"}, {"index": 21, "text": "The teenager was grateful and got great power from his friend’s words.", "start": 123.81666666666666, "voiceEnd": 129.13433333333333, "end": 134.452, "voiceSeconds": 5.317666666666667, "pauseSeconds": 5.317666666666667, "sourceStart": 68.14333333333333, "sourceEnd": 73.461, "zh": "少年很感激，从朋友的话中获得了巨大力量。"}, {"index": 22, "text": "Now, he has recovered from being upset and has fallen in love with English.", "start": 134.452, "voiceEnd": 140.236, "end": 146.02, "voiceSeconds": 5.784, "pauseSeconds": 5.784, "sourceStart": 73.941, "sourceEnd": 79.725, "zh": "如今，他摆脱了沮丧，已经爱上了英语。"}], "duration": 146.02, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "27": {"day": 27, "title": "Different Countries Have Different Kinds of Englishes", "groups": [{"index": 0, "text": "Different Countries Have Different Kinds of Englishes.", "start": 0, "voiceEnd": 3.9723333333333333, "end": 7.9446666666666665, "voiceSeconds": 3.9723333333333333, "pauseSeconds": 3.9723333333333333, "sourceStart": 0.215, "sourceEnd": 4.187333333333333, "zh": "不同国家有不同的英语。"}, {"index": 1, "text": "Voyages of people from England", "start": 7.9446666666666665, "voiceEnd": 10.308875, "end": 12.673083333333334, "voiceSeconds": 2.3642083333333335, "pauseSeconds": 2.3642083333333335, "sourceStart": 4.677333333333333, "sourceEnd": 7.041541666666666, "zh": "英国人跨海远行，"}, {"index": 2, "text": "play an important part in spreading the English language.", "start": 12.673083333333334, "voiceEnd": 16.758208333333336, "end": 20.843333333333334, "voiceSeconds": 4.085125, "pauseSeconds": 4.085125, "sourceStart": 7.086541666666666, "sourceEnd": 11.171666666666667, "zh": "对英语的传播起了重要作用。"}, {"index": 3, "text": "At present, English is frequently spoken as an official or common language in many countries,", "start": 20.843333333333334, "voiceEnd": 27.858125, "end": 34.87291666666667, "voiceSeconds": 7.0147916666666665, "pauseSeconds": 7.0147916666666665, "sourceStart": 11.661666666666667, "sourceEnd": 18.676458333333333, "zh": "如今，英语在许多国家被广泛用作官方语言或通用语言，"}, {"index": 4, "text": "such as America,", "start": 34.87291666666667, "voiceEnd": 36.24029166666667, "end": 37.60766666666667, "voiceSeconds": 1.367375, "pauseSeconds": 1.367375, "sourceStart": 18.946458333333332, "sourceEnd": 20.313833333333335, "zh": "例如美国，"}, {"index": 5, "text": "Singapore, Malaysia and some African countries.", "start": 37.60766666666667, "voiceEnd": 41.71483333333333, "end": 45.822, "voiceSeconds": 4.107166666666667, "pauseSeconds": 4.107166666666667, "sourceStart": 20.493833333333335, "sourceEnd": 24.601, "zh": "新加坡、马来西亚，以及一些非洲国家。"}, {"index": 6, "text": "The English varieties spoken in these countries,", "start": 45.822, "voiceEnd": 49.31820833333334, "end": 52.814416666666666, "voiceSeconds": 3.496208333333333, "pauseSeconds": 3.496208333333333, "sourceStart": 25.101, "sourceEnd": 28.597208333333334, "zh": "这些国家使用的各种英语，"}, {"index": 7, "text": "all based on British English,", "start": 52.814416666666666, "voiceEnd": 54.815958333333334, "end": 56.8175, "voiceSeconds": 2.0015416666666668, "pauseSeconds": 2.0015416666666668, "sourceStart": 28.797208333333334, "sourceEnd": 30.79875, "zh": "都以英式英语为基础，"}, {"index": 8, "text": "can be well understood by native English speakers.", "start": 56.8175, "voiceEnd": 60.393750000000004, "end": 63.97, "voiceSeconds": 3.57625, "pauseSeconds": 3.57625, "sourceStart": 31.12875, "sourceEnd": 34.705, "zh": "能被英语母语者很好地理解。"}, {"index": 9, "text": "But actually, these Englishes have been gradually changing in accents,", "start": 63.97, "voiceEnd": 69.05166666666666, "end": 74.13333333333333, "voiceSeconds": 5.081666666666667, "pauseSeconds": 5.081666666666667, "sourceStart": 35.235, "sourceEnd": 40.31666666666667, "zh": "但实际上，这些英语的口音正逐渐发生变化，"}, {"index": 10, "text": "spellings, expressions and the usage of vocabulary.", "start": 74.13333333333333, "voiceEnd": 78.59183333333333, "end": 83.05033333333333, "voiceSeconds": 4.4585, "pauseSeconds": 4.4585, "sourceStart": 40.516666666666666, "sourceEnd": 44.97516666666667, "zh": "拼写、表达方式以及词汇用法也在改变。"}, {"index": 11, "text": "Because of this fact,", "start": 83.05033333333333, "voiceEnd": 84.63137499999999, "end": 86.21241666666666, "voiceSeconds": 1.5810416666666667, "pauseSeconds": 1.5810416666666667, "sourceStart": 45.415166666666664, "sourceEnd": 46.996208333333335, "zh": "正因为如此，"}, {"index": 12, "text": "you can make use of the differences", "start": 86.21241666666666, "voiceEnd": 88.42183333333332, "end": 90.63125, "voiceSeconds": 2.209416666666667, "pauseSeconds": 2.209416666666667, "sourceStart": 47.216208333333334, "sourceEnd": 49.425625, "zh": "你可以利用这些差异，"}, {"index": 13, "text": "to tell which country the foreigners of your block are from.", "start": 90.63125, "voiceEnd": 94.36295833333332, "end": 98.09466666666665, "voiceSeconds": 3.731708333333333, "pauseSeconds": 3.731708333333333, "sourceStart": 49.425625, "sourceEnd": 53.157333333333334, "zh": "判断你所在街区的外国人来自哪个国家。"}, {"index": 14, "text": "For example, if a boss fluently commands his driver,", "start": 98.09466666666665, "voiceEnd": 102.05854166666666, "end": 106.02241666666666, "voiceSeconds": 3.963875, "pauseSeconds": 3.963875, "sourceStart": 53.617333333333335, "sourceEnd": 57.581208333333336, "zh": "例如，如果一个老板流利地命令司机："}, {"index": 15, "text": "“Come up straight to my apartment by elevator", "start": 106.02241666666666, "voiceEnd": 108.94416666666666, "end": 111.86591666666666, "voiceSeconds": 2.92175, "pauseSeconds": 2.92175, "sourceStart": 57.911208333333335, "sourceEnd": 60.83295833333333, "zh": "“乘电梯（elevator）直接到我的公寓（apartment）来，"}, {"index": 16, "text": "and take some gas for my trucks and cabs ”,", "start": 111.86591666666666, "voiceEnd": 114.76079166666666, "end": 117.65566666666666, "voiceSeconds": 2.894875, "pauseSeconds": 2.894875, "sourceStart": 60.83295833333333, "sourceEnd": 63.727833333333336, "zh": "给我的卡车（trucks）和出租车（cabs）带些汽油（gas）”，"}, {"index": 17, "text": "instead of requesting,", "start": 117.65566666666666, "voiceEnd": 119.173125, "end": 120.69058333333332, "voiceSeconds": 1.5174583333333334, "pauseSeconds": 1.5174583333333334, "sourceStart": 64.04783333333333, "sourceEnd": 65.56529166666667, "zh": "而不是这样请求："}, {"index": 18, "text": "“Please come to my flat by lift", "start": 120.69058333333332, "voiceEnd": 122.73583333333332, "end": 124.78108333333333, "voiceSeconds": 2.04525, "pauseSeconds": 2.04525, "sourceStart": 65.86529166666666, "sourceEnd": 67.91054166666666, "zh": "“请乘电梯（lift）到我的公寓（flat）来，"}, {"index": 19, "text": "and take some petrol for my lorries and taxis ”,", "start": 124.78108333333333, "voiceEnd": 127.86524999999999, "end": 130.94941666666665, "voiceSeconds": 3.0841666666666665, "pauseSeconds": 3.0841666666666665, "sourceStart": 67.91054166666666, "sourceEnd": 70.99470833333334, "zh": "给我的货车（lorries）和出租车（taxis）带些汽油（petrol）”，"}, {"index": 20, "text": "you can recognize his American identity,", "start": 130.94941666666665, "voiceEnd": 133.77329166666664, "end": 136.59716666666665, "voiceSeconds": 2.823875, "pauseSeconds": 2.823875, "sourceStart": 71.29470833333333, "sourceEnd": 74.11858333333333, "zh": "你就能判断出他是美国人，"}, {"index": 21, "text": "while the latter suggests that he is British.", "start": 136.59716666666665, "voiceEnd": 140.05158333333333, "end": 143.50599999999997, "voiceSeconds": 3.4544166666666665, "pauseSeconds": 3.4544166666666665, "sourceStart": 74.39858333333333, "sourceEnd": 77.853, "zh": "而后一种用词则暗示他是英国人。"}], "duration": 143.50599999999997, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "28": {"day": 28, "title": "A Hard Trip", "groups": [{"index": 0, "text": "A Hard Trip.", "start": 0, "voiceEnd": 1.2943333333333333, "end": 2.5886666666666667, "voiceSeconds": 1.2943333333333333, "pauseSeconds": 1.2943333333333333, "sourceStart": 0.195, "sourceEnd": 1.4893333333333334, "zh": "艰难的旅程。"}, {"index": 1, "text": "My sister was fond of traveling.", "start": 2.5886666666666667, "voiceEnd": 5.1946666666666665, "end": 7.800666666666666, "voiceSeconds": 2.606, "pauseSeconds": 2.606, "sourceStart": 1.9993333333333334, "sourceEnd": 4.605333333333333, "zh": "我姐姐很喜欢旅行。"}, {"index": 2, "text": "Ever since graduating,", "start": 7.800666666666666, "voiceEnd": 9.637208333333334, "end": 11.473749999999999, "voiceSeconds": 1.8365416666666667, "pauseSeconds": 1.8365416666666667, "sourceStart": 5.075333333333333, "sourceEnd": 6.911875, "zh": "从毕业起，"}, {"index": 3, "text": "she had been determined to organize a trip to an old temple.", "start": 11.473749999999999, "voiceEnd": 15.837208333333333, "end": 20.200666666666663, "voiceSeconds": 4.363458333333333, "pauseSeconds": 4.363458333333333, "sourceStart": 7.151875, "sourceEnd": 11.515333333333333, "zh": "她就决心组织一次前往古庙的旅行。"}, {"index": 4, "text": "Since the transport fare was expensive,", "start": 20.200666666666663, "voiceEnd": 23.250291666666662, "end": 26.29991666666666, "voiceSeconds": 3.049625, "pauseSeconds": 3.049625, "sourceStart": 12.035333333333334, "sourceEnd": 15.084958333333333, "zh": "由于交通费用昂贵，"}, {"index": 5, "text": "she decided to use a bicycle to cycle there", "start": 26.29991666666666, "voiceEnd": 29.425916666666662, "end": 32.55191666666666, "voiceSeconds": 3.126, "pauseSeconds": 3.126, "sourceStart": 15.324958333333333, "sourceEnd": 18.450958333333332, "zh": "她决定骑自行车过去，"}, {"index": 6, "text": "not caring about the disadvantages.", "start": 32.55191666666666, "voiceEnd": 35.366625, "end": 38.18133333333333, "voiceSeconds": 2.8147083333333334, "pauseSeconds": 2.8147083333333334, "sourceStart": 18.450958333333332, "sourceEnd": 21.265666666666668, "zh": "并不在乎这种方式的缺点。"}, {"index": 7, "text": "Her stubborn attitude was always her shortcoming.", "start": 38.18133333333333, "voiceEnd": 41.952999999999996, "end": 45.724666666666664, "voiceSeconds": 3.7716666666666665, "pauseSeconds": 3.7716666666666665, "sourceStart": 21.765666666666668, "sourceEnd": 25.537333333333333, "zh": "固执一直是她的缺点。"}, {"index": 8, "text": "Once she made up her mind to do something,", "start": 45.724666666666664, "voiceEnd": 48.705124999999995, "end": 51.685583333333334, "voiceSeconds": 2.9804583333333334, "pauseSeconds": 2.9804583333333334, "sourceStart": 26.037333333333333, "sourceEnd": 29.017791666666668, "zh": "一旦她下定决心做某事，"}, {"index": 9, "text": "no one could persuade her to change her mind.", "start": 51.685583333333334, "voiceEnd": 54.728791666666666, "end": 57.772, "voiceSeconds": 3.0432083333333333, "pauseSeconds": 3.0432083333333333, "sourceStart": 29.267791666666668, "sourceEnd": 32.311, "zh": "就没人能说服她改变主意。"}, {"index": 10, "text": "Finally, we gave in as usual though we preferred to take a train.", "start": 57.772, "voiceEnd": 62.782333333333334, "end": 67.79266666666666, "voiceSeconds": 5.0103333333333335, "pauseSeconds": 5.0103333333333335, "sourceStart": 32.801, "sourceEnd": 37.81133333333333, "zh": "最后，我们像往常一样让步了，尽管我们更想坐火车。"}, {"index": 11, "text": "After we prepared everything,", "start": 67.79266666666666, "voiceEnd": 69.881875, "end": 71.97108333333333, "voiceSeconds": 2.089208333333333, "pauseSeconds": 2.089208333333333, "sourceStart": 38.281333333333336, "sourceEnd": 40.37054166666667, "zh": "准备好一切之后，"}, {"index": 12, "text": "including the schedule,", "start": 71.97108333333333, "voiceEnd": 73.66733333333333, "end": 75.36358333333332, "voiceSeconds": 1.69625, "pauseSeconds": 1.69625, "sourceStart": 40.530541666666664, "sourceEnd": 42.226791666666664, "zh": "包括行程表，"}, {"index": 13, "text": "reliable weather forecast and the insurance,", "start": 75.36358333333332, "voiceEnd": 78.64574999999999, "end": 81.92791666666666, "voiceSeconds": 3.2821666666666665, "pauseSeconds": 3.2821666666666665, "sourceStart": 42.33679166666667, "sourceEnd": 45.61895833333333, "zh": "可靠的天气预报和保险，"}, {"index": 14, "text": "we began our trip.", "start": 81.92791666666666, "voiceEnd": 83.354625, "end": 84.78133333333332, "voiceSeconds": 1.4267083333333332, "pauseSeconds": 1.4267083333333332, "sourceStart": 45.89895833333333, "sourceEnd": 47.32566666666666, "zh": "我们踏上了旅程。"}, {"index": 15, "text": "Our journey was along a river flowing from a high altitude.", "start": 84.78133333333332, "voiceEnd": 89.48933333333332, "end": 94.19733333333332, "voiceSeconds": 4.708, "pauseSeconds": 4.708, "sourceStart": 47.80566666666667, "sourceEnd": 52.513666666666666, "zh": "我们沿着一条从高海拔地区流下来的河流前进。"}, {"index": 16, "text": "Our pace was slow", "start": 94.19733333333332, "voiceEnd": 95.58033333333331, "end": 96.96333333333332, "voiceSeconds": 1.383, "pauseSeconds": 1.383, "sourceStart": 53.013666666666666, "sourceEnd": 54.39666666666667, "zh": "行进的速度很慢，"}, {"index": 17, "text": "because the river frequently had many sharp bends", "start": 96.96333333333332, "voiceEnd": 100.36512499999999, "end": 103.76691666666666, "voiceSeconds": 3.4017916666666665, "pauseSeconds": 3.4017916666666665, "sourceStart": 54.39666666666667, "sourceEnd": 57.798458333333336, "zh": "因为河道常常急转弯，"}, {"index": 18, "text": "through deep valleys,", "start": 103.76691666666666, "voiceEnd": 105.08516666666667, "end": 106.40341666666666, "voiceSeconds": 1.31825, "pauseSeconds": 1.31825, "sourceStart": 57.798458333333336, "sourceEnd": 59.116708333333335, "zh": "穿过深深的山谷，"}, {"index": 19, "text": "where the water seemed to boil.", "start": 106.40341666666666, "voiceEnd": 108.46970833333333, "end": 110.53599999999999, "voiceSeconds": 2.066291666666667, "pauseSeconds": 2.066291666666667, "sourceStart": 59.42670833333333, "sourceEnd": 61.493, "zh": "那里的水仿佛在沸腾。"}, {"index": 20, "text": "Just as I recorded in my journal,", "start": 110.53599999999999, "voiceEnd": 113.07449999999999, "end": 115.61299999999999, "voiceSeconds": 2.5385, "pauseSeconds": 2.5385, "sourceStart": 61.983, "sourceEnd": 64.5215, "zh": "正如我在日记里记下的，"}, {"index": 21, "text": "it was really a hard journey.", "start": 115.61299999999999, "voiceEnd": 117.75916666666666, "end": 119.90533333333332, "voiceSeconds": 2.146166666666667, "pauseSeconds": 2.146166666666667, "sourceStart": 64.7115, "sourceEnd": 66.85766666666666, "zh": "这确实是一次艰难的旅行。"}, {"index": 22, "text": "But we also enjoyed great views.", "start": 119.90533333333332, "voiceEnd": 122.69749999999999, "end": 125.48966666666665, "voiceSeconds": 2.7921666666666667, "pauseSeconds": 2.7921666666666667, "sourceStart": 67.34766666666667, "sourceEnd": 70.13983333333333, "zh": "但我们也欣赏到了壮丽的风景。"}, {"index": 23, "text": "One night, I put my head on my pillow--a parcel of wool coats,", "start": 125.48966666666665, "voiceEnd": 130.51916666666665, "end": 135.54866666666666, "voiceSeconds": 5.0295, "pauseSeconds": 5.0295, "sourceStart": 70.63983333333333, "sourceEnd": 75.66933333333333, "zh": "一天晚上，我把头枕在枕头上——那是一包羊毛外套，"}, {"index": 24, "text": "and lay beneath the stars.", "start": 135.54866666666666, "voiceEnd": 137.451, "end": 139.35333333333332, "voiceSeconds": 1.9023333333333334, "pauseSeconds": 1.9023333333333334, "sourceStart": 75.87933333333334, "sourceEnd": 77.78166666666667, "zh": "躺在星空之下。"}, {"index": 25, "text": "When the flame in front of our cave went out at midnight,", "start": 139.35333333333332, "voiceEnd": 143.15875, "end": 146.96416666666667, "voiceSeconds": 3.8054166666666664, "pauseSeconds": 3.8054166666666664, "sourceStart": 78.26166666666667, "sourceEnd": 82.06708333333333, "zh": "午夜时，我们洞穴前的火熄灭了，"}, {"index": 26, "text": "I found the sky so beautiful!", "start": 146.96416666666667, "voiceEnd": 149.36808333333335, "end": 151.772, "voiceSeconds": 2.4039166666666665, "pauseSeconds": 2.4039166666666665, "sourceStart": 82.34708333333333, "sourceEnd": 84.751, "zh": "我发现天空竟然如此美丽！"}], "duration": 151.772, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "29": {"day": 29, "title": "A Horrible Earthquake", "groups": [{"index": 0, "text": "A Horrible Earthquake.", "start": 0, "voiceEnd": 2.004, "end": 4.008, "voiceSeconds": 2.004, "pauseSeconds": 2.004, "sourceStart": 0.195, "sourceEnd": 2.199, "zh": "可怕的地震。"}, {"index": 1, "text": "Dirty water rose in wells and canals before the earthquake.", "start": 4.008, "voiceEnd": 8.864333333333335, "end": 13.720666666666666, "voiceSeconds": 4.856333333333334, "pauseSeconds": 4.856333333333334, "sourceStart": 2.709, "sourceEnd": 7.565333333333333, "zh": "地震之前，井和水渠中的浑水水位上升了。"}, {"index": 2, "text": "But no one judged that an earthquake was coming.", "start": 13.720666666666666, "voiceEnd": 17.233166666666666, "end": 20.745666666666665, "voiceSeconds": 3.5125, "pauseSeconds": 3.5125, "sourceStart": 8.115333333333334, "sourceEnd": 11.627833333333333, "zh": "但没人判断出地震即将发生。"}, {"index": 3, "text": "Suddenly, everything shook.", "start": 20.745666666666665, "voiceEnd": 23.320833333333333, "end": 25.895999999999997, "voiceSeconds": 2.5751666666666666, "pauseSeconds": 2.5751666666666666, "sourceStart": 12.127833333333333, "sourceEnd": 14.703, "zh": "突然，一切都摇晃起来。"}, {"index": 4, "text": "It seemed as if the world was at an end.", "start": 25.895999999999997, "voiceEnd": 29.001999999999995, "end": 32.108, "voiceSeconds": 3.106, "pauseSeconds": 3.106, "sourceStart": 15.193, "sourceEnd": 18.299, "zh": "仿佛世界末日到了。"}, {"index": 5, "text": "Millions of brick houses and a number of dams were destroyed.", "start": 32.108, "voiceEnd": 36.806, "end": 41.504, "voiceSeconds": 4.698, "pauseSeconds": 4.698, "sourceStart": 18.799, "sourceEnd": 23.497, "zh": "数百万栋砖房和许多水坝遭到毁坏。"}, {"index": 6, "text": "Railway tracks became useless bars.", "start": 41.504, "voiceEnd": 44.748333333333335, "end": 47.992666666666665, "voiceSeconds": 3.2443333333333335, "pauseSeconds": 3.2443333333333335, "sourceStart": 23.997, "sourceEnd": 27.241333333333333, "zh": "铁轨变成了毫无用处的铁条。"}, {"index": 7, "text": "Pipes in mines burst and let out smelly steam.", "start": 47.992666666666665, "voiceEnd": 51.934666666666665, "end": 55.876666666666665, "voiceSeconds": 3.942, "pauseSeconds": 3.942, "sourceStart": 27.731333333333332, "sourceEnd": 31.673333333333332, "zh": "矿井里的管道爆裂，喷出难闻的蒸汽。"}, {"index": 8, "text": "Huge cracks trapped cyclists everywhere.", "start": 55.876666666666665, "voiceEnd": 59.305, "end": 62.733333333333334, "voiceSeconds": 3.4283333333333332, "pauseSeconds": 3.4283333333333332, "sourceStart": 32.13333333333333, "sourceEnd": 35.56166666666667, "zh": "巨大的裂缝把各处骑车的人困住了。"}, {"index": 9, "text": "The next day,", "start": 62.733333333333334, "voiceEnd": 63.869625, "end": 65.00591666666666, "voiceSeconds": 1.1362916666666667, "pauseSeconds": 1.1362916666666667, "sourceStart": 36.02166666666667, "sourceEnd": 37.15795833333333, "zh": "第二天，"}, {"index": 10, "text": "this event was the headline or main title of all newspapers.", "start": 65.00591666666666, "voiceEnd": 69.75695833333333, "end": 74.508, "voiceSeconds": 4.751041666666667, "pauseSeconds": 4.751041666666667, "sourceStart": 37.40795833333333, "sourceEnd": 42.159, "zh": "这件事成了所有报纸的头条或主要标题。"}, {"index": 11, "text": "With the reporters giving an outline of the disaster,", "start": 74.508, "voiceEnd": 78.27016666666667, "end": 82.03233333333333, "voiceSeconds": 3.762166666666667, "pauseSeconds": 3.762166666666667, "sourceStart": 42.649, "sourceEnd": 46.41116666666667, "zh": "记者概述了这场灾难，"}, {"index": 12, "text": "the whole nation was shocked by the damage and the victim’s extreme suffering.", "start": 82.03233333333333, "voiceEnd": 87.24483333333333, "end": 92.45733333333332, "voiceSeconds": 5.2125, "pauseSeconds": 5.2125, "sourceStart": 46.72116666666667, "sourceEnd": 51.93366666666667, "zh": "灾害的破坏和受害者的巨大痛苦震惊了全国。"}, {"index": 13, "text": "People were moved", "start": 92.45733333333332, "voiceEnd": 93.65749999999998, "end": 94.85766666666666, "voiceSeconds": 1.2001666666666666, "pauseSeconds": 1.2001666666666666, "sourceStart": 52.443666666666665, "sourceEnd": 53.64383333333333, "zh": "人们被感动了，"}, {"index": 14, "text": "when they read that the survivors comforted each other", "start": 94.85766666666666, "voiceEnd": 98.31745833333332, "end": 101.77725, "voiceSeconds": 3.459791666666667, "pauseSeconds": 3.459791666666667, "sourceStart": 53.64383333333333, "sourceEnd": 57.103625, "zh": "因为他们读到幸存者互相安慰，"}, {"index": 15, "text": "by saying “Congratulations!", "start": 101.77725, "voiceEnd": 104.053125, "end": 106.329, "voiceSeconds": 2.275875, "pauseSeconds": 2.275875, "sourceStart": 57.103625, "sourceEnd": 59.3795, "zh": "说道：“恭喜你！"}, {"index": 16, "text": "You survived!”.", "start": 106.329, "voiceEnd": 107.65266666666666, "end": 108.97633333333333, "voiceSeconds": 1.3236666666666668, "pauseSeconds": 1.3236666666666668, "sourceStart": 59.8695, "sourceEnd": 61.19316666666667, "zh": "你活下来了！”"}, {"index": 17, "text": "So they not only expressed their sympathy sincerely,", "start": 108.97633333333333, "voiceEnd": 112.753125, "end": 116.52991666666667, "voiceSeconds": 3.7767916666666665, "pauseSeconds": 3.7767916666666665, "sourceStart": 61.643166666666666, "sourceEnd": 65.41995833333333, "zh": "因此，人们不仅真诚地表达同情，"}, {"index": 18, "text": "but also organized together to help the victims right away.", "start": 116.52991666666667, "voiceEnd": 120.981625, "end": 125.43333333333334, "voiceSeconds": 4.451708333333333, "pauseSeconds": 4.451708333333333, "sourceStart": 65.77995833333334, "sourceEnd": 70.23166666666667, "zh": "还马上组织起来帮助灾民。"}, {"index": 19, "text": "The injured were rescued and the dead were buried.", "start": 125.43333333333334, "voiceEnd": 129.02133333333333, "end": 132.60933333333332, "voiceSeconds": 3.588, "pauseSeconds": 3.588, "sourceStart": 70.72166666666666, "sourceEnd": 74.30966666666667, "zh": "伤者获救，死者得到安葬。"}, {"index": 20, "text": "The frightened survivors were dug out from under the ruins", "start": 132.60933333333332, "voiceEnd": 136.52170833333332, "end": 140.43408333333332, "voiceSeconds": 3.912375, "pauseSeconds": 3.912375, "sourceStart": 74.82966666666667, "sourceEnd": 78.74204166666667, "zh": "惊恐的幸存者被从废墟下挖了出来，"}, {"index": 21, "text": "and were offered shelter,", "start": 140.43408333333332, "voiceEnd": 142.1100833333333, "end": 143.78608333333332, "voiceSeconds": 1.676, "pauseSeconds": 1.676, "sourceStart": 78.74204166666667, "sourceEnd": 80.41804166666667, "zh": "人们给他们提供了住处，"}, {"index": 22, "text": "fresh water and electricity.", "start": 143.78608333333332, "voiceEnd": 146.32537499999998, "end": 148.86466666666666, "voiceSeconds": 2.5392916666666667, "pauseSeconds": 2.5392916666666667, "sourceStart": 80.62804166666666, "sourceEnd": 83.16733333333333, "zh": "干净的水和电力。"}, {"index": 23, "text": "Thanks to people’s help,", "start": 148.86466666666666, "voiceEnd": 150.7165, "end": 152.56833333333333, "voiceSeconds": 1.8518333333333334, "pauseSeconds": 1.8518333333333334, "sourceStart": 83.64733333333334, "sourceEnd": 85.49916666666667, "zh": "多亏了大家的帮助，"}, {"index": 24, "text": "the loss was minimized.", "start": 152.56833333333333, "voiceEnd": 154.49616666666665, "end": 156.424, "voiceSeconds": 1.9278333333333333, "pauseSeconds": 1.9278333333333333, "sourceStart": 85.77916666666667, "sourceEnd": 87.707, "zh": "损失被尽可能地减少了。"}], "duration": 156.424, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "30": {"day": 30, "title": "The Great President", "groups": [{"index": 0, "text": "The Great President.", "start": 0, "voiceEnd": 1.6723333333333332, "end": 3.3446666666666665, "voiceSeconds": 1.6723333333333332, "pauseSeconds": 1.6723333333333332, "sourceStart": 0.205, "sourceEnd": 1.8773333333333333, "zh": "伟大的总统。"}, {"index": 1, "text": "As the founder of the republic,", "start": 3.3446666666666665, "voiceEnd": 5.511666666666667, "end": 7.6786666666666665, "voiceSeconds": 2.167, "pauseSeconds": 2.167, "sourceStart": 2.3973333333333335, "sourceEnd": 4.564333333333333, "zh": "作为共和国的创建者，"}, {"index": 2, "text": "the president had many good qualities.", "start": 7.6786666666666665, "voiceEnd": 10.561666666666667, "end": 13.444666666666667, "voiceSeconds": 2.883, "pauseSeconds": 2.883, "sourceStart": 4.894333333333333, "sourceEnd": 7.777333333333333, "zh": "这位总统具有许多优秀品质。"}, {"index": 3, "text": "Before coming to power,", "start": 13.444666666666667, "voiceEnd": 15.266125, "end": 17.087583333333335, "voiceSeconds": 1.8214583333333334, "pauseSeconds": 1.8214583333333334, "sourceStart": 8.327333333333334, "sourceEnd": 10.148791666666666, "zh": "执政之前，"}, {"index": 4, "text": "he was a generous lawyer.", "start": 17.087583333333335, "voiceEnd": 18.908625, "end": 20.729666666666667, "voiceSeconds": 1.8210416666666667, "pauseSeconds": 1.8210416666666667, "sourceStart": 10.368791666666667, "sourceEnd": 12.189833333333333, "zh": "他是一位慷慨的律师。"}, {"index": 5, "text": "He was willing to selflessly help everyone who turned to him.", "start": 20.729666666666667, "voiceEnd": 25.197166666666668, "end": 29.66466666666667, "voiceSeconds": 4.4675, "pauseSeconds": 4.4675, "sourceStart": 12.689833333333333, "sourceEnd": 17.157333333333334, "zh": "他愿意无私地帮助每一个向他求助的人。"}, {"index": 6, "text": "He accepted no fee to offer legal guidance and opinions", "start": 29.66466666666667, "voiceEnd": 34.119083333333336, "end": 38.5735, "voiceSeconds": 4.454416666666667, "pauseSeconds": 4.454416666666667, "sourceStart": 17.637333333333334, "sourceEnd": 22.09175, "zh": "他提供法律指导和意见，不收取费用，"}, {"index": 7, "text": "to those who were out of work or uneducated.", "start": 38.5735, "voiceEnd": 41.91308333333333, "end": 45.25266666666667, "voiceSeconds": 3.339583333333333, "pauseSeconds": 3.339583333333333, "sourceStart": 22.09175, "sourceEnd": 25.431333333333335, "zh": "帮助那些失业或没有受过教育的人。"}, {"index": 8, "text": "Later, believing all mankind to be equal,", "start": 45.25266666666667, "voiceEnd": 48.90320833333334, "end": 52.55375, "voiceSeconds": 3.650541666666667, "pauseSeconds": 3.650541666666667, "sourceStart": 25.931333333333335, "sourceEnd": 29.581875, "zh": "后来，由于相信所有人都应平等，"}, {"index": 9, "text": "he devoted himself to stopping the unfair anti-black laws.", "start": 52.55375, "voiceEnd": 57.142875000000004, "end": 61.732, "voiceSeconds": 4.589125, "pauseSeconds": 4.589125, "sourceStart": 29.871875, "sourceEnd": 34.461, "zh": "他致力于废除不公正的反黑人法律。"}, {"index": 10, "text": "He set up the Black Youth League", "start": 61.732, "voiceEnd": 63.894, "end": 66.056, "voiceSeconds": 2.162, "pauseSeconds": 2.162, "sourceStart": 34.961, "sourceEnd": 37.123, "zh": "他成立了黑人青年联盟，"}, {"index": 11, "text": "and was voted to be the leader.", "start": 66.056, "voiceEnd": 68.31466666666667, "end": 70.57333333333332, "voiceSeconds": 2.2586666666666666, "pauseSeconds": 2.2586666666666666, "sourceStart": 37.123, "sourceEnd": 39.38166666666667, "zh": "并被选为领导人。"}, {"index": 12, "text": "However, though he kept peaceful principles without violence and terror,", "start": 70.57333333333332, "voiceEnd": 75.65429166666665, "end": 80.73525, "voiceSeconds": 5.080958333333333, "pauseSeconds": 5.080958333333333, "sourceStart": 39.861666666666665, "sourceEnd": 44.942625, "zh": "然而，尽管他坚持和平原则，反对暴力和恐怖行为，"}, {"index": 13, "text": "his mean enemies still blew up his house and attacked his relatives,", "start": 80.73525, "voiceEnd": 85.20962499999999, "end": 89.684, "voiceSeconds": 4.474375, "pauseSeconds": 4.474375, "sourceStart": 45.182625, "sourceEnd": 49.657, "zh": "卑鄙的敌人仍炸毁他的房子，袭击他的亲人，"}, {"index": 14, "text": "and he himself couldn’t escape being sentenced to 30 years in prison.", "start": 89.684, "voiceEnd": 94.596, "end": 99.508, "voiceSeconds": 4.912, "pauseSeconds": 4.912, "sourceStart": 49.987, "sourceEnd": 54.899, "zh": "而他自己也没能逃过被判30年监禁的命运。"}, {"index": 15, "text": "Not fearing the prison guards’ cruelty,", "start": 99.508, "voiceEnd": 102.42204166666666, "end": 105.33608333333333, "voiceSeconds": 2.914041666666667, "pauseSeconds": 2.914041666666667, "sourceStart": 55.389, "sourceEnd": 58.303041666666665, "zh": "他不畏惧狱警的残酷，"}, {"index": 16, "text": "he kept active and begged no mercy from them.", "start": 105.33608333333333, "voiceEnd": 108.796375, "end": 112.25666666666666, "voiceSeconds": 3.4602916666666665, "pauseSeconds": 3.4602916666666665, "sourceStart": 58.53304166666667, "sourceEnd": 61.99333333333333, "zh": "保持积极，从不向他们乞求怜悯。"}, {"index": 17, "text": "As a matter of fact,", "start": 112.25666666666666, "voiceEnd": 113.83416666666666, "end": 115.41166666666666, "voiceSeconds": 1.5775, "pauseSeconds": 1.5775, "sourceStart": 62.483333333333334, "sourceEnd": 64.06083333333333, "zh": "事实上，"}, {"index": 18, "text": "he was always hopeful and never lost heart during the stage", "start": 115.41166666666666, "voiceEnd": 119.66733333333333, "end": 123.923, "voiceSeconds": 4.2556666666666665, "pauseSeconds": 4.2556666666666665, "sourceStart": 64.31083333333333, "sourceEnd": 68.5665, "zh": "在那段时期，他始终充满希望，从不灰心，"}, {"index": 19, "text": "even though he was in trouble.", "start": 123.923, "voiceEnd": 125.72983333333333, "end": 127.53666666666666, "voiceSeconds": 1.8068333333333333, "pauseSeconds": 1.8068333333333333, "sourceStart": 68.5665, "sourceEnd": 70.37333333333333, "zh": "即使身处困境。"}, {"index": 20, "text": "Finally, people rewarded him with the leader’s position and a gold blanket.", "start": 127.53666666666666, "voiceEnd": 133.60433333333333, "end": 139.672, "voiceSeconds": 6.067666666666667, "pauseSeconds": 6.067666666666667, "sourceStart": 70.88333333333334, "sourceEnd": 76.951, "zh": "最后，人们以领袖的位置和一条金色毯子作为对他的回报。"}], "duration": 139.672, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "31": {"day": 31, "title": "A Brave Maid", "groups": [{"index": 0, "text": "A Brave Maid.", "start": 0, "voiceEnd": 1.3523333333333334, "end": 2.7046666666666668, "voiceSeconds": 1.3523333333333334, "pauseSeconds": 1.3523333333333334, "sourceStart": 0.195, "sourceEnd": 1.5473333333333332, "zh": "勇敢的女仆。"}, {"index": 1, "text": "A wooden vase from the Ming Dynasty", "start": 2.7046666666666668, "voiceEnd": 5.442208333333333, "end": 8.17975, "voiceSeconds": 2.7375416666666665, "pauseSeconds": 2.7375416666666665, "sourceStart": 2.0473333333333334, "sourceEnd": 4.784875, "zh": "一只明代的木制花瓶，"}, {"index": 2, "text": "at the entrance of the reception hall", "start": 8.17975, "voiceEnd": 10.645875, "end": 13.112, "voiceSeconds": 2.466125, "pauseSeconds": 2.466125, "sourceStart": 4.784875, "sourceEnd": 7.251, "zh": "摆在接待大厅的入口处，"}, {"index": 3, "text": "amazed everyone.", "start": 13.112, "voiceEnd": 14.484, "end": 15.856, "voiceSeconds": 1.372, "pauseSeconds": 1.372, "sourceStart": 7.251, "sourceEnd": 8.623, "zh": "让所有人都惊叹不已。"}, {"index": 4, "text": "The artists designed it in a rare style", "start": 15.856, "voiceEnd": 19.104625, "end": 22.35325, "voiceSeconds": 3.248625, "pauseSeconds": 3.248625, "sourceStart": 9.103, "sourceEnd": 12.351625, "zh": "艺术家以罕见的风格设计了它，"}, {"index": 5, "text": "and selected valuable jewels to decorate it.", "start": 22.35325, "voiceEnd": 25.832958333333334, "end": 29.312666666666665, "voiceSeconds": 3.4797083333333334, "pauseSeconds": 3.4797083333333334, "sourceStart": 12.351625, "sourceEnd": 15.831333333333333, "zh": "并挑选贵重珠宝来装饰。"}, {"index": 6, "text": "People thought highly of its fancy colour of honey", "start": 29.312666666666665, "voiceEnd": 33.014375, "end": 36.71608333333333, "voiceSeconds": 3.7017083333333334, "pauseSeconds": 3.7017083333333334, "sourceStart": 16.371333333333332, "sourceEnd": 20.073041666666665, "zh": "人们高度赞赏它精美的蜜色外观，"}, {"index": 7, "text": "and the beautiful paintings on it.", "start": 36.71608333333333, "voiceEnd": 39.064874999999994, "end": 41.413666666666664, "voiceSeconds": 2.3487916666666666, "pauseSeconds": 2.3487916666666666, "sourceStart": 20.073041666666665, "sourceEnd": 22.421833333333332, "zh": "以及瓶身上美丽的画作。"}, {"index": 8, "text": "The vase used to belong to a former castle.", "start": 41.413666666666664, "voiceEnd": 44.85916666666667, "end": 48.30466666666666, "voiceSeconds": 3.4455, "pauseSeconds": 3.4455, "sourceStart": 22.931833333333334, "sourceEnd": 26.377333333333333, "zh": "这个花瓶曾属于一座旧城堡。"}, {"index": 9, "text": "But when the country was at war,", "start": 48.30466666666666, "voiceEnd": 50.51591666666666, "end": 52.72716666666666, "voiceSeconds": 2.21125, "pauseSeconds": 2.21125, "sourceStart": 26.917333333333332, "sourceEnd": 29.128583333333335, "zh": "但在国家陷入战争时，"}, {"index": 10, "text": "the enemy troops exploded the castle.", "start": 52.72716666666666, "voiceEnd": 55.68008333333333, "end": 58.632999999999996, "voiceSeconds": 2.952916666666667, "pauseSeconds": 2.952916666666667, "sourceStart": 29.428583333333332, "sourceEnd": 32.3815, "zh": "敌军炸毁了城堡。"}, {"index": 11, "text": "Debates on how the vase survived went on and on.", "start": 58.632999999999996, "voiceEnd": 62.7125, "end": 66.792, "voiceSeconds": 4.0795, "pauseSeconds": 4.0795, "sourceStart": 32.9015, "sourceEnd": 36.981, "zh": "关于花瓶如何幸存，人们争论不休。"}, {"index": 12, "text": "In order to remove people’s doubt,", "start": 66.792, "voiceEnd": 69.27129166666667, "end": 71.75058333333334, "voiceSeconds": 2.4792916666666667, "pauseSeconds": 2.4792916666666667, "sourceStart": 37.451, "sourceEnd": 39.93029166666667, "zh": "为了消除大家的疑问，"}, {"index": 13, "text": "a team of no less than 20 people carried out an informal investigation.", "start": 71.75058333333334, "voiceEnd": 77.331625, "end": 82.91266666666667, "voiceSeconds": 5.581041666666667, "pauseSeconds": 5.581041666666667, "sourceStart": 40.160291666666666, "sourceEnd": 45.74133333333333, "zh": "一支不少于20人的队伍展开了非正式调查。"}, {"index": 14, "text": "The evidence they found showed", "start": 82.91266666666667, "voiceEnd": 85.006, "end": 87.09933333333333, "voiceSeconds": 2.0933333333333333, "pauseSeconds": 2.0933333333333333, "sourceStart": 46.24133333333333, "sourceEnd": 48.334666666666664, "zh": "他们发现的证据表明，"}, {"index": 15, "text": "that a maid took the vase apart", "start": 87.09933333333333, "voiceEnd": 89.4155, "end": 91.73166666666667, "voiceSeconds": 2.3161666666666667, "pauseSeconds": 2.3161666666666667, "sourceStart": 48.334666666666664, "sourceEnd": 50.65083333333333, "zh": "一名女仆把花瓶拆开了，"}, {"index": 16, "text": "and asked a sailor to sink it in a local well.", "start": 91.73166666666667, "voiceEnd": 95.05850000000001, "end": 98.38533333333334, "voiceSeconds": 3.3268333333333335, "pauseSeconds": 3.3268333333333335, "sourceStart": 50.65083333333333, "sourceEnd": 53.977666666666664, "zh": "请一名水手将它沉入当地的一口井中。"}, {"index": 17, "text": "She never gave away the secret", "start": 98.38533333333334, "voiceEnd": 100.62829166666667, "end": 102.87125, "voiceSeconds": 2.242958333333333, "pauseSeconds": 2.242958333333333, "sourceStart": 54.467666666666666, "sourceEnd": 56.710625, "zh": "她始终没有泄露秘密，"}, {"index": 18, "text": "even under the cruel trial of the enemies", "start": 102.87125, "voiceEnd": 105.84466666666667, "end": 108.81808333333333, "voiceSeconds": 2.9734166666666666, "pauseSeconds": 2.9734166666666666, "sourceStart": 56.710625, "sourceEnd": 59.684041666666666, "zh": "即便遭受敌人的残酷审讯，"}, {"index": 19, "text": "who were in search of treasures.", "start": 108.81808333333333, "voiceEnd": 110.79104166666667, "end": 112.764, "voiceSeconds": 1.9729583333333334, "pauseSeconds": 1.9729583333333334, "sourceStart": 59.684041666666666, "sourceEnd": 61.657, "zh": "那些敌人正在搜寻财宝。"}, {"index": 20, "text": "It is worth giving this brave maid a fortune in return.", "start": 112.764, "voiceEnd": 117.056, "end": 121.348, "voiceSeconds": 4.292, "pauseSeconds": 4.292, "sourceStart": 62.157, "sourceEnd": 66.449, "zh": "这位勇敢的女仆值得得到一大笔钱作为回报。"}], "duration": 121.348, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "32": {"day": 32, "title": "A Fair Competition", "groups": [{"index": 0, "text": "A Fair Competition.", "start": 0, "voiceEnd": 1.8266666666666667, "end": 3.6533333333333333, "voiceSeconds": 1.8266666666666667, "pauseSeconds": 1.8266666666666667, "sourceStart": 0.195, "sourceEnd": 2.0216666666666665, "zh": "公平竞赛。"}, {"index": 1, "text": "Swifter, Higher and Stronger stands for the spirit of the Olympics.", "start": 3.6533333333333333, "voiceEnd": 9.283333333333333, "end": 14.913333333333334, "voiceSeconds": 5.63, "pauseSeconds": 5.63, "sourceStart": 2.5316666666666667, "sourceEnd": 8.161666666666667, "zh": "“更快、更高、更强”代表着奥林匹克精神。"}, {"index": 2, "text": "But fairness is the basis of this motto.", "start": 14.913333333333334, "voiceEnd": 18.1995, "end": 21.485666666666667, "voiceSeconds": 3.2861666666666665, "pauseSeconds": 3.2861666666666665, "sourceStart": 8.711666666666666, "sourceEnd": 11.997833333333332, "zh": "但公平是这句格言的基础。"}, {"index": 3, "text": "Only when you win fairly", "start": 21.485666666666667, "voiceEnd": 23.287, "end": 25.088333333333335, "voiceSeconds": 1.8013333333333332, "pauseSeconds": 1.8013333333333332, "sourceStart": 12.457833333333333, "sourceEnd": 14.259166666666667, "zh": "只有公平地赢得比赛，"}, {"index": 4, "text": "will you and your homeland deserve the great glory.", "start": 25.088333333333335, "voiceEnd": 28.866500000000002, "end": 32.644666666666666, "voiceSeconds": 3.7781666666666665, "pauseSeconds": 3.7781666666666665, "sourceStart": 14.259166666666667, "sourceEnd": 18.037333333333333, "zh": "你和你的祖国才配得上这份荣耀。"}, {"index": 5, "text": "But nowadays, unlike the ancient honest slave competitors,", "start": 32.644666666666666, "voiceEnd": 37.275083333333335, "end": 41.9055, "voiceSeconds": 4.630416666666667, "pauseSeconds": 4.630416666666667, "sourceStart": 18.517333333333333, "sourceEnd": 23.14775, "zh": "但如今，与古代诚实的奴隶选手不同，"}, {"index": 6, "text": "some hopeless athletes who can’t bear the pain of training", "start": 41.9055, "voiceEnd": 45.74725, "end": 49.589000000000006, "voiceSeconds": 3.84175, "pauseSeconds": 3.84175, "sourceStart": 23.42775, "sourceEnd": 27.2695, "zh": "某些没有出息的运动员无法忍受训练的痛苦，"}, {"index": 7, "text": "cheat when taking part in games.", "start": 49.589000000000006, "voiceEnd": 52.013000000000005, "end": 54.437000000000005, "voiceSeconds": 2.424, "pauseSeconds": 2.424, "sourceStart": 27.2695, "sourceEnd": 29.6935, "zh": "参加比赛时便作弊。"}, {"index": 8, "text": "Medals seem to have magical power causing them to cheat,", "start": 54.437000000000005, "voiceEnd": 58.691833333333335, "end": 62.94666666666667, "voiceSeconds": 4.254833333333333, "pauseSeconds": 4.254833333333333, "sourceStart": 30.1935, "sourceEnd": 34.44833333333333, "zh": "奖牌似乎有一种魔力，驱使他们作弊，"}, {"index": 9, "text": "and the prize money has replaced the motto as their only goal.", "start": 62.94666666666667, "voiceEnd": 67.21733333333334, "end": 71.488, "voiceSeconds": 4.270666666666667, "pauseSeconds": 4.270666666666667, "sourceStart": 34.778333333333336, "sourceEnd": 39.049, "zh": "奖金也取代了格言，成了他们唯一的目标。"}, {"index": 10, "text": "So, in the gymnastics event to be held in our city next month,", "start": 71.488, "voiceEnd": 76.493375, "end": 81.49875, "voiceSeconds": 5.005375, "pauseSeconds": 5.005375, "sourceStart": 39.549, "sourceEnd": 44.554375, "zh": "因此，在下个月于本市举行的体操赛事中，"}, {"index": 11, "text": "one of the host’s responsibilities is to keep competitions fair.", "start": 81.49875, "voiceEnd": 86.27770833333334, "end": 91.05666666666667, "voiceSeconds": 4.778958333333334, "pauseSeconds": 4.778958333333334, "sourceStart": 44.904375, "sourceEnd": 49.68333333333333, "zh": "主办方的一项责任就是保证比赛公平。"}, {"index": 12, "text": "They advertised on posters outside the stadium", "start": 91.05666666666667, "voiceEnd": 94.82466666666667, "end": 98.59266666666667, "voiceSeconds": 3.768, "pauseSeconds": 3.768, "sourceStart": 50.13333333333333, "sourceEnd": 53.90133333333333, "zh": "他们在体育场外张贴海报，"}, {"index": 13, "text": "to promise that every competitor", "start": 98.59266666666667, "voiceEnd": 100.95729166666668, "end": 103.32191666666668, "voiceSeconds": 2.364625, "pauseSeconds": 2.364625, "sourceStart": 53.90133333333333, "sourceEnd": 56.26595833333333, "zh": "承诺每一位参赛者，"}, {"index": 14, "text": "is to have a regular physical examination in a gymnasium", "start": 103.32191666666668, "voiceEnd": 107.39966666666668, "end": 111.47741666666668, "voiceSeconds": 4.07775, "pauseSeconds": 4.07775, "sourceStart": 56.26595833333333, "sourceEnd": 60.34370833333333, "zh": "都要在体育馆接受常规身体检查，"}, {"index": 15, "text": "one after another.", "start": 111.47741666666668, "voiceEnd": 112.91137500000002, "end": 114.34533333333336, "voiceSeconds": 1.4339583333333332, "pauseSeconds": 1.4339583333333332, "sourceStart": 60.34370833333333, "sourceEnd": 61.77766666666667, "zh": "一个接一个地接受检查。"}, {"index": 16, "text": "No one can bargain on this.", "start": 114.34533333333336, "voiceEnd": 116.61133333333336, "end": 118.87733333333335, "voiceSeconds": 2.266, "pauseSeconds": 2.266, "sourceStart": 62.257666666666665, "sourceEnd": 64.52366666666667, "zh": "任何人都不能对此讨价还价。"}, {"index": 17, "text": "The volunteers in charge will be very strict.", "start": 118.87733333333335, "voiceEnd": 122.48466666666668, "end": 126.09200000000003, "voiceSeconds": 3.6073333333333335, "pauseSeconds": 3.6073333333333335, "sourceStart": 65.02366666666667, "sourceEnd": 68.631, "zh": "负责此事的志愿者会十分严格。"}, {"index": 18, "text": "It is foolish to cheat", "start": 126.09200000000003, "voiceEnd": 127.91450000000003, "end": 129.73700000000002, "voiceSeconds": 1.8225, "pauseSeconds": 1.8225, "sourceStart": 69.161, "sourceEnd": 70.9835, "zh": "作弊是愚蠢的，"}, {"index": 19, "text": "because they will not be admitted to compete", "start": 129.73700000000002, "voiceEnd": 132.5535, "end": 135.37000000000003, "voiceSeconds": 2.8165, "pauseSeconds": 2.8165, "sourceStart": 71.0185, "sourceEnd": 73.835, "zh": "因为作弊者不会被允许参赛，"}, {"index": 20, "text": "and will even be fined as well.", "start": 135.37000000000003, "voiceEnd": 137.46300000000002, "end": 139.55600000000004, "voiceSeconds": 2.093, "pauseSeconds": 2.093, "sourceStart": 73.85, "sourceEnd": 75.943, "zh": "甚至还会被罚款。"}], "duration": 139.55600000000004, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "33": {"day": 33, "title": "Computers", "groups": [{"index": 0, "text": "Computers.", "start
