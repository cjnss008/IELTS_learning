ome.", "review": [2, 4, 8]}, {"day": 2, "title": "An Interesting Festival", "page": 3, "text": "The Agricultural Feast takes place after Independence Day. It is not a worldwide celebration. Only Christians in Mexico look forward to its arrival for its religious origin. Long ago, humans’ ancestors were bad. They fooled and played tricks on each other and never kept their word. So God turned up and drowned all their crops. Humans starved day and night, weeping. In order to gain God’s forgiveness, a woman poet set off to see God. She admired God and kept apologizing. God was moved. With his permission, humans finally had good harvests again. So, to wipe away sadness and remind themselves of the belief in God, people began the festival. During the festival, people gather in the open air, such as playgrounds or parking lots, and energetically have fun with each other all night long, as though they were never tired. When a beauty dressed up in lovely clothing reads poems in memory of the poet, everyone holds their breath. Then, it is the custom that the bone of a rooster’s head is given to her as an award. Obviously, the story is not true, but the festival is interesting.", "original": "The Agricultural Feast takes place after the Independence Day. It is not a worldwide celebration. Only Christians in Mexico look forward to its arrival for its religious origin Long ago, humans’ ancestors were bad. They fooled and played tricks on each other and never kept their word. So God turned up and drowned all their crops. Humans starved day and night, weeping. In order to gain God’s forgiveness, a woman poet set off to see God. She admired God and kept apologizing. God was moved. With his permission, humans finally had good harvests again. So, to wipe sadness and remind themselves of the belief in God, people began the festival. On the festival, people gather in open air, such as playgrounds or parking lots, and energetically have fun with each other all night long, as though they , 9]}, {"day": 3, "title": "Balanced Diet", "page": 5, "text": "Wang Peng earned his living by running a barbecue restaurant, which served delicious bacon, fried chicken breast and mutton roasted with pepper and garlic. But his food and discount attracted fewer and fewer customers. Finally, he was in debt. Yong Hui’s slimming restaurant served fresh peas, carrots, eggplants, and raw cucumbers with vinegar. As the hostess, she said fibres benefited customers' digestion the most. In order not to let Yong Hui get away with telling lies, Wang Peng spied on Yong Hui despite her glare. But he was surprised that she was losing her customers, too. Curiosity drove Wang Peng to consult an expert. The expert sighed and said, “Both of your menus have weaknesses and limited strengths. Your customers put on weight too easily, while Yong Hui’s lose weight too quickly. So, Wang Peng, cut down on the fat in your food and increase vegetables and fruits, like nuts, beans, mushrooms, peaches and lemons. You ought to combine the two menus and provide a balanced diet.” Before long, Wang Peng won his customers back.", "original": "Wang Peng earned his living by running a barbecue restaurant, which served delicious bacon, fried chicken breast and mutton roast ed with pepper and garlic. But his food and discount attracted fewer and fewer customers. Finally, he was in debt. Yong Hui’s slimming restaurant served fresh peas, carrots, eggplants, and raw cucumbers with vinegar. As the hostess, she said fibres benefited customers' digestion the most. In order not to let Yong Hui get away with telling Lies, Wang Peng spied on Yong Hui despite her glare. But he was surprised that she was losing her customers, too. Curiosity drove Wang Peng to consult an expert. The expert sighed and said, “Both of your menus have weakness and limited strength. Your customers put on weight too easily, while Yong Hui’s lose weight too quickly. So, Wang Peng, cut down the fat of your food and increase vegetables and f f function. For example, yawning means not being interested and turning one’s back to someone or swinging your fist shows your anger. But what those gestures really mean is subjective in different cultures. Thus, misunderstandings happen now and then in today’s world of cultural crossroads. Once, representing the Adults’ Education Association, I went to the airport to meet an official of high rank from Colombia and take him to his dormitory and then to the canteen. After the flight arrived, I saw a man looking around curiously. So I approached to greet him. He suddenly dashed to hug me and kissed me on both cheeks. As a young girl, I felt truly embarrassed and put up my hands to defend myself. His false smile told me that he had lost face. Later, I received a cassette from him, in which he recorded his apology. On hearing that Colombians were more likely to kiss others, I soon felt at ease.", "original": "In general, spoken statements are the major way of communication, but body language and facial expressions also have such kinds of function. For example, yawning means being not interested and turning one’s back to someone or swinging your fist shows your anger. But what those gestures really mean is subjective in different cultures. Thus, misunderstandings happen now and then in today’s world of cultural crossroads. Once, representing the Adults’ Education Association, I went to the airport to meet an official of high rank from Columbia and take him to his dormitory and then to the canteen. After the flight arrived, I saw a man looking around curiously. So I approached to greet him. He suddenly dashed to hug me and kissed me on both cheeks. As a young girl, I felt truly embarrassed and put up my hands to defend myself. His false smile told me that he had lost face. Later, I received a cassette from him, in which he recorded his apology. On hearing that Columbians were more likely to kiss others, I soon felt at ease.", "changes": [["Columbia", "Colombia"], ["being  shop was made of wood, and wherever we went we could see minority carpenters working. They made wooden tools, wooden cartoon figures, wooden athletic products and so on. They even built a huge wooden engine with a length of 20 metres, which was modeled after a real one. This theme park is really a fantasy amusement park. No wonder it has become the brand of local tourism.", "original": "As soon as our shuttle got close to the theme park by the freeway, everyone came to life and put on cloth sneakers in advance for an outing. Our translator paid for the admission, and we started enjoying the various attractions in the sunlight. According to the travel brochure, this unique park is famous for its well preserved minority culture. We experienced many deeds of the early settlers, such as swinging across rivers, hunting creatures in the jungle, or taking part in swords fighting tournaments. This park is also famous for its wooden souvenirs. Whichever we bought in the central shop was made of wood, and wherever we went we could see minority carpenters working. They made wooden tools, wooden cartoon figures, wooden athletic products and so on. They even built a huge wooden engine with a length of 20 metres, which was modeled after a real one. This theme park is really a fantasy amusement park. No wonder it has become the brand of local tourism.", "changes": [["swords fighting tournaments", "sword-fighting tournaments"]], "sentences": ["As soon as our shuttle got close to the theme park by the freeway, everyone came to life and put on cloth sneakers in advance for an outing.", "Our translator paid for the admission, and we started enjoying the various attractions in the sunlight.", "According to the travel brochure, this unique park is famous for its well preserved minority culture.", "We experienced many deeds of the early settlers, such as swinging across rivers, hunting creatures in the jungle, or taking part in sword-fighting tournaments.", "This park is also famous for "]}, {"en": "be modeled after", "cn": "仿照……制作（原文 was modeled after）", "hint": "仿照……制作", "answers": ["be modeled after", "was modeled after"]}], "grammar": [{"quote": "As soon as our shuttle got close", "explain": "as soon as 引导时间状语从句；叙述过去，所以用 got。描述将来时，从句通常用一般现在时。"}, {"quote": "Whichever we bought in the central shop was made of wood", "explain": "whichever 引导名词性从句作主语，意为“无论我们买的是哪一样”。"}, {"quote": "wherever we went we could see minority carpenters working", "explain": "wherever 引导地点/让步意味的状语从句；see…working 表示看到正在工作。"}], "questions": [{"q": "What is the park famous for besides its culture?", "a": "Its wooden souvenirs."}, {"q": "How long was the wooden engine?", "a": "It was 20 metres long."}], "dictation": "No wonder it has become the brand of local tourism.", "review": [6, 8, 12]}, {"day": 6, "title": "A Strange Disease", "page": 11, "text": "When the construction of the firework factory came to the stage of painting, a pump was put in. Then, all the painters in the neighbourhood were defeated by a severe disease whose characteristic was similar to that of a bad burn. An expert physician was instructed to attend to the victims and handle this case. He was enthusiastic, but he didn’t foresee that it was a hard challenge. After a simple enquiry, he announced that the polluted paint was to blame. But without positive evidence, people suspected and rejected his view, saying the theory he put forward made no sense. Being much more strict with himself, he devoted himself to the case. Apart from making enquiries, he made detailed charts and analysed the data cautiously. Finally, he drew a scientific conclusion, linking the disease to the radium in the pump. Exposed to radium, a kind of radioactive material in the universe, people absorbed radiation and got sick immediately. Spinning the pump backward, he took away the radium. This simple movement cured all the victims.", "original": "When the construction of the firework factory came to the stage of painting, a pump was put  to blame 是固定表达，主动形式具有“应受责备”的含义，不机械写成 was to be blamed。"}, {"quote": "Exposed to radium…people absorbed radiation", "explain": "过去分词作状语，people 与 expose 构成被动关系；可改为 When people were exposed…。"}], "questions": [{"q": "What did the physician initially blame?", "a": "The polluted paint."}, {"q": "What did his final conclusion link the disease to?", "a": "Radium in the pump."}], "dictation": "Spinning the pump backward, he took away the radium.", "review": [7, 9, 13]}, {"day": 7, "title": "Sightseeing in the United Kingdom", "page": 12, "text": "After the wedding, my cousin and his wife went to the United Kingdom for nationwide sightseeing. He faxed a letter to me in English yesterday. To my delight, he no longer made any tense error. And his description roughly clarified my questions about the UK--its currency, its administration, the institution which divides it into four constituent countries, and the historical conflicts and quarrels when Southern Ireland broke away from the UK. Unwilling to leave out any attraction, my cousin arranged his enjoyable journey carefully. One attractive place he visited was a castle in the countryside of Scotland, which lies near a port. It used to be the headquarters of the Communism Union but broke down during the war. Finding nothing could take the place of this splendid architecture, people accomplished rebuilding it in 1952. It was to their credit that all furnished rooms are consistent with what they used to be. My cousin was thrilled by its collections consisting of statues plus royal uniforms folded in glass tanks. Though there was no possibility of buying some of these exhibits, it was convenient to take photos, which he sent me along with his fax.", "original": "After the wedding, my cousin and his wife went to the United Kingdom for nationwide sightseeing. He faxed a letter to me in English yesterday. To my delight, he no longer made any tense error. And his description roughly clarified my questions about the UK--its currency, ，描述主语 my cousin 的状态与动机。"}, {"quote": "collections consisting of statues", "explain": "现在分词短语修饰 collections；consist of 通常不用被动形式。"}, {"quote": "what they used to be", "explain": "what 引导名词性从句，作介词 with 的宾语；used to 表过去的状态。"}], "questions": [{"q": "Who went sightseeing after a wedding?", "a": "The narrator’s cousin and his wife."}, {"q": "How did the cousin share pictures?", "a": "He sent photos along with his fax."}], "dictation": "Though there was no possibility of buying some of these exhibits, it was convenient to take photos, which he sent me along with his fax.", "review": [8, 10, 14]}, {"day": 8, "title": "An Air Crash", "page": 14, "text": "I was formerly a typist in a post office. Because I couldn’t tolerate typing any more postage bills or postcodes on a typewriter every day, I resigned. With a greedy motivation of making big money, I took up working as a business representative for the G.E Ecology Company, which produced goods by recycling useful materials from our dustbins. My new job left me good impressions in many aspects except that the working timetable was full of traveling by jets. Once, when speeding up, our jet was swallowed by a thunderstorm, which destroyed our GPS receiver and made us lose sight of the directions. A constantly flashing light showed that our jet was in danger. A steward instantly asked us to put on masks and fasten the safety belts, and then pressed a button to switch on the escaping capsule. It slid sideways out of the opening at once and landed in a desert area safely. Lacking food and tablets, we were nervous and uncertain at first. But we all kept optimistic and made a good adjustment to the situation. We swept up the surrounding mud to make our settlement and were back on our feet soon. Finally, guided by the smoke of our crashing jet, some local citizens came by carriages and saved us.", "original": "I was a previous typist in a post office. Because I couldn’t tolerate typing any more postage bills or postcodes on a typewriter every day, I resigned. With a greedy motivation of making big money, I took up working as a business representative for the G.E Ecology Company, which produced goods by recycling useful materials from our dustbins. My new job left me good impressions in many aspects except that the working timetable was full of traveling by jets. Once, when speeding up, our jet was swallowed by a thunderstorm, which destroyed our GPS receiver and made us lose sight of the directions. A constantly flashing light showed that our jet was in danger. A steward instantly asked us to put on masks and fasten the safety belts, and then pressed a button to switch on the escaping capsule. It slid sideways out of the opening at once and landed in a desert area safely. Lacking food and tablets, we were nervous and uncertain at first. But we all kept optimistic and made good adjustment to the situation. We swept up the surrounding mud to make our settlement and were back on our feet soon. Finally, guided by the smoke of our crashing jet, some local citizens came by carriages and saved us.", "changes": [["a previous typist", "formerly a typist"], ["made good adjustment", "made a good adjustment"]], "sentences": ["I was formerly a typist in a post office.", "Because I couldn’t tolerate typing any more postage bills or postcodes on a typewriter every day, I resigned.", "With a greedy motivation of making big money, I took up working as a business representative for the G.E Ecology Company, which produced goods by recycling useful materials from our dustbins.", "My new job left me good impressions in many aspects except that the working timetable was full of traveling by jets.", "Once, when speeding up, our jet was swallowed by a thunderstorm, which destroyed our GPS receiver and made us lose sight of the directions.", "A constantly flashing light showed that our jet was in danger.", "A steward instantly asked us to put on masks and fasten the safety belts, and then pressed a button to switch on th  on our feet"]}], "grammar": [{"quote": "couldn’t tolerate typing", "explain": "tolerate 后接动名词，不接 to type。"}, {"quote": "when speeding up", "explain": "时间状语从句的省略形式，逻辑主语是 our jet；可展开为 when our jet was speeding up。"}, {"quote": "guided by the smoke of our crashing jet", "explain": "过去分词状语表被动；被烟雾引导的是后面的 some local citizens。"}], "questions": [{"q": "Why did the narrator leave the typing job?", "a": "The narrator could not tolerate typing bills and postcodes every day."}, {"q": "How were the survivors found?", "a": "Local citizens were guided by smoke from the crashed jet."}], "dictation": "Finally, guided by the smoke of our crashing jet, some local citizens came by carriages and saved us.", "review": [9, 11, 15]}, {"day": 9, "title": "An Amateur Journalist", "page": 16, "text": "Jane is a housewife, but delighted to work as an amateur journalist. It is a dilemma for her to rush between family and work, and it is also unusual for the News Department to depend on an amateur to cover crimes. But Jane is really gifted. It is admirable that she is seldom accused of making mistakes. And, eager to become more professional, she concentrates on her job and updates herself now and then. Once she is informed of a new case, her normal working process is as follows: first, she makes appointments with guilty people for interviews. So as to acquire accurate stories, she usually demands to record what they say. Meanwhile, a technically good colleague will assist her in taking photographs. Second, she assesses whether they are deliberately hiding the truth. If she is skeptical about their words, she will look into the case herself. Third, she writes thorough stories ahead of the deadline and submits them to the senior chief editor, who polishes and approves every section. Finally, her stories will be published in different editions of their magazine.", "original": "Jane is a housewife, but delighted to work as an amateur journalist. It is a dilemma for her to rush between family and work, and it is also unusual for the News Department to depend on an amateur to cover crimes. But Jane is really gifted. It is admirable that she is seldom accused of making mistakes. And, eager to become more professional, she concentrates on her job and updates herself now and then. Once she is informed of a new case, her normal working process is as follows: first, she makes appointments with guilty people for interviews. So as to acquire accurate stories, she usually demands to record what they say. Meanwhile, a technically good colleague will assist her in taking photographs. Second, she assesses whether they are deliberately hiding the truth. If she is skeptical about their words, she will look into the case herself. Third, she writes thorough stories ahead of the deadline and submits it to the senior chief editor, who polishes and approves every section. Finally, her stories will be published in different editions of their magazine.", "changes": [["submits it to", "submits them to"]], "sentences": ["Jane is a housewife, but delighted to work as an amateur journalist.", "It is a dilemma for her to rush between family and work, and it is also unusual for the News Department to depend on an amateur to cover crimes.", "But Jane is really gifted.", "It is admirable that she is seldom accused of making mistakes.", "And, eager to become more professional, she concentrates on her job and updates herself now and then.", "Once she is informed of a new case, her normal working process is as follows: first, she makes appointments with guilty people for interviews.", "So as to acquire accurate stories, she usually demands to record what they say.", "Meanwhile, a technically good colleague will assist her in taking photographs.", "Second, she assesses whether they are deliberately hiding the truth.", "If she is skeptical about their words, she will look into the case herself.", "Third, she writes thorough stories ahead of the deadline and submits them to the senior chief editor, who polishes and approves every section.", "Finally, her stories will be published in different editions of their magazine."], "endpage": 18, "cn": "业余记者", "P": ["depend on=依靠", "be accused of=被指责（原文 is seldom accused of）", "concentrate on=专注于（原文 concentrates on）", "be informed of=被告知（原文 is informed of）", "look into=调查", "ahead of=在……之前"], "G": ["It is admirable that she is seldom accused of making mistakes=>it 是形式主语，真正主语是 that 从句；of 后接 making。", "she assesses whether they are deliberately hiding the truth=>whether 引导宾语从句，语序是陈述语序，不倒装。", "the senior chief editor, who polishes and approves every section=>who 引导非限制性定语从句，补充编辑的工作。"], "Q": ["What does Jane do if she doubts an interviewee’s words?=>She looks into the case herself.", "Who polishes and approves her stories?=>The senior chief editor."], "S": "用 first、second、finally 描述一项工作流程，至少用 look into 和 ahead of。", "V": ["journalist /ˈdʒɜːnəlɪst/：重音在首音节。", "accurate /ˈækjərət/：结尾不是 /eɪt/。"], "N": "原文 stories…submits it 数不一致；学习版改为 submits them。", "grammarQuiz": {"q": "She was accused of ____ mistakes. (make)", "answers": ["making"], "why": "of 后接动名词。"}, "originalNumber": "24", "phrases": [{"en": "depend on", "cn": "依靠", "hint": "依靠", "answers": ["depend on"]}, {"en": "be accused of", "cn": "被指责（原文 is seldom accused of）", "hint": "被指责", "answers": ["be accused of", "is seldom accused of"]}, {"en": "concentrate on", "cn": "专注于（原文 concentrates on）", "hint": "专注于", "answers": ["concentrate on", "concentrates on"]}, {"en": "be informed of", "cn": "被告知（原文 is informed of）", "hint": "被告知", "answers": ["be informed of", "is informed of"]}, {"en": "look into", "cn": "调查", "hint": "调查", "answers": ["look into"]}, {"en": "ahead of", "cn": "在……之前", "hint": "在……之前", "answers": ["ahead of"]}], "grammar": [{"quote": "It is admirable that she is seldom accused of making mistakes", "explain": "it 是形式主语，真正主语是 that 从句；of 后接 making。"}, {"quote": "she assesses whether they are deliberately hiding the truth", "explain": "whether 引导宾语从句，语序是陈述语序，不倒装。"}, {"quote": "the senior chief editor, who polishes and approves every section", "explain": "who 引导非限制性定语从句，补充编辑的工作。"}], "questions": [{"q": "What does Jane do if she doubts an interviewee’s words?", "a": "She looks into the case herself."}, {"q": "Who polishes and approves her stories?", "a": "The senior chief editor."}], "dictation": "Finally, her stories will be published in different editions of their magazine.", "review": [10, 12, 16]}, {"day": 10, "title": "First Aid", "page": 18, "text": "A boy fell ill. His organs were damaged by the radiation of an infrared ray stove. But before the ambulance arrived, a number of other injuries happened to this unlucky boy over and over again. First, he was choked by some poisonous liquid from the kettle on the cupboard. Then his wrist skin was burnt by electric shock. Finally, his ankle was cut by a pan. Fortunately, the boy’s nurse gave him proper temporary treatments according to his complex symptoms. She mildly squeezed the poisonous liquid out of his throat and put bandages firmly in place to apply pressure to the ankle wound to stop bleeding. As for the burn, she used scissors to remove his sleeve, poured a basin of cold water over the burn to cool it and put her hands on a damp blouse to cover his swollen tissue tightly. She also inspired his bravery to fight against the unbearable pain. Her first aid made a vital difference in saving his life. A ceremony was held to honour the nurse who overcame a variety of barriers to save the boy.", "original": "A boy fell ill. His organs were damaged by the radiation of an infrared ray stove. But before the ambulance arrived, a number of other injuries happened to this unlucky boy over and over again. First, he was choked by some poisonous liquid from the kettle on the cupboard. Then his wrist skin was burnt by electric shock. Finally, his ankle was cut by a pan. Fortunately, the boy’s nurse gave him proper temporary treatments according to his complex symptoms. She mildly squeezed the poisonous liquid out of his throat and put bandages firmly in place to apply pressure to the ankle wound to stop bleeding. As for the burn, she used scissors to remove his sleeve, poured a basin of cold water over the burn to cool it and put her hands on a damp blouse to cover his swollen tissue tightly. She also inspired his bravery to fight against the unbearable pain. Her first aid made a vital difference in saving his life. A ceremony was held to honour the nurse who overcame a variety of barriers to save the boy.", "changes": [], "sentences": ["A boy fell ill.", "His organs were damaged by the radiation of an infrared ray stove.", "But before the ambulance arrived, a number of other injuries happened to this unlucky boy over and over again.", "First, he was choked by some poisonous liquid from the kettle on the cupboard.", "Then his wrist skin was burnt by electric shock.", "Finally, his ankle was cut by a pan.", "Fortunately, the boy’s nurse gave him proper temporary treatments according to his complex symptoms.", "She mildly squeezed the poisonous liquid out of his throat and put bandages firmly in place to apply pressure to the ankle wound to stop bleeding.", "As for the burn, she used scissors to remove his sleeve, poured a basin of cold water over the burn to cool it and put her hands on a damp blouse to cover his swollen tissue tightly.", "She also inspired his bravery to fight against the unbearable pain.", "Her first aid made a vital difference in saving his life.", "A ceremony was held to honour the nurse who overcame a variety of barriers to save the boy."], "endpage": 19, "cn": "急救", "P": ["fall ill=生病（原文 fell ill）", "over and over again=反复地", "in place=在适当的位置", "apply pressure to=对……施压", "a variety of=多种多样的", "make a difference=产生影响（原文 made a vital difference）"], "G": ["His organs were damaged=>一般过去时被动：were + 过去分词，强调承受动作的对象。", "to stop bleeding=>不定式作目的状语；stop doing 表“停止做”，与 stop to do“停下来去做”区分。", "the nurse who overcame a variety of es carved out of marble or fragile clay, were all with a specific aim of showing feelings. Some conventional scholars who were allergic to abstract art said it was evidently ridiculous and neither art nor geometry. Their Traditional Art Committee predicted that it would soon disappear. But nowadays, abstract art has become part of the permanent possessions of contemporary civilization. Galleries along the Madison Avenue give scores of superb exhibitions on typical abstract works, appealing to many who have a preference for abstract art. The Shadow of Egypt, a café in this district, has become the home to those aggressive abstract artists. Consequently, it is not a coincidence for you to meet one of these artists of great reputation in the flesh. They are asked for signatures and given bunches of fragrant flowers plus they are given a great deal of praise by their faithful fans.", "original": "Abstract art used to be controversial. On one hand, the artists stopped painting delicate figures but attempted to adopt special techniques to give people different visual impacts. On the other hand, their works, including sculptures carved out of marble or fragile clay, were all with a specific aim of showing feelings. Some conventional scholars who were allergic to abstract art said it was evidently ridiculous and neither art nor geometry. Their Traditional Art Committee predicted its soon disappearing. But nowadays, abstract art has become part of the permanent possessions of contemporary civilization. Galleries along the Madison Avenue give scores of superb exhibitions on typical abstract works, appealing to many who have a preference for abstract art. The Shadow of Egypt, a café in this district, has become the home to those aggressive abstract artists. Consequently, it is not a coincidence for you to meet one of these artists of great reputation in the flesh. They are asked for signatures and given bunches of fragrant flowers plus they are given a great deal of praise by  of words is his style. He tried out different patterns and preferred nursery rhyme in particular. The following is a translation of one of his works made up of 3 sections: Little sparrow with heavy load, Ran out of energy and very cold; No compass and all sweat salty, Can you go through the endless darkness? Little balloon let out by the thread, Flew over cottages and was very glad; With warmth transformed from sunlight, He said he could forever fly; Take it easy, little balloon; Don’t tease the sparrow with his wound; On the bare branch and have a rest; This diamond heart will eventually get success.", "original": "Since childhood, Anton had often recited poems, accompanied by pianists and violinists, at wedding ceremonies before brides and bridegrooms exchanged rings. Gradually, he found writing poems the most appropriate way to convey his joy and sorrow. When his poem Contradictory Blank won him a national championship and a scholarship to the Moscow University from a sponsor, he was just an unknown librarian. After getting his diploma, he devoted his life to writing poems. Using concrete but flexible language and the minimum of words is his style. He tried out different patterns and preferred nursery rhyme in particular. The following is a translation of one of his works made up of 3 sections: Little sparrow with heavy load,Ran out of energy and very cold;No compass and all sweat salty,Can you go through the endless darkness?Little balloon let out by the thread,Flew over cottages and was very glad;With warmth transformed from sunlight,He said he could forever fly;Take it easy, little balloon;Don’t tease the sparrow with his wound;On the bare branch and have a rest;This diamond heart will eventually get success.", "changes": [["load,Ran", "load, Ran"], ["cold;No", "cold; No"], ["salty,Can", "salty, Can"], ["darkness?Little", "darkness? Little"], ["thread,Flew", "thread, Flew"], ["glad;With", "glad; With"], ["sunlight,He", "sunlight, He"], ["fly;Take", "fly; Take"], ["balloon;Don", "balloon; Don"], ["wound;On", "wound; On"], ["rest;This", "rest; This"]], "sentences": ["Since childhood, Anton had often recited poems, accompanied by pianists and violinists, at wedding ceremonies before brides and bridegrooms exchanged rings.", "Gradually, he found writing poems the most appropriate way to convey his joy and sorrow.", "When his poem Contradictory Blank won him a national championship and a scholarship to the Moscow University from a sponsor, he was just an unknown librarian.", "After getting his diploma, he devoted his life to writing poems.", "Using concrete but flexible language and the minimum of words is his style.", "He tried out different patterns and preferred nursery rhyme in particular.", "The following is a translation of one of his works made up of 3 sections: Little sparrow with heavy load, Ran out of energy and very cold; No compass and all sweat salty, Can you go through the endless darkness?", "Little balloon let out by the thread, Flew over cottages and was very glad; With warmth transformed from sunlight, He said he could forever fly; Take it easy, little balloon; Don’t tease the sparrow with his wound; On the bare branch and have a rest; This diamond heart will eventually get success."], "endpage": 23, "cn": "俄国童谣", "P": ["exchange rings=交换戒指（原文 exchanged rings）", "devote one’s life to=献身于（原文 devoted his life to）", "try out=试验（原文 tried out）", "in particular=尤其", "be made up of=由……组成（原文 made up of）", "run out of=用完（原文 Ran out of）"], "G": ["he found writing poems the most appropriate way=>find + 宾语 + 宾语补足语；writing poems 是动名词短语作宾语。", "Using concrete but flexible language and the minimum of words is his style=>动名词短语作主语；这里把这一写作方式视为整体，谓语用 is。", "one of his works made up of 3 sections=>made up of 作后置定语，说明这篇作品的组成。"], "Q": ["What was Anton’s job before he became well known?=>He was a librarian.", "What form of poetry did he particularly prefer?=>Nursery rhyme."], "S": "谈一种创作爱好，用 try out 和 in particular，并写一个动名词主语句。", " are addicted to cigarettes, only several packets of which will hurt their lungs and make them breathless quickly. Others can’t quit drinking alcohol, whose harmful effects include causing young pregnant women to abort or give birth to abnormal babies. The worst is drug abuse, for the withdrawal is tough once their bodies are accustomed to the drugs. Meanwhile, those who share needles bought from illegal chemists are at great risk of being infected with desperate AIDS. If so, neither injecting nor taking pills can guarantee their survival. However, don’t be disappointed at or have prejudice against our children so easily. After all, being awkward is an appendix of youth. As long as we strengthen communication with them instead of only banning this or banning that, we will surely help them avoid anything unfit.", "original": "Whether they are male or female, adolescents feel like deciding on everything themselves in spite of parents’ instruction, especially when they face problems like sex, mental stress, etc., which make them feel ashamed and embarrassed. Thus they often automatically get into troubles due to their imperfect comprehension and judgement. Some are addicted to cigarettes, only several packets of which will hurt their lungs and make them breathless quickly. Others can’t quit drinking alcohol, whose harmful effects include causing young pregnant women to abort or give birth to abnormal babies. The worst is drug abuse, for the withdrawal is tough once their bodies are accustomed to the drugs. Meanwhile, those who share needles bought from illegal chemists are at great risk of being infected with desperate AIDS. If so, neither injecting nor taking pills can guarantee their survival. However, don’t be disappointed at or have prejudice against our children so easily. After all, being awkward is an appendix of youth. As long as we strengthen communication with them instead of only banning this or banning that, we will surely help them avoid anything unfit.", " valuate information for a database about diverse natural disasters, such as hurricanes, typhoons or thunderstorms. Sometimes I did this by giving out questionnaires to those who went through them. But sometimes I had to go through actual disasters myself. The Musaki Volcano was one of them. At that time, I lived in a bungalow alongside the volcano with a novelist, who came for the appreciation of its eruption. One day, when I was drawing diagrams on the balcony and he was bathing inside, the volcano erupted unexpectedly. The ash and lava fountains shooting high in the sky varied from 50 to 100 meters in height. It was absolutely fantastic! I even noticed a rainbow appear in the fog caused by a heat wave. But, glancing through our surroundings, I foresaw the potential danger and found no guarantee of our safety. The uncomfortable gas almost made us unconscious. Sweat began to drip as we grew anxious. Managing to stop panicking and trembling, we quickly put on our protective suits, helmets and boots and eventually made our way to a safe place. How lucky we were even though my precious equipment and documents were all burnt to the ground!", "original": "As the best candidate, I was appointed to collect and evaluate information for a database about diverse natural disasters, such as hurricanes, typhoons or thunderstorms. Sometimes I did this by giving out questionnaires to those who went through them. But sometimes I had to go through actual disasters myself. The Musaki Volcano was one of them. At that time, I lived in a bungalow alongside the volcano with a novelist, who came for the appreciation of its eruption. One day, when I was drawing diagrams on the balcony and he was bathing inside, the volcano erupted unexpectedly. The ash and lava fountains shooting highly in the sky varied from 50 to 100 meters in height. It was absolutely fantastic! I even noticed a rainbow appear in the fog caused by a heat wave. But, glancing through our surroundings, I foresaw the potent ictation": "How lucky we were even though my precious equipment and documents were all burnt to the ground!", "review": [16, 18, 22]}, {"day": 16, "title": "Defeat Disability", "page": 28, "text": "Yang’s ambition was to get an architect’s certificate or become a bowling master. But when he was conducting experiments with a microscope in the basement, a tank on the bench exploded, sending him flying outwards through the exit. He was out of breath while knowing he lost his eyesight as well as 70% of his hearing. In other words, he was disabled. Feeling clumsy, he was annoyed at first though nobody made fun of him. He cut out going outdoors and just sat around at home talking to his parrot or tortoise silently. His sister resigned to help him in many ways. Her assistance and encouragement were so beneficial to his psychology that he adapted to his disability soon and became outgoing again. In a college accessible to him, he studied politics and literature. He always sat in the front row near the entry without any absence and, with the help of his handy laptop, he studied well by means of dictation. His thesis, Abolishing Slavery, met with all professors’ approval. After class, he and his companions often played drum music, which was noisy but suitable for his hearing. After graduation, he made high profits by designing software for a firm. All in all, in his community, he won his dignity and people’s congratulations. He always wished all the best to his disabled fellows and encouraged them, “Never mind! All you have is adequate to achieve your goals.”", "original": "Yang’s ambition was to get an architect certificate or become a bowling master. But when he was conducting experiments with a microscope in the basement, a tank on the bench exploded, sending him flying outwards through the exit. He was out of breath while knowing he lost his eyesight as well as 70% of his hearing. In other words, he was disabled. Feeling clumsy, he was annoyed at first though nobody made ut"]}], "grammar": [{"quote": "a wound…caused by a shark", "explain": "过去分词定语，伤口是被鲨鱼造成的。"}, {"quote": "as if to urge him to help it", "explain": "as if 后接不定式，表示“仿佛要催促他帮助它”。"}, {"quote": "Every time he brought it tasty fish, it would…", "explain": "every time 引导时间状语从句；would 表过去反复出现的行为。"}], "questions": [{"q": "What had injured the seal?", "a": "A shark."}, {"q": "Where did Mark settle the seal?", "a": "In a narrow cave by the seaside."}], "dictation": "Witnesses said their anecdotes reflected a magic dimension of the relationship between humans and animals.", "review": [19, 21, 25]}, {"day": 19, "title": "Helping the Remote Village", "page": 34, "text": "A year ago, the famous astronaut received an invitation by airmail from a remote village. Intending to sniff some fresh air, he and his interpreter paid a fortnight’s visit there. It was a privilege for them to be there, but they were shocked by what they saw. The tracks were muddy. The river was drying up. Most villagers only possessed one broom, a few tins and several jars and their rectangular grass huts with rounded corners were surrounded by weeds. Besides, their school had no roof and platform, and the students had no concept of clicking a computer at all. They were badly in need. Soon, the astronaut made a generous voluntary donation to the village. There were textbooks for students, sewing machines for tailors and tractors for farmers. His distribution catalogue also included operating a clinic and a trunk library, as well as giving weekly lessons to teach relevant farming knowledge like how to dry out seeds or raise oxen. He himself not only helped do some paperwork but also purchased grills for boys to toast potatoes and combs for girls who were dying to get one. The other day, he heard from the villagers again inviting him to participate in the donation anniversary. For political and security reasons, he couldn’t adjust his travel arrangements-otherwise he would go. But his deeds were remembered forever.",  example, she found English idioms difficult to understand. And it was out of the question to eat delicious Chinese foods though many optional cafeterias served abundant substitutes. In addition, she had to wait in a queue early for the minibus that took her to school and it was usually so cold that she felt numb. What bothered her most was that she received no apology when her sleeping was disturbed by a barking dog in a shopkeeper’s cage. Luckily, with her parents comforting her by videophone, she became autonomous soon and eventually got her bachelor’s degree successfully.", "original": "Nannan’s father runs an enterprise near the Ming Tombs selling batteries and drills to the Daqing Oilfield. Hoping to get the qualification to help govern it, Nannan made much preparation and then left her motherland with her visa to study in America. Having reached her destination, she settled in an inn recommended by the travel agent. As far as Nannan was concerned, she always kept it up in China. But she had to acknowledge it was not easy to adjust herself to the new academic requirements, which were not parallel with China’s. Though she was occupied with lectures and seminars day in and day out, the essays she drafted were still contradicted by her tutors. As for her routine life, she felt that it was hard to fit in, too. For example, she found English idioms difficult to understand. And it was out of the question to eat delicious Chinese foods though many optional cafeterias served abundant substitutes. In addition, she had to wait in a queue early for the minibus that took her to school and it was usually so cold that she felt numb. What bothered her most was that she received no apology when her sleeping was disturbed by a barking dog in a shopkeeper’s cage. Luckily, with her parents comforting her by videophone, she became autonomous soon and eventually got her bachelor’s degree successfully.", "changes": [["parallel with China’s", "in line with those in China"], ["essays view": [21, 23, 27]}, {"day": 21, "title": "Immigrate to America", "page": 38, "text": "Attracted by the boom in America, my nephew teamed up with a Korean to illegally cross the Bering Strait in the Arctic to America. To avoid the Customs’ punishment, they hid in a small ferry called the North Pole Seagull, sitting back to back without sleeping, showering and shaving for 3 days, and had no chance to mourn their lost luggage when landing. The hardship of this crossing was apparent. At first, he made a living by means of raising cattle and then was hired in aircraft industries. He lived in a Catholic district. Taking in a small percentage of Pakistani immigrants, the majority of the residents were from Italy and Denmark, who all kept up their customs and cultures. Different blocks here were distinctly marked out and indicated from the racial angle. It was unfair and needed reforming. But with nowhere else to go, my nephew lived on and managed to make a life for himself. My nephew’s fortune came when he bravely helped a conductor brake a tram to stop it from slipping out of the rails. The man was elected vice chairman of the Socialist Party later. It occurred to my nephew that he could grasp this opportunity to ask for his help. The man who was thankful helped him apply to the civil authority for the right to live in America by inserting his brave deed into his documents. Unlike a great many other applicants, his application was approved by the Federal Justice Ministry. Before long, he started his own bakery and lived a better life.", "original": "Attracted by the boom in America, my nephew teamed up with a Korean to illegally cross the Bearing Strait in the Arctic to America. To avoid the Customs’ punishment, they hid in a small ferry called the North Pole Seagull, sitting back to back without sleeping, showering and shaving for 3 days, and had no chance to mourn their lost luggage when landing. The hardship of this crossing was apparent. At first, he made a living b  remark on her should be condemned. In terms of this extraordinary woman, you can’t classify her status by her horrible clothes or disgusting nails. Her clean woolen vest and stockings, especially her classic pronunciation, all suggested her upper status.” The ambassador gave a whistle in amazement, and advised making her acquaintance. The professor hesitated for a while, then compromised. The outcome was that she was an authentic superior police officer. When they were shown in her office and saw her once more, she brought them a teapot of tea and some cookies, laughing and saying, “I rubbed some cream and wax on my garment and passed myself off as a shabby woman among thieves and robbers to investigate a plot. Generally speaking, your overlooking me and my adaptation are the best help. But my pronunciation seemed to have betrayed me.”", "original": "An ambassador and a referee were consulting a professor on the caption of a Buddhistic alphabet when a sobbing woman stopped them to sell an antique musical bathtub. Her dirty garment and the handkerchief around her waist were badly in need of sending to a laundry. The ambassador uncomfortably gave her a handful of pence from his wallet and said, “Take this fortune away, troublesome woman.” When her figure faded away, the brilliant professor said, “You are mistaken and your improper remark on her should be condemned. In terms of this extraordinary woman, you can’t classify her status by her horrible clothes or disgusting nails. Her clean woolen vest and stockings, especially her classic pronunciation, all suggested her upper status.” The ambassador gave a whistle in amazement, and advised making her acquaintance. The professor hesitated for a while, then compromised. The outcome was that she was an authentic superior police officer. When they were shown in her office and saw her once more, she brought them a teapot of tea and some cookies, laughing and saying, “I rubbed some cream and wax on my garment and passed mysel  as an official or common language in many countries, such as America, Singapore, Malaysia and some African countries. The English varieties spoken in these countries, all based on British English, can be well understood by native English speakers. But actually, these Englishes have been gradually changing in accents, spellings, expressions and the usage of vocabulary. Because of this fact, you can make use of the differences to tell which country the foreigners of your block are from. For example, if a boss fluently commands his driver, “Come up straight to my apartment by elevator and take some gas for my trucks and cabs ”, instead of requesting, “Please come to my flat by lift and take some petrol for my lorries and taxis ”, you can recognize his American identity, while the latter suggests that he is British.", "original": "Voyages of people from England play an important part in spreading the English language. At present, English is frequently spoken as an official or common language in many countries, such as America, Singapore, Malaysia and some African countries. All based on British English, the English spoken in these countries can be well understood by native English speakers. But actually, these Englishes have been gradually changing in accents, spellings, expressions and the usage of vocabulary. Because of this fact, you can make use of the differences to tell which country the foreigners of your block are from. For example, if a boss fluently commands his driver, “Come up straight to my apartment by elevator and take some gas for my trucks and cabs ”, instead of requesting, “Please come to my flat by lift and take some petrol for my lorries and taxis ”, you can recognize his American identity, while the latter suggests that he is British.", "changes": [["All based on British English, the English spoken in these countries", "The English varieties spoken in these countries, all based on British English,"]], "sentences": ["Voyages of people from England p , he was a generous lawyer. He was willing to selflessly help everyone who turned to him. He accepted no fee to offer legal guidance and opinions to those who were out of work or uneducated. Later, believing all mankind to be equal, he devoted himself to stopping the unfair anti-black laws. He set up the Black Youth League and was voted to be the leader. However, though he kept peaceful principles without violence and terror, his mean enemies still blew up his house and attacked his relatives, and he himself couldn’t escape being sentenced to 30 years in prison. Not fearing the prison guards’ cruelty, he kept active and begged no mercy from them. As a matter of fact, he was always hopeful and never lost heart during the stage even though he was in trouble. Finally, people rewarded him with the leader’s position and a gold blanket.", "original": "As the founder of the republic, the president had many good qualities. Before coming to power, he was a generous lawyer. He was willing to selflessly help everyone who turned to him. He accepted no fee to offer legal guidance and opinions to those who were out of work or uneducated. Later, believing all mankind to be equal, he devoted himself to stopping the unfair anti-black laws. He set up the Black Youth League and was voted to be the leader. However, though he kept peaceful principles without violence and terror, his mean enemies still blew up his house and attacked his relatives, and he himself couldn’t escape being sentenced to 30 years in prison. Not fearing of the prison guards’ cruelty, he kept active and begged no mercy from them. As a matter of fact, he was always hopeful and never lost heart during the stage even though he was in trouble. Finally, people rewarded him with the leader’s position and a gold blanket.", "changes": [["Not fearing of", "Not fearing"]], "sentences": ["As the founder of the republic, the president had many good qualities.", "Before coming to power, he was a generous lawyer.", "He was willing to selflessly help everyone who turned to him.", "He accepted no fee to offer legal guidance and opinions to those who were out of work or uneducated.", "Later, believing all mankind to be equal, he devoted himself to stopping the unfair anti-black laws.", "He set up the Black Youth League and was voted to be the leader.", "However, though he kept peaceful principles without violence and terror, his mean enemies still blew up his house and attacked his relatives, and he himself couldn’t escape being sentenced to 30 years in prison.", "Not fearing the prison guards’ cruelty, he kept active and begged no mercy from them.", "As a matter of fact, he was always hopeful and never lost heart during the stage even though he was in trouble.", "Finally, people rewarded him with the leader’s position and a gold blanket."], "endpage": 56, "cn": "伟大的总统", "P": ["come to power=上台执政（原文 coming to power）", "turn to=求助于（原文 turned to）", "out of work=失业", "devote oneself to=致力于（原文 devoted himself to）", "lose heart=灰心（原文 lost heart）", "as a matter of fact=事实上"], "G": ["those who were out of work=>who 引导限制性定语从句，先行词 those 指“那些人”。", "devoted himself to stopping=>to 为介词，后接动名词 stopping。", "couldn’t escape being sentenced=>escape 后接动名词；being sentenced 是被动形式，表示被判刑。"], "Q": ["What was the president’s profession before coming to power?=>He was a lawyer.", "Did he charge people for the legal guidance described?=>No, he accepted no fee."], "S": "描述一位你尊敬的人，用 devote oneself to 和 never lose heart，并举一个具体行动。", "V": ["equal /ˈiːkwəl/：第一音节长 /iː/。", "generous /ˈdʒenərəs/：首音节重读。"], "N": "文中人物未明确署名，细节不应直接当作某位真实总统的生平。", "grammarQuiz": {"q": "He devoted himself to ____ unfair laws. (stop)", "answers": ["stopping"], "why": "to 为介词；stop 双写 p 加 -ing。"}, "originalNumber": "5", "phrases": [{"en": "come to power", "cn": "上台执政（原文 coming to power）", "hint": "上台执政", "answers": ["come to power", "coming to power"]}, {"en": "turn to", "cn": "求助于（原文 turned to）", "hint": "求助于", "answers": ["turn to", "turned to"]}, {"e like the ancient honest slave competitors, some hopeless athletes who can’t bear the pain of training cheat when taking part in games. Medals seem to have magical power causing them to cheat, and the prize money has replaced the motto as their only goal. So, in the gymnastics event to be held in our city next month, one of the host’s responsibilities is to keep competitions fair. They advertised on posters outside the stadium to promise that every competitor is to have a regular physical examination in a gymnasium one after another. No one can bargain on this. The volunteers in charge will be very strict. It is foolish to cheat because they will not be admitted to compete and will even be fined as well.", "original": "Swifter, Higher and Stronger stands for the spirit of the Olympics. But fairness is the basis of this motto. Only when you win fairly will you and your homeland deserve the great glory. But nowadays, unlike the ancient honest slave competitors, some hopeless athletes who can’t bear the pain of training cheat when taking part in games. Medals seem to have magical power causing them to cheat, and the prize money has replaced the motto as their only goal. So, in the gymnastics event to be held in our city next month, one of the host’s responsibilities is to keep competitions fair. They advertised on posters outside the stadium to promise that every competitor is to have a regular physical examination in a gymnasium one after another. No one can bargain on this. The volunteers in charge will be very strict. It is foolish to cheat because they will not be admitted to compete and will even be fined as well.", "changes": [], "sentences": ["Swifter, Higher and Stronger stands for the spirit of the Olympics.", "But fairness is the basis of this motto.", "Only when you win fairly will you and your homeland deserve the great glory.", "But nowadays, unlike the ancient honest slave competitors, some hopeless athletes who can’t bear the pain of training cheat when t rs are hunted for fur to make carpets so that they can only live in secure reserves; grassland is destroyed without mercy so that dust storms come into being affecting distant cities. Last year, scientists saw some monkeys rubbing themselves with a certain kind of insect to protect themselves from fierce mosquitoes biting. According to the result of the inspection, they found that the insect contains a powerful drug, so local farmers were employed to catch the insects. The ending was that the insects disappeared from the whole zone. When told that it was a loss to humans, the farmers burst into laughter and responded, “Our real loss is our decreasing income.” We should appreciate the natural balance and pay more attention to the importance of wildlife protection. Not until we succeed in letting wildlife live in peace can we smile in relief.", "original": "Dinosaurs died out because of an unexpected incident. But wildlife today disappears or is in danger just because humans do harm to it. For example, tigers are hunted for fur to make carpets so that they can only live in secure reserves; grassland is destroyed without mercy so that dust storms come into being affecting distant cities. Last year, scientists saw some monkeys rubbing themselves with a certain kind of insects to protect themselves from fierce mosquitoes biting. According to the result of the inspection, they found that the insect contains a powerful drug, so local farmers were employed to catch the insects. The ending was that the insects disappeared from the whole zone. When told that it was a loss to humans, the farmers burst into laughter and responded, “Our real loss is our decreasing income.” We should appreciate the natural balance and pay more attention to the importance of wildlife protection. Not until we succeed in letting wildlife live in peace, can we smile in relief.", "changes": [["a certain kind of insects", "a certain kind of insect"], ["live in peace, can", "live in peace can"]], "sente  attractive music and made a record in a studio. A million or so copies were sold and we became millionaires. It was painful that the band broke up finally. But above all, I realized my dream to be a musician.", "original": "I was very sensitive to music. Just dipping into the music books briefly, I could sing or play well. To be honest, I always dreamt of becoming a famous folk actor. I was so confident that I never decreased my devotion. I formed my first band called “Rolling Frog”. At the beginning, we relied on performing on instruments in pubs or to passers –by to earn extra money in cash. Then we wore false beards to pretend to be the musicians whom people were familiar with. In addition, we attached humorous acts to our performances and played jokes on each other. Soon, our “funny jazz” became famous and invitations to perform for broadcast stations began to come. Afterwards, we sorted out attractive music and made a record in a studio. A million or so copies were sold and we became millionaires. It was painful that the band broke up finally. But above all, I realized my dream to be a musician.", "changes": [["passers –by", "passers-by"]], "sentences": ["I was very sensitive to music.", "Just dipping into the music books briefly, I could sing or play well.", "To be honest, I always dreamt of becoming a famous folk actor.", "I was so confident that I never decreased my devotion.", "I formed my first band called “Rolling Frog”.", "At the beginning, we relied on performing on instruments in pubs or to passers-by to earn extra money in cash.", "Then we wore false beards to pretend to be the musicians whom people were familiar with.", "In addition, we attached humorous acts to our performances and played jokes on each other.", "Soon, our “funny jazz” became famous and invitations to perform for broadcast stations began to come.", "Afterwards, we sorted out attractive music and made a record in a studio.", "A million or so copies were sold and we became millionaire const GAPDATA={"1": {"day": 1, "title": "A Journey across Canada", "groups": [{"index": 0, "text": "A Journey across Canada.", "start": 0, "voiceEnd": 2.192, "end": 4.384, "voiceSeconds": 2.192, "pauseSeconds": 2.192, "sourceStart": 0.195, "sourceEnd": 2.387, "zh": "横穿加拿大的旅行。"}, {"index": 1, "text": "After a quiz last autumn,", "start": 4.384, "voiceEnd": 6.522500000000001, "end": 8.661000000000001, "voiceSeconds": 2.1385, "pauseSeconds": 2.1385, "sourceStart": 2.867, "sourceEnd": 5.0055, "zh": "去年秋天，一次小测验之后，"}, {"index": 2, "text": "Kuang crossed the continent eastward to Toronto", "start": 8.661000000000001, "voiceEnd": 11.888666666666667, "end": 15.116333333333333, "voiceSeconds": 3.2276666666666665, "pauseSeconds": 3.2276666666666665, "sourceStart": 5.2555, "sourceEnd": 8.483166666666667, "zh": "光向东横穿大陆，来到多伦多，"}, {"index": 3, "text": "to visit his schoolmate,", "start": 15.116333333333333, "voiceEnd": 16.717291666666668, "end": 18.31825, "voiceSeconds": 1.6009583333333333, "pauseSeconds": 1.6009583333333333, "sourceStart": 8.483166666666667, "sourceEnd": 10.084125, "zh": "去看望他的同学，"}, {"index": 4, "text": "the distance measuring approximately 5,000 kilometers.", "start": 18.31825, "voiceEnd": 22.631458333333335, "end": 26.944666666666667, "voiceSeconds": 4.313208333333334, "pauseSeconds": 4.313208333333334, "sourceStart": 10.424125, "sourceEnd": 14.737333333333334, "zh": "路程大约为5000公里。"}, {"index": 5, "text": "His train started from Vancouver,", "start": 26.944666666666667, "voiceEnd": 29.666541666666667, "end": 32.388416666666664, "voiceSeconds": 2.721875, "pauseSeconds": 2.721875, "sourceStart": 15.247333333333334, "sourceEnd": 17.969208333333334, "zh": "他的火车从温哥华出发，"}, {"index": 6, "text": "a city surrounded by mountains.", "start": 32.388416666666664, "voiceEnd": 35.030541666666664, "end": 37.672666666666665, "voiceSeconds": 2.642125, "pauseSeconds": 2.642125, "sourceStart": 18.239208333333334, "sourceEnd": 20.881333333333334, "zh": "那是一座群山环绕的城市。"}, {"index": 7, "text": "After confirming his baggage was aboard the train,", "start": 37.672666666666665, "voiceEnd": 41.310541666666666, "end": 44.94841666666667, "voiceSeconds": 3.637875, "pauseSeconds": 3.637875, "sourceStart": 21.381333333333334, "sourceEnd": 25.019208333333335, "zh": "确认自己的行李已经上车后，"}, {"index": 8, "text": "Kuang settled down in his seat.", "start": 44.94841666666667, "voiceEnd": 47.252875, "end": 49.55733333333333, "voiceSeconds": 2.3044583333333333, "pauseSeconds": 2.3044583333333333, "sourceStart": 25.349208333333333, "sourceEnd": 27.653666666666666, "zh": "光在座位上安顿了下来。"}, {"index": 9, "text": "Having a gift for communication,", "start": 49.55733333333333, "voiceEnd": 52.10525, "end": 54.653166666666664, "voiceSeconds": 2.5479166666666666, "pauseSeconds": 2.5479166666666666, "sourceStart": 28.163666666666668, "sourceEnd": 30.711583333333333, "zh": "由于擅长与人交流，"}, {"index": 10, "text": "he started chatting with another passenger", "start": 54.653166666666664, "voiceEnd": 57.40566666666666, "end": 60.158166666666666, "voiceSeconds": 2.7525, "pauseSeconds": 2.7525, "sourceStart": 31.001583333333333, "sourceEnd": 33.754083333333334, "zh": "他便开始和另一位乘客聊天，"}, {"index": 11, "text": "within 5 minutes.", "start": 60.158166666666666, "voiceEnd": 61.85308333333333, "end": 63.548, "voiceSeconds": 1.6949166666666666, "pauseSeconds": 1.6949166666666666, "sourceStart": 33.754083333333334, "sourceEnd": 35.449, "zh": "在5分钟之内。"}, {"index": 12, "text": "Their topics included the Canadian traditions,", "start": 63.548, "voiceEnd": 67.03108333333334, "end": 70.51416666666667, "voiceSeconds": 3.4830833333333335, "pauseSeconds": 3.4830833333333335, "sourceStart": 35.949, "sourceEnd": 39.43208333333333, "zh": "他们谈到了加拿大的传统，"}, {"index": 13, "text": "the Prime Minister,", "start": 70.51416666666667, "voiceEnd": 71.85479166666667, "end": 73.19541666666667, "voiceSeconds": 1.340625, "pauseSeconds": 1.340625, "sourceStart": 39.67208333333333, "sourceEnd": 41.012708333333336, "zh": "总理，"}, {"index": 14, "text": "the mixture of races,", "start": 73.19541666666667, "voiceEnd": 74.84283333333335, "end": 76.49025, "voiceSeconds": 1.6474166666666668, "pauseSeconds": 1.6474166666666668, "sourceStart": 41.29270833333333, "sourceEnd": 42.940125, "zh": "不同族群的融合，"}, {"index": 15, "text": "and the terrifying Great Fall.", "start": 76.49025, "voiceEnd": 78.69545833333333, "end": 80.90066666666667, "voiceSeconds": 2.205208333333333, "pauseSeconds": 2.205208333333333, "sourceStart": 43.180125, "sourceEnd": 45.385333333333335, "zh": "以及那令人心惊胆战的大瀑布。"}, {"index": 16, "text": "After a nice buffet at noon,", "start": 80.90066666666667, "voiceEnd": 83.235625, "end": 85.57058333333333, "voiceSeconds": 2.3349583333333332, "pauseSeconds": 2.3349583333333332, "sourceStart": 45.885333333333335, "sourceEnd": 48.22029166666667, "zh": "中午享用了一顿可口的自助餐后，"}, {"index": 17, "text": "he was pleased to find", "start": 85.57058333333333, "voiceEnd": 87.07141666666666, "end": 88.57225, "voiceSeconds": 1.5008333333333332, "pauseSeconds": 1.5008333333333332, "sourceStart": 48.490291666666664, "sourceEnd": 49.991125, "zh": "他高兴地发现，"}, {"index": 18, "text": "that the scenery was impressive.", "start": 88.57225, "voiceEnd": 90.72079166666666, "end": 92.86933333333333, "voiceSeconds": 2.1485416666666666, "pauseSeconds": 2.1485416666666666, "sourceStart": 49.991125, "sourceEnd": 52.13966666666666, "zh": "沿途景色令人印象深刻。"}, {"index": 19, "text": "He saw beautiful harbours in the distance,", "start": 92.86933333333333, "voiceEnd": 95.88, "end": 98.89066666666666, "voiceSeconds": 3.010666666666667, "pauseSeconds": 3.010666666666667, "sourceStart": 52.61966666666667, "sourceEnd": 55.63033333333333, "zh": "他看见远处美丽的港口，"}, {"index": 20, "text": "wealthy urban areas and maple forests that covered thousands of acres.", "start": 98.89066666666666, "voiceEnd": 104.37333333333333, "end": 109.856, "voiceSeconds": 5.482666666666667, "pauseSeconds": 5.482666666666667, "sourceStart": 55.92033333333333, "sourceEnd": 61.403, "zh": "富裕的城区，以及绵延数千英亩的枫树林。"}, {"index": 21, "text": "He even managed to catch sight of an eagle", "start": 109.856, "voiceEnd": 112.82616666666667, "end": 115.79633333333332, "voiceSeconds": 2.9701666666666666, "pauseSeconds": 2.9701666666666666, "sourceStart": 61.913, "sourceEnd": 64.88316666666667, "zh": "他甚至还看见了一只鹰，"}, {"index": 22, "text": "flying upward over bushes.", "start": 115.79633333333332, "voiceEnd": 117.93683333333333, "end": 120.07733333333333, "voiceSeconds": 2.1405, "pauseSeconds": 2.1405, "sourceStart": 64.88316666666667, "sourceEnd": 67.02366666666667, "zh": "在灌木丛上方向高处飞去。"}, {"index": 23, "text": "Kuang reached Toronto", "start": 120.07733333333333, "voiceEnd": 121.71970833333333, "end": 123.36208333333333, "voiceSeconds": 1.642375, "pauseSeconds": 1.642375, "sourceStart": 67.55366666666667, "sourceEnd": 69.19604166666667, "zh": "光到达了多伦多，"}, {"index": 24, "text": "which lies near the border at a misty dawn.", "start": 123.36208333333333, "voiceEnd": 126.71120833333333, "end": 130.06033333333332, "voiceSeconds": 3.349125, "pauseSeconds": 3.349125, "sourceStart": 69.19604166666667, "sourceEnd": 72.54516666666666, "zh": "这座城市靠近边境；到达时是一个雾蒙蒙的清晨。"}, {"index": 25, "text": "There was frost and the broad downtown streets were very quiet.", "start": 130.06033333333332, "voiceEnd": 134.80083333333332, "end": 139.5413333333333, "voiceSeconds": 4.7405, "pauseSeconds": 4.7405, "sourceStart": 73.02516666666666, "sourceEnd": 77.76566666666666, "zh": "地上有霜，市中心宽阔的街道十分安静。"}, {"index": 26, "text": "Though it was early,", "start": 139.5413333333333, "voiceEnd": 140.85720833333332, "end": 142.17308333333332, "voiceSeconds": 1.315875, "pauseSeconds": 1.315875, "sourceStart": 78.26566666666666, "sourceEnd": 79.58154166666667, "zh": "虽然时间还早，"}, {"index": 27, "text": "Kuang phoned his schoolmate in a booth nearby at once", "start": 142.17308333333332, "voiceEnd": 146.03791666666666, "end": 149.90275, "voiceSeconds": 3.8648333333333333, "pauseSeconds": 3.8648333333333333, "sourceStart": 79.85154166666666, "sourceEnd": 83.716375, "zh": "光还是立刻在附近的电话亭给同学打了电话，"}, {"index": 28, "text": "rather than waiting for him to come.", "start": 149.90275, "voiceEnd": 152.027375, "end": 154.152, "voiceSeconds": 2.124625, "pauseSeconds": 2.124625, "sourceStart": 83.716375, "sourceEnd": 85.841, "zh": "而没有等同学过来。"}, {"index": 29, "text": "They had a good time together.", "start": 154.152, "voiceEnd": 156.206, "end": 158.26, "voiceSeconds": 2.054, "pauseSeconds": 2.054, "sourceStart": 86.311, "sourceEnd": 88.365, "zh": "他们一起度过了愉快的时光。"}], "duration": 158.26, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "2": {"day": 2, "title": "An Interesting Festival", "groups": [{"index": 0, "text": "An Interesting Festival.", "start": 0, "voiceEnd": 2.12, "end": 4.24, "voiceSeconds": 2.12, "pauseSeconds": 2.12, "sourceStart": 0.195, "sourceEnd": 2.315, "zh": "有趣的节日。"}, {"index": 1, "text": "The Agricultural Feast takes place after Independence Day.", "start": 4.24, "voiceEnd": 9.106333333333334, "end": 13.972666666666667, "voiceSeconds": 4.866333333333333, "pauseSeconds": 4.866333333333333, "sourceStart": 2.815, "sourceEnd": 7.681333333333333, "zh": "农业盛宴在独立日之后举行。"}, {"index": 2, "text": "It is not a worldwide celebration.", "start": 13.972666666666667, "voiceEnd": 16.943, "end": 19.913333333333334, "voiceSeconds": 2.9703333333333335, "pauseSeconds": 2.9703333333333335, "sourceStart": 8.181333333333333, "sourceEnd": 11.151666666666667, "zh": "它不是一个全世界都庆祝的节日。"}, {"index": 3, "text": "Only Christians in Mexico look forward to its arrival for its religious origin.", "start": 19.913333333333334, "voiceEnd": 26.067, "end": 32.220666666666666, "voiceSeconds": 6.153666666666667, "pauseSeconds": 6.153666666666667, "sourceStart": 11.651666666666667, "sourceEnd": 17.805333333333333, "zh": "由于其宗教渊源，只有墨西哥的基督徒期待它的到来。"}, {"index": 4, "text": "Long ago, humans’ ancestors were bad.", "start": 32.220666666666666, "voiceEnd": 35.869, "end": 39.51733333333333, "voiceSeconds": 3.6483333333333334, "pauseSeconds": 3.6483333333333334, "sourceStart": 18.275333333333332, "sourceEnd": 21.923666666666666, "zh": "很久以前，人类的祖先品行不好。"}, {"index": 5, "text": "They fooled and played tricks on each other and never kept their word.", "start": 39.51733333333333, "voiceEnd": 44.23866666666667, "end": 48.96, "voiceSeconds": 4.721333333333333, "pauseSeconds": 4.721333333333333, "sourceStart": 22.423666666666666, "sourceEnd": 27.145, "zh": "他们互相欺骗、捉弄，从不信守诺言。"}, {"index": 6, "text": "So God turned up and drowned all their crops.", "start": 48.96, "voiceEnd": 52.526, "end": 56.092, "voiceSeconds": 3.566, "pauseSeconds": 3.566, "sourceStart": 27.645, "sourceEnd": 31.211, "zh": "于是上帝出现了，用水淹没了他们所有的庄稼。"}, {"index": 7, "text": "Humans starved day and night,", "start": 56.092, "voiceEnd": 58.503791666666665, "end": 60.91558333333333, "voiceSeconds": 2.411791666666667, "pauseSeconds": 2.411791666666667, "sourceStart": 31.701, "sourceEnd": 34.112791666666666, "zh": "人们日夜挨饿，"}, {"index": 8, "text": "weeping.", "start": 60.91558333333333, "voiceEnd": 61.68645833333333, "end": 62.45733333333333, "voiceSeconds": 0.770875, "pauseSeconds": 0.770875, "sourceStart": 34.372791666666664, "sourceEnd": 35.14366666666667, "zh": "哭泣不止。"}, {"index": 9, "text": "In order to gain God’s forgiveness,", "start": 62.45733333333333, "voiceEnd": 64.85591666666666, "end": 67.2545, "voiceSeconds": 2.3985833333333333, "pauseSeconds": 2.3985833333333333, "sourceStart": 35.61366666666667, "sourceEnd": 38.01225, "zh": "为了得到上帝的宽恕，"}, {"index": 10, "text": "a woman poet set off to see God.", "start": 67.2545, "voiceEnd": 70.14158333333333, "end": 73.02866666666667, "voiceSeconds": 2.8870833333333334, "pauseSeconds": 2.8870833333333334, "sourceStart": 38.20225, "sourceEnd": 41.089333333333336, "zh": "一位女诗人动身去见上帝。"}, {"index": 11, "text": "She admired God and kept apologizing.", "start": 73.02866666666667, "voiceEnd": 76.43033333333334, "end": 79.832, "voiceSeconds": 3.401666666666667, "pauseSeconds": 3.401666666666667, "sourceStart": 41.589333333333336, "sourceEnd": 44.991, "zh": "她敬仰上帝，不断道歉。"}, {"index": 12, "text": "God was moved.", "start": 79.832, "voiceEnd": 81.306, "end": 82.77999999999999, "voiceSeconds": 1.474, "pauseSeconds": 1.474, "sourceStart": 45.491, "sourceEnd": 46.965, "zh": "上帝被感动了。"}, {"index": 13, "text": "With his permission,", "start": 82.77999999999999, "voiceEnd": 84.15062499999999, "end": 85.52124999999998, "voiceSeconds": 1.370625, "pauseSeconds": 1.370625, "sourceStart": 47.455, "sourceEnd": 48.825625, "zh": "在他的许可之下，"}, {"index": 14, "text": "humans finally had good harvests again.", "start": 85.52124999999998, "voiceEnd": 88.64329166666664, "end": 91.76533333333332, "voiceSeconds": 3.1220416666666666, "pauseSeconds": 3.1220416666666666, "sourceStart": 49.065625, "sourceEnd": 52.187666666666665, "zh": "人们终于再次获得了丰收。"}, {"index": 15, "text": "So, to wipe away sadness and remind themselves of the belief in God,", "start": 91.76533333333332, "voiceEnd": 97.18933333333332, "end": 102.61333333333332, "voiceSeconds": 5.424, "pauseSeconds": 5.424, "sourceStart": 52.66766666666667, "sourceEnd": 58.09166666666667, "zh": "于是，为了消除悲伤，并提醒自己对上帝的信仰，"}, {"index": 16, "text": "people began the festival.", "start": 102.61333333333332, "voiceEnd": 104.47533333333331, "end": 106.33733333333332, "voiceSeconds": 1.862, "pauseSeconds": 1.862, "sourceStart": 58.45166666666667, "sourceEnd": 60.31366666666667, "zh": "人们开始庆祝这个节日。"}, {"index": 17, "text": "During the festival,", "start": 106.33733333333332, "voiceEnd": 107.81195833333332, "end": 109.28658333333333, "voiceSeconds": 1.474625, "pauseSeconds": 1.474625, "sourceStart": 60.843666666666664, "sourceEnd": 62.31829166666667, "zh": "节日期间，"}, {"index": 18, "text": "people gather in the open air,", "start": 109.28658333333333, "voiceEnd": 111.40983333333332, "end": 113.53308333333332, "voiceSeconds": 2.12325, "pauseSeconds": 2.12325, "sourceStart": 62.52829166666667, "sourceEnd": 64.65154166666666, "zh": "人们聚集在露天场所，"}, {"index": 19, "text": "such as playgrounds or parking lots,", "start": 113.53308333333332, "voiceEnd": 116.23966666666665, "end": 118.94624999999999, "voiceSeconds": 2.706583333333333, "pauseSeconds": 2.706583333333333, "sourceStart": 64.78154166666667, "sourceEnd": 67.488125, "zh": "比如操场或停车场，"}, {"index": 20, "text": "and energetically have fun with each other all night long,", "start": 118.94624999999999, "voiceEnd": 122.58154166666665, "end": 126.21683333333333, "voiceSeconds": 3.635291666666667, "pauseSeconds": 3.635291666666667, "sourceStart": 67.768125, "sourceEnd": 71.40341666666667, "zh": "大家兴高采烈地玩上一整夜，"}, {"index": 21, "text": "as though they were never tired.", "start": 126.21683333333333, "voiceEnd": 128.02075, "end": 129.82466666666667, "voiceSeconds": 1.8039166666666666, "pauseSeconds": 1.8039166666666666, "sourceStart": 71.61341666666667, "sourceEnd": 73.41733333333333, "zh": "仿佛永远不会疲倦。"}, {"index": 22, "text": "When a beauty dressed up in lovely clothing", "start": 129.82466666666667, "voiceEnd": 132.89837500000002, "end": 135.97208333333333, "voiceSeconds": 3.0737083333333333, "pauseSeconds": 3.0737083333333333, "sourceStart": 73.91733333333333, "sourceEnd": 76.99104166666666, "zh": "当一位身穿漂亮衣服的女子，"}, {"index": 23, "text": "reads poems in memory of the poet,", "start": 135.97208333333333, "voiceEnd": 138.59958333333333, "end": 141.22708333333333, "voiceSeconds": 2.6275, "pauseSeconds": 2.6275, "sourceStart": 76.99104166666666, "sourceEnd": 79.61854166666667, "zh": "朗诵诗歌来纪念那位女诗人时，"}, {"index": 24, "text": "everyone holds their breath.", "start": 141.22708333333333, "voiceEnd": 143.09754166666667, "end": 144.968, "voiceSeconds": 1.8704583333333333, "pauseSeconds": 1.8704583333333333, "sourceStart": 79.89854166666667, "sourceEnd": 81.769, "zh": "大家都会屏住呼吸。"}, {"index": 25, "text": "Then, it is the custom", "start": 144.968, "voiceEnd": 147.01062499999998, "end": 149.05325, "voiceSeconds": 2.042625, "pauseSeconds": 2.042625, "sourceStart": 82.249, "sourceEnd": 84.291625, "zh": "接着，按照习俗，"}, {"index": 26, "text": "that the bone of a rooster’s head", "start": 149.05325, "voiceEnd": 151.14529166666665, "end": 153.2373333333333, "voiceSeconds": 2.092041666666667, "pauseSeconds": 2.092041666666667, "sourceStart": 84.291625, "sourceEnd": 86.38366666666667, "zh": "会把一块公鸡头部的骨头，"}, {"index": 27, "text": "is given to her as an award.", "start": 153.2373333333333, "voiceEnd": 155.55866666666665, "end": 157.87999999999997, "voiceSeconds": 2.3213333333333335, "pauseSeconds": 2.3213333333333335, "sourceStart": 86.38366666666667, "sourceEnd": 88.705, "zh": "作为奖品送给这位女子。"}, {"index": 28, "text": "Obviously, the story is not true,", "start": 157.87999999999997, "voiceEnd": 160.97262499999997, "end": 164.06524999999996, "voiceSeconds": 3.092625, "pauseSeconds": 3.092625, "sourceStart": 89.205, "sourceEnd": 92.297625, "zh": "显然，这个故事并不真实，"}, {"index": 29, "text": "but the festival is interesting.", "start": 164.06524999999996, "voiceEnd": 166.18662499999996, "end": 168.30799999999996, "voiceSeconds": 2.121375, "pauseSeconds": 2.121375, "sourceStart": 92.627625, "sourceEnd": 94.749, "zh": "但这个节日很有趣。"}], "duration": 168.30799999999996, "voice": "en-GB-SoniaNeural", "rate": "-25%", "pauseRule": "1:1", "sourceTextVerified": true}, "3": {"day": 3, "title": "Balanced Diet", "groups": [{"index": 0, "text": "Balanced Diet.", "start": 0, "voiceEnd": 1.5665, "end": 3.133, "voiceSeconds": 1.5665, "pauseSeconds": 1.5665, "sourceStart": 0.235, "sourceEnd": 1.8015, "zh": "均衡饮食。"}, {"index": 1, "text": "Wang Peng earned his living", "start": 3.133, "voiceEnd": 5.009458333333333, "end": 6.885916666666667, "voiceSeconds": 1.8764583333333333, "pauseSeconds": 1.8764583333333333, "sourceStart": 2.3115, "sourceEnd": 4.1879583333333334, "zh": "王鹏以此谋生："}, {"index": 2, "text": "by running a barbecue restaurant,", "start": 6.885916666666667, "voiceEnd": 9.175791666666667, "end": 11.465666666666667, "voiceSeconds": 2.289875, "pauseSeconds": 2.289875, "sourceStart": 4.1879583333333334, "sourceEnd": 6.477833333333334, "zh": "经营一家烧烤餐馆，"}, {"index": 3, "text": "which served delicious bacon,", "start": 11.465666666666667, "voiceEnd": 13.588875000000002, "end": 15.712083333333334, "voiceSeconds": 2.1232083333333334, "pauseSeconds": 2.1232083333333334, "sourceStart": 6.777833333333334, "sourceEnd": 8.901041666666666, "zh": "供应美味的培根，"}, {"index": 4, "text": "fried chicken breast and mutton roasted with pepper and garlic.", "start": 15.712083333333334, "voiceEnd": 20.290375, "end": 24.86866666666667, "voiceSeconds": 4.578291666666667, "pauseSeconds": 4.578291666666667, "sourceStart": 9.131041666666667, "sourceEnd": 13.709333333333333, "zh": "炸鸡胸肉，以及用胡椒和大蒜烤制的羊肉。"}, {"index": 5, "text": "But his food and discount attracted fewer and fewer customers.", "start": 24.86866666666667, "voiceEnd": 29.848833333333335, "end": 34.829, "voiceSeconds": 4.980166666666666, "pauseSeconds": 4.980166666666666, "sourceStart": 14.279333333333334, "sourceEnd": 19.2595, "zh": "但他的食物和折扣吸引来的顾客越来越少。"}, {"index": 6, "text": "Finally, he was in debt.", "start": 34.829, "voiceEnd": 37.25683333333333, "end": 39.684666666666665, "voiceSeconds": 2.4278333333333335, "pauseSeconds": 2.4278333333333335, "sourceStart": 19.7495, "sourceEnd": 22.177333333333333, "zh": "最后，他负债了。"}, {"index": 7, "text": "Yong Hui’s slimming restaurant served fresh peas,", "start": 39.684666666666665, "voiceEnd": 43.54320833333333, "end": 47.40175, "voiceSeconds": 3.8585416666666665, "pauseSeconds": 3.8585416666666665, "sourceStart": 22.687333333333335, "sourceEnd": 26.545875, "zh": "咏慧的减肥餐馆供应新鲜的豌豆，"}, {"index": 8, "text": "carrots, eggplants, and raw cucumbers with vinegar.", "start": 47.40175, "voiceEnd": 51.713208333333334, "end": 56.02466666666667, "voiceSeconds": 4.311458333333333, "pauseSeconds": 4.311458333333333, "sourceStart": 26.875875, "sourceEnd": 31.187333333333335, "zh": "胡萝卜、茄子，还有加醋的生黄瓜。"}, {"index": 9, "text": "As the hostess,", "start": 56.02466666666667, "voiceEnd": 57.368375, "end": 58.71208333333333, "voiceSeconds": 1.3437083333333333, "pauseSeconds": 1.3437083333333333, "sourceStart": 31.677333333333333, "sourceEnd": 33.02104166666667, "zh": "作为女店主，"}, {"index": 10, "text": "she said fibres benefited customers' digestion the most.", "start": 58.71208333333333, "voiceEnd": 63.45070833333333, "end": 68.18933333333334, "voiceSeconds": 4.738625, "pauseSeconds": 4.738625, "sourceStart": 33.221041666666665, "sourceEnd": 37.959666666666664, "zh": "她说膳食纤维最有助于顾客消化。"}, {"index": 11, "text": "In order not to let Yong Hui get away with telling lies,", "start": 68.18933333333334, "voiceEnd": 72.15104166666667, "end": 76.11275, "voiceSeconds": 3.961708333333333, "pauseSeconds": 3.961708333333333, "sourceStart": 38.46966666666667, "sourceEnd": 42.431375, "zh": "为了不让咏慧撒谎后逃过惩罚，"}, {"index": 12, "text": "Wang Peng spied on Yong Hui despite her glare.", "start": 76.11275, "voiceEnd": 79.884375, "end": 83.656, "voiceSeconds": 3.771625, "pauseSeconds": 3.771625, "sourceStart": 42.771375, "sourceEnd": 46.543, "zh": "王鹏不顾她的怒视，暗中调查她。"}, {"index": 13, "text": "But he was surprised that she was losing her customers,", "start": 83.656, "voiceEnd": 87.65070833333334, "end": 91.64541666666668, "voiceSeconds": 3.9947083333333335, "pauseSeconds": 3.9947083333333335, "sourceStart": 47.033, "sourceEnd": 51.02770833333334, "zh": "但他惊讶地发现，她正在失去顾客，"}, {"index": 14, "text": "too.", "start": 91.64541666666668, "voiceEnd": 92.22120833333334, "end": 92.79700000000001, "voiceSeconds": 0.5757916666666667, "pauseSeconds": 0.5757916666666667, "sourceStart": 51.23770833333333, "sourceEnd": 51.8135, "zh": "也是如此（too 表示“也”）。"}, {"index": 15, "text": "Curiosity drove Wang Peng", "start": 92.79700000000001, "voiceEnd": 95.29025000000001, "end": 97.78350000000002, "voiceSeconds": 2.49325, "pauseSeconds": 2.49325, "sourceStart": 52.3435, "sourceEnd": 54.83675, "zh": "好奇心促使王鹏，"}, {"index": 16, "text": "to consult an expert.",
